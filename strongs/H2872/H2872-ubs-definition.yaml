senses:
- sense_id: '002644001001000'
  domain: People
  definition: = mark in belly ◄ left by detachment of the umbilical cord; ≈ associated
    with the central or prominent part of an area; may also refer to a sacred area
    associated with the connection of heaven and earth
  glosses:
  - navel
  references:
  - JDG-009-037
  - EZK-038-012
- sense_id: '002644002001000'
  domain: Names of Landforms
  definition: = mountain, to be identified with Mount {L:Gerizim<SDBH:גְּרִזִים>},
    ◄ and located near {L:Shechem<SDBH:שְׁכֶם>}; ≈ regarded as a special connection
    between heaven and earth and therefore sacred ({A:ABD})
  glosses:
  - Navel of the Earth
  references:
  - JDG-009-037
