  domain: Plants
  definition: = a tree that grows to 5 meters (17 feet), has small leaves forming
    an oval crown, and very sharp thorns; Lycaeum europaeum ({A:HALOT}, {A:DCH}, {A:NIDB}
    1:496); or possibly a thorny bush of the Rubus genus, which includes several hundred
    species ({A:ABD} 2:80)
