- sense_id: 000309002001000
  domain: Names of Locations
  definition: = {L:threshing-floor<SDBH:גֹּרֶן>}, ◄ near river {L:Jordan<SDBH:יַרְדֵּן>};
    ► where {L:Jacob<SDBH:יַעֲקֹב>}'s descendants mourned their father's death
  glosses:
