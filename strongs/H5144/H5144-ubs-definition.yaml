strongs_number: H5144
lemma: נזר
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '004715001001000'
  domain: Apart
  definition: 'literally: to separate oneself (from certain things); hence: = action
    by which humans intentionally keep their distance from certain objects'
  glosses:
  - to separate oneself
  - to keep away (from certain object)
  forms:
  - vbnif-
  references:
  - LEV-022-002
- sense_id: '004715001002000'
  domain: Non-Engage
  definition: 'literally: to separate oneself (from an activity); hence: = action
    by which humans intentionally do not engage in a certain activity'
  glosses:
  - to practice abstinence
  forms:
  - vbnif-
  references:
  - ZEC-007-003
- sense_id: '004715001003000'
  domain: Non-Engage
  definition: 'literally: to cause (others) to separate themselves (from certain things);
    hence: = causative action by which humans cause other humans to intentionally
    not engage in certain activities, such as those that make them ritually unclean'
  glosses:
  - to keep away from
  forms:
  - vbhif-
  references:
  - LEV-015-031
- sense_id: '004715001004000'
  domain: Unfaithful
  definition: 'literally: to separate oneself (from a deity); hence: = action by which
    humans abandon their loyalty to a deity'
  glosses:
  - to abandon (a deity)
  - to break away (from a deity)
  forms:
  - vbnif-
  references:
  - EZK-014-007
- sense_id: '004715001005000'
  domain: Vow
  definition: = action by which humans take an oath to set themselves apart for the
    service of a deity, and by doing so devote themselves to certain practices, such
    as avoiding intoxicating drinks, corpses, and cutting their hair
  glosses:
  - to separate oneself
  - to consecrate oneself
  forms:
  - vbhif-
  - vbnif-
  references:
  - NUM-006-002
  - NUM-006-003
  - NUM-006-005
  - NUM-006-006
  - NUM-006-012
  - HOS-009-010
related_lemmas:
- word: נָזִיר
- word: נֵזֶר
