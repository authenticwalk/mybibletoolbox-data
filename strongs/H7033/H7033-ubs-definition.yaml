senses:
- sense_id: '006472001001000'
  domain: Impact
  definition: = causative action by which humans expose other humans to the heat of
    fire; ► which will result in excessive suffering and/or death; ≈ also used in
    a more figurative sense for the burning sensation caused by high fever
  glosses:
  - to burn
  - burning
  forms:
  - vbqal-
  - vbnif-ptca (passive)
  references:
  - PSA-038-008
  - JER-029-022
- sense_id: '006472001002000'
  domain: Cooked
  definition: = causative action by which humans place food items in or on a fire
    ► in order to expose it to its heat and make it ready to be eaten
  glosses:
  - to roast
  - to cook over fire
  forms:
  - vbqal-ptcp
  references:
  - LEV-002-014
- sense_id: '006472001003000'
  domain: Food
  definition: 'literally: roasted; hence: = ears of grain, ◄ made ready to be eaten
    by placing them on the fire'
  glosses:
  - parched grain
  forms:
  - vbqal-ptcp
  references:
  - JOS-005-011
- sense_id: '006472002001000'
  domain: Insignificant
  definition: = state/process in wich humans provoke disdain from the general public
    ◄ due to their lower social standing, poverty, or condition; ≈ people in this
    situation are generally expected to pay respect to those of a higher standing
  glosses:
  - to be of low esteem
  - to be held in contempt
  - to be degraded
  - to be humiliated
  forms:
  - vbnif-
  references:
  - DEU-025-003
  - 1SA-018-023
  - PRO-012-009
  - ISA-003-005
  - ISA-016-014
- sense_id: '006472002002000'
  domain: Despise
  definition: = action by which humans fail to give proper and due respect to someone
    else
  glosses:
  - to dishonor (someone else)
  forms:
  - vbhif-
  references:
  - DEU-027-016
related_lemmas:
- word: קָלִי
- word: קָלֹון
- word: קִיקָלֹון
- word: קלל
