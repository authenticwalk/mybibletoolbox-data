  - LUK-002-034
- sense_id: '004333001002000'
  louw_nida_code: '87.75'
  domain: Status
  definition: (a figurative extension of meaning of πτῶσις ‘fall,’ not occurring in
    the NT) radical change toward a lower status (note the contrast with {L:ἀνάστασις<SDBG:ἀνάστασις:000001>}[b]
    rising up, {D:87.39})
  glosses:
  - a falling
  references:
  - LUK-002-034
- sense_id: '004333001003000'
  louw_nida_code: '13.59'
  domain: Be, Become, Exist, Happen
  definition: to change for the worse, with emphasis upon extent and suddenness
  glosses:
  - to fall from
  - to worsen
  references:
  - LUK-002-034
