strongs_number: H5287
lemma: נער
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 004848001001000
  domain: Sounds
  definition: = action by which animals produce a full, deep, prolonged sound as made
    by a lion; ≈ associated with aggression, but also with suffering
  glosses:
  - to roar
  - to growl
  forms:
  - vbqal-
  references:
  - JER-051-038
- sense_id: 004848002001000
  domain: Unsteady
  definition: = process by which a tree and its branches are moved by the wind and
    so lose their dry or withered leaves
  glosses:
  - to shake off
  forms:
  - vbqal-
  references:
  - ISA-033-009
- sense_id: 004848002002000
  domain: Unsteady
  definition: 'literally: to shake oneself (from something); hence: = action by which
    humans shake their body in such a way that things covering it fall off'
  glosses:
  - to shake off
  forms:
  - vbnif-
  - vbhit-
  references:
  - JDG-016-020
  - ISA-052-002
- sense_id: 004848002003000
  domain: Unsteady
  definition: = causative action by which humans, deities, or forces cause an object
    to shake in such a way that things covering it fall off
  glosses:
  - to shake
  - to shake off
  - to shake out
  forms:
  - vbpiel
  - vbqal-ptcp
  - vbnif- (passive)
  references:
  - NEH-005-013
  - NEH-005-013
  - NEH-005-013
  - JOB-038-013
  - PSA-109-023
- sense_id: 004848002004000
  domain: Move
  definition: 'literally: to shake off (something into the sea); hence: = causative
    action by which deities cause objects to fall into the sea'
  glosses:
  - to hurl
  forms:
  - vbpiel
  references:
  - EXO-014-027
  - PSA-136-015
- sense_id: 004848002005000
  domain: Stance
  definition: 'literally: to shake off (one''s) palms; hence: = action by which humans
    make shaking movements with their hands in order to ensure that objects or substances
    that stick to them fall off; ≈ used in a figurative sense to denote someone''s
    unwillingness to possess things that are not rightfully theirs'
  glosses:
  - to shake (one's) hands
  forms:
  - vbqal-
  references:
  - ISA-033-015
related_lemmas:
- word: נְעֹרֶת
