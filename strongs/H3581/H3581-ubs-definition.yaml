  references:
  - JOB-006-022
- sense_id: 003280002001000
  domain: Small Animals
  definition: 'either: = a greyish brown lizard, powerful but slow-moving, except
    when escaping danger; carnivorous, eating a wide variety of prey, including insects,
    mice, snakes, birds’ eggs, nestlings, and carrion from animal carcasses; lives
    in desert and savannah semidesert regions; or: = similar in appearance, but lives
    near rivers and in thicker vegetation; eats turtle and crocodile eggs; ◄ varanus
    niloticus; ≈ both are considered unclean, not fit for eating'
  glosses:
  - monitor lizard
  references:
  - LEV-011-030
