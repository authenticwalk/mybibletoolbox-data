- sense_id: 003280001002000
  domain: Crops
  definition: 'literally: strength; hence: = the products of the field that people
    have produced with their strength and ability'
  glosses:
  - strength > crops
  references:
  - GEN-004-012
  - JOB-031-039
- sense_id: 003280001003000
  domain: Rich
  definition: 'literally: strength; hence: = the possessions that people have gathered
    through their strength and ability'
  glosses:
