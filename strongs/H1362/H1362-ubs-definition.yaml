senses:
- sense_id: '001253001001000'
  domain: High
  definition: = state in which an object is of great or more than average height;
    ≈ associated with status
  glosses:
  - high
  - tall
  references:
  - EZK-031-003
- sense_id: '001253001002000'
  domain: Great
  definition: = state in which humans or deities have an elevated status, either in
    their own eyes or in the eyes of other people, ≈ which can either be good or bad,
    depending on whether this status is justified
  glosses:
  - haughty
  - arrogant
  references:
  - PSA-101-005
  - PRO-016-005
  - ECC-007-008
