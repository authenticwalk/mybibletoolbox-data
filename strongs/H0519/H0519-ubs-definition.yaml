senses:
- sense_id: 000483001001000
  domain: Classes
  definition: = woman who is the legal property of someone else; either married or
    eligible for marriage; her children belong to the person who owns her; ≈ because
    of this an  אָמָה  appears to have a somewhat higher status than a  שִׁפְחָה  even
    though both terms are sometimes used interchangeably
  glosses:
  - (female) slave
