- sense_id: '007422001001000'
  domain: Names of People
  definition: = woman; ◄ daughter of {L:Dibri<SDBH:דִּבְרִי>}, tribe of {L:Dan<SDBH:דָּן>};
    ► married an {L:Egyptian<SDBH:מִצְרִי>} man and had a son who was later stoned
    for blaspheming
  glosses:
  - Shelomith
  references:
