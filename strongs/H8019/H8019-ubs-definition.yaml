  definition: = woman; ◄ daughter of {L:Zerubbabel<SDBH:זְרֻבָּבֶל>}; tribe of {L:Judah<SDBH:יְהוּדָה>}
  glosses:
  - Shelomith
  references:
  - 1CH-003-019
- sense_id: '007422001003000'
  domain: Names of People
  definition: = man; ◄ son of {L:Shimei<SDBH:שִׁמְעִי>}; tribe of {L:Levi<SDBH:לֵוִי>};
    ► family head; time of {L:David<SDBH:דָּוִד>}
  glosses:
  - Shelomoth
  - Shelomith
  references:
  - 1CH-023-009
- sense_id: '007422001004000'
