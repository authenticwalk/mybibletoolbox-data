- sense_id: 002839001001000
  domain: Names of People
  definition: = man, also known as {L:Hoshea<SDBH:הֹושֵׁעַ>} and {L:Jeshua<SDBH:יֵשׁוּעַ>};
    ◄ son of {L:Nun<SDBH:נוּן>}; tribe of {L:Ephraim<SDBH:אֶפְרַיִם>}; ► one of the
    twelve men sent by {L:Moses<SDBH:מֹשֶׁה>} to spy out the land; his name was Hoshea,
    later changed by Moses to {L:Joshua<SDBH:יְהֹושֻׁעַ>}; Moses' assistant, who later
    became his successor and brought {L:Israel<SDBH:יִשְׂרָאֵל>} into {L:Canaan<SDBH:כְּנַעַן>}
  glosses:
  - Joshua
