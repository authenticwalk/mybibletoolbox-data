strongs_number: H1581
lemma: גָּמָל
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 001449001001000
  domain: Domestic Animals
  definition: = large quadruped mammal, which may reach a height of 2 m. or more;
    dromedaries are bigger and a uniform light fawn color; bactrians are darker; they
    are suited to life in desert areas, store excess food in their humps, can go without
    water for long periods, and can make long journeys through dry areas; ◄ Camelus
    dromedarius and Camelus bactrianus; ► they are used for riding and for carrying
    heavy loads and pulling carts; their hair is woven into cloth used for making
    tents or outer robes; their milk is used as food and drink; ≈ they are a symbol
    of wealth and commerce, but unclean and not to be eaten
  glosses:
  - camel
