senses:
- sense_id: '001642001001000'
  domain: Wild Animals
  definition: = deerlike ruminant mammal of the Kobus family, of which the male grows
    two horns; feeds on plants; ◄ |iAddax nasomaculatus, Kobus|i*; ► clean animal
    which may be eaten
  glosses:
  - addax
  - waterbuck
  - defassa
  - kob
  references:
  - DEU-014-005
- sense_id: '001642002001000'
  domain: Names of People
  definition: = man; ◄ son of {L:Seir<SDBH:שֵׂעִיר>}; ► chief of {L:Horites<SDBH:חֹרִי>}
  glosses:
  - Dishon
  references:
  - GEN-036-021
  - GEN-036-030
  - 1CH-001-038
  - 1CH-001-041
  - 1CH-001-042
- sense_id: '001642002002000'
  domain: Names of People
  definition: = man, also known as {L:Dishan<SDBH:דִּישָׁן>}; ◄ son of {L:Anah<SDBH:עֲנָה>};
    brother of {L:Oholibamah<SDBH:אָהֳלִיבָמָה>}; descendant of {L:Seir<SDBH:שֵׂעִיר>};
    father of {L:Hemdan<SDBH:חֶמְדָּן>}/{L:Hamran<SDBH:חַמְרָן>}, {L:Eshban<SDBH:אֶשְׁבָּן>},
    {L:Ithran<SDBH:יִתְרָן>}, and {L:Cheran<SDBH:כְּרָן>}
  glosses:
  - Dishon
  references:
  - GEN-036-025
  - 1CH-001-041
