  louw_nida_code: '3.28'
  domain: Plants
  definition: (derivative of ἄμπελος ‘grapevine’) a field or garden of grapevines,
    creeping plants that develop a woody stem when they mature; Vitis vinifera; they
    grow along the ground until they find a tree or other object to climb, using tendrils;
    they bear bunches of small round fruit that are sweet and juicy; a symbol of blessing,
    prosperity, and happiness
  glosses:
  - vineyard
  - orchard of grapevines
