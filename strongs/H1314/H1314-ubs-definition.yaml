senses:
- sense_id: '001210001001000'
  domain: Trees
  definition: = tree of 2-3 meters tall, with small, wrinkled, three-part leaves,
    white flowers, and pea-sized red berries that have a fragrant yellow seed inside;
    the bark of younger branches is gray, turning brown with age; it grows in desert
    or semi-desert climates; ◄ Opobalsamum; ► the tree is wanted for its resin, which
    appears by itself in green droplets from the stems and branches, but collectors
    also make cuts in the branches to speed the process; the droplets turn from green
    to brown, clump together, and fall to the ground, where they are collected; the
    resin is used in holy anointing oil, as medicine, and as an ingredient of perfume
  glosses:
  - balsam tree
  references:
  - SNG-005-013
  - SNG-006-002
  - SNG-008-014
- sense_id: '001210001002000'
  domain: Spices
  definition: '= generic terms for spices and aromatics, but sometimes specifically:
    fragrant resin ◄ produced by the balsam tree; ► used as ingredient for anointing
    oil and fragrant incense, and as perfume; ≈ considered very valuable'
  glosses:
  - spices
  - perfume
  - balsam oil
