senses:
- sense_id: 005049001001000
  domain: Names of Locations
  definition: = desert; ◄ in {L:Sinai<SDBH:סִינַי>} peninsula, between {L:Sea of Reeds<SDBH:יָם־סוּף>}
    and {L:Dophkah<SDBH:דָּפְקָה>}; ► the {L:Israelites<SDBH:יִשְׂרָאֵל>} encamped
    there on their way from {L:Egypt<SDBH:מִצְרַיִם>} to {L:Canaan<SDBH:כְּנַעַן>}
  glosses:
  - Desert of Sin
  references:
  - EXO-016-001
  - EXO-017-001
  - NUM-033-011
  - NUM-033-012
- sense_id: 005049001002000
  domain: Names of Locations
  definition: = town, identified with Pelusium; ◄ located at north-eastern border
    of {L:Egypt<SDBH:מִצְרַיִם>} ({A:ABD})
  glosses:
  - Sin
  - Pelusium
  references:
  - EZK-030-015
  - EZK-030-016
