strongs_number: H3753
lemma: כִּרְכָּרָה
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '003433001001000'
  domain: Domestic Animals
  definition: = a large, four-legged animal with one or two humps on its back, which
    may reach a height of 2 m. or more; suited to life in desert areas as they store
    excess food in their humps, are able to go without water for long periods, and
    can make long journeys through dry areas; ◄ Camelus dromedarius and Camelus bactrianus;
    ► they are used for riding and for carrying heavy loads and pulling carts; their
    hair is woven into cloth used for making tents or outer robes; their milk is used
    as food and drink; ≈ they are a symbol of wealth and commerce, but unclean and
    not to be eaten
  glosses:
  - dromedary
  - camel
  forms:
  - nsf
  references:
  - ISA-066-020
related_lemmas:
- word: כרר
