senses:
- sense_id: '001132001001000'
  louw_nida_code: '8.47'
  domain: Body, Body Parts, and Body Products
  definition: central hinge joint of the leg where the thigh is joined to the lower
    leg
  glosses:
  - knee
  references:
  - LUK-005-008
  - HEB-012-012
- sense_id: '001132001002000'
  louw_nida_code: '9.16'
  domain: People
  definition: (a figurative extension of meaning of {L:γόνυ<SDBG:γόνυ:000000>}[a]
    ‘knee,’ {D:8.47}) a person in the attitude or position of one worshiping or submitting
    to authority{N:001}
  glosses:
  - person
  - individual
  references:
  - ROM-014-011
  - PHP-002-010
- sense_id: '001132001003000'
  louw_nida_code: '53.61'
  domain: Religious Activities
  definition: '(a Semitic idiom, literally: the knee bends, or: the knee bows) to
    bend or bow the knee as a symbol of religious devotion{N:002}'
  glosses:
  - to worship
  - to bow before
  references:
  - ROM-011-004
  - ROM-014-011
  - EPH-003-014
- sense_id: '001132001004000'
  louw_nida_code: '25.152'
  domain: Attitudes and Emotions
  definition: '(an idiom, literally: straighten paralyzed knees) to gain encouragement
    by a strong resolve'
  glosses:
  - to become encouraged
  - to encourage oneself by determination
  references:
  - HEB-012-012
- sense_id: '001132001005000'
  louw_nida_code: '17.19'
  domain: Stances and Events Related to Stances
  definition: '(an idiom, literally: to place the knees, a Latinism) to kneel down
    before, with the implication of an act of reverence or of supplication'
  glosses:
  - to kneel down
  - to kneel
  references:
  - MRK-015-019
  - LUK-022-041
  - ACT-007-060
  - ACT-009-040
  - ACT-020-036
  - ACT-021-005
