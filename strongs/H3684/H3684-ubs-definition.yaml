  domain: Foolish
  definition: = state of absence of wisdom, which manifests itself in excessive anger,
    talking too rashly and too much, sinful behavior, and laziness, ► and results
    in poverty, shame, punishment, and trouble and grief for other people; ≈ foolishness
    is thought to reside in a person's {L:heart<SDBH:לֵב>}; the behavior and treatment
    of fools is often compared to that of animals
