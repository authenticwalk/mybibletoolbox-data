senses:
- sense_id: '004276001001000'
  domain: Tools
  definition: = tool of a relatively small size, flat in shape with a number of small
    projections on one side, corresponding an equal number of holes in the bolt of
    a door;◄ made of wood or metal; ► used for removing the bolt from the outside
    by inserting it through a hole in the door; ≈ being entrusted with the key to
    an important building gives a certain amount of status and power
  glosses:
  - key
