senses:
- sense_id: '002526001001000'
  domain: Metals
  definition: = metal of a bright yellow color, ◄ found in rocks and alluvial deposits
    ► and used as a monetary standard and in jewellery and plating; ≈ associated with
    wealth and quality
  glosses:
  - gold
  references:
  - PSA-068-014
  - PRO-003-014
  - PRO-008-010
  - PRO-008-019
  - PRO-016-016
  - ZEC-009-003
- sense_id: '002526002001000'
  domain: Fortifications
  definition: = deep wide ditch surrounding a town; ◄ manmade; ► provides protection
  glosses:
  - trench
  - moat (to provide security against enemy attack)
  references:
  - DAN-009-025
- sense_id: '002526003001000'
  domain: Impact
  definition: = state in which objects have been provided with a thin cutting edge
  glosses:
  - sharpened
  - sharp (threshing-sledge)
  references:
  - ISA-041-015
- sense_id: '002526003002000'
  domain: Impact
  definition: 'literally: having been cut; = state in which animals have a physical
    defect, ◄ caused by injury or mutilation'
  glosses:
  - maimed (animals are not to be sacrificed)
  references:
  - LEV-022-022
- sense_id: '002526003003000'
  domain: Tools
  definition: = wooden board with sharp stones or pieces of iron tightly wedged into
    small holes; ► dragged over harvested grain with the help of a draft animal to
    separate grain from straw or husk; ≈ symbol of power and aggression
  glosses:
  - threshing-sledge
  references:
  - JOB-041-022
  - ISA-028-027
  - AMO-001-003
- sense_id: '002526004001000'
  domain: Diligent
  definition: = state in which humans are ready and prepared to act when needed
  glosses:
  - diligent
  references:
  - PRO-010-004
  - PRO-012-024
  - PRO-012-027
  - PRO-013-004
  - PRO-021-005
- sense_id: '002526005001000'
  domain: Names of People
  definition: = man; ► father of {L:Meshullemeth<SDBH:מְשֻׁלֶּמֶת>}, wife of {L:Manasseh<SDBH:מְנַשֶּׁה>},
    mother of {L:Amon<SDBH:אָמֹון>}, king of {L:Judah<SDBH:יְהוּדָה>}
  glosses:
  - Haruz
  references:
  - 2KI-021-019
- sense_id: '002526005002000'
  domain: Names of Landforms
  definition: 'literally: Valley of Decision; = valley, also known as {L:Kidron<SDBH:קִדְרֹון>}
    Valley or Valley of {L:Jehoshaphat<SDBH:יְהֹושָׁפָט>}; ◄ located east of {L:Jerusalem<SDBH:יְרוּשָׁלַ͏ִם>}'
  glosses:
  - Valley of Decision
  references:
  - JOL-004-014
  - JOL-004-014
