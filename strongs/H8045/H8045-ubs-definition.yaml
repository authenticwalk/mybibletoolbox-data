senses:
- sense_id: '007444001001000'
  domain: Non-Exist
  definition: = causative action by which humans, deities, or events completely remove
    humans, animals, or objects from existence; ◄ by (a usually unnatural) death,
    aggression, hardship, disaster, destruction, or direct divine intervention; ►
    often as punishment
  glosses:
  - to destroy
  - to exterminate
  - to wipe out
  - to demolish
