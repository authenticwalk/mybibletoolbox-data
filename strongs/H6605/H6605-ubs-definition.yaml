  - ISA-052-002
- sense_id: 006069001008000
  domain: Detach
  definition: = causative action by which humans remove a rope linking two objects
  glosses:
  - to loose
  - to untie
  forms:
  - vbpiel
  references:
  - JOB-038-031
- sense_id: 006069001009000
  domain: Detach
  definition: = causative action by which humans release animals from bridles and
    loads and everything else that hampers them
  glosses:
  - to unharness
  - to unload
  forms:
  - vbpiel
  references:
  - GEN-024-032
- sense_id: 006069001010000
  domain: Rejoice
  definition: 'literally: to ungird (someone''s) sackcloth; hence: = causative action
    by which deities  bring joy into the life of humans, ◄ as if by removing the mourning
    clothes they wear'
  glosses:
  - '"to ungird (someone''s) sackcloth" = to bring joy (to someone)'
  forms:
  - vbpiel
  references:
  - PSA-030-012
- sense_id: 006069001011000
  domain: Non-Role
  definition: 'literally: to ungird (someone''s) correction; hence: = causative action
    by which deities remove humans from a position of authority, ◄ as if that authority
    was symbolized by the belt around their waist'
  glosses:
  - '"to ungird (someone''s) correction" = to depose'
  forms:
  - vbpiel
  references:
  - JOB-012-018
- sense_id: 006069001012000
  domain: Non-Role
  definition: 'literally: to ungird (someone''s) loins; hence: = causative action
    by which humans remove other humans from a position of authority, ◄ as if that
    authority was symbolized by the belt around their waist'
  glosses:
  - '"to ungird (someone''s) loins" = to depose'
  forms:
  - vbpiel
  references:
  - ISA-045-001
- sense_id: 006069001013000
  domain: Non-Engage
  definition: 'literally: to loose the bonds of wickedness; hence: = action by which
    humans let go of an activity directed at other humans that is considered evil,
    ◄ as if this activity was a rope or chain by which those others were tied'
  glosses:
  - '"to loose bonds of wickedness" = to release (people) that are kept in bondage
    unjustly'
  forms:
  - vbpiel
  references:
  - ISA-058-006
- sense_id: 006069001014000
  domain: Safe
  definition: 'literally: to loose (someone''s) bonds; hence: = causative action by
    which deities save humans from danger, ◄ as if by releasing them from the trap
    in which they were caught'
  glosses:
  - '"to loose (someone''s) bonds" = to deliver (someone)'
  forms:
  - vbpiel
  references:
  - PSA-116-016
- sense_id: 006069001015000
  domain: Weak
  definition: 'literally: to untie (someone''s) bowstring; hence: = causative action
    by which deities remove humans from a position of power and status, ◄ as if by
    removing the string from their bow to disarm them'
  glosses:
  - '"to untie (someone''s) bowstring" = to weaken (someone)'
  forms:
  - vbpiel
  references:
  - JOB-030-011
- sense_id: 006069001016000
  domain: Easy
  definition: 'literally: to open up words; hence: = causative action by which humans
    make difficult words easy to understand'
  glosses:
  - to explain
  - to solve
  forms:
  - vbqal-
  references:
  - PSA-049-005
- sense_id: 006069001017000
  domain: Free
  definition: 'literally: to loose (someone''s) bonds; hence: = causative action by
    which a deity allows a domesticated animal become a wild animal'
  glosses:
  - to release
  - to set free
  forms:
  - vbpiel
  references:
  - JOB-039-005
- sense_id: 006069001018000
  domain: Free
  definition: = causative action by which humans and deities release a prisoner
  glosses:
  - to release
  - to set free
  forms:
  - vbqal-
  - vbpiel
  - vbnif- (passive)
  references:
