  - to open
  - to let loose
  forms:
  - vbqal-
  - vbnif- (passive)
  references:
  - JER-001-014
  - AMO-008-005
- sense_id: 006069001020000
  domain: Hear
  definition: 'literally: to open (someone''s) ear; hence: = causative action by which
