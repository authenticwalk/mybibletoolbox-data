- sense_id: 006069001005000
  domain: Able
  definition: 'literally: to open (someone''s) womb; hence: = causative action by
    which deities enable humans to bear children'
  glosses:
  - to enable (someone) to have children
  forms:
  - vbqal-
  references:
  - GEN-029-031
  - GEN-030-022
- sense_id: 006069001006000
  domain: Able
  definition: 'literally: to open (someone''s) lips; hence: = causative action by
    which deities enable humans to speak'
  glosses:
  - to enable to speak
  forms:
  - vbqal-
  references:
  - PSA-051-017
- sense_id: 006069001007000
  domain: Detach
  definition: = action by which humans detach an object that is tied around them
  glosses:
  - to loose
  - to untie
  - to undo
  forms:
  - vbhit-
  references:
