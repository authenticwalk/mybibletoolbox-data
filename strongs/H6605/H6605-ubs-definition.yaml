- sense_id: 006069001004000
  domain: Able
  definition: 'literally: to open (someone else''s) mouth; hence: = causative action
    by which deities give humans or animals the ability to speak'
  glosses:
  - to enable to speak
  forms:
  - vbqal-
  - vbnif- (passive)
  references:
