  - ISA-050-005
- sense_id: 006069001021000
  domain: Ingest
  definition: = action by which humans or animals open their mouth ► in order to eat
    or swallow something; ≈ here used figuratively about the earth that opens up to
    swallow someone alive and send that person to the {L:world of the dead<SDBH:שְׁאֹול>}
  glosses:
