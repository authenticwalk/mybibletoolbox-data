strongs: G5485
lemma: χάρις
transliteration: charis
pos: noun
occurrences: 139

senses:
  - gloss: grace
    definition: Unmerited favor, especially God's kindness toward sinners.
    frequency: primary
    example: "John 1:14"
  - gloss: favor, goodwill
    definition: Approval or kindness shown to someone.
    frequency: secondary
    example: "Luke 2:52"
  - gloss: thanks, gratitude
    definition: An expression of thankfulness.
    frequency: secondary
    example: "1 Cor 15:57"
  - gloss: gift
    definition: A benefit or blessing bestowed.
    frequency: tertiary
    example: "2 Cor 8:4"

etymology: From G5463 (chairo, to rejoice); that which causes joy.
word_family:
  - G5463 # chairo (to rejoice)
  - G5486 # charisma (gift of grace)
  - G5487 # charitoo (to bestow grace)

semantic_range: Divine favor, human kindness, thanksgiving, or gracious gift.
translation_issue: Central to Paul's theology; must distinguish between grace as unmerited favor and grace as enabling power.
major_translations:
  KJV: grace, favour, thanks
  NIV: grace, favor
  ESV: grace, favor

key_verses:
