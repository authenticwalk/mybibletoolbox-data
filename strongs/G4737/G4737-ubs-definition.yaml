strongs_number: G4737
lemma: στεφανόω
source: UBS/SDGNT
license: CC-BY-SA 4.0
senses:
- sense_id: 004638001001000
  louw_nida_code: '57.122'
  domain: Possess, Transfer, Exchange
  definition: (derivative of {L:στέφανος<SDBG:στέφανος:000001>}[b] ‘prize, reward,’
    {D:57.121}) to cause someone to receive a prize or reward as the result of excellence
    in competition
  glosses:
  - to give a prize
  - to provide a reward
  references:
  - 2TI-002-005
- sense_id: 004638001002000
  louw_nida_code: '87.13'
  domain: Status
  definition: (a figurative extension of meaning of στεφανόω ‘to crown’ or ‘to put
    a victory wreath on,’ not occurring in the NT with this meaning) to show particular
    honor to a person as the result of some type of victory
  glosses:
  - to honor
  - to exalt
  references:
  - HEB-002-007
  - HEB-002-009
related_lemmas:
- word: στέμμα
- word: στέφανος
