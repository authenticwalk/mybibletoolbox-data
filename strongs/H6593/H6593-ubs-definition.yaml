strongs_number: H6593
lemma: פֵּשֶׁת
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 006058001001000
  domain: Crops
  definition: = product of a plant of about a meter tall; its leaves are narrow and
    the flowers are bright blue with five petals; ► the seed capsule contains oil;
    after the plants have ripened they are uprooted and the stalks are left to dry
    for a while; they are then soaked, dried, and beaten to separate the fibers, which
    are then combed and woven into linen cloth
  glosses:
  - flax
  references:
  - EXO-009-031
  - EXO-009-031
  - JOS-002-006
  - JDG-015-014
  - PRO-031-013
  - ISA-019-009
  - HOS-002-007
  - HOS-002-011
- sense_id: 006058001002000
  domain: Cloth
  definition: = woven material made from the stems of the flax plant; absorbs perspiration
    better than many other types of cloth; ► used for production of cloth and clothes,
    but can also be used as a measuring line; worn by priests; ≈ associated with quality,
    strength, and coolness
  glosses:
  - linen
  references:
  - LEV-013-047
  - LEV-013-048
  - LEV-013-052
  - LEV-013-059
  - DEU-022-011
  - JER-013-001
  - EZK-040-003
  - EZK-044-017
  - EZK-044-018
  - EZK-044-018
- sense_id: 006058001003000
  domain: Furnishings
  definition: = a strip of cotton that, when placed in a lamp, draws up the oil on
    one side and is set alight on the other
  glosses:
  - wick
  references:
  - ISA-042-003
  - ISA-043-017
