strongs_number: G0258
lemma: ἀλώπηξ
source: UBS/SDGNT
license: CC-BY-SA 4.0
senses:
- sense_id: '000256001001000'
  louw_nida_code: '4.10'
  domain: Animals
  definition: animal looking like a longhaired dog with a pointed nose and a bushy
    tail; either reddish with white underparts (fox) or yellowish brown with red tips
    to the fur on the back (jackal); scavenger; associated with destruction and devastation,
    and also with being insignificant but self-important; also intelligent and quick-witted,
    crafty
  glosses:
  - fox
  - jackal
  references:
  - MAT-008-020
  - LUK-009-058
- sense_id: '000256001002000'
  louw_nida_code: '88.120'
  domain: Moral and Ethical Qualities and Related Behavior
  definition: (a figurative extension of meaning of {L:ἀλώπηξ<SDBG:ἀλώπηξ:000000>}[a]
    ‘fox,’ {D:4.10}) a wicked person, probably with the implication of being cunning
    and treacherous
  glosses:
  - wicked person
  - cunning person
  - fox
  references:
  - LUK-013-032
