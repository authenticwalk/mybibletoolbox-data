- sense_id: '007062001002000'
  domain: Names of Groups
  definition: = {L:Horite<SDBH:חֹרִי>} clan, named after the man who founded them
    and bearing the same name as the area they live in; they were later dispossessed
    by the {L:Edomites<SDBH:אֲדֹומִי>} and it is not always clear from the context
    whether it refers to the original {L:Horites<SDBH:חֹרִי>} or the {L:Edomites<SDBH:אֲדֹומִי>}
  glosses:
