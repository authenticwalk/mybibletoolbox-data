senses:
- sense_id: 000393001001000
  domain: Trees
  definition: = terebinth; tree with a broad crown, heavy branches, and thick trunk;
    may reach a height of 7.5 to 9 m.; sheds its leaves; has small an inconspicuous
    flowers; ◄ pictacia terebinthus; ► its stem contains aromatic turpentine, a resinous
    juice, which flows out when the bark is cut; it provides pleasant shade; ≈ imposing
    tree, preferred place to sit under and enjoy the shade, associated with cultic
    worship
  glosses:
  - terebinth
