senses:
- sense_id: '002217001001000'
  domain: Sin
  definition: = action by which a human being commits a wrongful act against God or
    someone else, whether on purpose or not, ► which may require atonement, restitution,
    and/or retribution
  glosses:
  - sin
  references:
  - EXO-034-007
  - ISA-005-018
- sense_id: '002217001002000'
  domain: Sacrifice
  definition: = action by which a human being performs the sacrificial ritual that
    is intended to remove the state of guilt from oneself or someone else
  glosses:
  - sin-offering
  references:
  - EZR-006-017
  - EZR-006-017
