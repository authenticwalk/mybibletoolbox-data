senses:
- sense_id: 002858001001000
  domain: Birds
  definition: = a bird with a blue-gray color with a pinkish sheen to the neck feathers
    and a black tip on its tail; lives  in large colonies and eats mainly seeds; courts,
    mates, and has nests several times a year; nests on rock ledges; ◄ |iColumba livia|i*;
    ► used as food and for sacrifices; ≈ regarded as swift, docile, and innocent,
    but also as silly and senseless; associated with affection, fertility and sexuality
    because of its mating habits; the moaning sound this bird sometimes makes is associated
    with pain and suffering
  glosses:
  - dove
  - pigeon
