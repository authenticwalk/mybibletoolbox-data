senses:
- sense_id: '003374001001000'
  louw_nida_code: '32.59'
  domain: Understand
  definition: (causative derivative of {L:μωρία<SDBG:μωρία:000000>} ‘foolishness,’
    {D:32.57}) to cause the content of certain thoughts to become devoid of meaning
  glosses:
  - to cause to become nonsense
  references:
  - 1CO-001-020
- sense_id: '003374001002000'
  louw_nida_code: '32.56'
  domain: Understand
  definition: (derivative of {L:μωρός<SDBG:μωρός:000000>}[a] ‘unwise, foolish,’ {D:32.55})
    to become one who does not employ a capacity to understand and thus acts very
    foolishly
  glosses:
  - to become foolish
  - to act more foolishly
  forms:
  - μωραίνομαι[a]
  references:
  - ROM-001-022
- sense_id: '003374001003000'
  louw_nida_code: '79.44'
  domain: Features of Objects
  definition: to become insipid or tasteless
  glosses:
  - to become tasteless
  - to lose taste
  forms:
  - μωραίνομαι[b]
  references:
  - MAT-005-013
  - LUK-014-034
