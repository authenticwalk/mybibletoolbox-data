senses:
- sense_id: '005221001001000'
  louw_nida_code: '11.49'
  domain: Groups and Classes of Persons and Members of Such Groups and Classes
  definition: a member of an important religious and political Jewish party at the
    time of Jesus and the apostles. The Pharisees constituted a significantly larger
    group than the Sadducees (see {D:11.48}) and differed with them on certain doctrines
    and patterns of behavior. The Pharisees were strict and jealous adherents to the
    laws of the OT and to numerous additional traditions
  glosses:
  - Pharisee
