- sense_id: 004699001002000
  domain: Flee
  definition: = causative action by which humans cause other humans to move to another
    place in haste, ► in order to escape from a dangerous situation
  glosses:
  - to put to flight
  - to cause to flee
  forms:
  - vbhif-
  references:
  - EXO-009-020
  - DEU-032-030
- sense_id: 004699001003000
  domain: Flow
  definition: 'literally: to cause to flee; hence: = process by which wind causes
    water to flow into a certain direction'
  glosses:
  - to drive
  forms:
  - vbpiel
  references:
  - ISA-059-019
- sense_id: 004699001004000
  domain: Safe
  definition: 'literally: to cause to flee; hence: = causative action by which humans
    cause objects to be safe from danger'
  glosses:
  - to keep safe
  forms:
  - vbhif-
  references:
  - JDG-006-011
