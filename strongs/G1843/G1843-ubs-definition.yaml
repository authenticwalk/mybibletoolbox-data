senses:
- sense_id: 001857001001000
  louw_nida_code: '33.278'
  domain: Communication
  definition: to indicate agreement with a proposition or offer
  glosses:
  - to agree to
  references:
  - LUK-022-006
- sense_id: 001857001002000
  louw_nida_code: '33.274'
  domain: Communication
  definition: to express openly one’s allegiance to a proposition or person
  glosses:
  - to profess
  - to confess
  - confession
  forms:
  - ἐξομολογέομαι[a]
  references:
  - ROM-014-011
  - ROM-015-009
- sense_id: 001857001003000
  louw_nida_code: '33.275'
  domain: Communication
  definition: to acknowledge a fact publicly, often in reference to previous bad behavior
  glosses:
  - to admit
  - to confess
  forms:
  - ἐξομολογέομαι[b]
  references:
  - MAT-003-006
  - MRK-001-005
  - ACT-019-018
  - PHP-002-011
  - JAS-005-016
- sense_id: 001857001004000
  louw_nida_code: '33.351'
  domain: Communication
  definition: to acknowledge one’s thankfulness, restricted in NT usage to contexts
    in which God is the one being thanked
  glosses:
  - to thank
  - to give thanks to
  forms:
  - ἐξομολογέομαι[c]
  references:
  - MAT-011-025
  - LUK-010-021
- sense_id: 001857001005000
  louw_nida_code: '33.359'
  domain: Communication
  definition: to express praise or honor, with a possible implication of acknowledging
    the nature of someone or something (occurring in the NT only in quotations from
    the Septuagint)
  glosses:
  - to praise
  forms:
  - ἐξομολογέομαι[d]
  references:
  - LUK-022-006
  - ROM-014-011
  - ROM-015-009
