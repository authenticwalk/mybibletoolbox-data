senses:
- sense_id: '007110001001000'
  domain: Small Animals
  definition: = reddish brown viper with a pale underside and a row of pale blotches
    arranged side-by-side in pairs all the way down its back; it grows to about 80
    centimeters  in length, and its head is smaller and its body thinner than most
    typical vipers; it is easily provoked and quite aggressive; it is active mainly
    in the daytime, as it can stand higher temperatures than many other snakes; it
    lives in desert and grassland areas and feeds on jerboas, mice, and mole rats;
    its venom is slow-acting but highly poisonous; ◄ |iEchis coloratus|i*; ► unclean
    animal; ≈ associated with lurking danger
  glosses:
  - carpet viper
  references:
  - NUM-021-006
  - NUM-021-008
  - DEU-008-015
  - ISA-014-029
  - ISA-030-006
- sense_id: '007110001002000'
  domain: Spirits
  definition: = heavenly creature with six wings; ► surrounding the throne of God
    and praising his holiness
  glosses:
  - seraph
  references:
  - ISA-006-002
  - ISA-006-006
- sense_id: '007110002001000'
  domain: Names of People
  definition: = man; ◄ tribe of {L:Judah<SDBH:יְהוּדָה>}
  glosses:
  - Saraph
  references:
  - 1CH-004-022
