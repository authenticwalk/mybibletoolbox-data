senses:
- sense_id: '001427001001000'
  domain: Turn
  definition: = causative action by which humans cause an object to move by turning
    it over and over
  glosses:
  - to roll
  forms:
  - vbqal-
  - vbpiel
  references:
  - GEN-029-003
  - GEN-029-008
  - GEN-029-010
  - JOS-005-009
  - JOS-010-018
  - 1SA-014-033
  - PSA-119-022
  - PRO-026-027
  - JER-051-025
- sense_id: '001427001002000'
  domain: Turn
  definition: = causative action by which humans turn a flat object over and over
    on itself to form a cylindrical shape
  glosses:
  - to roll up
  forms:
  - vbnif- (passive)
  references:
  - ISA-034-004
- sense_id: '001427001003000'
  domain: Control
  definition: = action by which a group of people moves forward with force in order
    to arrest someone with violence
  glosses:
  - to roll oneself upon > to overpower
  forms:
  - vbhit-
  references:
  - GEN-043-018
- sense_id: '001427001004000'
  domain: Move
  definition: = process by which an object moves with an unstoppable force, ◄ like
    a stone that comes rolling down a slope
  glosses:
  - to roll on
  forms:
  - vbnif-
  references:
  - AMO-005-024
- sense_id: '001427001005000'
  domain: Move
  definition: = action by which a group of people moves forward with an unstoppable
    force, ◄ like a stone that comes rolling down a slope, ► with aggressive intent
  glosses:
  - to roll on
  forms:
  - vbhit-
  references:
  - JOB-030-014
- sense_id: '001427001006000'
  domain: Confident
  definition: = action by which humans show their confidence in a deity by putting
    difficult matters in that deity's hands, ◄ like a heavy stone is rolled on to
    someone else who is more able to carry it
  glosses:
  - to roll > to commit
  references:
  - PSA-022-009
  - PSA-037-005
  - PRO-016-003
- sense_id: '001427001007000'
  domain: Wet
  definition: = process by which an object is turned about in a liquid or substance,
    so it becomes drenched by it
  glosses:
  - to be rolled > to be soaked
  forms:
  - vbpual
  references:
  - ISA-009-004
- sense_id: 001427001008000
  domain: Wet
  definition: = action by which humans turn about in a liquid or substance, so that
    their clothing becomes drenched by it
  glosses:
  - to wallow
  forms:
  - vbhit-
  references:
  - 2SA-020-012
