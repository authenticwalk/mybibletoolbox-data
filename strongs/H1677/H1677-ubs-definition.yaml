- sense_id: '001540001001000'
  domain: Wild Animals
  definition: = large mammal with thick fur and a rather doglike face; walks on all
    fours but may stand up on its back legs to get a better view; maybe 2 meters tall
    when standing up and weigh over 200 kilos; feeds on roots, berries, wild fruit,
    mice, and lizards, and, occasionally, small livestock; ◄ |iUrsus arctos syriacus|i*;
    ► dangerous when provoked or robbed of cubs; ≈ associated with violence and danger
  glosses:
  - (Syrian brown) bear
