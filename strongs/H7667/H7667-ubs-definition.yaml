senses:
- sense_id: 007185001001000
  domain: Impact
  definition: = causative action or process by which humans or deities cause an object
    to be broken into two or more pieces; ≈ sometimes use figuratively to denote the
    sudden end of a certain condition or situation
  glosses:
  - breaking
  - breach
  references:
  - PSA-060-004
  - ISA-030-013
  - ISA-030-014
- sense_id: 007185001002000
  domain: Impact
  definition: 'literally: to break; hence: = causative action or process by which
    humans, deities, animals, or circumstances cause (other) humans or animals to
    be severely injured'
  glosses:
  - injury
  - fracture
  references:
  - LEV-021-019
  - LEV-021-019
  - LEV-024-020
  - LEV-024-020
  - ISA-030-026
- sense_id: 007185001003000
  domain: Grieve
  definition: 'literally: breaking of (someone''s) spirit; hence: = causative process
    by which deities or circumstances cause humans to suffer profound grief'
  glosses:
  - to break (someone's) spirit > to cause profound grief
  references:
  - PRO-015-004
  - ISA-065-014
- sense_id: 007185001004000
  domain: Know
  definition: 'literally: breaking; hence: = action by which humans explain the meaning
    of an event that is hard to interpret, such as a dream'
  glosses:
  - interpretation
  references:
  - JDG-007-015
- sense_id: 007185001005000
  domain: Sounds
  definition: 'literally: (sound of) breaking; hence: = process by which a loud sound
    is heard, ◄ which is experienced as similar to the sound of something breaking'
  glosses:
  - crashing sound
  references:
  - JOB-041-017
  - ZEP-001-010
- sense_id: 007185001006000
  domain: Unsafe
  definition: 'literally: breaking; hence: = causative action by which humans, deities,
    or circumstances take away {L:peace<SDBH:שָׁלֹום>} from a community by causing
    destruction, death, and suffering'
  glosses:
  - disaster
  - destruction
