strongs_number: H2174
lemma: זִמְרִי
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '002006001001000'
  domain: Names of People
  definition: = man; official of {L:Elah<SDBH:אֵלָה>} who conspired against him and
    was king of {L:Israel<SDBH:יִשְׂרָאֵל>} for seven days (ca. 876 BCE)
  glosses:
  - Zimri
  references:
  - 1KI-016-009
  - 1KI-016-010
  - 1KI-016-012
  - 1KI-016-015
  - 1KI-016-016
  - 1KI-016-018
  - 1KI-016-020
  - 2KI-009-031
- sense_id: '002006001002000'
  domain: Names of People
  definition: = man; ◄ son of {L:Salu<SDBH:סָלוּא>}; tribe of {L:Simeon<SDBH:שִׁמְעֹון>};
    ► was killed by {L:Phinehas<SDBH:פִּינְחָס>} because he committed adultery with
    a {L:Midianite<SDBH:מִדְיָנִי>} woman
  glosses:
  - Zimri
  references:
  - NUM-025-014
- sense_id: '002006001003000'
  domain: Names of People
  definition: = man, also known as {L:Zabdi<SDBH:זַבְדִּי>}; ◄ son of {L:Zerah<SDBH:זֶרַח>};
    tribe of {L:Judah<SDBH:יְהוּדָה>}
  glosses:
  - Zimri
  references:
  - 1CH-002-006
- sense_id: '002006001004000'
  domain: Names of People
  definition: = man; ◄ son of {L:Jarah<SDBH:יַעְרָה>}, {L:Jehoaddah<SDBH:יְהֹועַדָּה>};
    tribe of {L:Benjamin<SDBH:בִּנְיָמִן>}; ► father of {L:Moza<SDBH:מֹוצָא>}
  glosses:
  - Zimri
  references:
  - 1CH-008-036
  - 1CH-008-036
  - 1CH-009-042
  - 1CH-009-042
- sense_id: '002006001005000'
  domain: Names of Groups
  definition: = nation, possibly to be linked with {L:Zimran<SDBH:זִמְרָן>}, son of
    {L:Abraham<SDBH:אַבְרָהָם>} and {L:Ketura<SDBH:קְטוּרָה>}; or possibly a substitution
    cipher, where the letters of the alphabet are reversed (atbash), for {L:Elam<SDBH:עֵילָם>}
  glosses:
  - Zimri
  references:
  - JER-025-025
