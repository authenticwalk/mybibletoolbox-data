senses:
- sense_id: '006416001001000'
  domain: Wild Animals
  definition: = large primate with long tail and doglike muzzle, the size of a fairly
    large dog; usually light brown in color, but older males sometimes turn gray;
    some large males develop a mane like a lion; they spend most of their time on
    the ground and eat a variety of roots, shoots, fruits, leaves, insects, and small
    reptiles; ◄ various subspecies of |ipapio|i*; ► brought to Israel from Tarsis
  glosses:
  - baboon
  references:
  - 1KI-010-022
  - 2CH-009-021
