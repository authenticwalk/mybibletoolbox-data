senses:
- sense_id: 003491001001000
  domain: Names of People
  definition: = woman; ◄ daughter of {L:Laban<SDBH:לָבָן>}; ► first wife of {L:Jacob<SDBH:יַעֲקֹב>};
    mother of {L:Reuben<SDBH:רְאוּבֵן>}, {L:Levi<SDBH:לֵוִי>}, {L:Simeon<SDBH:שִׁמְעֹון>},
    {L:Judah<SDBH:יְהוּדָה>}, {L:Issachar<SDBH:יִשָּׂשכָר>}, {L:Zebulun<SDBH:זְבוּלוּן>},
    {L:Dinah<SDBH:דִּינָה>}, and, through her slave {L:Zilpah<SDBH:זִלְפָּה>}, of
    {L:Gad<SDBH:גָּד>} and {L:Asher<SDBH:אָשֵׁר>}
