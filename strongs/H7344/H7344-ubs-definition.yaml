senses:
- sense_id: '006745001001000'
  domain: Names of Locations
  definition: = a well, ◄ dug by herdsmen of {L:Isaac<SDBH:יִצְחָק>}, which, unlike
    the wells of {L:Esek<SDBH:עֵשֶׂק>} and {L:Sitnah<SDBH:שִׂטְנָה>}, did not become
    a source of contention between them and the herdsmen of {L:Gerar<SDBH:גְּרָר>}
  glosses:
  - Rehoboth
  references:
  - GEN-026-022
- sense_id: '006745001002000'
  domain: Names of Locations
  definition: = town; ◄ located on the {L:Euphrates<SDBH:פְּרָת>} river in {L:Mesopotamia<SDBH:אֲרַם
    נַהֲרַיִם>}; ► town of King {L:Shaul<SDBH:שָׁאוּל>} of {L:Edom<SDBH:אֱדֹום>}
  glosses:
  - Rehoboth
  - Rehoboth on the River
  references:
  - GEN-036-037
  - 1CH-001-048
