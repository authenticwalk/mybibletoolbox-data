strongs_number: H0724
lemma: אֲרוּכָה
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '000667001001000'
  domain: Intact
  definition: = causative action by which humans restore a building to its original
    state
  glosses:
  - repair
  references:
  - 2CH-024-013
  - NEH-004-001
- sense_id: '000667001002000'
  domain: Strong
  definition: = causative action by which humans or deities help or cause (other)
    humans to be restored to health or physical strength after a disease or an accident
  glosses:
  - healing
  references:
  - ISA-058-008
  - JER-008-022
  - JER-030-017
- sense_id: '000667001003000'
  domain: Safe
  definition: 'literally: healing; hence: = causative action by which deities remove
    the consequences of evil and restore a country or nation to a state of peace and
    prosperity'
  glosses:
  - healing
  references:
  - JER-033-006
