- sense_id: '000065001003000'
  domain: Titles
  definition: God ◄ described as an unmoveable stone, ► signifying that he is dependable
    and able to protect against the enemy
  glosses:
  - Stone of Israel
  - Rock of Israel
  references:
  - GEN-049-024
- sense_id: '000065001004000'
  domain: Titles
  definition: = God ◄ described as a stone over which one may stumble, ► signifying
    that he will punish those who do not honor him
  glosses:
  - (God as a) stumbling stone
  references:
  - ISA-008-014
- sense_id: '000065001005000'
  domain: Dead
  definition: 'literally: to descend to the stones of the pit; hence: = to die and
    go to the world of the dead, depicted as a deep rocky pit'
  glosses:
  - to go to the stones of the pit > to die
  forms:
  - vbqal-
  references:
  - ISA-014-019
- sense_id: '000065001006000'
  domain: Non-Exist
  definition: 'literally: to stretch out the plummet of chaos over something; hence:
    = to reduce a land to destruction, ◄ as if it were meticulously planned and methodologically
    executed with the help of a plummet'
  glosses:
  - to stretch the plummet of chaos over (something) > to reduce (something) to chaos
  references:
  - ISA-034-011
- sense_id: '000065001007000'
  domain: Confident
  definition: 'literally: (one''s) heart is hard as stone; hence: = state of not being
    easily frightened'
  glosses:
  - to be hard as stone (of one's heart) > to not be easily frightened
  forms:
  - vbqal-s
  references:
  - JOB-041-016
