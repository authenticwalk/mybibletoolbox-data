senses:
- sense_id: '002710001001000'
  louw_nida_code: '13.133'
  domain: Be, Become, Exist, Happen
  definition: to cause something adverse to happen to someone, usually in connection
    with accusations or condemnations
  glosses:
  - to bring against
  - to cause to happen to
  - to bring about
  references:
  - ACT-025-007
- sense_id: '002710001002000'
  louw_nida_code: '30.103'
  domain: Think
  definition: '(an idiom, literally: to bring a pebble against someone, a reference
    to a white or black pebble used in voting for or against someone) to make known
    one’s choice against someone'
  glosses:
  - to vote against
  references:
  - ACT-026-010
- sense_id: '002710001003000'
  louw_nida_code: '23.71'
  domain: Physiological Processes and States
  definition: '(an idiom, literally: to be carried away from sleep) to be in a state
    of deep sleep'
  glosses:
  - to be sound asleep
  - to be completely asleep
  forms:
  - καταφέρομαι[a]
  references:
  - ACT-020-009
- sense_id: '002710001004000'
  louw_nida_code: '23.68'
  domain: Physiological Processes and States
  definition: '(an idiom, literally: to be carried away by sleep) to become increasingly
    more sleepy'
  glosses:
  - to get sleepier
  - to become more and more sleepy
  forms:
  - καταφέρομαι[b]
  references:
  - ACT-020-009
