senses:
- sense_id: '006334001001000'
  domain: Impact
  definition: = a condition that affects the skin or surface, which probably covers
    diseases such as psoriasis, favus, leucoderma, but also mildew on cloth and walls;
    ► a person who suffers from this disease is considered ritually unclean, and therefore
    unable to participate in worship; clothes and buildings that are affected by it
    are unclean as well; ≈ regarded as infectious, and seen as a curse and a punishment
    from God
  glosses:
  - skin disease
  - mildew
