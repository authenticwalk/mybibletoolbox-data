senses:
- sense_id: 006294001001000
  domain: Domestic Animals
  definition: = male domestic animal, generally black in color, found in both shorthaired
    and longhaired varieties, with horns, usually herded together with sheep; ◄ Capra
    hircus mambrica or Capra hircus angorensis; ► clean animal, source of milk, hides,
    hair, and horns, may be used for sacrifice; ≈ sometimes associated with demons,
    regarded as aggressive
  glosses:
  - he-goat
