strongs_number: H0792
lemma: אֶשְׁבַּעַל
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '000731001001000'
  domain: Names of People
  definition: = man, also known as {L:Ish-Boshet<SDBH:אִישׁ־בֹּשֶׁת>} and {L:Ishvi<SDBH:יִשְׁוִי>};
    ◄ son of {L:Saul<SDBH:שָׁאוּל>}; tribe of {L:Benjamin<SDBH:בִּנְיָמִן>}; ► succeeded
    his father as king of the northern tribes until he was assassinated and {L:David<SDBH:דָּוִד>}
    took his place; ≈ the author or a redactor of 2 Samuel probably changed his name
    to Ish-Bosheth ("man of shame") to avoid references to the idol {L:Baal<SDBH:בַּעַל>}
  glosses:
  - Eshbaal
  references:
  - 1CH-008-033
  - 1CH-009-039
related_lemmas:
- word: אִישׁ
