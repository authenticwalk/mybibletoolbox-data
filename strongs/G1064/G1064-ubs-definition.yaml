senses:
- sense_id: '001074001001000'
  louw_nida_code: '8.68'
  domain: Body, Body Parts, and Body Products
  definition: the inward parts of the body, either the digestive system (as in γαστέρες
    ἀργαί, literally ‘lazy bellies,’ but meaning ‘gluttons’ {S:05600101200026}) or
    the womb (in set phrases such as συλλαμβάνω ἐν γαστρί ‘to conceive’ {S:04200103100010};
    ἐν γαστρὶ ἔχω ‘be pregnant’ {S:04000101800044} and elsewhere)
  glosses:
  - belly
  - stomach
  - womb
  references:
  - LUK-001-031
- sense_id: '001074001002000'
  louw_nida_code: '23.19'
  domain: Physiological Processes and States
  definition: (a figurative extension of meaning of {L:γαστήρ<SDBG:γαστήρ:000000>}[a]
    ‘belly,’ {D:8.68}) a person who habitually eats excessively
  glosses:
  - glutton
  references:
  - TIT-001-012
- sense_id: '001074001003000'
  louw_nida_code: '23.50'
  domain: Physiological Processes and States
  definition: '(an idiom, literally: to have in the womb) to be in a state of pregnancy'
  glosses:
  - pregnant
  - to be pregnant
  references:
  - MAT-001-018
  - MAT-001-023
  - MAT-024-019
  - MRK-013-017
  - LUK-021-023
  - 1TH-005-003
  - REV-012-002
