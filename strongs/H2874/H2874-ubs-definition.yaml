senses:
- sense_id: '002646001001000'
  domain: Dead
  definition: = causative action by which humans kill animals by slicing the jugular
    vein and windpipe with a sharp-bladed instrument, ► to prepare its meat for a
    meal; ≈ associated with aggression
  glosses:
  - killing, slaughter, butchering
  references:
  - GEN-043-016
  - PRO-007-022
  - PRO-009-002
  - ISA-034-006
  - ISA-053-007
  - JER-050-027
- sense_id: '002646001002000'
  domain: Dead
  definition: = causative action by which humans kill other humans like an animal,
    with a sharp-bladed instrument; ≈ associated with anger, power, callousness (of
    the killer), and helplessness (of the victim)
  glosses:
  - killing
  - slaughter
  - butchering
  references:
  - ISA-034-002
  - ISA-065-012
  - JER-048-015
  - EZK-021-015
  - EZK-021-020
  - EZK-021-033
- sense_id: '002646002001000'
  domain: Names of People
  definition: = man; ◄ son of {L:Abraham<SDBH:אַבְרָהָם>}'s brother {L:Nahor<SDBH:נָחֹור>}
    and his concubine {L:Reumah<SDBH:רְאוּמָה>}
  glosses:
  - Tebah
  references:
  - GEN-022-024
