strongs_number: H7828
lemma: שַׁחַף
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 007293001001000
  domain: Birds
  definition: = seabird, living on the coasts of large bodies of water; white with
    gray or black back and upper wing surfaces; it has long flexible wings; it feeds
    on fish or plankton, usually settling on the water to feed; some dive into the
    water for their food, and many are also shoreline scavengers, eating dead fish,
    crabs, and shellfish; Larus ridibundus, Larus argentatus, ◄ Sterna hirundo, Sterna
    albifrons; ► unclean and therefore not to be eaten
  glosses:
  - seagull
  references:
  - LEV-011-016
  - DEU-014-015
