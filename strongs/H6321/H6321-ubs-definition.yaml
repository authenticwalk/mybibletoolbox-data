senses:
- sense_id: 005806001001000
  domain: Crops
  definition: = product of an erect plant, not a vine, reaching to 1 meter (3 feet)
    in height; its stem branches only in the upper part, and it has no tendrils; it
    has white flowers that, when they ripen, form pods containing 3-6 large flat beans
    of a cream or tan color; ◄ Vicia faba or Faba vulgaris; ► used for food
  glosses:
  - bean
  references:
  - 2SA-017-028
  - EZK-004-009
