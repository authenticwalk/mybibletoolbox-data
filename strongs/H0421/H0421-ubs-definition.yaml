strongs_number: H0421
lemma: אלה
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 000391001001000
  domain: Curse
  definition: '= action by which someone invokes the name of a deity and ask him to
    punish a wrong-doer; ◄ contexts in which this may happen include: (1) covenants
    and agreements, where the deity is asked to punish those who do not obey the terms
    of the agreement, (2) cases  where a supposedly wrongful act has been committed,
    but where there is not enough certainty about the identity of the person who is
    responsible, and (3) in order to prevent people from committing a wrongful action,
    knowing that the deity''s punishment will be upon them if they do so; ► the effectiveness
    of the curse partially depends on the authority of the one pronouncing it'
  glosses:
  - to utter a curse
  - to bind with a curse
  forms:
  - vbqal-
  references:
  - JDG-017-002
  - HOS-010-004
- sense_id: 000391001002000
  domain: Curse
  definition: '= to cause someone else to invoke the name of a deity and ask him to
    punish a wrong-doer; ◄ contexts in which this may happen include: (1) covenants
    and agreements, where the deity is asked to punish those who do not obey the terms
    of the agreement, (2) cases  where a supposedly wrongful act has been committed,
    but where there is not enough certainty about the identity of the person who is
    responsible, and (3) in order to prevent people from committing a wrongful action,
    knowing that the deity''s punishment will be upon them if they do so; ► the effectiveness
    of the curse partially depends on the authority of the one pronouncing it'
  glosses:
  - to cause someone to bind himself with a curse
  forms:
  - vbhif-
  references:
  - 1SA-014-024
  - 1KI-008-031
  - 2CH-006-022
- sense_id: 000391001003000
  domain: Curse
  definition: = to consign someone or something to death, damage, or destruction,
    usually by invoking the name of a deity if the agent is human; ◄ this is done
    as punishment, out of contempt, anger, or hostility; ► the effectiveness of a
    curse partially depends on the authority of the one pronouncing it
  glosses:
  - to curse
  forms:
  - vbqal-
  references:
  - HOS-004-002
- sense_id: 000391002001000
  domain: Shout
  definition: = to loudly express one's grief
  glosses:
  - to lament
  forms:
  - vbqal-
  references:
  - JOL-001-008
- sense_id: 000391003001000
  domain: Test
  definition: = to make an effort to perform a certain event
  glosses:
  - to try
  forms:
  - vbqal-
  references:
  - 1SA-017-039
related_lemmas:
- word: אָלָה
- word: תַּאֲלָה
