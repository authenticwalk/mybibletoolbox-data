senses:
- sense_id: '007055001001000'
  domain: Clothing
  definition: = a long, flowing outer garment reaching to the feet; it was generally
    a loose-fitting cloth that was draped around the body and held in place in the
    middle by a sash wrapped around the waist or some means of fastening such as pins
    or buttons; it was worn at all levels of society, including also priests and other
    religious leaders; it served more purposes than just an outer covering; women
    sometimes carried bowls or other implements or grain in its folds; for poorer
    people it also served as a covering when sleeping
  glosses:
  - mantle
  - cloak
