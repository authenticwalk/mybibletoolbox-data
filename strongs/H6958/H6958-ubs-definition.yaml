strongs_number: H6958
lemma: קיא
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '006443001001000'
  domain: Excrete
  definition: = action by which humans or animals empty their stomachs of its contents;
    ◄ after having eaten too much, having ingested contaminated food, or due to sickness
    or excessive alcohol consumption
  glosses:
  - to vomit
  - to throw up
  forms:
  - vbqal-
  references:
  - JER-025-027
- sense_id: '006443001002000'
  domain: Excrete
  definition: = action by which humans or animals vomit up something specific from
    their stomachs
  glosses:
  - to vomit up (something specific)
  forms:
  - vbhif-
  references:
  - PRO-023-008
  - PRO-025-016
  - JON-002-011
- sense_id: '006443001003000'
  domain: Non-Possess
  definition: 'literally: to vomit; hence: = process by which humans lose their possessions
    in an unpleasant way'
  glosses:
  - to vomit > lose (one's wealth as punishment)
  forms:
  - vbhif-
  references:
  - JOB-020-015
- sense_id: '006443001004000'
  domain: Move
  definition: 'literally: to vomit; hence: = causative action by which land refuses
    to allow people to remain as if they were contaminated food'
  glosses:
  - to vomit > to expel (its people because of their sin)
  forms:
  - vbqal-
  - vbhif-
  references:
  - LEV-018-025
  - LEV-018-028
  - LEV-018-028
  - LEV-020-022
related_lemmas:
- word: קִיא
