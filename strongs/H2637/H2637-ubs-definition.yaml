  - ECC-009-008
  - SNG-007-003
  - ISA-051-014
- sense_id: 002429001002000
  domain: Non-Possess
  definition: = state in which humans lack something that they are supposed to have
  glosses:
  - to lack
  - to be in need (of something)
  forms:
  - vbqal-
  - vbhif-
  references:
  - EXO-016-018
  - DEU-002-007
  - DEU-008-009
  - DEU-015-008
