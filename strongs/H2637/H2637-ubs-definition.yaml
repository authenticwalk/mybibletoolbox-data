  - EZK-004-017
- sense_id: 002429001003000
  domain: Non-Possess
  definition: = causative action by which humans cause other humans to lack something
    that they are supposed to have
  glosses:
  - to deprive
  forms:
  - vbhif-
  references:
  - ISA-032-006
- sense_id: 002429001004000
  domain: Non-Engage
  definition: = causative action by which humans cause other humans to attain a certain
    state to a lesser extent than would be possible or desired
  glosses:
  - to deprive
  forms:
  - vbpiel
  references:
  - ECC-004-008
- sense_id: 002429001005000
  domain: Insignificant
  definition: = causative action by which deities cause humans to have a lesser status
    than other people
  glosses:
  - to cause to be less
  forms:
  - vbpiel
  references:
  - PSA-008-006
