senses:
- sense_id: 001459001001000
  domain: Names of People
  definition: = man, ◄ son of {L:Hadad<SDBH:הֲדַד>}, member of the royal family of
    {L:Edom<SDBH:אֱדֹום>}, who had to flee to {L:Egypt<SDBH:מִצְרַיִם>}, and the son
    of the sister of {L:Tahpenes<SDBH:תַּחְפְּנֵיס>}, queen of Egypt ► during the
    time of King {L:David<SDBH:דָּוִד>} and King {L:Solomon<SDBH:שְׁלֹמֹה>}
  glosses:
  - Genubath
