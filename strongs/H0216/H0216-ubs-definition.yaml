senses:
- sense_id: '000207001001000'
  domain: Shine
  definition: = light as a physical phenomenon, mainly observed during daytime, and
    the opposite of darkness; ◄ one of God's most important attributes; first created
    by God and since produced by sun, moon, and stars, but also by fire; ► enables
    people and animals to see; ≈ associated with life, goodness, happiness, prosperity,
    security, favor, and wisdom, loved by the righteous, and hated by the wicked
  glosses:
  - light
