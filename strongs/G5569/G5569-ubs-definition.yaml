- sense_id: '005453001001000'
  louw_nida_code: '11.36'
  domain: Groups and Classes of Persons and Members of Such Groups and Classes
  definition: an individual who pretends to be a close member of a socio-religious
    group but is not (see {D:11.22}, {D:11.23}, and {D:11.24})
  glosses:
  - false brother
  - one who only pretends to be a fellow believer in Christ
