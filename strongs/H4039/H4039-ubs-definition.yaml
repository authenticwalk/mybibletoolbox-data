strongs_number: H4039
lemma: מְגִלָּה
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 003697001001000
  domain: Scrolls
  definition: = long strip of writing material made by sewing together sheets of papyrus
    or parchment; this strip was then rolled up from one end or from both ends to
    form one or two cylinders; usually the ends of the scroll were attached to sticks,
    around which the scroll was rolled; an unrolled scroll was often about 10 meters
    in length and stood approximately 23-25 centimeters high; the term מְגִלַּת־סֵפֶר
    seems to be the more complete term for a book scroll, as it occurs at the beginning
    of passages in which scrolls play a roll; the shorter term מְגִלָּה is used after
    that
  glosses:
  - scroll
