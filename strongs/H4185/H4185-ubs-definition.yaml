senses:
- sense_id: 003819001001000
  domain: Detach
  definition: = process why which an object gets detached from the place where it
    has been fixed
  glosses:
  - to give way
  forms:
  - vbqal-
  references:
  - ISA-022-025
- sense_id: 003819001002000
  domain: Non-Engage
  definition: 'literally: to detach oneself (from an activity); hence: = action by
    which humans stop engaging in an activity'
  glosses:
  - to deviate from
  forms:
  - vbhif-
  references:
  - JOB-023-012
- sense_id: 003819001003000
  domain: Move
  definition: = process by which an object moves away from its location
  glosses:
