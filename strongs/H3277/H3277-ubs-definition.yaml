strongs_number: H3277
lemma: יָעֵל
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 002997001001000
  domain: Wild Animals
  definition: = fairly large wild goat, with adults being about ninety centimeters
    high at the shoulder; for most of the year its color is grayish but it turns browner
    in winter; males have thick long horns over 130 centimeters in length which curve
    backwards in a semicircle; the horns of the females are much slimmer and shorter,
    reaching a length of only about 40 centimeters; only the last few centimeters
    of the horns are smooth, the rest being ringed with ridges; these animals live
    in small herds in the mountains and prefer cliffs and crags, where they live off
    the bushes that grow on the ledges; ► clean animal, so may be eaten
  glosses:
  - ibex
  - wild goat
  - mountain goat
  references:
  - JOB-039-001
  - PSA-104-018
- sense_id: 002997002001000
  domain: Names of Landforms
  definition: = rocks; ◄ located near {L:En-Gedi<SDBH:עֵין גֶּדִי>}; ► one of the
    places where {L:David<SDBH:דָּוִד>} and his men were hiding for {L:Saul<SDBH:שָׁאוּל>}
  glosses:
  - Rocks of Wild Goats
  references:
  - 1SA-024-003
- sense_id: 002997003001000
  domain: Names of People
  definition: = woman; ◄ wife of {L:Heber<SDBH:חֶבֶר>}, {L:Kenite<SDBH:קֵינִי>}; ►
    time of the Judges
  glosses:
  - Jael
  references:
  - JDG-004-017
  - JDG-004-018
  - JDG-004-021
  - JDG-004-022
  - JDG-005-006
  - JDG-005-024
