senses:
- sense_id: 003988001001000
  domain: Traps
  definition: = circular net with weights and a draw rope around its edge of roughly
    6-7.5 meters in diameter; ► thrown from a boat or the shore in a circular motion
    so that it lands with the net fully spread out on the water; the weights carry
    it down, trapping fish underneath; then the fisherman uses the draw rope to close
    the net and pull it back to himself; ≈ associated with aggression and control
  glosses:
  - casting net
  references:
  - ISA-019-008
  - HAB-001-015
  - HAB-001-016
