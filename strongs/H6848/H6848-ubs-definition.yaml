  domain: Small Animals
  definition: = extremely poisonous snake with the ability to spread the ribs in the
    neck area so as to form a broad, flat profile; dark brown in color with a yellowish
    underside (and sometimes yellowish bands); ◄ Desert Cobra (|iWalterinnesia aegyptia|i*)
    or Egyptian Cobra (|iNaja haje|i*); ► unclean animal; ≈ associated with aggression
    and lurking danger
  glosses:
  - cobra
