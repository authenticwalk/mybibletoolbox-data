senses:
- sense_id: '001120001001000'
  domain: Crops
  definition: = plant, with hollow leaves and a hollow stem about 30 centimeters tall
    with a spherical head of flowers; its root is a round bulb made up of tightly
    packed layers of fleshy, edible tissue; sharp in taste; ◄ Allium cepa; ► considered
    one of the tasty things from the life of Egypt that the Israelites longed for
    as they wandered in the Sinai Desert for forty years
  glosses:
  - onion
