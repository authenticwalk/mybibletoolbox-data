- sense_id: 000396001002000
  domain: Curse
  definition: = action by which someone or something is consigned to death, damage,
    or destruction, usually by invoking the name of a deity if the agent is human;
    ◄ this is done as punishment, out of contempt, anger, or hostility; ► the effectiveness
    of a curse partially depends on the authority of the one pronouncing it
  glosses:
  - curse
  references:
  - JOB-031-030
  - PSA-010-007
  - PSA-059-013
- sense_id: 000396001003000
  domain: Curse
  definition: = object of a curse uttered by other people because of the wrongful
    acts that one has committed
