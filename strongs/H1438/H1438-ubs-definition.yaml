strongs_number: H1438
lemma: גדע
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 001318001001000
  domain: Detach
  definition: = process by which part of an object, without apparent human intervention,
    detaches itself from a larger unit, so that it falls to the ground
  glosses:
  - to break off
  forms:
  - vbnif-
  references:
  - ISA-022-025
- sense_id: 001318001002000
  domain: Detach
  definition: = causative action by which part of an object is violently removed from
    a larger unit, with the help of a sharp object, so that it falls to the ground
  glosses:
  - to cut off
  - to cut down
  forms:
  - vbqal-
  - vbpiel
  - vbnif- (passive)
  - vbpual (passive)
  references:
  - DEU-007-005
  - DEU-012-003
  - JDG-021-006
  - 1SA-002-031
  - 2CH-014-002
  - 2CH-031-001
  - 2CH-034-004
  - 2CH-034-007
  - PSA-075-011
  - ISA-009-009
  - ISA-010-033
  - ISA-014-012
  - JER-048-025
  - LAM-002-003
  - EZK-006-006
  - AMO-003-014
- sense_id: 001318001003000
  domain: Impact
  definition: = causative action by which a human being breaks an object into two
    pieces in a violent way, so that it will no longer be functional
  glosses:
  - to break in two
  forms:
  - vbqal-
  - vbpiel
  - vbnif- (passive)
  references:
  - PSA-107-016
  - ISA-045-002
  - JER-050-023
  - ZEC-011-010
  - ZEC-011-014
