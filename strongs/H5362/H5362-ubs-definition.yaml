    that covers an object is removed'
  glosses:
  - to be peeled of
  forms:
  - vbpiel
  references:
  - JOB-019-026
- sense_id: 004912002001000
  domain: Space
  definition: = state in which an object is located in a circle around another object
  glosses:
  - to surround
  - to encompass
  forms:
  - vbhif-
  references:
  - 1KI-007-024
  - 2CH-004-003
- sense_id: 004912002002000
  domain: Space
  definition: = action by which humans take position in a full or partial circle around
