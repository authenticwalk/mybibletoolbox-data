  domain: Small Animals
  definition: = snake with the ability to spread the ribs in the neck area, so as
    to form a broad, flat profile called the hood, which makes it look thicker than
    it really is; reaches two meters in length and 50 millimeters in diameter; it
    is dark brown with a yellowish underside; very poisonous; feeds on mice, gerbils,
    birds, bird eggs, lizards, frogs, and other snakes; ≈ associated with great danger
  glosses:
  - asp
  - cobra
