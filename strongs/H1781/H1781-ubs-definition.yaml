senses:
- sense_id: '001636001001000'
  domain: Judge
  definition: = a person whose responsibility it is to give a verdict on a case or
    person in a dispute and ensure that the verdict is implemented, which, ideally,
    results in vindication for the innocent and punishment for the guilty; this can
    only be done by someone in authority, such as a judge or ruler or even God himself
  glosses:
  - judge
  references:
  - 1SA-024-016
  - EZR-007-025
  - PSA-068-006
