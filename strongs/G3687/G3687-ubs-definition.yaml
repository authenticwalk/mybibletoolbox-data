  - to give a name to
  - to give a title to
  references:
  - MRK-003-014
  - LUK-006-014
  - 1CO-005-011
  - EPH-001-021
  - EPH-003-015
- sense_id: 003594001002000
  louw_nida_code: '33.133'
  domain: Communication
  definition: to utter a name in a ritual context (without directly referring to the
    person or speaking about the person in question)
  glosses:
  - to pronounce a name
  - to call out a name
  references:
  - LUK-006-013
  - ACT-019-013
- sense_id: 003594001003000
  louw_nida_code: '33.93'
  domain: Communication
  definition: to speak of something by mentioning the name of it
  glosses:
  - to mention
  - to speak about
  references:
  - ROM-015-020
  - EPH-005-003
- sense_id: 003594001004000
  louw_nida_code: '53.62'
  domain: Religious Activities
  definition: '(an idiom, literally: to name the name of the Lord) to employ the name
    of the Lord as evidence that one worships the Lord'
  glosses:
  - to say that one belongs to the Lord or to declare that one is a worshiper of the
    Lord
  references:
  - 2TI-002-019
- sense_id: 003594001005000
  louw_nida_code: '28.22'
  domain: Know
  definition: (a figurative extension of meaning of {L:ὀνομάζω<SDBG:ὀνομάζω:000001>}[b]
    ‘to call a name,’ {D:33.133}) to be caused to be made known
  glosses:
  - to be known
  forms:
  - ὀνομάζομαι
  references:
  - ROM-015-020
