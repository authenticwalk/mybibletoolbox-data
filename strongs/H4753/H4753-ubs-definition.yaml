  domain: Spices
  definition: = the gum of a bush or shrub with thick thorny branches that project
    and bend at odd angles; its leaves come in sets of three; its fruit is oval like
    a plum; its wood and bark have a pleasant smell; the gum oozes naturally from
    the branches; clear or yellowish brown when it comes out, but gets darker as it
    dries; ◄ Commiphora myrrha, abyssinica, or schimperi; ► an ingredient of anointing
    oil and perfume; ≈ regarded as precious
