lemma: צָבוּעַ
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '006106001001000'
  domain: Color
  definition: = state in which the skin of animal has spots, stains, and other irregular
    markings of skin
  glosses:
  - speckled
  references:
  - JER-012-009
- sense_id: '006106002001000'
  domain: Wild Animals
  definition: = mammal with a big head and of which the front feet are longer than
    the hind feet; it has a brownish grey color with dark indistinct stripes that
    become spots and blotches on its neck; it has a stiff, upright mane that stretches
    from between its ears all the way down its back until the end of its tail; it
    feeds mainly on carrion and but occasionally goes hunting itself; lives in holes
    and hollows under logs but is also known to inhabit abandoned houses or tombs;
    produces wailing sounds; ◄ |ihyaena hyaena|i*; ► probably unclean
  glosses:
  - hyena
  references:
  - JER-012-009
related_lemmas:
- word: צֶבַע
