senses:
- sense_id: 002498001001000
  domain: Write
  definition: = action by which humans reproduce the form or shape of an object on
    another object; ◄ by carving, drawing, writing, etc.; ► for the purpose of decoration,
    communication, sometimes as preparation for a new construction
  glosses:
  - to carve
  - to portray
  - to draw
  - to mark out
  - to write
  forms:
  - vbqal-
  - vbhof- (passive)
  references:
  - JOB-019-023
  - PRO-008-027
  - PRO-008-029
  - ISA-030-008
  - ISA-049-016
  - EZK-004-001
  - EZK-023-014
- sense_id: 002498001002000
  domain: Exist
  definition: = to construct by making cuts in stone
  glosses:
  - to hew out
  forms:
  - vbqal-
  references:
  - ISA-022-016
- sense_id: 002498001003000
  domain: Happen
  definition: = causative action by which humans prescribe patterns of behavior required
    from other humans under their authority
  glosses:
  - to decree
  - to issue (a decree)
  forms:
  - vbqal-
  - vbpiel
  - vbpual (passive)
  references:
  - PRO-008-015
  - PRO-031-005
  - ISA-010-001
- sense_id: 002498001004000
  domain: Leaders
  definition: 'literally: one who decrees; hence: = person who is in a position of
    authority over other people'
  glosses:
  - commander
  - leader
  forms:
  - vbqal-
  - vbpiel
  references:
  - DEU-033-021
  - JDG-005-009
  - JDG-005-014
  - ISA-033-022
- sense_id: 002498001005000
  domain: Tools
  definition: = object shaped in such a way that it can be held in one's hand; ◄ usually
    made out of wood and/or metal; ► held by people in authority, like kings; ≈ symbolizes
    the position of authority of the person holding it
  glosses:
  - sceptre
  - ruler's staff
  forms:
  - vbpiel
  references:
  - GEN-049-010
  - NUM-021-018
  - PSA-108-009
  - PSA-060-009
