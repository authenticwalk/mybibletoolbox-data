- sense_id: '003347001001000'
  domain: Musical Instruments
  definition: = musical instrument consisting of a sound box ◄ made of wood, out of
    the ends or sides of which projected two arms; the arms supported a crosspiece;
    strings descended from the crosspiece over the sound box and the number of strings
    could vary; ► often used to accompany singing
  glosses:
  - small lyre
  - lute
