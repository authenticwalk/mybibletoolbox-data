strongs_number: H6498
lemma: פַּקֻּעֹת
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 005975001001000
  domain: Fruits
  definition: = a fruit that looks like a melon, cucumber, or calabash vine; it has
    a thick, watery root, which can penetrate deep into the ground; its stems creep
    on the ground, clinging to bushes or fences with their tendrils; its leaves are
    triangular and lobed like melon leaves; its yellow flowers develop into round
    yellow fruits the size of a large apple or grapefruit; the shell of the fruit
    is hard and smooth, and inside is a spongy pulp with white or brown seeds; ◄ Citrullus
    colocynthis; ► slightly poisonous, but used for stomach disorders and as a purgative
  glosses:
  - wild gourd
  references:
  - 2KI-004-039
related_lemmas:
- word: פְּקָעִים
