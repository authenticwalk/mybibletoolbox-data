strongs_number: H1379
lemma: גבל
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '001270001001000'
  domain: Detach
  definition: = state in which a particular geographical object forms the boundary
    of a certain area
  glosses:
  - to form the boundary
  forms:
  - vbqal-
  references:
  - JOS-018-020
- sense_id: '001270001002000'
  domain: Detach
  definition: = causative action by which someone establishes a boundary around an
    area in order to mark it as different from the area surrounding it
  glosses:
  - to set a boundary
  forms:
  - vbqal-
  references:
  - DEU-019-014
- sense_id: '001270001003000'
  domain: Detach
  definition: = causative action by which someone establishes a boundary between two
    areas in order to ensure that nobody will cross over to the other side without
    special permission
  glosses:
  - to set bounds
  forms:
  - vbhif-
  references:
  - EXO-019-012
  - EXO-019-023
- sense_id: '001270001004000'
  domain: Location
  definition: = state in which a geographical object is situated in a location close
    to another one, as if it were located right on the border between the two places
  glosses:
  - to border on (another place)
  forms:
  - vbqal-
  references:
  - ZEC-009-002
related_lemmas:
- word: גְּבוּל
- word: גְּבוּלָה
- word: גַּבְלוּת
- word: מִגְבֶּלֶת
