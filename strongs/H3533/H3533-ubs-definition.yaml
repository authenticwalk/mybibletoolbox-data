- sense_id: '003236001002000'
  domain: Control
  definition: 'literally: to tread underfoot; hence: = causative action by which humans
    use force to bring other humans and areas under their authority and control'
  glosses:
  - to subdue
  - to subjugate
  - to enslave
  - to molest
  forms:
