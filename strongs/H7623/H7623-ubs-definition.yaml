senses:
- sense_id: '007156001001000'
  domain: Think
  definition: = state in which humans think positively about (other) humans or events
  glosses:
  - to consider good
  - to consider fortunate
  references:
  - ECC-004-002
  - ECC-008-015
- sense_id: '007156001002000'
  domain: Speak
  definition: = action by which humans speak to other humans about certain matters
    with appreciation
  glosses:
  - to commend
  - to laud
  references:
  - PSA-145-004
- sense_id: '007156001003000'
  domain: Praise
  definition: "= action by which humans express their appreciation, admiration, respect,\
    \ and/or gratitude to \ndeities about who they are and what they do"
  glosses:
  - to praise
  forms:
  - vbpiel
  references:
  - PSA-063-004
  - PSA-117-001
  - PSA-147-012
  - DAN-002-023
  - DAN-004-031
  - DAN-004-034
  - DAN-005-004
  - DAN-005-023
- sense_id: '007156001004000'
  domain: Great
  definition: = process by which humans consider themselves priviliged to be able
    to do something
  glosses:
  - to glory (in an activity)
  forms:
  - vbhit-
  references:
  - 1CH-016-035
  - PSA-106-047
- sense_id: '007156002001000'
  domain: Control
  definition: = state in which humans or deities have the ability to keep things from
    happening or stop happening
  glosses:
  - to hold back
  - to still
  - to calm
  - to control
  forms:
  - vbhif-
  - vbpiel
  references:
  - PSA-065-008
  - PSA-089-010
  - PRO-029-011
