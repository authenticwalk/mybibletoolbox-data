senses:
- sense_id: 006769001001000
  domain: Space
  definition: = state in which humans or objects are located in a place that is at
    a relatively great distance from the point of reference
  glosses:
  - to be far
  - to go far
  - to stay far
  forms:
  - vbhif-
  - vbqal-
  references:
  - GEN-021-016
  - GEN-044-004
  - EXO-008-024
  - EXO-008-024
  - EXO-033-007
  - DEU-012-021
  - DEU-014-024
  - JOS-003-016
  - JOS-008-004
  - JDG-018-022
  - JOB-030-010
  - PSA-055-008
  - PSA-103-012
  - PRO-005-008
