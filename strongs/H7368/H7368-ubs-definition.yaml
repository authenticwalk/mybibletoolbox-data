  - PRO-022-005
  - ISA-049-019
  - LAM-001-016
  - EZK-011-015
- sense_id: 006769001002000
  domain: Space
  definition: = causative action by which humans or deities cause (other) humans or
    animals to be located in a place that is at a relatively great distance from the
    point of reference
  glosses:
  - to put far away
  - to remove
  forms:
  - vbhif-
  - vbpiel
  references:
  - ISA-006-012
  - JER-027-010
  - EZK-008-006
  - EZK-011-016
  - JOL-002-020
  - JOL-004-006
- sense_id: 006769001003000
  domain: Space
  definition: 'literally: to be far off; hence: = state in which an event is in the
    distant future'
  glosses:
  - to be far off (in time)
  forms:
  - vbqal-
  references:
  - ISA-046-013
- sense_id: 006769001004000
  domain: Dissociate
  definition: 'literally: to be far (from someone else); hence: = state in which humans
    or deities are no longer associating with (other) humans or deities, ◄ as if they
    have distanced themselves'
  glosses:
  - to be far (from someone)
  forms:
  - vbqal-
  - vbhif-
  references:
  - PSA-022-012
  - PSA-022-020
  - PSA-035-022
  - PSA-038-022
  - PSA-071-012
  - JER-002-005
  - EZK-044-010
- sense_id: 006769001005000
  domain: Dissociate
  definition: 'literally: to cause to be far (from someone else); hence: = causative
    action by which deities cause humans to stop associating with (other) humans,
    ◄ as if they have distanced themselves'
  glosses:
  - to make shun
  forms:
  - vbhif-
  references:
  - JOB-019-013
  - PSA-088-009
  - PSA-088-019
- sense_id: 006769001006000
  domain: Non-Engage
  definition: 'literally: to be far (from an event); hence: = state in which humans
    are not able to engage in a certain event, ◄ as if the event has distanced itself
    from them'
  glosses:
  - to be far from (an activity)
  forms:
  - vbqal-
  references:
  - JOB-005-004
  - JOB-021-016
  - JOB-022-018
  - PSA-109-017
  - PSA-119-150
  - ISA-054-014
  - ISA-059-009
  - ISA-059-011
- sense_id: 006769001007000
  domain: Non-Engage
  definition: 'literally: to put (an event) far (from someone else); hence: = action
    by which humans do not engage in a certain event, ◄ as if they have distanced
    the event from reality'
  glosses:
  - to avoid
  - to refrain from
  forms:
  - vbpiel
  references:
  - EZK-043-009
- sense_id: 006769001008000
  domain: Non-Engage
  definition: 'literally: to stay far (from an event); hence: = action by which humans
    do not engage in a certain event, ◄ as if they have distanced themselves from
    the event'
  glosses:
  - to avoid
  - to refrain from
  forms:
  - vbqal-
  - vbhif-
  references:
  - EXO-023-007
  - JOB-011-014
  - JOB-022-023
  - PRO-004-024
  - ECC-003-005
- sense_id: 006769001009000
  domain: Non-Engage
  definition: 'literally: to put (an event) far (from someone else); hence: = causative
    action by which deities or circumstances cause humans not to engage in a certain
    event, ◄ as if they have distanced the event from them'
  glosses:
  - to remove (a condition) from (someone)
  forms:
  - vbhif-
  references:
  - PRO-022-015
  - PRO-030-008
- sense_id: 006769001010000
  domain: Release
  definition: 'literally: to put (one''s) palms far (from someone else); hence: =
    causative action by which deities release their control of someone else'
  glosses:
  - to withdraw (one's) hands (from someone)
  - to stop punishing
  forms:
  - vbhif-
  references:
  - JOB-013-021
- sense_id: 006769001011000
  domain: Innocent
  definition: 'literally: to put (someone''s) sins far (from that person); hence:
    = action by which deities fully forgive someone''s sins and shortcomings ◄ as
    if by moving them to a distant place'
  glosses:
  - to put away (sins)
  - to forgive
  forms:
  - vbhif-
  references:
  - PSA-103-012
- sense_id: 006769001012000
  domain: Large
  definition: 'literally: to cause ends or boundaries to be far; hence: = causative
    action by which deities enlarge a territory ◄ by extending its boundaries'
  glosses:
  - to extend boundaries (of a land)
  forms:
  - vbpiel
  - vbqal-
  references:
  - ISA-026-015
  - MIC-007-011
- sense_id: 006769001013000
  domain: Think
  definition: 'literally: to put (one''s) heart far (from a deity); hence: = action
    by which humans refuse to think or take notice of a certain deity'
  glosses:
  - to refuse to think (about someone)
  forms:
  - vbpiel
  references:
  - ISA-029-013
