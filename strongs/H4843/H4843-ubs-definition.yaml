senses:
- sense_id: '004431001001000'
  domain: Bad
  definition: = state in which a liquid has a sharp, pungent taste; ≈ regarded as
    unpleasant and unsuitable for consumption; associated with anger and grief
  glosses:
  - to taste bitter
  forms:
  - vbqal-
  references:
  - ISA-024-009
- sense_id: '004431001002000'
  domain: Angry
  definition: 'literally: to be bitter; hence: = state in which humans are experiencing
    emotions of anger, resentment, and grief'
  glosses:
  - to be embittered
  forms:
  - vbqal-
  - vbhit-
  references:
  - RUT-001-013
  - 1SA-030-006
  - 2KI-004-027
  - ISA-038-017
  - JER-002-019
  - JER-004-018
  - LAM-001-004
  - DAN-008-007
  - DAN-011-011
- sense_id: '004431001003000'
  domain: Angry
  definition: 'literally: to act with bitterness; hence: = action by which humans
    express their emotions of anger, resentment, and grief by engaging other humans
    in battle'
  glosses:
  - to attack bitterly
  - to assail bitterly
  forms:
  - vbpiel
  references:
  - GEN-049-023
- sense_id: '004431001004000'
  domain: Angry
  definition: 'literally: to act with bitterness in weeping; hence: = action by which
    humans express their emotions of anger, resentment, and grief by intense weeping'
  glosses:
  - to weep bitterly
  forms:
  - vbpiel
  references:
  - ISA-022-004
- sense_id: '004431001005000'
  domain: Angry
  definition: 'literally: to act with bitterness; hence: = action by which humans
    express their emotions of anger, resentment, and grief by intense weeping'
  glosses:
  - to weep bitterly
  forms:
  - vbhif-
  references:
  - ZEC-012-010
  - ZEC-012-010
- sense_id: '004431001006000'
  domain: Angry
  definition: 'literally: to make bitter; hence: = causative action by which humans
    or deities cause (other) humans to experience emotions of anger, resentment, and
    grief by their actions'
  glosses:
  - to make hard
  forms:
  - vbhif-
  - vbpiel
  references:
  - EXO-001-014
  - RUT-001-020
  - JOB-027-002
