senses:
- sense_id: 004129001001000
  domain: Possess
  definition: = action by which humans or deities are unwilling to give or sell something
    to (other) humans
  glosses:
  - to withhold
  - to refuse
  - to hold back
  - to keep
  forms:
  - vbqal-
  references:
  - 1KI-020-007
  - NEH-009-020
  - JOB-022-007
  - JOB-031-016
  - PRO-011-026
- sense_id: 004129001002000
  domain: Associate
  definition: 'literally: to withhold; hence: = action by which humans refuse to allow
    other humans to marry their daughter'
  glosses:
  - to withhold
  - to deny
  forms:
  - vbqal-
  references:
  - 2SA-013-013
- sense_id: 004129001003000
  domain: Birth
  definition: 'literally: to withhold the fruit of the womb (from someone); hence:
    = causative action by which deities keep women from becoming pregnant'
  glosses:
  - to withhold the fruit of the womb
  - to deny (someone) motherhood
  forms:
  - vbqal-
  references:
  - GEN-030-002
- sense_id: 004129001004000
  domain: Non-Engage
  definition: 'literally: to withhold (one''s) foot from (someone else''s) path; hence:
    = action by which humans refuse to engage in a certain kind of behavior'
  glosses:
  - to keep (one's) foot from (someone else's) path
  - to stay clear of (someone's) ways
  forms:
  - vbqal-
  references:
  - PRO-001-015
- sense_id: 004129001005000
  domain: Non-Engage
  definition: 'to withhold (something or someone from doing something); hence: = action
    by which humans or deities keep (other) humans or objects from being engaged in
    a certain event'
  glosses:
  - to keep
  - to restrain
  forms:
  - vbqal-
  references:
  - NUM-022-016
  - 1SA-025-026
  - 1SA-025-034
  - JER-002-025
  - JER-031-016
  - JER-048-010
- sense_id: 004129001006000
  domain: Possess
  definition: 'literally: to withhold; hence: = action by which deities keep a river
    from flowing'
  glosses:
  - to restrain
  forms:
  - vbqal-
  references:
  - EZK-031-015
- sense_id: 004129001007000
  domain: Non-Happen
  definition: 'literally: to withhold; hence: = causative action by which humans or
    deities cause a certain event not to take place'
  glosses:
  - to withhold
  - to deny
  forms:
  - vbqal-
  - vbnif- (passive)
  references:
  - NUM-024-011
  - JOB-038-015
  - PSA-021-003
  - PSA-084-012
  - PRO-003-027
  - PRO-023-013
  - PRO-030-007
  - JER-003-003
  - JER-005-025
  - JOL-001-013
  - AMO-004-007
- sense_id: 004129001008000
  domain: Rejoice
  definition: 'literally: to withhold (one''s) heart from joy; hence: = action by
