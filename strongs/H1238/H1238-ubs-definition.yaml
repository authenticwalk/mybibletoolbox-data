senses:
- sense_id: '001146001001000'
  domain: Impact
  definition: = to act forcibly on something, ► so as to cause it to become waste
    and/or desolate
  glosses:
  - to lay waste
  - to devastate
  forms:
  - vbqal-
  - vbpiel
  - vbnif- (passive)
  references:
  - ISA-019-003
  - ISA-024-001
  - ISA-024-003
  - ISA-024-003
  - JER-019-007
  - JER-051-002
  - NAM-002-003
- sense_id: '001146001002000'
  domain: Impact
  definition: = someone who acts forcibly on others, ► so as to lay them waste and
    make them desolate
  glosses:
  - destroyer
  - marauder
  - plunderer
  forms:
  - vbqal-
  references:
  - NAM-002-003
- sense_id: '001146001003000'
  domain: Stage
  definition: = process by which a plant grows luxuriantly and spreads out, often
    to the detriment of other plants
  glosses:
  - to flourish
  - to spread
  forms:
  - vbqal-
  references:
  - HOS-010-001
