- sense_id: '005645001001000'
  domain: Time
  definition: = the time of day when the sun starts going down, when people leave
    their work and go home, have food, and go to sleep; this is also the time of the
    evening sacrifice, and the time when an unclean person who has gone through the
    cleansing rituals is declared clean, when fasting and mourning come to an end,
    and when the exposed body of an executed person needs to be removed
