senses:
- sense_id: '004770001001000'
  domain: Safe
  definition: = causative action by which humans make sure that an object is safe
    from harm; ◄ by observing the object and the surrounding area carefully and intervening
    when necessary
  glosses:
  - to watch over
  - to guard
  - to be in charge of
  - to take care of
  - to protect
  - to tend
  - to keep
  forms:
  - vbqal-
  references:
  - SNG-001-006
  - SNG-001-006
  - SNG-008-011
  - SNG-008-012
- sense_id: '004770001002000'
  domain: Know
  definition: 'literally: to keep (something) in (one''s) heart; hence: = action by
    which humans keep processing information in their minds'
  glosses:
  - to keep in mind
  - to remember
  forms:
  - vbpeal
  references:
  - DAN-007-028
- sense_id: '004770002001000'
  domain: Angry
  definition: = state in which humans or deities remain angry with (other) humans
    for an extended period of time
  glosses:
  - to hold a grudge
  forms:
  - vbqal-
  references:
  - LEV-019-018
  - PSA-103-009
  - JER-003-005
  - JER-003-012
  - NAM-001-002
