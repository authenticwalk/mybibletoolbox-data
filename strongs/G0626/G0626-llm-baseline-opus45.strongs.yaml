strongs: G0626
lemma: "ἀπολογέομαι"
transliteration: apologeomai
pos: verb
occurrences: 7

senses:
  - gloss: "defend oneself"
    definition: To speak in one's own defense; to make a legal defense.
    frequency: primary
    example: "Acts 26:1"
  - gloss: "make a defense"
    definition: To offer a reasoned argument in response to accusations.
    frequency: primary
    example: "Acts 24:10"
  - gloss: "answer"
    definition: To reply to charges or questions.
    frequency: secondary
    example: "Luke 21:14"

etymology: Compound of apo (from) + logos (word, reason) - to speak from reason; source of English "apologetics"
word_family:
  - G0627
  - G0379

semantic_range: defend oneself, make a defense, answer charges, give an account
translation_issue: Not "apologize" in the modern sense of expressing regret; it means to give a reasoned defense
major_translations:
  KJV: "answer, make defence, excuse, speak for self"
  NIV: "make defense, defend"
  ESV: "make defense"

