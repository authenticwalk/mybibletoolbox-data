- sense_id: 004685001002000
  domain: Afraid
  definition: 'literally: to shake; hence: = process by which humans are unsure about
    a certain matter'
  glosses:
  - to waver
  forms:
  - vbqal-
  references:
  - JER-004-001
- sense_id: 004685001003000
  domain: Move
  definition: 'literally: to shake; hence: = action by which humans move or travel
