strongs_number: G5299
lemma: ὑπωπιάζω
source: UBS/SDGNT
license: CC-BY-SA 4.0
senses:
- sense_id: 005189001001000
  louw_nida_code: '25.245'
  domain: Attitudes and Emotions
  definition: to cause great annoyance to and thus to wear someone out
  glosses:
  - to annoy and wear out
  - to wear someone down by annoying
  references:
  - LUK-018-005
- sense_id: 005189001002000
  louw_nida_code: '88.89'
  domain: Moral and Ethical Qualities and Related Behavior
  definition: (a figurative extension of meaning of ὑπωπιάζω ‘to strike the eye,’
    not occurring in the NT) to keep one’s body under complete control, with the implication
    of rough treatment given to the body, possibly as an aspect of discipline (a meaning
    evidently taken from the language of prize-fighting)
  glosses:
  - to keep under control
  - to exercise self-control
  references:
  - 1CO-009-027
