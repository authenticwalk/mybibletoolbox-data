  references:
  - JOB-030-030
- sense_id: 007299002001000
  domain: Search
  definition: = action by which deities, humans, or animals make an intensive effort
    to locate (other) humans, animals, objects, or activities, which often requires
    them to move from one location to another
  glosses:
  - to search
  - to look for
  forms:
  - vbpiel
  references:
  - JOB-007-021
  - JOB-024-005
  - PRO-007-015
- sense_id: 007299002002000
  domain: Associate
  definition: = action by which humans make an intensive effort to associate with
    a deity, to serve and worship him, and to get answers to questions
  glosses:
