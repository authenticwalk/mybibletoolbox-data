  domain: Tents
  definition: = a shelter, ◄ made of fragile materials such as leaves and branches,
    ► for the purpose of protection from rain and sun for both humans and animals;
    used by people who needed a temporary shelter, such as nomads, soldiers, and farm
    workers in the field; ≈ by extension, a metaphor for Jerusalem, the place where
    God dwells
