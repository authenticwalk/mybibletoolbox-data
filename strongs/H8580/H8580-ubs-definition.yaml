lemma: תִּנְשֶׁמֶת
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 007871001001000
  domain: Birds
  definition: 'exact meaning unknown; probably: = type of owl with a very pale color,
    light fawn or gray on the wings and back, and almost white on the chest and under
    the wings; it has small eyes, a large head for its size, and a very striking heart-shaped
    white facial disk outlined in brown; it often roosts in barns, deserted houses,
    caves, and tombs; it lives mainly on rats, mice, and other small nocturnal creatures;
    ◄ Tyto alba; ► unclean and therefore not to be eaten'
  glosses:
  - barn owl
  references:
  - LEV-011-018
  - DEU-014-016
- sense_id: 007871001002000
  domain: Small Animals
  definition: = type of lizard with a basically green color, but which can change
    color to match its environment; it is slow moving; it feeds on insects by catching
    them with its long, sticky, elastic tongue, which it flicks at the prey; it is
    also able to use its tail to wrap around twigs and other things to support itself
    when the wind blows or when climbing at a steep angle; ◄ Chamaeleo chamaeleon;
    ► unclean and therefore not to be eaten
  glosses:
  - chameleon
  references:
  - LEV-011-030
related_lemmas:
- word: נשׁם
