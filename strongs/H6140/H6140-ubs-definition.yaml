senses:
- sense_id: '005637001001000'
  domain: Evil
  definition: 'literally: to be crooked of ways; hence: = state in which humans are
    morally and/or ethically unacceptable as far as their behavior is concerned'
  glosses:
  - to be crooked in (one's) behavior
  forms:
  - vbnif-ptca
  references:
  - PRO-028-018
- sense_id: '005637001002000'
  domain: Evil
  definition: 'literally: to make (a person) crooked; hence: = causative action by
    which deities cause humans to appear to be people without integrity'
  glosses:
  - to prove to be evil
  forms:
  - vbhif-
  references:
  - JOB-009-020
- sense_id: '005637001003000'
  domain: Wrong
  definition: 'literally: to make (an event) crooked; hence: = causative action by
    which humans change something that is right into wrong'
  glosses:
  - to make crooked
  - to distort
  - to pervert
  forms:
  - vbpiel
  references:
  - PRO-010-009
  - ISA-059-008
  - MIC-003-009
