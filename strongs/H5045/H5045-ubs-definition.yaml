senses:
- sense_id: '004625001001000'
  domain: Names of Locations
  definition: =  an area of land located in the south of {L:Israel<SDBH:יִשְׂרָאֵל>},
    consisting of little vegetation and with very little annual rainfall; inhabited
    by numerous peoples - initially by the Canaanites in {L:Arad<SDBH:עֲרָד>} and
    the {L:Amelekites<SDBH:עֲמָלֵקִי>}, later, the people of {L:Judah<SDBH:יְהוּדָה>}
