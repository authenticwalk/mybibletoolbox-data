- sense_id: '006467001001000'
  domain: Names of Waterbodies
  definition: = river; ◄ that drains the western portion of the Plain of Esdraelon
    from {L:Megiddo<SDBH:מְגִדֹּו>} to the sea, fed by springs from {L:Gilboa<SDBH:גִּלְבֹּעַ>}
    and the foot of the {L:Carmel<SDBH:כַּרְמֶל>} range; ► location where {L:Sisera<SDBH:סִיסְרָא>}
    was defeated and where {L:Elijah<SDBH:אֵלִיָּהוּ>} killed the prophets of {L:Baal<SDBH:בַּעַל>}
