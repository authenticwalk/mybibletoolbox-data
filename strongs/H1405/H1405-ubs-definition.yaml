senses:
- sense_id: 001289001001000
  domain: Names of Locations
  definition: = town; ◄ territory of {L:Dan<SDBH:דָּן>}; ► assigned to clan of {L:Kohath<SDBH:קְהָת>},
    tribe of {L:Levi<SDBH:לֵוִי>}; later controlled by {L:Philistines<SDBH:פְּלִשְׁתִּי>};
    location where King {L:Nadab<SDBH:נָדָב>}, son of {L:Jeroboam<SDBH:יָרָבְעָם>},
    of the northern tribes of {L:Israel<SDBH:יִשְׂרָאֵל>}, was killed by {L:Baasha<SDBH:בַּעְשָׁא>},
    who succeeded him as king
  glosses:
  - Gibbethon
