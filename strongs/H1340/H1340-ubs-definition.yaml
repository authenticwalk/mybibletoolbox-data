  definition: = woman, also known as {L:Bathsheba<SDBH:בַּת־שֶׁבַע>}; ◄ daughter of
    {L:Ammiel<SDBH:עַמִּיאֵל>} (also known as {L:Eliam<SDBH:אֱלִיעָם>}); wife of {L:Uriah<SDBH:אוּרִיָּה>},
