senses:
- sense_id: '002347001001000'
  domain: Small Animals
  definition: = small reptile, resembling a lizard, belonging to the family of Scincidae;
    yellowish of color; lives in desert places; unlike the true lizard it does not
    climb, but hides under stones or in holes; ◄ swarming land creature; ► unclean
    animal and therefore not to be eaten
  glosses:
  - skink
  references:
  - LEV-011-030
