senses:
- sense_id: 001378001001000
  domain: Trees
  definition: = the main body of a tree, which is either the part that remains in
    the earth after the stem or trunk is cut off, or a branch that is planted with
    the intention that it develops new roots; ≈ symbol of something apparently dead
    that has the potential for renewed life
  glosses:
  - stump
  - stem
  references:
  - JOB-014-008
  - ISA-011-001
  - ISA-040-024
