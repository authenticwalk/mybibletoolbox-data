senses:
- sense_id: '004011001001000'
  domain: Tools
  definition: = a bowl-shaped vessel ◄ usually made of stone or another strong material
    ► in which a substance such as seeds is pounded or crushed with a {L:pestle<SDBH:עֱלִי>}
  glosses:
  - mortar
  references:
  - PRO-027-022
- sense_id: '004011001002000'
  domain: Landforms
  definition: 'literally: mortar; hence: = a hollow place in the earth, ◄ referred
    to as such because of its mortar-like shape'
  glosses:
  - hollow place
  references:
  - JDG-015-019
- sense_id: '004011001003000'
  domain: Names of Constructions
  definition: 'literally: mortar; exact meaning unknown; possibly: = a relatively
    low part of {L:Jerusalem<SDBH:יְרוּשָׁלַ͏ִם>} used as market area, ◄ referred
    to as such because of its mortar-like shape'
  glosses:
  - the Mortar
  references:
  - ZEP-001-011
