strongs_number: H1894
lemma: הָבְנִים
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '001744001001000'
  domain: Trees
  definition: '= a spiny tree up to 6-7 m. high; its leaves are compound, with the
    leaflets nearly opposite one another on the spine; it grows white flowers that
    hang in loose clusters, that give way to flat, papery seedpods about 6 cm long
    and 1 cm wide; found in Africa and locally known as zebrawood; ◄ Dalbergia melanoxylon;
    alternatively: = a tree which grows to 10 m. tall, with evergreen leaves; the
    inner part of its trunk is black; it is found in India and Sri Lanka: ◄ Diospyros
    ebenum; ► used by carvers, who inlay the wood with ivory'
  glosses:
  - ebony
  references:
  - EZK-027-015
  - EZK-027-015
