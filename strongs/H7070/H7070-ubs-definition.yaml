senses:
- sense_id: '006506001001000'
  domain: Plants
  definition: = a tall grass with stiff, sharply-pointed leaves and a plume-like flower
    head that reaches to more than 2 m; it grows in lakes and streams, the roots creeping
    across the bottom of the lake to produce new leaves and stalks; or on riverbanks;
    ◄ Phragmites australis (Common reed) or Arundo donax (Giant reed); ► used for
    baskets, mats, flutes, pens, arrows, and roof-coverings; ≈ symbol of weakness
    and undependability, but also flexibility
  glosses:
  - reed
  references:
