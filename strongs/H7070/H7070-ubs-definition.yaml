- sense_id: '006506001002000'
  domain: Plants
  definition: 'meaning unsure; either: (1) = type of grass that grows in clumps to
    more than a meter high and has stiff leaves like sword grass and has a sweet smell;
    ◄ Cymbopogon; ► oil is extracted by boiling and distilling the leaves; used in
    the oil for anointing priests; or (2) = a type of reed with stiff leaves, distinguished
    by its green flower head that grows on a stalk to about 50 cm high; ◄ Acorus calamus
    or Calamus; ► the scented leaves and more strongly scented tubers have traditionally
    been used medicinally and to make fragrances, and the dried and powdered tubers
    have been used as a substitute for ginger, cinnamon and nutmeg'
  glosses:
  - fragrant grass
