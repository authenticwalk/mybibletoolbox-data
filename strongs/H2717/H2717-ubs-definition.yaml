senses:
- sense_id: '002504001001000'
  domain: Dry
  definition: = process by which a body of water or place that was formerly covered
    with moisture dries up, ◄ as a result of evaporation or draining; ► in the case
    of land, if this condition persists, sedentary life will become impossible
  glosses:
  - to become dry
  - to dry up
  forms:
  - vbqal-
  references:
  - GEN-008-013
  - GEN-008-013
  - JOB-014-011
  - PSA-106-009
  - ISA-019-005
  - ISA-019-006
  - ISA-044-027
  - HOS-013-015
- sense_id: '002504001002000'
  domain: Dry
  definition: = causative action by which humans or deities cause a state of dryness;
    ► in the case of land, if this condition persists, sedentary life will become
    impossible
  glosses:
  - to dry
  - to make dry
  - to cause to dry up
  forms:
  - vbhif-
  - vbhof- (passive)
  references:
