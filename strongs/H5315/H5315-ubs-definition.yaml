senses:
- sense_id: 004873001001000
  domain: Creatures
  definition: = the part of the body connecting the head and the rump and containing
    the passageways for blood, air, and food; ≈ associated with breathing, appetite,
    and life and often used metonymically to refer to the entire body and the personality
    inhabiting it
  glosses:
  - throat
  - neck
  - gullet
  references:
  - NUM-011-006
  - PSA-069-002
  - PSA-105-018
  - PRO-003-022
  - ISA-005-014
  - JER-004-010
  - JON-002-006
  - HAB-002-005
- sense_id: 004873001002000
  domain: Air
  definition: 'literally: throat, but with focus on the air flowing through it; hence:
    = process by which air flows in and out of the body, which shows that a person
    or animal is alive'
  glosses:
  - breath
  references:
  - JOB-011-020
  - JOB-041-013
- sense_id: 004873001003000
  domain: Self
  definition: 'literally: throat, as the part of the body that contains the passageways
    for blood, air, and food; hence: = the life principle that animates both humans
    and animals, turns them into breathing living beings, and functions as the center
    of their personality, mind, physical and non-physical desires, courage, emotions,
    and affections; it is believed to reside in the blood'
  glosses:
  - life
  - life principle
  - soul
  - self
  - greed
  - craving
  references:
