- sense_id: '007137001001000'
  domain: Blow
  definition: = process by which humans or animals strain for breath with an open
    mouth, ◄ caused by exhaustion or pain
  glosses:
  - to gasp
  - to pant
  forms:
  - vbqal-
  references:
  - ECC-001-005
  - ISA-042-014
- sense_id: '007137001002000'
  domain: Blow
  definition: = action by which animals draw up air through the nose in an audible
    way; ◄ out of hunger or a desire to mate; ► in order to detect the smell of food
    or of a mate; ≈ associated with longing and desire
  glosses:
  - to sniff the air
  forms:
  - vbqal-
  references:
  - JER-002-024
  - JER-014-006
- sense_id: '007137001003000'
  domain: Wish
  definition: 'literally: to pant after something; hence: = state in which humans
    wish strongly for something to happen'
  glosses:
  - to pant after
  - to long for
  forms:
  - vbqal-
  references:
