senses:
- sense_id: 000993001001000
  domain: Stage
  definition: = process by which a plant produces fruits early in a season; ≈ which
    are specially regarded and looked after, both because of taste and earliness
  glosses:
  - to bear early fruit
  forms:
  - vbpiel
  references:
  - EZK-047-012
- sense_id: 000993001002000
  domain: Birth
  definition: = process by which a woman gives birth to her first child; ≈ associated
    with anguish and pain
  glosses:
  - to bear (one's) first child
  forms:
  - vbhif-
  references:
  - JER-004-031
- sense_id: 000993001003000
  domain: Act
  definition: = action by which someone determines which offspring (of either humans
    or animals) is to be considered the firstborn and to be treated as such
  glosses:
  - to treat as firstborn
  forms:
  - vbpiel
  - vbpual (passive)
  references:
  - LEV-027-026
  - DEU-021-016
