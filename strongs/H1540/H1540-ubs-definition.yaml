  domain: Undress
  definition: = action by which someone takes off his/her clothes, either entirely
    or in part, ► as a result of which that person becomes naked or improperly dressed,
    ≈ which is considered a shameful thing to do
  glosses:
  - to uncover oneself
  forms:
