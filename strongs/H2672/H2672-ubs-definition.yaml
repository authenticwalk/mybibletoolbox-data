senses:
- sense_id: '002464001001000'
  domain: Impact
  definition: = action by which humans strike an object repeatedly with an axe, chisel,
    or other sharp implement, ► in order to alter its shape and so create a new object
    out of it
  glosses:
  - to hew
  - to hew out
  - to dig
  - to cut out
  - to dress
  - to mine
  forms:
  - vbqal-
  - vbpual (passive)
  references:
  - DEU-006-011
  - DEU-006-011
  - DEU-008-009
  - 2KI-012-013
  - 1CH-022-002
  - 2CH-026-010
  - NEH-009-025
  - PSA-029-007
  - PRO-009-001
  - ISA-005-002
  - ISA-010-015
  - ISA-022-016
  - ISA-022-016
  - ISA-051-001
  - JER-002-013
- sense_id: '002464001002000'
  domain: Dead
  definition: = causative action by which deities strike an animal repeatedly with
    a sharp or deadly object so that it dies
  glosses:
  - to strike
  - to kill
  forms:
  - vbhif-
  references:
  - ISA-051-009
- sense_id: '002464001003000'
  domain: Unsafe
  definition: = causative action by which deities cause non-physical hurt to humans,
    ◄ as if cutting them with a sharp implement
  glosses:
  - to cut
  forms:
  - vbqal-
  references:
  - HOS-006-005
- sense_id: '002464001004000'
  domain: Professions
  definition: = person whose job it is to cut stones in a quarry and get them ready
    for construction
  glosses:
  - quarrier
  - stonecutter
  forms:
  - vbqal-
  references:
  - 1KI-005-029
  - 1CH-022-002
  - 1CH-022-015
  - 2CH-002-001
  - 2CH-002-017
  - 2CH-024-012
  - EZR-003-007
- sense_id: '002464001005000'
  domain: Write
  definition: = action by which humans engrave words in stone with the use of a sharp
    object
  glosses:
  - to chisel
  - to incise
  forms:
  - vbnif- (passive)
  references:
  - JOB-019-024
