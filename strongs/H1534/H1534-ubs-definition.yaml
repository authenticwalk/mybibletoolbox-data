strongs_number: H1534
lemma: גַּלְגַּל
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '001410001001000'
  domain: Vehicles
  definition: = ring or round disk with a rod (axle) running through its center or
    hub; either made of a solid piece of wood or a central hub connected with several
    spokes to an outer rim; ◄ made of wood and sometimes partly of iron; ► used to
    help vehicles move over the ground
  glosses:
  - wheel
  references:
  - PSA-077-019
  - ISA-005-028
  - JER-047-003
  - EZK-010-002
  - EZK-010-006
  - EZK-010-013
- sense_id: '001410001002000'
  domain: Wells and Cisterns
  definition: = ring or round disk with a rod (axle) running through its center or
    hub; either made as a solid piece of wood or a central hub connected with several
    spokes to an outher rim, with a grooved rim around which a cord passes; ◄ made
    of wood and sometimes partly of iron; ► used to raise and lower jars into a well
  glosses:
  - pulley
  references:
  - ECC-012-006
- sense_id: '001410001003000'
  domain: Vehicles
  definition: = two or four-wheeled carriage or cart, used for travel or the transport
    of loads; pulled by draft animals, such as {L:oxen<SDBH:שֹׁור>}, {L:donkeys<SDBH:חֲמֹור>},
    or {L:horses<SDBH:סוּס>}
  glosses:
  - cart
  - wagon
  - chariot
  references:
  - EZK-023-024
  - EZK-026-010
- sense_id: '001410001004000'
  domain: Plants
  definition: = any of several plants that commonly break from their roots at maturity
    and, drying into a rounded tangle of light, stiff branches, roll before the wind,
    covering long distances and scattering seed as they go; ≈ associated with things
    that lack weight and substance and do not endure
  glosses:
  - tumbleweed
  references:
  - PSA-083-014
  - ISA-017-013
related_lemmas:
- word: גלל
