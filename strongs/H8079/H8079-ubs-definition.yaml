senses:
- sense_id: '007057001001000'
  domain: Small Animals
  definition: = small type of lizard about 10 centimeters (4 inches) long with pads
    at the end of its toes with small hairs, enabling it to walk upside down on ceilings
    and overhangs; only type of lizard that produces sound; ◄ Hemidactylus turcicus,
    or a general word for all kinds of gecko; some varieties of geckos are often found
    inside buildings; ► feeds on insects; unclean animal and therefore not to be eaten
  glosses:
  - gecko
  references:
  - PRO-030-028
