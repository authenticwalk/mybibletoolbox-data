senses:
- sense_id: '005060001001000'
  domain: Tents
  definition: = a shelter, ◄ made of fragile materials such as leaves and branches,
    ► for the purpose of protection from rain and sun for both humans and animals;
    used by people who needed a temporary shelter, such as nomads, soldiers, and farm
    workers in the field; ≈ by extension, figuratively God's protection over his people,
    God's shelter for himself; also a metaphor for Jerusalem, the dwelling of God's
    people; also by extension, a place where ferocious animals can hide in order to
    attack someone
  glosses:
  - shelter
  - booth
  - hut
