  domain: Plants
  definition: 'meaning unsure; probably: = a plant of the same family as the carrot,
    reaching a height of 50-60 cm; it branches from the base and has similar leaves
    and flowers, though its seeds have a sharper smell; ◄ Cuminum cyminum; ► it is
    planted and harvested each year, and its seeds are used in cooking and as medicine'
