senses:
- sense_id: 006985001001000
  domain: Names of Landforms
  definition: = valley; ◄ part of the {L:Jordan<SDBH:יַרְדֵּן>} Valley; ► location
    where the kings of {L:Sodom<SDBH:סְדֹם>} and {L:Gomorrah<SDBH:עֲמֹרָה>} and their
    allies came together to fight the kings from the east; after {L:Sodom<SDBH:סְדֹם>}
    and {L:Gomorrah<SDBH:עֲמֹרָה>} were destroyed this valley turned into the Salt
    Sea
  glosses:
  - valley of Siddim
