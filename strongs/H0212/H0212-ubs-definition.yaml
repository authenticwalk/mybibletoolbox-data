senses:
- sense_id: '000202001001000'
  domain: Vehicles
  definition: = ring or round disk with a rod (axle) running through its center or
    hub; either made as a solid piece of wood or a central hub connected with several
    spokes to an outher rim; ◄ made of wood and sometimes partly of iron; ► used to
    help vehicles move over the ground, and occasionally for other purposes, such
    as threshing grain
