senses:
- sense_id: '003576001001000'
  domain: Small Animals
  definition: = relatively small type of lizard, with a length of about 15-20 cm;
    has a shiny, smooth, and colored skin; it feeds on insects and is found in orchards
    and woods;◄ |iLacerta trilineata|i*; ► unclean animal and therefore not to be
    eaten
  glosses:
  - lacertid lizard
  references:
  - LEV-011-030
- sense_id: '003576001002000'
  domain: Small Animals
  definition: = relatively large type of lizard, with a length of about 50-60 cm;
    of a dull gray color, except for the mating season, when the male develops bright
    colors; its tail is long and stiff and is raised when it runs; it is know for
    bobbing its head and doing "push-ups" with its front legs; feeds on insects and
    smaller lizards; ◄ |iagama stellio|i*, found in houses and on walls and rocks;
    ► unclean animal{N:001}
  glosses:
  - agama lizard
  references:
  - LEV-011-030
