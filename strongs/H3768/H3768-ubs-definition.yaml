senses:
- sense_id: '003445001001000'
  domain: Plants
  definition: = an annual plant, which grows to 2 meters in height, with soft, lobed
    leaves and mallow-like flowers, which are yellow with a purple center; when the
    flower matures, the boll underneath puffs out and eventually splits, revealing
    a mass of fine white filaments that we know as “cotton wool;” ◄ Gossypium herbaceum;
    ► used for making cloth
  glosses:
  - cotton
