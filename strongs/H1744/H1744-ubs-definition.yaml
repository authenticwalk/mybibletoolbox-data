strongs_number: H1744
lemma: דּוּכִיפַת
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '001603001001000'
  domain: Birds
  definition: = bird about the size of a large dove, with a ginger colored head and
    body, and with wings and a tail that have black and white stripes; it has a long
    slender beak that curves slightly, and a long crest on its head, which it can
    erect into a fan shape; it has rather floppy wings and rises and falls as it flies;
    it spends a lot of time walking around on the ground looking for food; it eats
    insects and their larvae, termites, worms, small frogs, and beetles;◄ |iUpupa
    epops|i*; ► unclean and therefore not to be eaten
  glosses:
  - hoopoe
  references:
  - LEV-011-019
  - DEU-014-018
