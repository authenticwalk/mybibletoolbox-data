senses:
- sense_id: 002596001001000
  domain: Possess
  definition: = causative action by which human or deities keep something to themselves,
    refusing to give it to someone else
  glosses:
  - to withhold
  - to hold back
  forms:
  - vbqal-
  references:
  - GEN-022-012
  - GEN-022-016
  - GEN-039-009
  - JOB-038-023
  - PRO-011-024
  - PRO-021-026
- sense_id: 002596001002000
  domain: Possess
  definition: = action by which humans keep part of their body to themselves, refusing
    to use it to perform a particular event
  glosses:
  - to withhold
  - to hold back
  - to be reluctant
  forms:
  - vbqal-
  references:
  - JOB-007-011
  - PRO-010-019
  - PRO-017-027
  - JER-014-010
- sense_id: 002596001003000
  domain: Possess
  definition: 'literally: to withhold the rod; hence: = action by which humans are
    reluctant to administer punishment to someone else'
  glosses:
  - to withhold the rod
  - to be reluctant to punish
  forms:
  - vbqal-
  references:
  - PRO-013-024
- sense_id: 002596001004000
  domain: Unwilling
  definition: 'literally: not to withhold spit; = action by which humans are unwilling
    to restrain themselves from spitting at somebody; ≈ associated with contempt'
  glosses:
  - to not withhold spit (from someone)
  forms:
  - vbqal-
  references:
  - JOB-030-010
- sense_id: 002596001005000
  domain: Prevent
  definition: = causative action by which humans or deities keep (other) humans from
    performing a particular event
  glosses:
  - to prevent
  - to rescue
  - to spare
  forms:
  - vbqal-
  - vbnif- (passive)
  references:
