  - 1SA-025-039
  - 2SA-018-016
  - 2KI-005-020
  - JOB-021-030
  - JOB-033-018
  - PSA-019-014
  - PSA-078-050
  - PRO-024-011
- sense_id: 002596001006000
  domain: Lax
  definition: = causative action by which humans or deities cause an event to happen
