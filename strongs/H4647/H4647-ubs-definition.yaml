senses:
- sense_id: '004254001001000'
  domain: Tools
  definition: = contraption, possibly consisting of two vertical cylinders covered
    with thick leather; the operator stood on top of these, pulling the leather up
    with an attached strap and then pressing it down with his foot to create the rush
    of air, which was channeled into a furnace in order to achieve the temperatures
    needed for the work
  glosses:
  - bellows
