- sense_id: '005023001001000'
  domain: Domestic Animals
  definition: = large domesticated solid-hoofed quadruped; stockily built in comparison
    to today's horses, with shorter heads and thicker necks; about 122–142 cm tall,
    and 2.1 m long; its coat varies from dark to pale brown; it eats plants; ◄ Equus
    caballus; ► used in battle, both to ride and for pulling chariots; ≈ symbolic
    of military might; associated with the sun, which was said to ride across the
    sky in a chariot
  glosses:
  - horse
