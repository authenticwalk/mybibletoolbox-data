- sense_id: '007045002001000'
  domain: Names of People
  definition: = man, also known as {L:Salma<SDBH:שַׂלְמָא>} and {L:Salmon<SDBH:שַׂלְמֹון>};
    ◄ son of {L:Nahshon<SDBH:נַחְשֹׁון>}; tribe of {L:Judah<SDBH:יְהוּדָה>}; ► father
    of {L:Boaz<SDBH:בֹּעַז>} and ancestor of {L:David<SDBH:דָּוִד>}
  glosses:
  - Salmah
  - Salma
  - Salmon
  references:
