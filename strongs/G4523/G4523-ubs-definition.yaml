senses:
- sense_id: '004425001001000'
  louw_nida_code: '11.48'
  domain: Groups and Classes of Persons and Members of Such Groups and Classes
  definition: a member of a politically influential Jewish party in Jerusalem at the
    time of Jesus and the apostles. The Sadducees were a smaller group than the Pharisees
    (see {D:11.49}), but were often in control of important political and religious
    positions. Their denial of the resurrection of the dead and their acceptance of
    only the first five books of the OT are important elements in some of the important
    differences which arose between the Sadducees and the Pharisees
  glosses:
  - Sadducee
