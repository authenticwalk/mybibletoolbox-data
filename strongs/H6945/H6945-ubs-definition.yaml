- sense_id: 006393002001000
  domain: Names of Locations
  definition: = town, also known as {L:En Mishpat<SDBH:עֵין מִשְׁפָּט>} , {L:Kedesh<SDBH:קֶדֶשׁ>},
    and {L:Kadesh Barnea<SDBH:קָדֵשׁ בַּרְנֵעַ>}; ◄ located in the Wilderness of {L:Zin<SDBH:צִן>},
    in the northern part of {L:Sinai<SDBH:סִינַי>} peninsula; ► {L:Israelites<SDBH:יִשְׂרָאֵל>}
    encamped there on their way from {L:Egypt<SDBH:מִצְרַיִם>} to {L:Canaan<SDBH:כְּנַעַן>};
    it is also the location of the {L:Meribah<SDBH:מְרִיבָה>} spring; spies were sent
    out into Canaan from this place; it later marked the southern border of the territory
    of {L:Judah<SDBH:יְהוּדָה>}
