strongs_number: H0182
lemma: אֹדֹות
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 000119001001000
  domain: Happen
  definition: marker that introduces an object or event that is regarded as directly
    or indirectly responsible for the event in focus
  glosses:
  - on account of
  - because of
  - because
  references:
  - GEN-021-011
  - GEN-021-025
  - GEN-026-032
  - EXO-018-008
  - NUM-012-001
  - NUM-013-024
  - JOS-014-006
  - JOS-014-006
  - JDG-006-007
  - JER-003-008
- sense_id: 000119001002000
  domain: Negators
  definition: 'unclear construction, possibly to be read as אַל עַל־אֹדֹות: marker
    asserting that a proposed event should not take place, followed by an event that
    functions as the grounds for this statement'
  glosses:
  - no, because
  references:
  - 2SA-013-016
