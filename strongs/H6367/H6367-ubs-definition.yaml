strongs_number: H6367
lemma: פִּי הַחִירֹת
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 005844001001000
  domain: Names of Locations
  definition: = location ◄ in eastern {L:Egypt<SDBH:מִצְרַיִם>}, east of {L:Baal-Zephon<SDBH:בַּעַל
    צְפֹן>}, and close to {L:Migdol<SDBH:מִגְדֹּול>}, near the {L:Sea of Reeds<SDBH:יָם־סוּף>};
    ► the {L:Israelites<SDBH:יִשְׂרָאֵל>} encamped there after turning back from {L:Etham<SDBH:אֵתָם>}
    on their way from {L:Egypt<SDBH:מִצְרַיִם>} to {L:Canaan<SDBH:כְּנַעַן>} and crossed
    the Sea of Reeds there
  glosses:
  - Pi-Hahiroth
  references:
  - EXO-014-002
  - EXO-014-009
  - NUM-033-007
