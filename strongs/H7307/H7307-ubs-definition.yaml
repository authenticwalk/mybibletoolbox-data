    of God and one of his manifestation, often described as a substance that can be
    poured out, ► through whom the universe is created and animated; it can manifest
    itself as an invisible force equipping humans with wisdom, skill, and strength
    for specific tasks; it can also manifest itself as a movement of air through the
    bodies of animate creatures (breath) or through nature (wind)
