senses:
- sense_id: 007891001001000
  domain: Trees
  definition: = a tree that reaches a height of 5-10 meters; it has a rounded crown,
    and bears a round fruit about the size of an orange; in the spring the tree is
    completely covered with pink flowers, which gradually give way to the green of
    the leaves as they develop; the fruit can be greenish, yellow, or red. ◄ Malus
    sylvestris; ► considered both beautiful and refreshing
  glosses:
  - apple tree
  - apple
