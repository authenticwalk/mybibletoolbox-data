  glosses:
  - '"mother''s house" = mother''s household'
  references:
  - GEN-024-028
- sense_id: 000481001004000
  domain: Groups
  definition: = a nation or a city representing a nation, ◄ here compared to a mother,
    and its citizens to her children who are responsible for her well-being
  glosses:
  - mother > place of origin and sustenance
  references:
  - ISA-050-001
  - ISA-050-001
  - JER-050-012
  - EZK-019-002
  - EZK-019-010
  - HOS-002-004
  - HOS-002-007
  - HOS-004-005
- sense_id: 000481001005000
  domain: Faithful
  definition: = state in which a town is committed to fulfilling its obligations to
    the nation of which it is a part; ◄ here compared to a mother, who is considered
    a loyal and responsible part of a family
  glosses:
  - mother > faithful (town)
  references:
  - 2SA-020-019
- sense_id: 000481001006000
  domain: Titles
  definition: = friendly and endearing way to address a woman
  glosses:
  - mother > friend
  references:
  - JOB-017-014
- sense_id: 000481001007000
  domain: Roads
  definition: = the place where a road splits into two or more other roads; ◄ here
    compared to a mother with multiple children
  glosses:
  - '"the mother of the way" = the parting of a way'
  references:
  - EZK-021-026
