senses:
- sense_id: '004221001001000'
  domain: Move
  definition: = action by which humans, animals or objects go to a place that is situated
    at a higher elevation, by foot, carried by hand, or with the help of a vehicle
  glosses:
  - to go up
  - to climb up
  - to mount
  references:
  - EZR-007-009
- sense_id: '004221001002000'
  domain: Great
  definition: 'meaning unsure; literally: coming up; hence: = process by which humans
    or deities increase in status and importance'
  glosses:
  - ascending
  - rising (in status)
  references:
  - 1CH-017-017
- sense_id: '004221001003000'
  domain: Move
  definition: = one of a set of fixed steps leading up to a higher area
