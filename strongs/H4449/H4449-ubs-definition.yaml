  - JOB-018-016
  - PSA-090-006
- sense_id: '004067001002000'
  domain: Insignificant
  definition: 'literally: to wither; hence: = process by which humans gradually lose
    their power and social status'
  glosses:
  - to wither
  - to fade
  forms:
  - vbnif-
  - vbqal-
  - vbhit-
  references:
  - JOB-024-024
  - PSA-037-002
  - PSA-058-008
- sense_id: '004067002001000'
  domain: Stance
  definition: = action by which humans move parts of their bodies in order to pass
    on information without other people noticing
  glosses:
  - to make signs
  - to signal
  forms:
