- sense_id: '004067003001000'
  domain: Detach
  definition: = action by which someone removes the foreskin of the penis, + preferably
    with a {L:flint<SDBH:צֹר>} knife, as a sign of the covenant between YHWH and Abraham's
    descendants; ≈ considered an outward change for the good that should be accompanied
    by an inward change in attitude as well
  glosses:
