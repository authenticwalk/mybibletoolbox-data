senses:
- sense_id: 001409001001000
  domain: Vehicles
  definition: = ring or round disk with a rod (axle) running through its center or
    hub; either made of a solid piece of wood or a central hub connected with several
    spokes to an outer rim; ◄ made of wood and sometimes partly of iron; ► used to
    help vehicles move over the ground
  glosses:
  - wheel
  references:
  - ISA-028-028
- sense_id: 001409002001000
  domain: Names of Locations
  definition: = location; ◄ close to {L:Jericho<SDBH:יְרִחֹו>}; ► first camp of {L:Israelites<SDBH:יִשְׂרָאֵל>}
    after crossing the {L:Jordan<SDBH:יַרְדֵּן>}; here they set up twelve stones as
    a monument; it later became the location of a cultic center
  glosses:
  - Gilgal
