senses:
- sense_id: '007612001001000'
  domain: Trees
  definition: = a tree up to 10 m high with large low, spreading branches; its fruit
    grows in bunches on the trunk and branches of the tree rather than among the leaves;
    ◄ Ficus sycomorus; ► its fruit is edible but not as juicy or sweet as the more
    common variety of fig; ≈ image of something plentiful
  glosses:
  - sycamore tree
