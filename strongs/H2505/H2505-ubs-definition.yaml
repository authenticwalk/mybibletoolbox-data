senses:
- sense_id: '002311001001000'
  domain: Divide
  definition: = causative action by which humans or deities divide an object (or range
    of objects) into portions; ► usually with the intention to use one or more of
    these portions for a particular purpose
  glosses:
  - to divide
  forms:
  - vbpiel
  - vbnif- (passive)
  references:
  - JOB-038-024
  - EZK-005-001
- sense_id: '002311001002000'
  domain: Divide
  definition: = causative action by which humans divide an object (or range of objects)
    located in a certain place into portions and set aside one part of it
  glosses:
  - to take (from)
  - to select (from)
  forms:
  - vbqal-
  references:
  - 2CH-028-021
- sense_id: '002311001003000'
  domain: Divide
  definition: = causative action by which humans divide an object or range of objects
    in their thoughts in order to share the responsibility for dealing with it with
    someone else
  glosses:
  - to divide
  forms:
  - vbpiel
  references:
  - 1KI-018-006
- sense_id: '002311001004000'
  domain: Apart
  definition: = process by which a group becomes divided into smaller groups ◄ because
    of difference in opinion
  glosses:
  - to become divided
  forms:
  - vbnif-
  references:
  - 1KI-016-021
- sense_id: '002311001005000'
  domain: Apart
  definition: = causative action by which humans divide a group of people into smaller
    groups, ► usually with the intention of assigning a certain duty to some or each
    of these groups
  glosses:
  - to divide
  - to organize
  forms:
  - vbqal-
  - vbnif-
  - vbpiel
  references:
  - GEN-014-015
  - GEN-049-007
  - 1CH-023-006
  - 1CH-024-003
  - 1CH-024-004
  - 1CH-024-005
  - 2CH-023-018
  - LAM-004-016
- sense_id: '002311001006000'
  domain: Possess
  definition: = process by which humans receive a portion of an object (or range of
    objects) that has been divided
  glosses:
  - to receive a share
  forms:
  - vbqal-
  references:
  - JOS-018-002
  - JOS-022-008
  - 1SA-030-024
  - JOB-027-017
  - PRO-017-002
  - JER-037-012
- sense_id: '002311001007000'
