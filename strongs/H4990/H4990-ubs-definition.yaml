- sense_id: '004573001001000'
  domain: Names of People
  definition: = man; ► treasurier of king {L:Cyrus<SDBH:כֹּורֶשׁ>}; after exile
  glosses:
  - Mithredath
  references:
  - EZR-001-008
- sense_id: '004573001002000'
  domain: Names of People
  definition: = man; ► {L:Persian<SDBH:פָּרַס>} official, who wrote a letter to {L:Artaxerxes<SDBH:אַרְתַּחְשַׁסְתְּא>},
    together with {L:Bishlam<SDBH:בִּשְׁלָם>} and {L:Tabeel<SDBH:טָבְאֵל>}, to keep
    the {L:Jews<SDBH:יְהוּדִי>} from rebuilding the temple
  glosses:
  - Mithredath
  references:
  - EZR-004-007
