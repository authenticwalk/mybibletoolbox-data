  references:
  - PRO-012-019
- sense_id: 006693001002000
  domain: Time
  definition: = action by which humans or deities perform an action at an unexpected
    moment and with speed
  glosses:
  - to act in a moment
  - to act suddenly
  forms:
  - vbhif-
  references:
  - ISA-051-004
  - JER-049-019
  - JER-050-044
- sense_id: 006693002001000
  domain: Unsteady
  definition: = causative process by which a liquid mass is agitated
  glosses:
  - to stir up
  forms:
  - vbqal-
  references:
  - JOB-026-012
  - ISA-051-015
  - JER-031-035
- sense_id: 006693003001000
  domain: Non-Move
  definition: = process by which animals or objects in motion stop moving
  glosses:
