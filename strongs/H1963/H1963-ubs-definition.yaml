- sense_id: 001807001001000
  domain: Descriptive Referents
  definition: = referent to the way in which an event is performed; ► normally with
    the intention of finding out how, but often used in rhetorical questions in order
    to express one's conviction that that event in question cannot be performed at
    all (under the given circumstances)
  glosses:
  - how?
  forms:
  - question
  - word
