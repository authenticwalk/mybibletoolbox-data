strongs_number: H8377
lemma: תְּאֹו
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 007683001001000
  domain: Wild Animals
  definition: = medium-sized antelope, about the size of a donkey, with long slender
    horns that are usually over a meter long; these horns are almost straight and
    slope back from the animal’s head at about thirty degrees from the perpendicular;
    the adults are a light fawn color with dark brown markings on the face and on
    the lower part of both front and back legs; the belly is white; ◄ Oryx leucoryx;
    ► unclean and therefore not to be eaten
  glosses:
  - oryx
  references:
  - DEU-014-005
  - ISA-051-020
