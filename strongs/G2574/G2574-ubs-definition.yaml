senses:
- sense_id: 002579001001000
  louw_nida_code: '4.30'
  domain: Animals
  definition: large quadruped mammal; Camelus dromedarius and Camelus bactrianus;
    bactrians may reach 2 m.; dromedaries are bigger and a uniform light fawn color;
    bactrians are darker; suited to life in desert areas; store excess food in their
    humps, can go without water for long periods; can make long journeys through dry
    areas; used for riding and for carrying heavy loads and pulling carts; hair woven
    into cloth used for making tents or outer robes; milk used as food and drink;
    symbol of wealth and commerce
  glosses:
  - camel
