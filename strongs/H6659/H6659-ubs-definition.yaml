    high {L:priest<SDBH:כֹּהֵן>} under {L:David<SDBH:דָּוִד>} and {L:Solomon<SDBH:שְׁלֹמֹה>};
    with the {L:prophet<SDBH:נָבִיא>} {L:Nathan<SDBH:נָתָן>} anointed Solomon as {L:David<SDBH:דָּוִד>}'s
