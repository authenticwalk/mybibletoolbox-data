senses:
- sense_id: '006013001001000'
  domain: Birds
  definition: 'exact meaning unknown; possibly: = a grouping of eagles and vultures
    of a slightly smaller size than the {L:נֶשֶׁר<SDBH:נֶשֶׁר>}; including: the Gypaëtus
    barbatus (Bearded vulture or Lammergeier), the Circaetus gallicus (alternatively
    Circaetus pectoralus: the Black-breasted Snake Eagle, the Short-toed Eagle, the
    Black-chested Harrier Eagle), and the Hieraeetus pennatus (Booted Eagle), as well
    as one or two others'
  glosses:
  - bearded vulture
  - lammergeier
