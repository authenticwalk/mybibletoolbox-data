senses:
- sense_id: 007914001001000
  domain: Move
  definition: = location where the sun has reached the end of its circuit and from
    where it is expected to move back to its beginning point
  glosses:
  - turning point (of the sun)
  references:
  - PSA-019-007
- sense_id: 007914001002000
  domain: Time
  definition: 'literally: turning point of the year; hence: = time when the year has
    reached its end and when the new year begins'
  glosses:
  - end (of year)
  references:
  - EXO-034-022
  - 2CH-024-023
- sense_id: 007914001003000
  domain: Time
  definition: 'literally: turning point of days; hence: = time when a given period
    has reached its end'
  glosses:
  - after some time
  - in due time
  references:
  - 1SA-001-020
related_lemmas:
- word: נקף
