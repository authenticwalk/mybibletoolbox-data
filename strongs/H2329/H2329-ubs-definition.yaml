strongs_number: H2329
lemma: חוּג
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '002152001001000'
  domain: Regions Above the Earth
  definition: = dome-shaped structure; used exclusively to denote the firmament, which
    separates the waters above the earth from the earth itself; ≈ God is said to have
    his dwelling-place above this structure; it is also regarded as the boundary between
    light and darkness
  glosses:
  - circle
  - horizon
  - vault
  - dome
  - canopy
  references:
  - JOB-022-014
  - PRO-008-027
  - ISA-040-022
