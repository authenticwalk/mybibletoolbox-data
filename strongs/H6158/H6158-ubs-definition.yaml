- sense_id: '005311001001000'
  domain: Birds
  definition: = a large black bird with a thick strong beak, and fairly short legs;
    it is highly intelligent and seems to enjoy flying; it eats almost anything, including
    grain, fruit, insects, lizards, frogs, eggs, nestlings, and the meat of dead animals;
    ► unclean and therefore not to be eaten; ≈ its black color is regarded as beautiful
