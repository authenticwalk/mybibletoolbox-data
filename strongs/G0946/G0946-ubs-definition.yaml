  - REV-017-004
  - REV-017-005
  - REV-021-027
- sense_id: 000942001002000
  louw_nida_code: '53.38'
  domain: Religious Activities
  definition: '(a fixed phrase derived from Hebrew, literally: the detestable thing
    of desolation) an abomination (either an object or an event) which defiles a holy
    place and thus causes it to be abandoned and left desolate'
  glosses:
  - an abomination which desolates
  - a horrible thing which defiles
  references:
