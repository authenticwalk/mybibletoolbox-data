strongs_number: H3607
lemma: כלא
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '003304001001000'
  domain: Control
  definition: = causative action by which humans hold other humans under control,
    either in a prison or in another situation in which that person does not have
    the freedom to act and go at will
  glosses:
  - to imprison
  - to confine
  forms:
  - vbqal-
  references:
  - 1SA-006-010
  - PSA-088-009
  - JER-032-002
  - JER-032-003
- sense_id: '003304001002000'
  domain: Control
  definition: = causative action by which humans refuse other humans to access a certain
    place
  glosses:
  - to withhold
  forms:
  - vbqal-
  references:
  - GEN-023-006
- sense_id: '003304001003000'
  domain: Non-Engage
  definition: 'literally: to confine (oneself from doing something); hence: = action
    by which deities keep themselves from engaging in a certain activity'
  glosses:
  - to withhold
  forms:
  - vbqal-
  references:
  - PSA-040-012
  - HAG-001-010
  - HAG-001-010
- sense_id: '003304001004000'
  domain: Non-Engage
  definition: 'literally: to confine (someone from doing something); hence: = causative
    action by which humans or deities keep (other) humans from engaging in a certain
    activity'
  glosses:
  - to restrain
  forms:
  - vbqal-
  - vbnif- (passive)
  references:
  - GEN-008-002
  - EXO-036-006
  - NUM-011-028
  - 1SA-025-033
  - PSA-040-010
  - PSA-119-101
  - ECC-008-008
  - ISA-043-006
  - EZK-031-015
