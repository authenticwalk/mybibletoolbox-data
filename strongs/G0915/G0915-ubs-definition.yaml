senses:
- sense_id: 000914001001000
  louw_nida_code: '11.95'
  domain: Groups and Classes of Persons and Members of Such Groups and Classes
  definition: a person not participating in Greek culture and civilization (βάρβαρος
    contrasts with {L:Ἕλλην<SDBG:Ἕλλην:000000>}[a] ‘Greek,’ {D:11.90}, with the focus
    on culture rather than on language; see {S:04601401100024} at {D:11.94})
  glosses:
  - non-Greek
  references:
  - ROM-001-014
- sense_id: 000914001002000
  louw_nida_code: '11.94'
  domain: Groups and Classes of Persons and Members of Such Groups and Classes
  definition: the native people of an area in which a language other than Greek or
    Latin was spoken (such persons would be regarded as being outside the civilized
    world of NT times)
  glosses:
  - native people
  - uncivilized
  - foreigners
  references:
  - ACT-028-002
  - ACT-028-004
  - 1CO-014-011
  - 1CO-014-011
- sense_id: 000914001003000
  louw_nida_code: '41.31'
  domain: Behavior and Related States
  definition: a pattern of behavior associated with a low cultural level
  glosses:
  - uncivilized
  - barbarian
  references:
  - COL-003-011
