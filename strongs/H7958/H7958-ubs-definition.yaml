strongs_number: H7958
lemma: שְׂלָו
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '007043001001000'
  domain: Birds
  definition: = small brown bird streaked with white, the smallest of the game birds;
    looks like a miniature {L:partridge<SDBH:קֹרֵא>}, with a small white patch beneath
    its beak, a white stripe above its eye, and another around its neck; the males
    have a black chest stripe above a chestnut-colored breast patch; ◄ Coturnix coturnix;
    ► clean animal and therefore fit for consumption
  glosses:
  - quail
  references:
  - EXO-016-013
  - NUM-011-031
  - NUM-011-032
  - PSA-105-040
