- sense_id: 001396001002000
  domain: Names of Waterbodies
  definition: = spring; ◄ on the east side of {L:Jerusalem<SDBH:יְרוּשָׁלַ͏ִם>}, right
    outside the city wall; ► later made accessible from inside the town by means of
    a tunnel
  glosses:
  - Gihon
