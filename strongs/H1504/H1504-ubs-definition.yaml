strongs_number: H1504
lemma: גזר
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 001379001001000
  domain: Detach
  definition: = causative action by which humans or deities divide objects into two
    halves
  glosses:
  - to cut in two
  forms:
  - vbqal-
  references:
  - 1KI-003-025
  - 1KI-003-026
  - PSA-136-013
- sense_id: 001379001002000
  domain: Detach
  definition: = causative action by which part of an object is removed with force
    from a larger unit, with the help of a sharp object
  glosses:
  - to cut off
  - to cut down
  - to cut out
  forms:
  - vbqal-
  references:
  - 2KI-006-004
  - DAN-002-034
  - DAN-002-045
- sense_id: 001379001003000
  domain: Ingest
  definition: = causative action by which part of an edible object is removed with
    force from a larger unit, and eaten
  glosses:
  - to snatch and devour
  forms:
  - vbqal-
  references:
  - ISA-009-019
- sense_id: 001379001004000
  domain: Move
  definition: = process by which objects are forcefully removed from a location
  glosses:
  - to be snatched
  - to vanish
  forms:
  - vbqal-
  references:
  - HAB-003-017
- sense_id: 001379001005000
  domain: Move
  definition: = causative action by which objects are forcefully removed from a location,
    or denied access to a location
  glosses:
  - to cut off
  - to exclude
  - to banish
  forms:
  - vbnif- (passive)
  references:
  - 2CH-026-021
  - PSA-088-006
  - ISA-053-008
- sense_id: 001379001006000
  domain: Non-Exist
  definition: 'literally: to be cut off; hence: = process by which individuals or
    groups are about to disappear from existence, without hope for a reversal of the
    situation'
  glosses:
  - to be doomed
  forms:
  - vbnif-
  references:
  - LAM-003-054
  - EZK-037-011
- sense_id: 001379001007000
  domain: Think
  definition: = action by which humans in a position of authority end a period of
    consideration and come to a resolution in their minds
  glosses:
  - to decide
  - to decree
  forms:
  - vbqal-
  - vbnif- (passive)
  references:
  - EST-002-001
  - JOB-022-028
- sense_id: 001379002001000
  domain: Professions
  definition: 'participle: person skilled in interpreting mysteries; ◄ found in Babylon;
    ► working at the royal court'
  glosses:
  - diviner
  - astrologer
  references:
  - DAN-002-027
  - DAN-004-004
  - DAN-005-007
  - DAN-005-011
related_lemmas:
- word: גִּזְרָה
