  louw_nida_code: '4.57'
  domain: Animals
  definition: small, soft, legless, tube-shaped creatures that have no bones or shells.
    They typically feed on overripe fruit, rotting meat, and similar things; most
    are larvae that hatch from the eggs laid by flies or some beetles; symbols of
    uncleanness, decay, and death
  glosses:
  - maggot
  - worm
