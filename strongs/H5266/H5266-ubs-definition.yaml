strongs_number: H5266
lemma: סלק
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 005099001001000
  domain: Move
  definition: = process by which a substance or other object appears to move up by
    itself
  glosses:
  - to go up
  - to rise up
  forms:
  - vbpeal
  references:
  - DAN-007-003
  - DAN-007-008
  - DAN-007-020
- sense_id: 005099001002000
  domain: Move
  definition: = action by which humans go to a place that is situated at a higher
    elevation
  glosses:
  - to go up
  forms:
  - vbpeal
  references:
  - EZR-004-012
- sense_id: 005099001003000
  domain: Move
  definition: = action by which humans or divine beings move up in a supernatural
    way
  glosses:
  - to ascend
  forms:
  - vbqal-
  references:
  - PSA-139-008
- sense_id: 005099001004000
  domain: High
  definition: 'literally: to cause to go up; hence: = causative action by which humans
    take hold of other humans and cause them to rise up from a certain location'
  glosses:
  - to lift up
  forms:
  - vbhaf-
  - vbhof- (passive)
  references:
  - DAN-003-022
  - DAN-006-024
  - DAN-006-024
- sense_id: 005099001005000
  domain: Think
  definition: 'literally: thoughts come up; hence: = process by which humans start
    engaging with certain thoughts that come up spontaneously, possible through a
    dream or vision'
  glosses:
  - to come (to one's mind)
  forms:
  - vbpeal
  references:
  - DAN-002-029
