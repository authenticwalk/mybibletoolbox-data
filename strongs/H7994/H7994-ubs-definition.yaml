senses:
- sense_id: '007404001001000'
  domain: Birds
  definition: = an eagle-like bird that feeds on fish. It has a white head, chest,
    and belly, with a dark brown back and wings. It has a dark stripe from the edge
    of the beak through the eye to the back of the neck and a faint stripe on its
    chest; ◄ Pandion haliaetus; it is found on seacoasts and near lakes and large
    rivers; ► unclean and therefore not to be eaten
  glosses:
  - osprey
  references:
  - LEV-011-017
  - DEU-014-017
