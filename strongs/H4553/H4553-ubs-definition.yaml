senses:
- sense_id: 004169001001000
  domain: Grieve
  definition: = mourning ritual for someone who has died, or for another tragic event;
    this may include {L:wailing<SDBH:ילל>}, tearing one's clothes, putting on {L:sackcloth<SDBH:שַׂק>},
    covering oneself with dust or ashes, {L:fasting<SDBH:צום>} or eating specific
    food, {L:cutting oneself<SDBH:גדד>}, {L:shaving one's head<SDBH:קרח>}, covering
    part of one's face, etc.; this usually takes place during a specific period of
    time and ends after the burial has taken place, but it may also be repeated in
    later days to commemorate a tragic event
  glosses:
  - mourning
