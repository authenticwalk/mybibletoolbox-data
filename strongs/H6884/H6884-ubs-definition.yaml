senses:
- sense_id: '006336001001000'
  domain: Test
  definition: = action by which humans or deities examine the character of humans
    by having them engage in a certain activity, ◄ as a goldsmith tests the quality
    of a precious metal by smelting it in the fire
  glosses:
  - to test
  forms:
  - vbqal-
  references:
  - JDG-007-004
  - PSA-017-003
  - PSA-026-002
  - PSA-026-002
- sense_id: '006336001002000'
  domain: Detach
  definition: = causative action by which a goldsmith removes contaminants from a
    precious metal by smelting it in the fire; ≈ used as a metaphor for purging evil
    from the heart of humans
  glosses:
  - to purge away
  forms:
  - vbqal-
  references:
  - ISA-001-025
- sense_id: '006336001003000'
  domain: Exist
  definition: = causative action by which a goldsmith creates an artifact from a precious
    metal by smelting it in the fire
  glosses:
  - to cast
  forms:
  - vbqal-
  references:
  - ISA-040-019
- sense_id: '006336001004000'
  domain: Test
  definition: = causative action by which a goldsmith improves the quality of a precious
    metal by smelting it in the fire and so removing all contaminants; ≈ often used
    as a metaphor for purging evil from the hearts of humans
  glosses:
  - to refine
  forms:
  - vbqal-
  references:
  - PSA-012-007
  - PSA-066-010
  - JER-006-029
  - JER-006-029
  - ZEC-013-009
- sense_id: '006336001005000'
  domain: Test
  definition: = causative action by which deities improve the character of humans
    by leading them through difficult circumstances, ◄ like a goldsmith improves the
    quality of a precious metal by smelting it in the fire and so removing all contaminants
  glosses:
  - to refine
  forms:
  - vbqal-
  - vbnif- (passive)
  references:
  - PSA-066-010
  - PSA-105-019
  - ISA-048-010
  - JER-009-006
  - DAN-011-035
  - DAN-012-010
  - ZEC-013-009
- sense_id: '006336001006000'
  domain: Test
  definition: 'literally: tested; hence: = state in which the words of deities have
