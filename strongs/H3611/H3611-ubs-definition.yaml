senses:
- sense_id: 003308001001000
  domain: Domestic Animals
  definition: = relatively small light brown domestic animal, feeding on anything
    from household refuse to animal carcasses and excreta; ◄ |iCanis familiaris putiatini|i*;
    ► extremely unclean animal and therefore not to be eaten, though used for hunting
    and for watching sheep; ≈ considered almost as unclean as a {L:pig<SDBH:חֲזִיר>};
    associated with all sorts of uncleanness, aggression, greediness, low status;
    used as derogatory term for male shrine prostitutes
  glosses:
  - dog
