- sense_id: 003308001002000
  domain: Prostitutes
  definition: = male person involved in sexual intercourse in or around a sanctuary,
    probably for religious reasons; ≈ practice was prohibited in Mosaic law and for
    that reason regarded as despicable, hence the epithet "dog"
  glosses:
  - dog
  - male shrine prostitute
