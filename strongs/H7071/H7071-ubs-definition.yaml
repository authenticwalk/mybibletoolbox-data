senses:
- sense_id: '006507001001000'
  domain: Names of Waterbodies
  definition: = brook or wadi; ► marking the boundary of the territory of {L:Ephraim<SDBH:אֶפְרַיִם>},
    separating it from {L:Manasseh<SDBH:מְנַשֶּׁה>}; 8 km southwest of {L:Shechem<SDBH:שְׁכֶם>}
  glosses:
  - Kanah
  references:
  - JOS-016-008
  - JOS-017-009
- sense_id: '006507001002000'
  domain: Names of Locations
  definition: = town; ◄ located in the territory of {L:Asher<SDBH:אָשֵׁר>}; probably
    modern Qana, 10 km southeast of Tyre
  glosses:
  - Kanah
  references:
  - JOS-019-028
