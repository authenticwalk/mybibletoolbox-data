senses:
- sense_id: 003861001001000
  domain: Clean
  definition: = causative action by which humans clean or dry an object or body part
    by rubbing it with a cloth or with their hands; sometimes extended to refer to
    God; ≈ sometimes associated with destruction
  glosses:
  - to wipe
  forms:
  - vbqal-
  references:
  - 2KI-021-013
  - 2KI-021-013
  - PRO-030-020
  - ISA-025-008
- sense_id: 003861001002000
  domain: Clean
  definition: = causative action by which humans erase words from parchment or leather,
    either by scratching away the ink with a sharp implement or by washing it away
    with water
  glosses:
  - to erase
  - to blot out
  forms:
  - vbqal-
  - vbnif- (passive)
  references:
  - EXO-032-032
  - EXO-032-033
  - NUM-005-023
  - PSA-069-029
- sense_id: 003861001003000
  domain: Non-Know
  definition: = causative action by which deities or humans ensure that (other) humans
    and/or their actions will no longer be remembered
  glosses:
  - to blot out
  - to wipe out
  forms:
  - vbqal-
