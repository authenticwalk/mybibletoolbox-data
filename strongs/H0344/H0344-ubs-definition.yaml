senses:
- sense_id: '000322001001000'
  domain: Birds
  definition: = bird of prey of a relatively small size, that can fly fast, but also
    hover; lives on rats, mice, and other birds; ► unclean and therefore not to be
    eaten
  glosses:
  - falcon
  - hawk
  references:
  - LEV-011-014
  - DEU-014-013
  - JOB-028-007
- sense_id: '000322002001000'
  domain: Names of People
  definition: = man; ◄ son of {L:Zibeon<SDBH:צִבְעֹון>}, brother of {L:Anah<SDBH:עֲנָה>};
    descendant of {L:Seir<SDBH:שֵׂעִיר>}
  glosses:
  - Aiah
  references:
  - GEN-036-024
  - 1CH-001-040
- sense_id: '000322002002000'
  domain: Names of People
  definition: = man; ► father of {L:Rizpah<SDBH:רִצְפָּה>}, concubine of {L:Saul<SDBH:שָׁאוּל>}
  glosses:
  - Aiah
  references:
  - 2SA-003-007
  - 2SA-021-008
  - 2SA-021-010
  - 2SA-021-011
