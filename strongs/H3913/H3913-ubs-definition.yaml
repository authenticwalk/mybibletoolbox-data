senses:
- sense_id: 003578001001000
  domain: Shape
  definition: = causative action by which humans use a hammer to shape iron and other
    metals
  glosses:
  - to hammer
  - to forge
  forms:
  - vbqal-
  references:
  - GEN-004-022
- sense_id: 003578001002000
  domain: Shape
  definition: 'literally: to hammer; hence: = causative action by which humans use
    an iron tool to cause an object to have a thin cutting edge, ► in order to make
    it useful and effective as a tool'
  glosses:
  - to sharpen
  - to whet
  forms:
  - vbqal-
  - vbpual (passive)
  references:
  - 1SA-013-020
  - PSA-007-013
  - PSA-052-004
- sense_id: 003578001003000
  domain: See
  definition: 'literally: to sharpen (one''s) eyes; hence: = action by which someone
    glares at someone in a menacing way'
  glosses:
  - to give someone a menacing glare
  forms:
  - vbqal-
  references:
  - JOB-016-009
