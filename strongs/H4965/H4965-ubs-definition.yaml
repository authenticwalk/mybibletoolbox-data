strongs_number: H4965
lemma: מֶתֶג
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '004551001001000'
  domain: Tools
  definition: = short bar, ◄ usually made of metal, ► placed in the mouth of a horse;
    its ends, which project from the mouth of the animal, are attached to ropes or
    leather straps that fit over the head as the {L:bridle<SDBH:רֶסֶן>}; used to steer
    the horse; ≈ associated with control and, indirectly, with lack of wisdom
  glosses:
  - bit
  references:
  - 2KI-019-028
  - PSA-032-009
  - PRO-026-003
  - ISA-037-029
- sense_id: '004551001002000'
  domain: Control
  definition: 'literally: bit; hence: = state of being in control over a certain area'
  glosses:
  - control
  - supremacy
  references:
  - 2SA-008-001
- sense_id: '004551002001000'
  domain: Names of Locations
  definition: = location; ► taken by {L:David<SDBH:דָּוִד>} from the control of the
    {L:Philistines<SDBH:פְּלִשְׁתִּי>}
  glosses:
  - Metheg-Ammah
  references:
  - 2SA-008-001
