strongs_number: H3643
lemma: כִּמְהָם
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '003337001001000'
  domain: Names of People
  definition: = man; ◄ son of {L:Barzillai<SDBH:בַּרְזִלַּי>}, from {L:Gilead<SDBH:גִּלְעָד>};
    ► lived with {L:David<SDBH:דָּוִד>} in order to reward his father for his help
    during {L:Absalom<SDBH:אַבְשָׁלֹום>}'s revolt
  glosses:
  - Chimham
  - Chimhan
  references:
  - 2SA-019-038
  - 2SA-019-039
  - 2SA-019-041
- sense_id: '003337001002000'
  domain: Names of Locations
  definition: = location ◄ near {L:Bethlehem<SDBH:בֵּית לֶחֶם>}, ► where the {L:Judeans<SDBH:יְהוּדִי>}
    who were on their way to {L:Egypt<SDBH:מִצְרַיִם>} broke their journey, during
    the time of {L:Jeremiah<SDBH:יִרְמְיָה>}
  glosses:
  - Geruth Kimham
  - Geruth Chimham
  references:
  - JER-041-017
  - JER-041-017
