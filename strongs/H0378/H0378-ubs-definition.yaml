strongs_number: H0378
lemma: אִישׁ־בֹּשֶׁת
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '000356001001000'
  domain: Names of People
  definition: = man, also known as {L:Ishvi<SDBH:יִשְׁוִי>}, whose real name probably
    was {L:Eshbaal<SDBH:אֶשְׁבַּעַל>}, but which was changed in order to remove any
    reference to {L:Baal<SDBH:בַּעַל>}; ◄ son of king {L:Saul<SDBH:שָׁאוּל>}; tribe
    of {L:Benjamin<SDBH:בִּנְיָמִן>}; ► succeeded his father as king of the northern
    tribes until he was assassinated and {L:David<SDBH:דָּוִד>} took his place
  glosses:
  - Ish-Bosheth
