strongs_number: H1865
lemma: דְּרֹור
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '001716001001000'
  domain: Flow
  definition: = process by which a liquid flows slowly, forming large drops
  glosses:
  - liquid
  references:
  - EXO-030-023
- sense_id: '001716002001000'
  domain: Free
  definition: = state of being free from control and not in the power of someone else,
    which is not restricted to slavery and captivity only, but includes financial
    debts; it also applies to farm land that is free from being "enslaved" by the
    farmer and is allowed to lay fallow; it also applies to inalienable possessions,
    such as land, which is released to return to its rightful owner
  glosses:
  - liberty
  - freedom
  - release
  references:
  - LEV-025-010
  - ISA-061-001
  - JER-034-008
  - JER-034-015
  - EZK-046-017
- sense_id: '001716003001000'
  domain: Birds
  definition: = small bird with long slender wings and short legs; it flies at great
    speed for long periods on end, twisting and turning, usually in fairly large groups,
    catching insects in the air as they fly; it makes its nest under overhangs on
    rock faces, in caves, or in human structures, such as buildings and the underside
    of bridges; ◄ |iHirundo daurica|i*, |iHirundo obsolete|i*, |iDelichon urbica|i*
  glosses:
  - swallow
  - martin
  references:
  - PSA-084-004
  - PRO-026-002
