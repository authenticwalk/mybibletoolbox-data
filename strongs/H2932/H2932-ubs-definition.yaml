senses:
- sense_id: 002699001001000
  domain: Unclean
  definition: = something that causes humans, animals, or objects to be regarded by
    the law as having been contaminated, as a result of which anything that touches
    them may become contaminated as well; ► humans, animals, and objects that are
    unclean cannot participate in social and religious activities, until this state
    is reversed through prescribed rituals and procedures
  glosses:
  - uncleanness
