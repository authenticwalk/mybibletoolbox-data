senses:
- sense_id: '002417001001000'
  domain: Birds
  definition: = large bird with long legs and a long neck; the white stork has a white
    body and black wings, whereas the black stork is a glossy brownish black color
    with a white belly; both varieties have a red beak and legs; both types spend
    most of the time on the ground or in shallow water searching for food; the white
    stork eats mainly locusts, grasshoppers, and other insects, as well as frogs,
    lizards, and the chicks of ground-nesting birds, whereas the black stork prefers
    fish and frogs but also eats the same things as the white stork; ◄ |iCiconia ciconia|i*
    or |iCiconia nigra|i*; ► unclean and therefore not to be eaten
  glosses:
  - stork
  references:
