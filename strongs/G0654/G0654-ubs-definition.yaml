strongs_number: G0654
lemma: ἀποστρέφω
source: UBS/SDGNT
license: CC-BY-SA 4.0
senses:
- sense_id: 000648001001000
  louw_nida_code: '31.70'
  domain: Hold a View, Believe, Trust
  definition: to cause someone to turn away from a previous belief
  glosses:
  - to cause to turn away from
  - to cause to change one’s belief
  - to mislead
  references:
  - LUK-023-014
  - ACT-003-026
- sense_id: 000648001002000
  louw_nida_code: '88.264'
  domain: Moral and Ethical Qualities and Related Behavior
  definition: to cause someone to depart from correct behavior and thus engage in
    serious wrongdoing
  glosses:
  - to lead astray
  - to pervert
  - to mislead
  references:
  - LUK-023-014
- sense_id: 000648001003000
  louw_nida_code: '85.52'
  domain: Existence in Space
  definition: to cause something to be in a place where it was formerly
  glosses:
  - to return
  - to put back
  references:
  - MAT-026-052
- sense_id: 000648001004000
  louw_nida_code: '13.63'
  domain: Be, Become, Exist, Happen
  definition: to cause something to turn into or to become something else or to become
    removed from something or someone
  glosses:
  - to change
  - to turn into
  - to remove from
  references:
  - ROM-011-026
- sense_id: 000648001005000
  louw_nida_code: '68.44'
  domain: Aspect
  definition: (a figurative extension of meaning of ἀποστρέφω ‘to cause to turn back
    from,’ not occurring in the NT) to cease doing something, with the implication
    of rejection
  glosses:
  - to stop
  - to cease
  - to reject
  references:
  - MAT-005-042
  - ACT-003-026
  - 2TI-004-004
  - TIT-001-014
  - HEB-012-025
- sense_id: 000648001006000
  louw_nida_code: '31.62'
  domain: Hold a View, Believe, Trust
  definition: to no longer continue to believe as one has and hence to turn away from
    or to reject a previous set of beliefs
  glosses:
  - to turn away from
  - to reject
  forms:
  - ἀποστρέφομαι[a]
  references:
  - TIT-001-014
- sense_id: 000648001007000
  louw_nida_code: '34.26'
  domain: Association
  definition: to abandon a former relationship or association, or to dissociate (a
    type of reversal of beginning to associate){N:001}
  glosses:
  - to fall away
  - to forsake
  - to turn away
  forms:
  - ἀποστρέφομαι[b]
  references:
  - 2TI-001-015
  - HEB-012-025
- sense_id: 000648001008000
  louw_nida_code: '35.18'
  domain: Help, Care For
  definition: to refuse to provide help to someone
  glosses:
  - to refuse to help
  forms:
  - ἀποστρέφομαι[c]
  references:
  - MAT-005-042
  - 2TI-001-015
related_lemmas:
- word: στρέφω
