  domain: Copulate
  definition: = action by which a man has intercourse with the wife of his deceased
    brother, if the brother did not have a son before he died ► to enable a descendance
    from that brother and perhaps to assure a family for the widow
  glosses:
  - to fulfill the duty of producing an heir for one's brother
