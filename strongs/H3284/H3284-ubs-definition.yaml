senses:
- sense_id: '003003001001000'
  domain: Birds
  definition: 'exact meaning unknown; probably: = a type of owl, large, standing over
    75 centimeters (30 inches) tall; it has a pale fawn color, is spotted, has ear
    tufts, and is best known by its loud, deep hooting at night; it roosts by day
    in deep shade in acacia trees, caves, tombs, and ruined buildings; it feeds on
    small mammals, including hares, baby gazelles, lambs, rats and mice, and large
    roosting birds, especially wild and domestic ducks; ◄ Bubo bubo; ► unclean and
    therefore not to be eaten'
  glosses:
  - eagle owl
