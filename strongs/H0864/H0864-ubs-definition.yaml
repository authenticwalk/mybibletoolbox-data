strongs_number: H0864
lemma: אֵתָם
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 000802001001000
  domain: Names of Locations
  definition: = location; ◄ in eastern {L:Egypt<SDBH:מִצְרַיִם>} near {L:Succoth<SDBH:סֻכֹּות>}
    and on the edge of the desert; ► {L:Israelites<SDBH:יִשְׂרָאֵל>} encamped there
    on their way from Egypt to {L:Canaan<SDBH:כְּנַעַן>}; when setting out from {L:Etham<SDBH:אֵתָם>}
    they turned back in the direction of {L:Pi-Hahiroth<SDBH:פִּי הַחִירֹת>}; after
    having crossed the {L:Sea of Reeds<SDBH:יָם־סוּף>} the Israelites pass through
    the desert of Etham
  glosses:
  - Etham
  references:
  - EXO-013-020
  - NUM-033-006
  - NUM-033-007
  - NUM-033-008
