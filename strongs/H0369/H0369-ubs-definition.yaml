- sense_id: '000350002001000'
  domain: Spatial Referents
  definition: = referent to an unknown location; ► normally used with the purpose
    of finding out from which location a person or object originates; ≈ sometimes
    used in rhetorical questions expressing one's conviction that that location does
    not exist
  glosses:
  - from where?
  references:
  - GEN-029-004
  - GEN-042-007
