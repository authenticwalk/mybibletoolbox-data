senses:
- sense_id: '002127001001000'
  domain: Shape
  definition: = causative action by which humans use an iron tool to cause an object
    to have a thin cutting edge, ► in order to make it useful and effective as a tool;
    ≈ often associated with aggression and danger
  glosses:
  - to sharpen
  forms:
  - vbhif-
  - vbhof- (passive)
  references:
  - PRO-027-017
  - EZK-021-014
  - EZK-021-015
  - EZK-021-016
  - EZK-021-021
- sense_id: '002127001002000'
  domain: Ferocious
  definition: = state in which animals are inclined to violent and dangerous activity
    ◄ as dangerous as a sharp knife
  glosses:
  - to be fierce
  - to be dangerous
  forms:
  - vbqal-
  references:
  - HAB-001-008
- sense_id: '002127001003000'
  domain: Know
  definition: 'literally: to sharpen someone''s face; hence: = causative action by
    which humans increase the ability of others to assess different situations and
    react in an effective way'
  glosses:
  - to sharpen (someone's) face > wit
  forms:
  - vbhif-
  references:
  - PRO-027-017
- sense_id: '002127001004000'
  definition: NO DATA YET
