senses:
- sense_id: '005642001001000'
  domain: Bear
  definition: = action by which humans or deities take responsibility for someone
    else, taking upon themselves that person's obligations or vouching for that person's
    security
  glosses:
  - to pledge
  - to promise
  - to put up security
  forms:
  - vbqal-
  references:
  - GEN-043-009
  - GEN-044-032
  - JOB-017-003
  - PSA-119-122
  - PRO-006-001
  - PRO-011-015
  - PRO-017-018
  - PRO-020-016
  - PRO-022-026
  - PRO-027-013
  - ISA-038-014
- sense_id: '005642001002000'
  domain: Confident
  definition: 'literally: to pledge the heart; hence: =  action by which humans agree
    to perform an event that is considered dangerous and perhaps foolish, as if they
    had to set aside their heart''s desire'
  glosses:
  - to dare
  forms:
  - vbqal-
  references:
  - JER-030-021
- sense_id: '005642001003000'
  domain: Exchange
  definition: = action by which persons or groups engage in the exchange of merchandise
    or services, as in the business of buying and selling
  glosses:
  - to deal
  - to trade
  - to barter
  - to do business
  forms:
  - vbqal-
  references:
  - EZK-027-009
  - EZK-027-027
- sense_id: '005642001004000'
  domain: Non-Possess
  definition: = action by which humans pledge property as security for a debt
  glosses:
  - to mortgage
  - to pawn
  forms:
  - vbqal-
  references:
  - NEH-005-003
- sense_id: '005642001005000'
  domain: Vow
  definition: = action by which humans promise property or something of value to other
    humans, dependent upon the particular outcome of a future event
  glosses:
  - to make a wager, bet
  forms:
  - vbhit-
  references:
  - 2KI-018-023
  - ISA-036-008
- sense_id: '005642002001000'
  domain: Mixed
  definition: = state in which different substances are combined to form a single
    mass
  glosses:
  - to be mixed
  forms:
  - vbpael
  - vbhtpa
  references:
  - DAN-002-041
  - DAN-002-043
  - DAN-002-043
- sense_id: '005642002002000'
  domain: Associate
  definition: = action by which humans join in or associate other humans; used to
    describe the combinations of different groups of peoples, suggesting social and
    religious confusion
  glosses:
  - to mix
  - to mingle
  forms:
  - vbhit-
  - vbhtpa
  references:
  - EZR-009-002
  - PSA-106-035
  - PRO-020-019
  - PRO-024-021
  - DAN-002-043
- sense_id: '005642002003000'
  domain: Engage
  definition: = action by which a person experiences an event with another participant
    or other participants
  glosses:
  - to share
  forms:
  - vbhit-
  references:
  - PRO-014-010
- sense_id: '005642003001000'
  domain: Well
  definition: = state in which an action brings about a positive and desireable feeling
    or reaction
  glosses:
  - to be pleasing
  - to be pleasant
  - to be sweet
  forms:
  - vbqal-
  references:
  - PSA-104-034
  - PRO-003-024
  - PRO-013-019
  - JER-006-020
  - JER-031-026
  - EZK-016-037
  - HOS-009-004
  - MAL-003-004
- sense_id: '005642004001000'
  domain: Time
  definition: = process by which day comes to end, becoming late afternoon and evening;
    associated especially with the fading of daylight towards night
  glosses:
  - to become evening
  forms:
  - vbqal-
  references:
  - JDG-019-009
- sense_id: '005642004002000'
  domain: Complete
  definition: 'literally: to grow dark, become evening; hence = process by which an
    event comes to an end ◄ as the day comes to an end when daylight fades'
  glosses:
  - to grow dark, to fade  > to end
  forms:
  - vbqal-
  references:
  - ISA-024-011
- sense_id: '005642004003000'
  domain: Happen
  definition: = action which is performed late in the day or in the evening
  glosses:
  - to do at evening
  forms:
  - vbhif-
  references:
  - 1SA-017-016
