- sense_id: '006625001002000'
  domain: Clothing
  definition: = a kind of vest or shirt covering the upper part of the body and made
    of several hundred small bronze scales or platelets overlapping each other and
    sewn on a cloth or leather base; the scales were thin and about 11 by 6 centimeters;
    such armor was lighter than a solid metal breastplate and was also more flexible,
    giving greater maneuverability; used especially by soldiers who could not carry
    a shield but still needed protection in battle (for example, a chariot driver).
  glosses:
  - coat of mail
  references:
  - 1SA-017-005
