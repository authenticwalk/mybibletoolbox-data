senses:
- sense_id: '002565001001000'
  domain: Impact
  definition: = causative action by which someone makes incised marks on a surface
    of wood or stone with the help of a sharp and hard tool
  glosses:
  - to engrave (on stone)
  - to carve (wood)
  forms:
  - vbqal-
  references:
  - JER-017-001
- sense_id: '002565001002000'
  domain: Impact
  definition: = causative action by which someone breaks the soil with the help of
    a plow, pulled by domestic animals; ► to make it ready for cultivation; ≈ usually
    regarded as a strenuous task which requires much energy
  glosses:
  - to plow
  forms:
  - vbqal-
  references:
  - DEU-022-010
  - JDG-014-018
  - 1SA-008-012
  - 1KI-019-019
  - JOB-001-014
  - PSA-129-003
  - PSA-129-003
  - PRO-020-004
  - ISA-028-024
  - ISA-028-024
  - AMO-006-012
  - AMO-009-013
- sense_id: '002565001003000'
  domain: Impact
  definition: = causative action by which someone completely destroys an object so
    that it will not be seen anymore, ◄ in the same way as weeds are plowed under
    and disappear from view when the soil is turned up
  glosses:
  - to plow > to destroy
  forms:
  - vbnif- (passive)
  references:
  - JER-026-018
  - MIC-003-012
- sense_id: '002565001004000'
  domain: Happen
  definition: = causative action by which someone causes an entire sequence of events
    to take place by performing the first event in the sequence; only used for events
    that are considered morally and ethically unacceptable
  glosses:
  - to plow
  forms:
  - vbqal-
  references:
  - JOB-004-008
  - HOS-010-013
- sense_id: '002565001005000'
  domain: Hard
  definition: 'literally: to plow; hence: = action by which an animal performs a heavy
    task ◄ comparable to plowing'
  glosses:
  - to plow > to work hard
  forms:
  - vbqal-
  references:
  - HOS-010-011
- sense_id: '002565001006000'
  domain: Professions
  definition: = person with the skill to produce an artifact out of rough materials,
    such as stone, wood, metal
  glosses:
  - craftsman
  forms:
  - vbqal-
  references:
  - GEN-004-022
  - 1KI-007-014
- sense_id: '002565001007000'
  domain: Think
  definition: = action by which someone exercises his {L:mind<SDBH:לֵב>} in order
    to determine a course of action that will achieve a certain purpose; ≈ mostly
    associated with evil purposes
  glosses:
  - to plan
  - to devise
  - to plot
  forms:
  - vbqal-
  - vbhif-
  references:
