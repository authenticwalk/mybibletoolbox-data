- sense_id: '007776002001000'
  domain: Names of People
  definition: = man; ◄ son of {L:Nahor<SDBH:נָחֹור>}, {L:Abraham<SDBH:אַבְרָהָם>}'s
    brother, and his {L:concubine<SDBH:פִּילֶגֶשׁ>} {L:Reumah<SDBH:רְאוּמָה>}
  glosses:
  - Tahash
