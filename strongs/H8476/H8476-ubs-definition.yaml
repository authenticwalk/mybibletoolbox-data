senses:
- sense_id: '007776001001000'
  domain: Aquatic Animals
  definition: = large animal of about 3 meters (10 feet) long, which lives in the
    sea, usually in small herds of twelve to fifteen animals; they swim slowly and
    feed in fairly shallow water on underwater weeds near mouths of rivers; they sometimes
    even move a short distance up the river; they need to come to the surface every
    few minutes to breathe, and they sometimes come out of the water to lie on rocks
    or sandbanks;◄ |iDugong dugong|i*; ► their skins make very good leather
  glosses:
  - dugong
