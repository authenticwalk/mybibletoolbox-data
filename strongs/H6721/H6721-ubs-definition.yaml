- sense_id: 006184001002000
  domain: Names of Locations
  definition: = town; ◄ Phoenician city north of {L:Tyre<SDBH:צֹר>}; famous as a seaport
    and sometimes referred to as Great Sidon; marked the northern boundary of the
    Promised Land
