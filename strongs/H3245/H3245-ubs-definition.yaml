- sense_id: 002967001004000
  domain: Role
  definition: 'literally: to lay as a foundation; hence: = causative action by which
    humans or deities assign a role to (other) humans'
  glosses:
  - to establish
  forms:
  - vbqal-
  - vbpiel
  references:
