- sense_id: 002967001001000
  domain: Space
  definition: = causative action by which humans put in place the bottom part of a
    building or larger structure, usually below the ground level, which will have
    to bear the entire construction
  glosses:
  - to lay the foundations
  forms:
  - vbqal-
  - vbpiel
  - vbnif- (passive)
  - vbpual (passive)
  - vbhof- (passive)
