strongs_number: H6512
lemma: חֲפַרְפָּרָה
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '002454001001000'
  domain: Animals
  definition: 'meaning unsure; possibly: = gray rodent, that grows to about twenty
    centimeters in length, with very large teeth that protrude from the front of the
    mouth; they live almost entirely underground, digging their tunnels just below
    the ground surface with their large teeth and flat front paws; from time to time
    they eject surplus soil onto the surface of the ground, making small heaps, and
    thereby giving away their presence; they are blind, and live on roots.'
  glosses:
  - mole rat
  references:
  - ISA-002-020
related_lemmas:
- word: חפר
