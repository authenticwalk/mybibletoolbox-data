senses:
- sense_id: '004210001001000'
  domain: Clothing
  definition: = long garment, hanging down to the ankles, ◄ usually made of wool,
    ► and worn over the {L:tunic<SDBH:כֻּתֹּנֶת>}; it is not clear whether it had
    sleeves or not, nor whether it was open or closed in the front; ≈ certain attitudes
    and emotions are often described in terms of such a garment, e.g. "he wore fury
    like a robe"
