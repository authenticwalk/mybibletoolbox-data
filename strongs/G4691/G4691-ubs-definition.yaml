strongs_number: G4691
lemma: σπερμολόγος
source: UBS/SDGNT
license: CC-BY-SA 4.0
senses:
- sense_id: 004593001001000
  louw_nida_code: '27.19'
  domain: Learn
  definition: (a figurative extension of meaning of a term based on the practice of
    birds in picking up seeds) one who acquires bits and pieces of relatively extraneous
    information and proceeds to pass them on with pretense and show
  glosses:
  - ignorant show-off
  - charlatan
  references:
  - ACT-017-018
- sense_id: 004593001002000
  louw_nida_code: '33.381'
  domain: Communication
  definition: '(a figurative expression, literally: one who picks up seed; originally
    a reference to birds picking up seed, but figuratively applied to a person who
    is an information scavenger) one who is not able to say anything worthwhile in
    view of his miscellaneous collection of tidbits of information'
  glosses:
  - foolish babbler
  references:
  - ACT-017-018
