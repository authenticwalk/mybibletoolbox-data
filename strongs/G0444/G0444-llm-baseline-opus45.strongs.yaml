strongs: G0444
lemma: ἄνθρωπος
transliteration: anthropos
pos: noun
occurrences: 497

senses:
  - gloss: human being, person
    definition: A member of the human race regardless of gender.
    frequency: primary
    example: "Matt 4:4"
  - gloss: man
    definition: A human being, often in contrast to God or animals.
    frequency: secondary
    example: "John 1:6"
  - gloss: mankind, humanity
    definition: The human race collectively.
    frequency: tertiary
    example: "Matt 5:13"

etymology: From G0435 (aner, man) + G5700 (ops, face/appearance); literally "having the face of a man."
word_family:
  - G0441 # anthropareskos (people-pleaser)
  - G0442 # anthropinos (human)

semantic_range: Individual human, humanity in general, or specific person in narrative contexts.
translation_issue: Distinguished from aner (male); anthropos is gender-inclusive referring to any human.
major_translations:
  KJV: man, men, person
  NIV: man, people, person
  ESV: man, person, people

key_verses:
  - "Matt 4:4"
  - "John 1:6"
  - "Rom 3:28"
  - "1 Tim 2:5"
theological_weight: 8
doctrines_connected:
  - Human nature
  - Incarnation
  - Son of Man title
  - Anthropology

book_distribution: "Matthew (100x), John (60x), Romans (30x), Luke (50x), Acts (40x)"

nuggets:
  - "Son of Man" (huios tou anthropou) is Jesus' most frequent self-designation.
  - Paul's phrase "justified by faith apart from works of law" uses anthropos for the generic person (Rom 3:28).
