- sense_id: '001441001001000'
  domain: Plants
  definition: = tall sedge with a smooth triangular stem, and multiple drooping, clustered
    flower stalks arising from the apex of the main stalk; ◄ |iCyperus papyrus|i*,
    found in the {L:Nile<SDBH:יְאֹר>} valley; ► used for many different purposes in
    the Ancient Near East, such as writing material, ships, mattresses, furniture,
    rope, sandals, etc.
  glosses:
  - papyrus
