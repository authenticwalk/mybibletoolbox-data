  references:
  - GEN-046-014
  - NUM-026-026
- sense_id: '000402002002000'
  domain: Names of Trees
  definition: = oak tree; ◄ located near {L:Shechem<SDBH:שְׁכֶם>}; ► one of the places
    where {L:Abraham<SDBH:אַבְרָהָם>} pitched his tents
