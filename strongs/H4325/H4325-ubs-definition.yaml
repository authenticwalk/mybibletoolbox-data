- sense_id: 003953001001000
  domain: Liquids
  definition: = water as the indispensible liquid on which the existence of all life
    depends, used for drinking, preparing food, washing, irrigating, etc.; found under
    the earth, on the earth, and above the earth; sometimes used as a euphemism to
    denote certain body liquids; ≈ associated with abundance and refreshment, but
    also with instability, and danger, etc.
  glosses:
  - water
