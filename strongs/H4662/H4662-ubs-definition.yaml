senses:
- sense_id: '004270001001000'
  domain: See
  definition: = action by which humans carefully observe a relatively large group
    of people or objects, ► with the purpose of determining their number, establishing
    whether everyone is present, or, in the case of an army, to get to know their
    fighting strength
  glosses:
  - numbering
  - muster
  references:
  - 2SA-024-009
  - 1CH-021-005
- sense_id: '004270001002000'
  domain: Role
  definition: = causative action by which humans give other humans a certain responsibility
    or position of authority with regards to a group of people
  glosses:
  - appointment
  references:
  - 2CH-031-013
- sense_id: '004270001003000'
  domain: Space
  definition: = a place that has been designated for a particular purpose
  glosses:
  - appointed place
  references:
  - EZK-043-021
- sense_id: '004270001004000'
  domain: Names of Constructions
  definition: = one of the city {L:gates<SDBH:שַׁעַר>} of {L:Jerusalem<SDBH:יְרוּשָׁלַ͏ִם>}
  glosses:
  - Muster Gate
  references:
  - NEH-003-031
related_lemmas:
- word: פקד
