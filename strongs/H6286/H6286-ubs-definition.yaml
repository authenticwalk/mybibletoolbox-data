- sense_id: '005765002001000'
  domain: Great
  definition: = state in which humans or deities are considered worthy of honor and
    respect more than others
  glosses:
  - to receive honor
  - to receive praise
  forms:
  - vbhit-
  references:
  - EXO-008-005
  - ISA-044-023
  - ISA-049-003
  - ISA-060-021
  - ISA-061-003
- sense_id: '005765002002000'
  domain: Great
  definition: = state in which humans consider themselves more worthy of honor and
    respect than others and act accordingly
