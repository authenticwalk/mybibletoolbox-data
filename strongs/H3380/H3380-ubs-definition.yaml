senses:
- sense_id: 003089001001000
  domain: Names of People
  definition: = man, also known as {L:Gideon<SDBH:גִּדְעֹון>}, whose real name was
    {L:Jerubbaal<SDBH:יְרֻבַּעַל>}, which was changed to avoid any reference to {L:Baal<SDBH:בַּעַל>};
    ◄ son of {L:Joash<SDBH:יֹואָשׁ>}; tribe of {L:Manasseh<SDBH:מְנַשֶּׁה>}; ► judge
    of {L:Israel<SDBH:יִשְׂרָאֵל>}
  glosses:
  - Jerubbesheth
  - Jerubbaal
  references:
  - 2SA-011-021
