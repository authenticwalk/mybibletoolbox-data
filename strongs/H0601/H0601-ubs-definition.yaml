strongs_number: H0601
lemma: אֲנָפָה
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '000550001001000'
  domain: Birds
  definition: = fairly large bird with a long neck, long beak, and long legs; they
    stand or walk slowly in shallow water in rivers, dams, ponds, or lakes looking
    into the water for small fish, which they catch by suddenly darting their heads
    into the water; they fly with slow wing-beats; ► unclean and therefore not to
    be eaten
  glosses:
  - heron
  references:
  - LEV-011-019
  - DEU-014-018
