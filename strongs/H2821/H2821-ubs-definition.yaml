strongs_number: H2821
lemma: חשׁך
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 002595001001000
  domain: Dark
  definition: = process by which the light gradually disappears, ◄ caused by the fact
    that the light of sun, moon, and stars can no longer reach the location that is
    in focus, ► resulting in a state in which no one can readily see, and colors and
    shapes can no longer be distinguished; loved by the wicked only; ≈ associated
    with hardship, death, and lack of enlightenment
  glosses:
  - to grow dark
  - to be darkened
  forms:
  - vbqal-
  - vbhif-
  references:
  - JOB-003-009
  - JOB-018-006
  - PSA-139-012
  - ECC-012-002
  - ISA-005-030
  - ISA-013-010
  - EZK-030-018
  - MIC-003-006
- sense_id: 002595001002000
  domain: Dark
  definition: = causative process by which deities cause the light to gradually disappear,
    ◄ by making sure that the light of sun, moon, and stars can no longer reach the
    location that is in focus, ► resulting in a state in which no one can readily
    see, and colors and shapes can no longer be distinguished; loved by the wicked
    only; ≈ associated with hardship
  glosses:
  - to bring darkness
  - to make dark
  - to darken
  forms:
  - vbhif-
  references:
  - PSA-105-028
  - JER-013-016
  - AMO-005-008
  - AMO-008-009
- sense_id: 002595001003000
  domain: Color
  definition: = state in which objects are or appear to be of a dark color
  glosses:
  - to be dark
  - to be black
  forms:
  - vbqal-
  references:
  - EXO-010-015
  - LAM-004-008
- sense_id: 002595001004000
  domain: See
  definition: 'literally: eyes are darkened; hence: = state in which the human eye
    can no longer see very well'
  glosses:
  - to grow dim
  forms:
  - vbqal-
  references:
  - PSA-069-024
  - ECC-012-003
  - LAM-005-017
- sense_id: 002595001005000
  domain: Foolish
  definition: = causative action by which humans cause an event to appear void of
    wisdom or understanding
  glosses:
  - to obscure
  forms:
  - vbhif-
  references:
  - JOB-038-002
