  - bitumen pit
  references:
  - GEN-014-010
  - GEN-014-010
- sense_id: 000815001003000
  domain: Landforms
  definition: = naturally occurring depression, hole or pit, usually containing a
    substance in liquid form; ≈ a metaphor for death, based on the physical resemblance
    of a pit to a grave, on the danger of falling into a pit, or being drowned by
    water in it, and on the depth of a pit recalling the underworld place of the dead
  glosses:
  - pit
  references:
  - PSA-055-024
  - PSA-069-016
  - PRO-023-027
