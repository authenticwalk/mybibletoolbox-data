senses:
- sense_id: 000815001001000
  domain: Waterbodies
  definition: = hole in the ground that reaches underground water; ◄  usually manmade,
    dug out of the ground, or hewn from rock, but may also be naturally-occurring;
    ► used for accessing, collecting and storing water; used by shepherds as a source
    of water for their animals; ≈ regarded  as a source of life because of its water;
    sometimes used as a metaphor for a woman, possibly based on the physical resemblance
    of the well to the vagina and its connotation as a source of life
  glosses:
  - well
  - watering place
  - spring
