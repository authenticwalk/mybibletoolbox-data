senses:
- sense_id: 001978001001000
  domain: Pure
  definition: = state in which an object is without any outward form of physical contamination
  glosses:
  - to be clean
  - to be pure
  forms:
  - vbqal-
  references:
  - JOB-025-005
  - LAM-004-007
- sense_id: 001978001002000
  domain: Innocent
  definition: 'literally: to be clean; hence: = state in which people are considered
    to be without any moral contamination and therefore trustworthy'
  glosses:
  - pure
  forms:
  - vbqal-
  references:
  - JOB-015-015
- sense_id: 001978001003000
  domain: Pure
  definition: = causative action by which people remove all physical contamination
    from their hands, whether with the help of soap or not; ≈  used metaphorically
    to denote a change of behavior for the good
  glosses:
  - to cleanse
  forms:
  - vbhif-
  references:
  - JOB-009-030
