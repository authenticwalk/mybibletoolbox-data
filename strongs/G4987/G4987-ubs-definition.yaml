strongs_number: G4987
lemma: σωρεύω
source: UBS/SDGNT
license: CC-BY-SA 4.0
senses:
- sense_id: 004891001001000
  louw_nida_code: '25.199'
  domain: Attitudes and Emotions
  definition: '(an idiom, literally: to heap coals of fire on the head, but the historical
    background of this idiom is not known, and hence to some extent the meaning is
    uncertain) to treat someone in such a positive manner as to cause that person
    to be ashamed or embarrassed'
  glosses:
  - to cause to be ashamed
  - to make ashamed
  references:
  - ROM-012-020
- sense_id: 004891001002000
  louw_nida_code: '68.76'
  domain: Aspect
  definition: (a figurative extension of meaning of {L:σωρεύω<SDBG:σωρεύω:000000>}
    ‘to heap up’; see {D:25.199}) to be engaged intensively and extensively in some
    activity
  glosses:
  - to be given over to doing
  - to be fully engaged in
  forms:
  - σωρεύομαι
  references:
  - 2TI-003-006
related_lemmas:
- word: ἐπισωρεύω
