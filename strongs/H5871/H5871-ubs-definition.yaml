strongs_number: H5871
lemma: עַיִן
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 005388001001000
  domain: Creatures
  definition: = one of two parts of the body of humans and animals that is used to
    see things, after which the observed information is stored and processed in the
    mind; sparkling when the body is healthy and strong, but dim when weak or sick;
    the eyes also play a significant role in determining whether a person is considered
    beautiful or not; eyes can reflect both an attitude of compassion and a sentiment
    of malice; ≈ high eyes are associated with pride, whereas lowly eyes are connected
    with humility; a good eye is associated with generosity, whereas an evil eye denotes
    stinginess; winking the eye is associated with underhanded practices
  glosses:
  - eye
