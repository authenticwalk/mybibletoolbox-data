senses:
- sense_id: 005380001001000
  louw_nida_code: '1.77'
  domain: Geographical Objects and Features
  definition: a stream or river which flows only during the rainy season (in Palestine
    this would be during the winter months) or when melting snow from the mountains
    provides running water for a relatively short period of time
  glosses:
  - brook
  - winter stream
  - rainy-season stream
  references:
  - JHN-018-001
- sense_id: 005380001002000
  louw_nida_code: '1.52'
  domain: Geographical Objects and Features
  definition: a ravine or narrow valley in which a stream flows during the rainy season,
    but which is normally dry during the dry season
  glosses:
  - ravine
  - wadi
  references:
  - JHN-018-001
