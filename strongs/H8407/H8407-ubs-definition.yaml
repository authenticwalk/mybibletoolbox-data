senses:
- sense_id: '007713001001000'
  domain: Names of People
  definition: = man, also known as {L:Pul<SDBH:פּוּל>}, to be identified with Tiglath-Pileser
    III; ► king of {L:Assyria<SDBH:אַשּׁוּר>}, contemporary of {L:Ahaz<SDBH:אָחָז>}
    king of {L:Judah<SDBH:יְהוּדָה>}, who exiled part of the northern kingdom of {L:Israel<SDBH:יִשְׂרָאֵל>}
    during the reign of king {L:Pekah<SDBH:פֶּקַח>}
  glosses:
  - Tiglath-Pileser
  references:
