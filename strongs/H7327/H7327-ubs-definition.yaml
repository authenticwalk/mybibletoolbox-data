  domain: Names of People
  definition: = woman; ◄ from {L:Moab<SDBH:מֹואָב>}; ► wife of {L:Mahlon<SDBH:מַחְלֹון>},
    son of {L:Elimelech<SDBH:אֱלִימֶלֶךְ>}, after the death of {L:Mahlon<SDBH:מַחְלֹון>}
    she married {L:Boaz<SDBH:בֹּעַז>} and so became the mother of {L:Obed<SDBH:עֹובֵד>}
    and the great-grandmother of {L:David<SDBH:דָּוִד>}
