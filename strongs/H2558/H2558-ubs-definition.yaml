senses:
- sense_id: '002361001001000'
  domain: Liquids
  definition: = sour alcoholic liquid; ◄ by-product of {L:grape wine<SDBH:יַיִן>}
    and {L:date-wine<SDBH:שֵׁכָר>}, due to acetous fermentation when it has been in
    contact with open air longer than necessary; ► used in diluted form as dip for
    bread, but to be avoided by Nazirites because of the alcohol; very unpleasant
    when it comes in contact with (bad) teeth and open wounds
  glosses:
  - sour wine
  - vinegar
