strongs_number: H1396
lemma: גבר
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 001284001001000
  domain: Strong
  definition: = process by which humans gain strength, power, and authority, which
    enables them to do things that others are unable to accomplish
  glosses:
  - to become powerful
  - to grow mighty
  - to prevail
  forms:
  - vbqal-
  references:
  - EXO-017-011
  - EXO-017-011
  - 1SA-002-009
  - 2SA-001-023
  - 2SA-011-023
  - 1CH-005-002
  - JOB-021-007
  - PSA-012-005
  - JER-009-002
  - LAM-001-016
- sense_id: 001284001002000
  domain: Strong
  definition: 'literally: to make great (one''s) strength; hence: = action by which
    humans summon all their strength in order to be able to perform a certain event'
  glosses:
  - to exert strength
  forms:
  - vbpiel
  references:
  - ECC-010-010
- sense_id: 001284001003000
  domain: Strong
  definition: = causative action by which a deity gives humans strength and power,
    probably both physically and mentally
  glosses:
  - to make strong
  forms:
  - vbpiel
  references:
  - ZEC-010-006
  - ZEC-010-012
- sense_id: 001284001004000
  domain: Confident
  definition: 'literally: to make oneself strong; hence: = action by which humans
    or deities present themselves with boldness to other humans and deities, ≈ which
    may be good or bad depending on whether this boldness is justified'
  glosses:
  - to make oneself strong
  - to defy
  forms:
  - vbhit-
  references:
  - JOB-015-025
  - JOB-036-009
  - ISA-042-013
- sense_id: 001284001005000
  domain: Quantity
  definition: = process by which objects greatly increase in volume and quantity,
    to the extent that they appear to gain control over everything else
  glosses:
  - to prevail > to increase
  forms:
  - vbqal-
  references:
  - GEN-007-018
  - GEN-007-019
  - GEN-007-020
  - GEN-007-024
- sense_id: 001284001006000
  domain: Intense
  definition: = process by which conditions greatly increase in intensity, to the
    extent that they appear to gain control over everything else, ≈ which can be either
    good or bad, depending on the condition
  glosses:
  - to be great
  - to surpass
  - to overwhelm
  forms:
  - vbqal-
  references:
  - GEN-049-026
  - PSA-065-004
  - PSA-103-011
  - PSA-117-002
- sense_id: 001284001007000
  domain: Intense
  definition: 'literally: to make strong a covenant; hence: = causative action by
    which humans make a solemn and powerful {L:agreement<SDBH:בְּרִית>} with another
    party'
  glosses:
  - to make a firm covenant
  forms:
  - vbhif-
  references:
  - DAN-009-027
related_lemmas:
- word: גִּבֹּור
- word: גְּבוּרָה
- word: גְּבִירָה
- word: גְּבֶרֶת
