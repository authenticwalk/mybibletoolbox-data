senses:
- sense_id: 002969001001000
  louw_nida_code: '4.35'
  domain: Animals
  definition: relatively small light brown domestic animal, feeding on anything from
    household refuse to animal carcasses and excreta; Canis familiaris putiatini;
    associated with all sorts of uncleanness, aggression, greediness, low status (diminutive
    of {L:κύων<SDBG:κύων:000000>}[a] dog, {D:4.34}, but in the NT the diminutive force
    may have become lost, though a component of emotive attachment or affection is
    no doubt retained and thus the reference is presumably to a house dog)
  glosses:
  - house dog
  - little dog
