strongs_number: H4029
lemma: מִגְדַּל־עֵדֶר
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 003689001001000
  domain: Names of Landforms
  definition: = location, possibly a somewhat elevated place from which one could
    overlook a relatively large area of land; ◄ located near {L:Jerusalem<SDBH:יְרוּשָׁלַ͏ִם>}
    and {L:Bethlehem<SDBH:בֵּית לֶחֶם>}
  glosses:
  - Migdal-Eder
  references:
  - GEN-035-021
- sense_id: 003689001002000
  domain: Names of Locations
  definition: = a reference to the town of {L:Jerusalem<SDBH:יְרוּשָׁלַ͏ִם>} as the
    place from where {L:Judah<SDBH:יְהוּדָה>} (= "the flock") was ruled
  glosses:
  - Migdal-Eder
  - Tower of the Flock
  references:
  - MIC-004-008
