strongs_number: G3179
lemma: μεθίστημι
source: UBS/SDGNT
license: CC-BY-SA 4.0
senses:
- sense_id: 003198001001000
  louw_nida_code: '15.9'
  domain: Linear Movement
  definition: to cause something to be moved from one place to another
  glosses:
  - to cause to move
  - to remove
  references:
  - ACT-013-022
  - 1CO-013-002
- sense_id: 003198001002000
  louw_nida_code: '13.64'
  domain: Be, Become, Exist, Happen
  definition: to cause a change of state, with emphasis upon the difference in the
    resulting state{N:001}
  glosses:
  - to change to
  - to turn into
  - to cause to be different from
  - to transform
  references:
  - LUK-016-004
  - COL-001-013
- sense_id: 003198001003000
  louw_nida_code: '31.73'
  domain: Hold a View, Believe, Trust
  definition: (a figurative extension of meaning of {L:μεθίστημι<SDBG:μεθίστημι:000000>}[a]
    ‘to cause to move,’ {D:15.9}) to cause a complete change in someone’s beliefs,
    normally in the unfavorable sense of causing someone to turn away from a previous
    belief and hence to be misled
  glosses:
  - to turn away
  - to mislead
  references:
  - ACT-019-026
- sense_id: 003198001004000
  louw_nida_code: '68.38'
  domain: Aspect
  definition: to cease from a state or function, with the implication of transfer
    or removal
  glosses:
  - to cease
  forms:
  - μεθίσταμαι
  references:
  - LUK-016-004
