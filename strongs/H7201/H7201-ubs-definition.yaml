- sense_id: '006634001001000'
  domain: Birds
  definition: = bird of prey, dark brown with a greyish head and a long V-shaped tail,
    flies relatively low and slowly; feeds on insects, frogs, lizards, and food scraps
    from human dwellings, and scavenge dead fish or other dead animals; ► unclean
    and therefore not to be eaten
  glosses:
  - black kite
