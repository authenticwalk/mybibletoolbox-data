lemma: צְבִיָּה
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '006110001001000'
  domain: Wild Animals
  definition: = small to medium sized plain antelope, inhabiting savannah plains and
    semideserts, reddish brown in color with almost white underparts, and small horns
    (with exception of female impala); long-legged, graceful, and an expert jumper;
    lives in small herds; the female is sexually active at one year; high rate of
    reproduction; ◄ |iGazella dorcas|i* or |iGazella arabica|i*; ► clean and can therefore
    be eaten; ≈ associated with speed, grace, beauty, female sexuality, male virility,
    and fertility
  glosses:
  - gazelle
  references:
  - SNG-004-005
  - SNG-007-004
related_lemmas:
- word: צְבָאָה
- word: צְבִי
