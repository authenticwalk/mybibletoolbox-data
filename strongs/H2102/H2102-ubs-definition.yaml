senses:
- sense_id: 001958001001000
  domain: Cooked
  definition: = process by which a food substance is caused to be cooked; ◄ by heating
    it in a pan with water for a prolonged time ► in order to make it ready, or more
    palatable, for human consumption
  glosses:
  - to boil
  - to cook
  forms:
  - vbhif-
  references:
  - GEN-025-029
- sense_id: 001958001002000
  domain: Unwilling
  definition: = process by which someone fails to see the limits of what is permitted
    or appropriate in view of one's status, and act accordingly, described as an inner
    boiling that eventually gives rise to action; ≈ often associated with sin, disobedience,
    aggression, and rebellion against God
  glosses:
  - to act presumptuously
  - to presume
  - to defy
  - to scheme (against someone)
  forms:
  - vbqal-
  - vbhif-
  references:
  - EXO-018-011
  - EXO-021-014
