strongs: H7200
lemma: רָאָה
transliteration: ra'ah
pos: verb
occurrences: 1299

senses:
  - gloss: to see
    definition: To perceive with the eyes, observe, or look at something.
    frequency: primary
    example: "Gen 1:4"
  - gloss: to understand, perceive
    definition: To grasp mentally or discern the significance of something.
    frequency: secondary
    example: "Gen 16:13"
  - gloss: to appear
    definition: In niphal, to be seen or to make oneself visible (of God appearing to people).
    frequency: secondary
    example: "Gen 12:7"
  - gloss: to provide
    definition: To see to a matter, hence to provide or make provision.
    frequency: tertiary
    example: "Gen 22:8"

etymology: A primitive root; one of the most common Hebrew verbs.
word_family:
  - H4758 # mar'eh (appearance, vision)
  - H7203 # ro'eh (seer, prophet)
  - H7210 # ro'i (seeing)

semantic_range: From physical sight to mental perception, divine revelation, prophetic vision, and providential care.
translation_issue: The niphal form ("appeared") is theologically significant for theophanies; context determines if physical or spiritual sight.
major_translations:
  KJV: see, look, behold, appear
  NIV: see, look, appear, show
  ESV: see, look, appear, provide

key_verses:
  - "Gen 1:4"
  - "Gen 12:7"
  - "Gen 22:14"
  - "Exod 3:2"
  - "Isa 6:1"
theological_weight: 9
doctrines_connected:
  - Theophany (God appearing)
  - Divine providence (Jehovah Jireh)
  - Prophetic vision
  - Revelation

book_distribution: "Genesis (120x), Exodus (80x), Numbers (70x), Judges (60x), Samuel (100x)"

nuggets:
  - Forms the basis of the name "Jehovah Jireh" (The LORD will provide/see) in Gen 22:14.
  - The title "seer" (ro'eh) for prophets comes from this root, emphasizing prophetic insight.
