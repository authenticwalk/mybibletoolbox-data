senses:
- sense_id: 007687001001000
  domain: Trees
  definition: '= a tree that reaches a height of 5-8 m, with a round crown and very
    deep roots; its fruit is about the size of a hen’s egg and can be green, yellow,
    purple, or brown depending on the type; ◄ Ficus carica; ► the fruits are sweet
    and soft; ≈ the image of peace and happiness in Israel was: “every man under his
    vine and under his fig tree"'
