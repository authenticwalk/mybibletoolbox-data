strongs_number: H0024
lemma: אָבִיב
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '000024001001000'
  domain: Plants
  definition: = uppermost part ◄ of a grain plant, ► which contains the seeds
  glosses:
  - ear
  references:
  - LEV-002-014
- sense_id: '000024001002000'
  domain: Stage
  definition: = grain plant that has reached the final stage of its growth, which
    means that the ear containing the seeds has formed; this also implies that the
    plant is more vulnerable to weather conditions, such as hail
  glosses:
  - plant in the ear
  references:
  - EXO-009-031
- sense_id: '000024002001000'
  domain: Names of Times
  definition: = month, equivalent to period March/April, ► which was the month when
    the ears were formed in the new grain; pre-exilic
  glosses:
  - Abib
  references:
  - EXO-013-004
  - EXO-023-015
  - EXO-034-018
  - EXO-034-018
  - DEU-016-001
  - DEU-016-001
