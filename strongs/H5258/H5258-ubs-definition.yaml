senses:
- sense_id: 004824001001000
  domain: Flow
  definition: = causative action by which humans pour out a liquid, ≈ exclusively
    used for libations
  glosses:
  - to pour out
  forms:
  - vbqal- vH
  references:
  - GEN-035-014
  - EXO-025-029
  - EXO-030-009
  - EXO-037-016
  - NUM-028-007
  - 2SA-023-016
  - 2KI-016-013
  - 1CH-011-018
  - PSA-016-004
  - JER-007-018
  - JER-019-013
  - JER-032-029
  - JER-044-017
  - JER-044-018
  - JER-044-019
  - JER-044-019
  - JER-044-025
  - EZK-020-028
  - HOS-009-004
- sense_id: 004824001002000
  domain: Asleep
  definition: 'literally: to pour out a spirit of deep sleep; hence: = causative action
    by which deities use their power to bring a state of deep sleep over humans, ≈
    here used figuratively to denote a lack of prophetic vision'
  glosses:
  - to pour out a spirit of deep sleep (over someone)
  forms:
  - vbqal-
  references:
  - ISA-029-010
- sense_id: 004824001003000
  domain: Associate
  definition: 'literally: to pour out a treaty; hence, possibly: = action by which
    two parties establish a union or association for mutual benefit, accompanied by
    a libation to a deity'
  glosses:
  - to make a treaty
  forms:
  - vbqal-
  references:
  - ISA-030-001
- sense_id: 004824001004000
  domain: Exist
  definition: 'literally: to pour out; hence: = causative action by which humans pour
    molten metal into a mold ► to create a physical likeness or representation of
    a person, animal, or thing to be used as an object of non-sanctioned worship'
  glosses:
  - to cast
  forms:
  - vbqal-
  references:
  - ISA-040-019
  - ISA-044-010
- sense_id: 004824001005000
  domain: Exist
  definition: 'literally: to pour out; hence: = causative action by which a deity
    creates something that did not exist before, ◄ as if by pouring out a substance
    in a mold'
  glosses:
  - to be fashioned
  forms:
  - vbnif-
  references:
  - PRO-008-023
- sense_id: 004824001006000
  domain: Role
  definition: 'literally: to pour our (a libation); hence: = causative action by which
    deities cause humans to be appointed in a position of authority, usually accompanied
    by rituals including a libation'
  glosses:
  - to install
  forms:
  - vbqal-
  references:
  - PSA-002-006
- sense_id: 004824001007000
  domain: Sacrifice
  definition: = action by which humans make an offering to a deity or someone considered
    to have divine qualities
  glosses:
  - to sacrifice
  - to offer
  forms:
  - vbpael
  references:
  - DAN-002-046
- sense_id: 004824002001000
  definition: read {L:סכך<SDBH:סכך>}
  glosses:
  - to be covered
  references:
  - ISA-025-007
