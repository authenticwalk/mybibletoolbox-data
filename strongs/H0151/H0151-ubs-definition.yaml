- sense_id: '000151001001000'
  domain: Names of People
  definition: = man, also called {L:Adoniram<SDBH:אֲדֹנִירָם>} and {L:Hadoram<SDBH:הֲדֹורָם>};
    ◄ son of {L:Abda<SDBH:עַבְדָּא>}; ► official; time of kings {L:David<SDBH:דָּוִד>},
    {L:Solomon<SDBH:שְׁלֹמֹה>}, and {L:Rehoboam<SDBH:רְחַבְעָם>}; stoned by people
    when they rebelled against Rehoboam
