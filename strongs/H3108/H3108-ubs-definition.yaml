    a {L:Moabite<SDBH:מֹואָבִי>} woman; ► he was a servant of {L:Joash<SDBH:יֹואָשׁ>},
    king of {L:Judah<SDBH:יְהוּדָה>}, who murdered his master with the help of {L:Jozabad<SDBH:יֹוזָבָד>}/{L:Zabad<SDBH:זָבָד>},
    son of {L:Shimeath<SDBH:שִׁמְעָת>}; both were later killed by {L:Joash<SDBH:יֹואָשׁ>}'
    successor {L:Amaziah<SDBH:אֲמַצְיָהוּ>}
  glosses:
