senses:
- sense_id: 002824001001000
  domain: Names of People
  definition: = man, also known as {L:Zabad<SDBH:זָבָד>}; ► son of {L:Shimeath<SDBH:שִׁמְעָת>},
    an {L:Ammonite<SDBH:עַמֹּונִי>} woman; ► he was a servant of {L:Joash<SDBH:יֹואָשׁ>},
    king of {L:Judah<SDBH:יְהוּדָה>}, who murdered his master with the help of {L:Jehozabad<SDBH:יְהֹוזָבָד>},
    son of {L:Shimrith<SDBH:שִׁמְרִית>}; both were later killed by {L:Joash<SDBH:יֹואָשׁ>}'
    successor {L:Amaziah<SDBH:אֲמַצְיָהוּ>}
  glosses:
  - Jozabad
  references:
  - 2KI-012-022
- sense_id: 002824001002000
