strongs: G1437
lemma: ἐάν
transliteration: ean
pos: conj
occurrences: 288

senses:
  - gloss: if
    definition: Conditional particle with subjunctive mood indicating possibility.
    frequency: primary
    example: "Matt 4:9"
  - gloss: whenever
    definition: Introducing a temporal condition.
    frequency: secondary
    example: "Mark 3:11"

etymology: From G1487 (ei, if) + G0302 (an, conditional particle).
word_family:
  - G1487 # ei (if)
  - G0302 # an (conditional particle)

semantic_range: Condition (if), indefinite temporal clause (whenever), or uncertain eventuality.
translation_issue: Used with subjunctive for third class conditionals (uncertain but possible); distinguished from ei (first class, assumed true).
major_translations:
  KJV: if, though
  NIV: if, when
  ESV: if, when

key_verses:
  - "Matt 4:9"
  - "Matt 18:3"
  - "John 3:3"
  - "1 John 1:9"
theological_weight: 5
doctrines_connected:
  - Conditional promises
  - Third class conditional sentences

book_distribution: "John (50x), Matthew (50x), 1 John (25x), Mark (20x), Luke (25x)"

nuggets:
  - "If we confess our sins" (1 John 1:9) uses ean, indicating the condition is possible and expected.
  - Jesus' conditional promises often use this construction.
