  domain: Curse
  definition: = causative action by which humans or deities consign humans to death,
    usually by invoking the name of a deity if the agent is human; ◄ this is done
    as punishment, out of contempt, fear, anger, or hostility, or because one was
    paid to do so; ► the effectiveness of a curse partially depends on the authority
    of the one pronouncing it
