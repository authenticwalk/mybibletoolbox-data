senses:
- sense_id: 004860001001000
  domain: Blow
  definition: = causative action by which humans or deities cause air to flow from
    their nose or mouth upon an object
  glosses:
  - to blow
  - to breathe
  forms:
  - vbqal-
  - vbpual (passive)
  references:
  - GEN-002-007
  - JOB-020-026
  - ISA-054-016
  - EZK-022-020
  - EZK-022-021
  - EZK-037-009
  - HAG-001-009
- sense_id: 004860001002000
  domain: Dead
  definition: 'literally: to blow (one''s) self; hence: = process by which humans
    breathe their last breath and pass away'
  glosses:
  - to breathe (one's) last
  forms:
  - vbqal-
  references:
  - JER-015-009
- sense_id: 004860001003000
  domain: Dead
  definition: 'literally: to cause to blow (someone''s) life; hence: = causative process
    by which humans cause other humans to breathe their last breath and pass away'
  glosses:
  - to cause to breathe (one's) last
  forms:
  - vbhif-
  references:
  - JOB-031-039
- sense_id: 004860001004000
  domain: Despise
  definition: 'exact meaning unknown; probably: = action by which humans give expression
    to an emotion of contempt by releasing a little bit of air through the nose'
  glosses:
  - to snort
  - to sniff
  forms:
  - vbhif-
  references:
  - MAL-001-013
- sense_id: 004860001005000
  domain: Hot
  definition: = process by which a container containing a boiling substance releases
    its steam
  glosses:
  - to steam
  forms:
  - vbqal-ptcp
  references:
  - JOB-041-012
  - JER-001-013
related_lemmas:
