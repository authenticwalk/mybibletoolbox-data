strongs_number: H1361
lemma: גבהּ
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '001252001001000'
  domain: High
  definition: = state in which a person or object is of great or more than average
    height; ≈ associated with status
  glosses:
  - to be tall
  - to be high
  forms:
  - vbqal-
  references:
  - 1SA-010-023
  - EZK-019-011
  - EZK-031-005
  - EZK-031-010
  - EZK-031-014
- sense_id: '001252001002000'
  domain: High
  definition: = state in which a human being or deity causes an object to be of great
    or more than average height
  glosses:
  - to make high
  - to make tall
  forms:
  - vbhif-
  references:
  - 2CH-033-014
  - PRO-017-019
  - EZK-017-024
- sense_id: '001252001003000'
  domain: High
  definition: = state in which an object is located high up in the air and out of
    human reach; ≈ sometimes used as a metaphor to describe things that are beyond
    human understanding
  glosses:
  - to be high above
  forms:
  - vbqal-
  references:
  - JOB-035-005
  - PSA-103-011
  - ISA-055-009
  - ISA-055-009
- sense_id: '001252001004000'
  domain: High
  definition: = causative action by which an object is created in a location high
    up in the air and out of human reach
  glosses:
  - to cause to be high above
  forms:
  - vbhif-
  references:
  - JER-049-016
  - OBA-001-004
- sense_id: '001252001005000'
  domain: High
  definition: = state or process by which a certain activity takes place in a location
    high up in the air
  glosses:
  - on high
  forms:
  - vbhif-
  references:
  - JOB-005-007
  - JOB-039-027
  - PSA-113-005
  - ISA-007-011
- sense_id: '001252001006000'
  domain: Great
  definition: 'literally: (one''s) heart is high; hence: = state in which humans have
    positive thoughts about themselves and their abilities, ≈ which can be either
    good or bad, depending on whether these thoughts are justified'
  glosses:
  - to be high of heart > to have an elevated mind
  forms:
  - vbqal-
  references:
  - 2CH-017-006
  - 2CH-026-016
  - 2CH-032-025
  - PSA-131-001
  - PRO-018-012
  - EZK-028-002
  - EZK-028-005
  - EZK-028-017
- sense_id: '001252001007000'
  domain: Great
  definition: = state in which humans or deities have an elevated status, either in
    their own eyes or in the eyes of other people, ≈ which can either be good or bad,
    depending on whether this status is justified
  glosses:
  - to be exalted
  - to be proud
  - to be haughty
  - to be arrogant
  forms:
  - vbqal-
  references:
  - JOB-036-007
  - ISA-003-016
  - ISA-005-016
  - ISA-052-013
  - JER-013-015
  - EZK-016-050
  - ZEP-003-011
- sense_id: 001252001008000
  domain: Great
  definition: = causative action by which humans are given an elevated status in the
    eyes of other people, ≈ which is regarded as a good thing
  glosses:
  - to exalt
  forms:
  - vbhif-
  references:
  - EZK-021-031
related_lemmas:
- word: גָּבֹהַּ
- word: גֹּבַהּ
- word: גַּבְהוּת
