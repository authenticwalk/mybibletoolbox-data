- sense_id: '000724001001000'
  domain: Fire
  definition: = state of burning, in which substances combine chemically with oxygen
    from the air and give out bright light, heat, and smoke; ► used for cooking, melting,
    cleansing, heating, and destroying; ≈ many aspects of life are compared with fire,
    such as anger, jealousy, aggression, wickedness, words, life, certain sicknesses,
    suffering, etc.
