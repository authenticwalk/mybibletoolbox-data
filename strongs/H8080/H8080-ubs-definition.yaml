senses:
- sense_id: 007469001001000
  domain: Fat
  definition: 'literally: to be fat; hence: = state in which humans or animals look
    healthy and strong ◄ as a result of an abundance of food; ≈ it is important to
    note that fatness is usually regarded as a good quality in the OT, even though
    the causes and consequences are not necessarily considered positive; sometimes,
    however, fatness is associated with dullness and unresponsiveness'
  glosses:
  - to be well-fed
  forms:
  - vbqal-
  - vbhif-
  references:
  - DEU-032-015
  - DEU-032-015
  - NEH-009-025
  - JER-005-028
- sense_id: 007469001002000
  domain: Foolish
  definition: 'literally: to cause (someone else''s) heart to be fat; hence: = causative
    action by which humans cause the mind of other humans to be dull and unresponsive'
  glosses:
  - to make (someone's) heart fat > to make (someone's) mind dull and unresponsive
  forms:
  - vbhif-
  references:
  - ISA-006-010
