senses:
- sense_id: '000101001001000'
  domain: Plants
  definition: = plant with flexible stems, growing in rivers and marshes; ◄ |iScirpus|i*;
    ► produces much smoke when burning and used for making ropes; ≈ associated with
    humility
  glosses:
  - rush
  - bulrush
  references:
  - JOB-041-012
  - ISA-058-005
- sense_id: '000101001002000'
  domain: Classes
  definition: 'literally: palm branch and reed; hence: = people of all layers in the
    society, including those belonging to the nobility (i.e. the palm branch) and
    those that are part of the lower classes (i.e. the reed)'
  glosses:
  - palm branch and reed
  - everyone, whether great or small
  references:
  - ISA-009-013
  - ISA-019-015
- sense_id: '000101001003000'
  domain: Cords
  definition: = a fairly thick cord formed by twisting or braiding several strands
    together; ◄ probably made out of rush fibers; ► used by hunters
  glosses:
  - rope
  references:
  - JOB-040-026
