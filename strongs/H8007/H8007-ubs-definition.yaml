senses:
- sense_id: '007044001001000'
  domain: Names of People
  definition: = man, also known as {L:Salmah<SDBH:שַׂלְמָה>} and {L:Salmon<SDBH:שַׂלְמֹון>};
    ◄ son of {L:Nahshon<SDBH:נַחְשֹׁון>}; tribe of {L:Judah<SDBH:יְהוּדָה>}; ► father
    of {L:Boaz<SDBH:בֹּעַז>} and ancestor of {L:David<SDBH:דָּוִד>}
  glosses:
  - Salma
  - Salmah
  - Salmon
  references:
  - 1CH-002-011
  - 1CH-002-011
- sense_id: '007044001002000'
  domain: Names of People
  definition: = man; ◄ descendant of {L:Caleb<SDBH:כָּלֵב>}; tribe of {L:Judah<SDBH:יְהוּדָה>};
    ► founder of {L:Bethlehem<SDBH:בֵּית־לֶחֶם>}
  glosses:
  - Salma
  references:
  - 1CH-002-051
  - 1CH-002-054
