senses:
- sense_id: 000182001001000
  domain: Names of People
  definition: = man; ◄ son of {L:Joktan<SDBH:יָקְטָן>}; descendant of {L:Shem<SDBH:שֵׁם>};
    ► possibly regarded as founder of a nation with the same name
  glosses:
  - Uzal
  references:
  - GEN-010-027
  - 1CH-001-021
- sense_id: 000182001002000
  domain: Names of Locations
  definition: = nation or area; ◄ either to be considered founded by a person with
    the same name and located somewhere on the Arabian peninsula, or to be identified
    with Izalla in northeastern Mesopotamia; ► trading partner of {L:Tyre<SDBH:צֹר>}
    ({A:ABD})
  glosses:
  - Uzal
  references:
  - EZK-027-019
