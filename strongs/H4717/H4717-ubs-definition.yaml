- sense_id: '004317001001000'
  domain: Tools
  definition: = instrument of about 30 centimeters long, consisting of a handle, usually
    made of wood, to which was attached a stone, wooden, or (less frequently) metal
    head; ► used for many purposes, including the breaking or dressing of building
    stones, pounding nails or pegs into wood, or pounding pegs into the ground; also
    used by blacksmiths to shape hot metal
  glosses:
  - hammer
