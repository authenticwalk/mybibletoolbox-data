  - PSA-119-025
  - PSA-137-006
  - JER-013-011
  - LAM-004-004
- sense_id: '001552001003000'
  domain: Attach
  definition: = causative action by which someone causes something else to be positioned
    around or against another object in such a way that the two cannot be separated
    easily
  glosses:
  - to cause to cling
  - to cause to cleave
  - to cause to stick
  forms:
  - vbhif-
  references:
  - EZK-003-026
  - EZK-029-004
  - EZK-029-004
- sense_id: '001552001004000'
  domain: Happen
  definition: 'literally: to cling to someone; hence: = to happen to someone ◄ as
    if the event has physically attached itself to the one undergoing it; ≈ only used
    for negative events'
  glosses:
  - to cling
  - to cleave
  - to overtake
  forms:
  - vbqal-
  references:
  - GEN-019-019
  - DEU-028-060
  - 2KI-005-027
  - JER-042-016
- sense_id: '001552001005000'
  domain: Happen
  definition: 'literally: to cause to cling to someone; hence: = causative action
    by which someone causes something to happen to someone else ◄ as if the event
    has been physically attached to the one undergoing it; ≈ only used for negative
    events'
  glosses:
  - to cause to cling
  - to cause to cleave to
  - to cause to overtake
  forms:
  - vbhif-
  references:
  - DEU-028-021
- sense_id: '001552001006000'
  domain: Associate
  definition: = action by which someone commits oneself to remain closely involved
