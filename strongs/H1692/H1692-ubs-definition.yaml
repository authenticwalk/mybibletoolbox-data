senses:
- sense_id: '001552001001000'
  domain: Attach
  definition: = state in which objects are closely compacted together
  glosses:
  - to stick together
  - to cling together
  forms:
  - vbpual
  references:
  - JOB-038-038
  - JOB-041-009
  - JOB-041-015
- sense_id: '001552001002000'
  domain: Attach
  definition: = state in which an object is positioned around or against another object
    in such a way that the two cannot be separated easily
  glosses:
  - to cling
  - to cleave
  - to stick
  - to freeze
  forms:
  - vbqal-
  - vbhof-
  references:
  - DEU-013-018
  - 2SA-023-010
  - JOB-019-020
  - JOB-029-010
  - JOB-031-007
  - PSA-022-016
