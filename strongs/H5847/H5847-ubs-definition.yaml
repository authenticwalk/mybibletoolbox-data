senses:
- sense_id: '005366001001000'
  domain: Birds
  definition: = mammal with a fur skin, and slender elongated forelegs and fingers
    that support a flap of skin joining its fingers to its toes, which functions as
    a wing and allows it to fly; they fly around at night and hang upside down from
    trees or overhanging rocks during the day; also found in caves, tombs, unoccupied
    houses, and old ruins; ◄ classified as a bird by ancient Israelites because of
    its ability to fly; ► unclean; ≈ associated with death, desolation, destruction,
    and witchcraft
  glosses:
  - bat
  references:
  - LEV-011-019
  - DEU-014-018
  - ISA-002-020
related_lemmas:
- word: עטף
