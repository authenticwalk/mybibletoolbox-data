senses:
- sense_id: '001446001001000'
  domain: Happen
  definition: = action by which humans act towards other humans or deities in a way
    that has consequences and can result either in retribution or a reward
  glosses:
  - actions
  - deeds
  references:
  - ISA-059-018
- sense_id: '001446001002000'
  domain: Chastise
  definition: = action by which humans or deities deal with other humans or deities
    according to their actions, which could be either by punishing them or by giving
    them a reward
  glosses:
  - retribution
  references:
  - 2SA-019-037
  - JER-051-056
related_lemmas:
- word: גמל
