strongs_number: H0427
lemma: אַלָּה
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 000395001001000
  domain: Trees
  definition: = tree, more commonly known as {L:אֵלָה<SDBH:אֵלָה>}, with a broad crown,
    heavy branches, and thick trunk; may reach a height of 7.5 to 9 m.; sheds its
    leaves; has small an inconspicuous flowers; ◄ pictacia terebinthus; ► its stem
    contains aromatic turpentine, a resinous juice, which flows out when the bark
    is cut; it provides pleasant shade; ≈ imposing tree, preferred place to sit under
    and enjoy the shade, associated with cultic worship
  glosses:
  - terebinth
  references:
  - JOS-024-026
