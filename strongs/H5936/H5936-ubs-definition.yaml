lemma: עֲלוּקָה
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '005447001001000'
  domain: Swarming Creatures
  definition: = a worm-like creature that lives in streams, swamps, or damp ground;
    its specialized mouth makes small cuts in the skin of its victims, which may be
    humans, animals, reptiles, or fish, after which it fastens itself firmly on to
    the surrounding skin and gorges itself on blood; ◄ Limnatis nilotica; ≈ associated
    with greed
  glosses:
  - Nile leech
  references:
  - PRO-030-015
