senses:
- sense_id: '006741001001000'
  domain: Large
  definition: = state in which an object is large in size
  glosses:
  - to be large
  - to be broad
  forms:
  - vbnif-
  references:
  - ISA-030-023
- sense_id: '006741001002000'
  domain: Large
  definition: = state in which one object has a relatively large distance from side
    to side compared to another, similar object
  glosses:
  - to become larger
  forms:
  - vbqal-
  references:
  - EZK-041-007
- sense_id: '006741001003000'
  domain: Large
  definition: = causative action by which humans or deities increase the size of an
    area or object
  glosses:
  - to enlarge
  - to make large
  forms:
  - vbhif-
  references:
  - EXO-034-024
  - DEU-012-020
  - DEU-019-008
  - DEU-033-020
  - ISA-030-033
  - ISA-054-002
  - ISA-057-008
  - AMO-001-013
  - MIC-001-016
- sense_id: '006741001004000'
  domain: Intense
  definition: 'literally: to make large one''s self; hence: = causative process by
    which humans act with intense greed'
  glosses:
  - to enlarge (one's) self > to be excessively greedy
  forms:
  - vbhif-
  references:
  - HAB-002-005
- sense_id: '006741001005000'
  domain: Rejoice
  definition: 'literally: (one''s) heart is open wide; hence: = state in which humans
    experience an abundance of joy'
  glosses:
  - (one's) heart is enlarged > to be full of joy
  forms:
  - vbqal-
  references:
  - ISA-060-005
- sense_id: '006741001006000'
  domain: Relief
  definition: 'literally: to enlarge (for someone); hence: = causative action by which
    humans or deities grant relief to (other) humans by alleviating difficult circumstances'
  glosses:
  - to enlarge > to ease (someone's circumstances)
  forms:
  - vbhif-
  references:
  - GEN-026-022
  - PSA-004-002
  - PRO-018-016
- sense_id: '006741001007000'
  domain: Relief
  definition: 'literally: to enlarge narrow things; hence: = causative action by which
    deities grant relief to humans by alleviating difficult circumstances

    '
  glosses:
  - to grant relief from troubles
  - to ease troubles
  forms:
  - vbhif-
  references:
  - PSA-025-017
- sense_id: 006741001008000
  domain: Stance
  definition: 'literally: to enlarge (one''s) gullet; = action by which a place prepares
    itself for a large group of people ◄ as if it were an animal that opens its mouth
    wide to swallow a large quantity of food'
  glosses:
  - to open wide (one's) gullet
  forms:
  - vbhif-
  references:
  - ISA-005-014
- sense_id: 006741001009000
  domain: Stance
  definition: = state in which humans have their mouth wide open
  glosses:
  - to be wide open
  forms:
  - vbqal-
  references:
  - 1SA-002-001
- sense_id: '006741001010000'
  domain: Stance
  definition: = action by which humans open their mouth widely in order to put out
    one's tongue, to be fed, or to shout
  glosses:
  - to open wide (one's) mouth
  forms:
  - vbhif-
  references:
  - PSA-035-021
  - PSA-081-011
  - ISA-057-004
- sense_id: '006741001011000'
  domain: Succeed
  definition: 'literally: to enlarge (someone''s) steps; hence: = causative action
    by which deities make humans successful in their undertakings'
  glosses:
  - to enlarge (someone's) steps > to clear the way (for someone)
  forms:
  - vbhif-
  references:
  - 2SA-022-037
  - PSA-018-037
- sense_id: '006741001012000'
  domain: Wise
  definition: 'literally: to enlarge (someone''s) heart; hence: = causative action
    by which deities grant wisdom and understanding to humans'
  glosses:
  - to enlarge (someone's heart) > to broaden (someone's) understanding
  forms:
  - vbhif-
  references:
  - PSA-119-032
