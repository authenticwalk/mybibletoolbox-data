strongs_number: H1696
lemma: דבר
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '001555001001000'
  domain: Non-Exist
  definition: = causative action by which someone exterminates a group of people,
    either directly or by the hands of someone else
  glosses:
  - to destroy
  - to get rid of
  - to do away with
  forms:
  - vbpiel
  references:
  - 2CH-022-010
- sense_id: '001555001002000'
  domain: Control
  definition: = action or process by which a nation gains control over someone else,
    usually involving violence
  glosses:
  - to subdue
  forms:
  - vbhif-
  references:
  - PSA-018-048
  - PSA-047-004
- sense_id: '001555002001000'
  domain: Speak
  definition: = action by which humans and deities utter words; this can happen within
    their minds and be inaudible to others, but in most cases the words are spoken
    out loud in order to communicate something to others; usually not directly followed
    by the actual words that are spoken
  glosses:
  - to speak
  - to mention
  - to tell
  forms:
  - vbqal-
  - vbpiel
  - vbpual (passive)
  references:
