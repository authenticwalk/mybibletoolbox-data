  louw_nida_code: '4.13'
  domain: Animals
  definition: 'refers to two members of the large cat family: Panthera pardus - leopard;
    about 2 m in length and yellowish brown with black spots arranged in rosettes
    all over the body and tail; hunts by stalking prey; and Acinonyx jubatus - cheetah;
    spotted but are slightly smaller and have longer legs than leopards; extremely
    fast; symbol of violent danger or of speed (cheetah)'
  glosses:
  - leopard
