- sense_id: '003513001001000'
  domain: Names of Locations
  definition: = location, possibly to be identified with {L:Laban<SDBH:לָבָן>} ◄ in
    {L:Sinai<SDBH:סִינַי>} peninsula, between {L:Rimmon-Perez<SDBH:רִמֹּון פֶּרֶץ>}
    and {L:Rissah<SDBH:רִסָּה>}; ► {L:Israelites<SDBH:יִשְׂרָאֵל>} encamped there
    on their way from {L:Egypt<SDBH:מִצְרַיִם>} to {L:Canaan<SDBH:כְּנַעַן>}
  glosses:
