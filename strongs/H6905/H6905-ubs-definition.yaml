senses:
- sense_id: '006354001001000'
  domain: Weapons
  definition: = a log or other long, heavy piece of wood covered on one end with metal;
    it was rammed by soldiers against the wall or gate of a city under siege; it sometimes
    had a point since the purpose of the ramming was to wedge a hole in the wall;
    others were blunt on the end; it could be held and swung by soldiers, or sometimes
    it was suspended by ropes from a moveable wooden tower.
  glosses:
  - battering-ram
  references:
  - EZK-026-009
- sense_id: '006354002001000'
  domain: Space
  definition: = relation linking an event to the location right in front of an object
  glosses:
  - before
  - in front of
  references:
  - 2KI-015-010
