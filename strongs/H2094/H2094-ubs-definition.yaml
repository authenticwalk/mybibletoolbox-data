senses:
- sense_id: 001938001001000
  domain: Shine
  definition: = process by which an object emits or reflects intense light; ≈ regarded
    as awesome
  glosses:
  - to shine
  - to be bright
  - to be brilliant
  forms:
  - vbhif-
  references:
  - DAN-012-003
- sense_id: 001938002001000
  domain: Know
  definition: = process by which someone becomes aware of something (usually bad)
    that is going to happen, or something one should do to prevent something (usually
    bad) from happening; usually refers to a mediator making known what God has said
    or implied; ≈ wise people take these things seriously whereas foolish people ignore
    them
  glosses:
  - to be warned
  - to take heed
  forms:
  - vbnif-
  references:
  - PSA-019-012
  - ECC-004-013
  - ECC-012-012
  - EZK-003-021
  - EZK-033-004
  - EZK-033-005
  - EZK-033-005
  - EZK-033-006
- sense_id: 001938002002000
  domain: Know
  definition: = action or process by which someone makes someone else aware of something
    bad that is going to happen, or something they should do to prevent something
    bad from happening; usually refers to a mediator making known what God has said
    or implied
  glosses:
  - to warn
  - to teach
  - to instruct
  - to advise
  - to alert
  - to dissuade
  forms:
  - vbhif-
