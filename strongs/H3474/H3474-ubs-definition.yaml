strongs_number: H3474
lemma: ישׁר
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 003184001001000
  domain: Shape
  definition: = causative action by which humans or deities cause objects to be without
    curve or bend and/or have an even or regular surface
  glosses:
  - to make straight
  - to make smooth
  - to make level
  - to make even
  forms:
  - vbpiel
  - vbpual
  references:
  - 1KI-006-035
  - ISA-040-003
  - ISA-045-002
  - ISA-045-002
- sense_id: 003184001002000
  domain: Move
  definition: = action by which animals move forward without deviating to the left
    or the right
  glosses:
  - to go straight ahead
  forms:
  - vbqal-
  references:
  - 1SA-006-012
- sense_id: 003184001003000
  domain: Move
  definition: 'literally: to make one''s way straight; = action by which humans move
    forward without deviating to the right or to the left; ≈ with the possible connotation
    of minding one''s own affairs'
  glosses:
  - to make straight one's way > to walk straight ahead
  forms:
  - vbpiel
  references:
  - PRO-009-015
- sense_id: 003184001004000
  domain: See
  definition: 'literally: to make straight one''s eyelids; = action by which humans
    look forward without being distracted by things visible on the left or on the
    right'
  glosses:
  - to look straight ahead
  forms:
  - vbhif-
  references:
  - PRO-004-025
- sense_id: 003184001005000
  domain: Right
  definition: 'literally: to make someone else''s way straight; = causative action
    by which deities cause the actions and endeavors of humans to be prosperous and
    successful'
  glosses:
  - to make straight (someone's) way
  forms:
  - vbpiel
  - vbhif-
  references:
  - PSA-005-009
  - PSA-005-009
  - PRO-003-006
  - PRO-011-005
  - ISA-045-013
- sense_id: 003184001006000
  domain: Right
  definition: 'literally: to make straight; = causative action by which humans cause
    an action to be performed in a morally and ethically acceptable way'
  glosses:
  - to make straight (an event) > to (perform an event) right
  forms:
  - vbpiel
  references:
  - PRO-015-021
- sense_id: 003184001007000
  domain: Flow
  definition: = causative action by which humans cause water to flow in a certain
    direction
  glosses:
  - to direct
  - to channel
  forms:
  - vbpiel
  references:
  - 2CH-032-030
- sense_id: 003184001008000
  domain: Innocent
  definition: = state in which humans are morally and ethically right
  glosses:
  - to be upright
  - to be just
  forms:
  - vbqal-
  references:
  - HAB-002-004
- sense_id: 003184001009000
  domain: Willing
  definition: 'literally: to be straight in the eyes of someone; hence: = state/process
    by which humans consider someone or something good'
  glosses:
  - to be straight in the eyes (of someone) > to be accepted
  - to be approved
  - to please
  forms:
  - vbqal-
  references:
  - NUM-023-027
  - JDG-014-003
  - JDG-014-007
  - 1SA-018-020
  - 1SA-018-026
  - 2SA-017-004
  - 1KI-009-012
  - 1CH-013-004
  - 2CH-030-004
  - JER-018-004
  - JER-027-005
- sense_id: 003184001010000
  domain: Willing
  definition: = state/process by which humans consider something morally and ethically
    right
  glosses:
  - to consider right
  - to approve
  forms:
  - vbpiel
  references:
  - PSA-119-128
related_lemmas:
- word: יָשָׁר
- word: יֹשֶׁר
- word: יִשְׁרָה
- word: מִישֹׁור
- word: מֵישָׁרִים
