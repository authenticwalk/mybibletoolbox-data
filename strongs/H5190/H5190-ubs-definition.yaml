strongs_number: H5190
lemma: נטל
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '004762001001000'
  domain: High
  definition: = causative action by which humans or forces take hold of objects and
    cause them to rise up from a certain location
  glosses:
  - to lift up
  forms:
  - vbqal-
  - vbpiel
  - vbpeil (passive)
  references:
  - ISA-040-015
  - ISA-063-009
  - DAN-007-004
- sense_id: '004762001002000'
  domain: Engage
  definition: 'literally: to lift up (and lay) on someone else; hence: = causative
    action by which deities cause humans to undergo a certain event'
  glosses:
  - to lay upon
  forms:
  - vbqal-
  references:
  - LAM-003-028
- sense_id: '004762001003000'
  domain: See
  definition: 'to lift up (one''s eyes); hence: = action by which humans direct their
    face or eyes away from the ground so that they can see what is in the distance
    or in the sky'
  glosses:
  - to look up
  forms:
  - vbpeal
  references:
  - DAN-004-031
- sense_id: '004762001004000'
  domain: Engage
  definition: 'literally: to lift up (over someone else); hence: = action by which
    a deity offers several options for humans to choose from'
  glosses:
  - to offer
  - to give options
  references:
  - 2SA-024-012
related_lemmas:
- word: נָטִיל
- word: נֵטֶל
