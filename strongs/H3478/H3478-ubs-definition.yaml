senses:
- sense_id: 003188001001000
  domain: Names of People
  definition: = man, also known as {L:Jacob<SDBH:יַעֲקֹב>} and {L:Jeshurun<SDBH:יְשֻׁרוּן>},
    including the ethnic group that is regarded to be his descendants; ◄ son of {L:Isaac<SDBH:יִצְחָק>}
    and {L:Rebekah<SDBH:רִבְקָה>}, brother of {L:Esau<SDBH:עֵשָׂו>}, and ► father
    of twelve sons -- after whom the tribes of Israel were named -- and one daughter
  glosses:
  - Israel
