- sense_id: '004615001002000'
  domain: Weak
  definition: = process by which humans lose their strength as a result of hard work
  glosses:
  - to wear oneself out
  - to tire oneself out
  forms:
  - vbqal-
  references:
  - EXO-018-018
  - EXO-018-018
- sense_id: '004615001003000'
  domain: Afraid
  definition: = process by which humans lose courage when confronted with a formidable
