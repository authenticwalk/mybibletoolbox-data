  domain: Dry
  definition: = process by which plants and their products become devoid of moisture,
    and therefore lose color and bend over ► which may ultimately result in death
    if circumstances do not change; ≈ associated with drought and destruction, often
    as punishment from God
  glosses:
  - to wither
  - to fade
