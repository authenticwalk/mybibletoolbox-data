strongs_number: H2735
lemma: חֹר הַגִּדְגָּד
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '002502001001000'
  domain: Names of Locations
  definition: = location, probably to be identified with {L:Gudgodah<SDBH:גֻּדְגֹּדָה>},
    ◄ in {L:Sinai<SDBH:סִינַי>} peninsula, between {L:Bene-Jaakan<SDBH:בְּנֵי יַעֲקָן>}
    and {L:Yotbathah<SDBH:יָטְבָתָה>}; ► {L:Israelites<SDBH:יִשְׂרָאֵל>} encamped
    there on their way from {L:Egypt<SDBH:מִצְרַיִם>} to {L:Canaan<SDBH:כְּנַעַן>}
  glosses:
  - Hor-Haggidgad
  references:
  - NUM-033-032
  - NUM-033-033
