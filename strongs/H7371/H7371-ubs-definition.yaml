  domain: Tools
  definition: = wooden implement with a long, flat blade attached to a long handle,
    ► for throwing threshed grain into the air so that the wind might separate the
    straw and chaff from the grain; ≈ winnowing is often used as a figure of speech
    to denote the process of distinguishing between good and bad
  glosses:
  - winnowing shovel
