senses:
- sense_id: '006556001001000'
  domain: Birds
  definition: = type of partridge, of which there were at least three variaties in
    ancient Israel;  it lives in small flocks called coveys, lays a great many eggs,
    and prefers to run when in danger, flying only when necessary; even when it takes
    flight it flies for only a short distance before dropping back to the ground;
    habitat differs from one kind of partridge to another; the rock partridge is about
    35 centimeters (14 inches) in length and has striking white cheeks with a black
    band running from its brow, through its eyes, down its neck, and curving around
    its breast; It also has striking black and chestnut stripes on its flanks; its
    back and wings are gray; the beak and legs are red; both sexes look alike; the
    black francolin is about the same size but has a slightly shorter tail; the male
    has a black breast and flanks; the female is a speckled brown; the sand partridge
    is the color of the local sand and is about half the size of the other two types;
    ◄ Alectoris graeca, Alectoris chukar, Francolinus francolinus, Ammoperdix heyi;
    ► clean animal, so may be eaten
  glosses:
  - rock partridge
  - black francolin
  - sand partridge
  references:
  - 1SA-026-020
  - JER-017-011
