- sense_id: '004332001003000'
  domain: Weapons
  definition: 'exact meaning unknown; possibly: = a short wooden rod used for striking
    the enemy in hand-to-hand combat; it could be held with one hand and was used
    to strike the enemy on all parts of his body, particularly where he was unprotected
    by armor; possibly fitted with a heavy head made of stone or metal'
  glosses:
  - war club
  - mace
  references:
