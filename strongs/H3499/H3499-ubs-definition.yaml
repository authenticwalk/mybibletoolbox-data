  definition: 'literally: to pull up (someone''s) tent-cord; hence: = causative action
    by which an end is made to a human life ◄ as if it were a tent of which the cords
    are pulled up so that it will collapse'
  glosses:
  - to pull up (someone's) tent-cord > to cause someone to die
  forms:
