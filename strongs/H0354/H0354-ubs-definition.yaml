senses:
- sense_id: '000332001001000'
  domain: Wild Animals
  definition: = wild animal, standing about a meter high, that ruminates, and of which
    the male grows antlers, which are dropped every year; has a reddish fur with white
    spots during summer; during winter the white spots disappear and the coat becomes
    darker; ◄ belongs to family of cervidae; ► clean animal and can therefore be eaten;
    ≈ associated with strength, speed, and agility; the male is also associated with
    sexual prowess
  glosses:
  - fallow deer
