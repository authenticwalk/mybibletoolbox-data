senses:
- sense_id: '003655001001000'
  domain: Curse
  definition: = act by which humans consign other humans or objects to death, damage,
    or destruction, usually by invoking the name of a deity if the agent is human;
    ◄ this is done as punishment, out of contempt, anger, or hostility, or because
    one was paid to do so; ► the effectiveness of a curse partially depends on the
    authority of the one pronouncing it
  glosses:
  - curse
  references:
