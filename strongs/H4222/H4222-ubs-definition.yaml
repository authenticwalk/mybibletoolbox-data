  references:
  - PSA-098-008
  - ISA-055-012
  - EZK-025-006
- sense_id: 003854001002000
  domain: Impact
  definition: = process by which an object hits another object with force
  glosses:
  - to strike
  forms:
  - vbpeal
  references:
  - DAN-002-034
  - DAN-002-035
- sense_id: 003854001003000
  domain: Dead
  definition: 'literally: (one''s body) is struck (on top of something); hence: =
    process by which a human body is placed on a vertically position on a sharpened
    upright pole that will pierce it'
  glosses:
  - to be impaled
  forms:
  - vbhtpe
  references:
  - EZR-006-011
- sense_id: 003854001004000
  domain: Non-Engage
  definition: 'literally: to strike on (someone''s) hand; hence: = causative action
