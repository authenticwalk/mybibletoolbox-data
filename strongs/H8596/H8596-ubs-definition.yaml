senses:
- sense_id: 007888001001000
  domain: Musical Instruments
  definition: = musical instrument, consisting of a membrane, usually of animal skin,
    which was stretched over a shallow circular, triangular, or square frame; ► it was
    struck sharply with one or two hands, depending on where it was situated; it could
    be held in one hand, under the arm, or against the chest and struck with the other
    hand, or it could be held on the knees or the ground and struck with one or two
    hands; the fingers of one hand could be used to tighten or loosen the tension
    on the membrane as it was struck
  glosses:
  - drum
  - hand drum
