- sense_id: 006817001001000
  domain: Trees
  definition: = a small tree reaching a height of 3-5 m, with narrow, dark green leaves
    and thorny branches; its has a red flower and produces red round fruits with a
    hard skin and tightly-packed pockets of seeds inside; ◄ Punica granatum; ► the
    seeds can be made into wine; the flower-shaped end of the fruit made it an attractive
    decoration on stone and in the temple; ≈ associated with love, beauty, and sex
  glosses:
  - pomegranate
