senses:
- sense_id: 006948001001000
  domain: Fire
  definition: = a sudden burst of brighly glowing light, whose source can be seen
    (like fire) or invisible (like lightning)
  glosses:
  - flame
  - flash
  - spark
  references:
  - JOB-005-007
  - PSA-078-048
  - SNG-008-006
  - SNG-008-006
- sense_id: 006948001002000
  domain: Weapons
  definition: 'literally: flames of the bow; hence: = pointed missile, shot from a
    bow; slender and straight in shape and moving swiftly; made out of wood and/or
    iron and used mainly for hunting and in warfare; ≈ in this context the focus is
    on the way the arrows flash through the sky'
  glosses:
  - flashing arrows
  references:
  - PSA-076-004
- sense_id: 006948001003000
  domain: Weak
  definition: = a destructive and deadly condition which affects nature
  glosses:
  - plague
  - disease
  references:
  - DEU-032-024
  - HAB-003-005
- sense_id: 006948002001000
  domain: Names of People
  definition: = son of {L:Beriah<SDBH:בְּרִיעָה>}, ancestor of {L:Joshua<SDBH:יְהֹושֻׁעַ>},
    from the tribe of {L:Ephraim<SDBH:אֶפְרַיִם>}
  glosses:
  - Resheph
  references:
  - 1CH-007-025
