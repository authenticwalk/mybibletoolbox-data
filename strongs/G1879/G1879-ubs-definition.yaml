strongs_number: G1879
lemma: ἐπαναπαύομαι
source: UBS/SDGNT
license: CC-BY-SA 4.0
senses:
- sense_id: 001895001001000
  louw_nida_code: '13.25'
  domain: Be, Become, Exist, Happen
  definition: to continue to be in a state in or on someone, with the implication
    of beneficent result
  glosses:
  - to remain on
  - to continue to be on
  references:
  - LUK-010-006
- sense_id: 001895001002000
  louw_nida_code: '31.83'
  domain: Hold a View, Believe, Trust
  definition: (a figurative extension of meaning of ἐπαναπαύομαι ‘to remain upon something
    or someone,’ not occurring in the NT) to continue to believe firmly in someone
    or something and thus to rely upon
  glosses:
  - to rely on
  - to depend on
  - to put one’s trust in
  references:
  - ROM-002-017
related_lemmas:
- word: παύω
