  domain: Unclean
  definition: = process by which humans, or objects are or become contaminated, ◄
    as a result of contagious diseases or conditions, unlawful activities, or contact
    with what has been contaminated, ► which often results in their inability of being
    used or participating in social and religious activities, until this state is
    reversed through prescribed rituals and procedures
