senses:
- sense_id: 005947001001000
  domain: People
  definition: = the lower part of the leg beyond the ankle, on which humans or animals
    stand and with which they walk
  glosses:
  - foot
  references:
  - 2KI-019-024
  - PSA-058-011
  - SNG-007-002
  - ISA-026-006
  - ISA-037-025
- sense_id: 005947001002000
  domain: Move
  definition: = the act or movement of putting one foot in front of the other in walking
  glosses:
  - footstep
  - hoofbeat
  references:
  - JDG-005-028
  - PSA-074-003
- sense_id: 005947001003000
  domain: Act
  definition: 'literally: footstep, used exclusively in a figurative way to denote
    part of one''s journey through life; hence: = something that is being done and,
    when God is the agent, something that other people ought to do as well; at the
    same time one can easily slip and fall, which is a metaphor for failure'
  glosses:
  - steps
  references:
  - PSA-017-005
  - PSA-057-007
  - PSA-085-014
  - PSA-119-133
  - PSA-140-005
  - PRO-029-005
- sense_id: 005947001004000
  domain: People
  definition: 'literally: foot; hence: = one of the four bottom corners of a square
    object'
  glosses:
  - foot
  references:
  - EXO-025-012
  - EXO-037-003
  - 1KI-007-030
- sense_id: 005947001005000
  domain: People
  definition: 'literally: foot; hence: = one of a series of beams or entire stories
    placed one above the other'
  glosses:
  - tier
  references:
  - 1KI-007-004
  - 1KI-007-005
  - EZK-041-006
- sense_id: 005947001006000
  domain: Tools
  definition: 'literally: foot; hence: = a heavy piece of metal that served as a base
    for hammering and shaping other pieces of metal'
  glosses:
  - anvil
  references:
  - ISA-041-007
