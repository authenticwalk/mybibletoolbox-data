- sense_id: 004948001001000
  domain: Birds
  definition: 'exact meaning unknown; possibly: = a grouping of large birds of prey
    with keen eyesight; ► unclean and therefore not to be eaten; ≈ associated with
    large size and great strength, ability to fly great distances at high speed; symbol
    of protection, metaphor for God, but also symbol for death in battle'
  glosses:
  - large bird of prey
  - eagle
  - vulture
