senses:
- sense_id: 003508001001000
  domain: Color
  definition: 'literally: to become white; hence: = process by which branches become
    light in color because they are stripped of their bark'
  glosses:
  - to become white
  forms:
  - vbhif-
  references:
  - JOL-001-007
- sense_id: 003508001002000
  domain: Innocent
  definition: 'literally: to become white; hence: = causative process by which humans
    are considered free of guilt again, after having fallen into sin'
  glosses:
  - to become pure
  forms:
  - vbhif-
  - vbhit-
  references:
  - PSA-051-009
  - DAN-011-035
  - DAN-012-010
- sense_id: 003508001003000
  domain: Right
  definition: 'literally: sins become white; hence: = causative process by which the
    guilt resulting from wrongdoing will be removed'
  glosses:
  - sins are made right
  forms:
  - vbhif-
  references:
  - ISA-001-018
- sense_id: 003508002001000
  domain: Exist
  definition: = causative action by which humans produce {L:bricks<SDBH:לְבֵנָה>}
    for building
  glosses:
  - to make bricks
  forms:
  - vbqal-
  references:
  - GEN-011-003
  - EXO-005-007
  - EXO-005-014
