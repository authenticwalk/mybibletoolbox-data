senses:
- sense_id: 007590001001000
  domain: Wild Animals
  definition: = Syrian Rock Hyrax; animal with small round ears, no visible tail,
    and short legs, lives on leaves and herbs; two of their front teeth develop into
    small tusks; can run up almost vertical rock faces and climb trees with ease;
    ◄ procavia capensis syriaca; ► unclean animal; ≈ associated with small size and
    wisdom
  glosses:
  - hyrax
  references:
