  louw_nida_code: '4.44'
  domain: Animals
  definition: 'Asiatic Rock dove: bird with a blue-gray color with a pinkish sheen
    to the neck feathers and a black tip on its tail; lives in large colonies and
    eats mainly seeds; courts, mates, and has nests several times a year; nests on
    rock ledges; Columba via; used as food and for sacrifices; regarded as swift,
    docile, and innocent'
  glosses:
  - dove
  - pigeon
