senses:
- sense_id: 004795001001000
  domain: Names of People
  definition: = king of {L:Egypt<SDBH:מִצְרַיִם>} who defeated king {L:Josiah<SDBH:יֹאשִׁיָּהוּ>}
    of {L:Judah<SDBH:יְהוּדָה>} who wanted to keep him from helping the {L:Assyrians<SDBH:אַשּׁוּר>}
    in their battle against {L:Nebuchadnezzar<SDBH:נְבוּכַדְנֶאצַּר>} king of {L:Babylon<SDBH:בָּבֶל>}
