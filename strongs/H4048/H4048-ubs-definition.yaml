senses:
- sense_id: '003705001001000'
  domain: Fail
  definition: 'literally: to throw down; hence: = causative process by which deities
    cause humans to fail in their undertakings'
  glosses:
  - to cause (someone's) downfall
  forms:
  - vbpael
  references:
  - EZR-006-012
- sense_id: '003705001002000'
  domain: Happen
  definition: 'literally: to be thrown down (towards something); hence: = causative
    process by which humans become the victims of an event'
  glosses:
  - to be thrown
  - to be delivered
  forms:
  - vbqal-ptcp
  references:
  - EZK-021-017
- sense_id: '003705001003000'
  domain: Insignificant
  definition: 'literally: to cast (something) to the ground; hence: = causative process
    by which deities bring dishonor on something'
  glosses:
  - to throw
  - to hurl
  forms:
  - vbpiel
  references:
  - PSA-089-045
