strongs_number: H1739
lemma: דָּוֶה
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 001598001001000
  domain: People
  definition: = female person discharging blood and other material from the lining
    of the uterus at intervals of about one lunar month; ≈ regarded as ritually unclean
  glosses:
  - menstruous woman
  references:
  - LEV-015-033
  - LEV-020-018
  - ISA-030-022
- sense_id: 001598001002000
  domain: Body Products
  definition: = blood and other material from the lining of the uterus discharged
    from the body in the menstrual period; ≈ regarded as unclean
  glosses:
  - menstrual discharge
  references:
  - ISA-030-022
- sense_id: 001598001003000
  domain: Objects
  definition: = an unspecified object ► brought in contact to a woman undergoing menstruation;
    ≈ regarded as unclean
  glosses:
  - filthy things = objects stained by menstruation
  references:
  - ISA-030-022
- sense_id: 001598001004000
  domain: Clothing
  definition: = piece of cloth ► worn or touched by a woman undergoing menstruation;
    ≈ regarded as unclean
  glosses:
  - menstruous cloth
  references:
  - ISA-030-022
- sense_id: 001598001005000
  domain: Weak
  definition: = state in which someone feels physically weak; ◄ as if one were menstruating
  glosses:
  - faint
  - weak
  references:
  - LAM-001-013
- sense_id: 001598001006000
  domain: Non-Think
  definition: 'literally, "confused heart": = state in which someone is unable to
    think properly ◄ as a result of hardship'
  glosses:
  - stunned
  - confused
  references:
  - LAM-005-017
related_lemmas:
- word: דוה
