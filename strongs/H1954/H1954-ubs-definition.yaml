- sense_id: 001797001001000
  domain: Names of People
  definition: = man, also known as {L:Joshua<SDBH:יְהֹושֻׁעַ>} and {L:Jeshua<SDBH:יֵשׁוּעַ>};
    ◄ son of {L:Nun<SDBH:נוּן>}; tribe of {L:Ephraim<SDBH:אֶפְרַיִם>}; ► one of the
    twelve men sent by {L:Moses<SDBH:מֹשֶׁה>} to spy out the land; his original name
    was Hoshea, which was later changed by Moses to Joshua; he was Moses' assistant,
    who later became his successor and brought {L:Israel<SDBH:יִשְׂרָאֵל>} into {L:Canaan<SDBH:כְּנַעַן>}
  glosses:
  - Hoshea
