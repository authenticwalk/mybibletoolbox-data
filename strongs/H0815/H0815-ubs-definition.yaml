senses:
- sense_id: '000751001001000'
  domain: Trees
  definition: = small, fast-growing tree, about 10 m. high, to be found abundantly
    in deserts, dunes, and salt marshes; leafless, has green branches, and a wide
    crown; this tree has small white flowers, and its fruit is a capsule with feathery
    seeds; ◄ |itamarix aphylla|i*; ► has durable wood; ≈ could have a link with cultic
    worship
  glosses:
  - tamarisk tree
  references:
  - GEN-021-033
  - 1SA-022-006
  - 1SA-031-013
