  references:
  - EXO-034-007
  - PRO-003-021
  - PRO-005-002
- sense_id: 004893001005000
  domain: Non-Engage
  definition: = causative action by which humans keep part of their body from engaging
    in a certain activity
  glosses:
  - to keep (from)
  forms:
  - vbqal-
  references:
  - PSA-034-014
- sense_id: 004893001006000
  domain: Non-Know
  definition: 'literally: looked for or guarded; hence: = state in which certain information
    is not generally known and difficult to access'
  glosses:
  - to be hidden
  forms:
  - vbqal-
  references:
  - ISA-048-006
- sense_id: 004893001007000
  domain: Non-Know
  definition: 'literally: hidden of heart; hence: = state in which one''s intentions
    are unknown to others'
  glosses:
  - of hidden intent
  forms:
  - vbqal-
  references:
  - PRO-007-010
- sense_id: 004893001008000
  domain: Safe
