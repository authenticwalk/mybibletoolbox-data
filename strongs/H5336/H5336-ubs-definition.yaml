- sense_id: 004893001003000
  domain: Buildings
  definition: 'literally: tower of watchers; hence: = elevated construction from where
    one can observe the surrounding land and give timely warnings in case of danger'
  glosses:
  - watchtower
  forms:
  - vbqal-
  references:
  - 2KI-017-009
  - 2KI-018-008
- sense_id: 004893001004000
  domain: Endure
  definition: = action by which humans persist in a certain activity
