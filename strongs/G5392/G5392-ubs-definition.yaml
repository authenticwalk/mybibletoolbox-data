senses:
- sense_id: 005281001001000
  louw_nida_code: '44.6'
  domain: Animal Husbandry, Fishing
  definition: to put something over or around the mouths of animals so as to prevent
    them from eating
  glosses:
  - to muzzle
  - to keep from eating
  references:
  - 1TI-005-018
- sense_id: 005281001002000
  louw_nida_code: '33.123'
  domain: Communication
  definition: to cause someone to have nothing to say
  glosses:
  - to silence
  references:
  - MAT-022-034
  - LUK-004-035
  - 1PE-002-015
- sense_id: 005281001003000
  louw_nida_code: '14.86'
  domain: Physical Events and States
  definition: to cause to cease to make a sound
  glosses:
  - to stop making a sound
  - to become quiet
  references:
  - MRK-001-025
  - MRK-004-039
- sense_id: 005281001004000
  louw_nida_code: '33.122'
  domain: Communication
  definition: to have nothing to say, with the implication of being prevented from
    speaking (compare φιμός ‘muzzle,’ not occurring in the NT)
  glosses:
  - to have nothing to say
  - to say nothing
  forms:
  - φιμοῦμαι
  references:
  - MAT-022-012
