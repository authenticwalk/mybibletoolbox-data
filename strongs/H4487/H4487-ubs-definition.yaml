  forms:
  - vbqal-
  references:
  - ISA-065-012
- sense_id: '004103001005000'
  domain: Quantity
  definition: = causative action by which people in authority make a decision regarding
    a certain quantity of food items to be given to individuals or groups of people
    on a regular basis
  glosses:
