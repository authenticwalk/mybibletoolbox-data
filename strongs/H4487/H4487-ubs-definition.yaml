- sense_id: '004103001002000'
  domain: Compare
  definition: = state in which humans hold the opinion that a particular person is
    to be identified with, considered similar to, or to be equated with another person
    or group
  glosses:
  - to be counted among
  forms:
  - vbnif-
  references:
  - ISA-053-012
- sense_id: '004103001003000'
  domain: Engage
  definition: = process by which humans undergo a certain event, ◄ as if it were measured
    out and assigned to them
  glosses:
  - to be apportioned
  - to be allotted
  forms:
  - vbpiel
  references:
  - JOB-007-003
- sense_id: '004103001004000'
  domain: Engage
  definition: = causative action by which deities causes humans to undergo a certain
    event, ◄ as if by measuring it out and assigning it to them
  glosses:
