- sense_id: '003407001001000'
  domain: Cover
  definition: = causative action by which humans cover objects with a coating of a
    certain substance
  glosses:
  - to cover
  forms:
  - vbqal-
  references:
  - GEN-006-014
- sense_id: '003407001002000'
  domain: Cover
  definition: = causative action by which humans do what is needed to prevent a dreaded
    event from happening
  glosses:
  - to ward off
  forms:
  - vbpiel
  references:
  - PRO-016-014
  - ISA-047-011
- sense_id: '003407001003000'
  domain: Non-Endure
  definition: = process by which a certain condition comes to a sudden end
  glosses:
  - to be annulled
  forms:
  - vbpual
  references:
  - ISA-028-018
- sense_id: '003407001004000'
  domain: Clean
  definition: = causative action by which priests remove uncleanness from a sanctuary
    and its furnishings by performing the rituals that are required to achieve that,
    so that they can function again as they should
  glosses:
  - to cleanse
  - to purify
  forms:
  - vbpiel
  references:
  - LEV-016-020
