  domain: Names of Locations
  definition: = location, also known as {L:Bene-Jaakan<SDBH:בְּנֵי יַעֲקָן>}; ◄ in
    {L:Sinai<SDBH:סִינַי>} peninsula, between {L:Moserah<SDBH:מֹוסֵרָה>} and {L:Hor-Haggidgad<SDBH:חֹר
