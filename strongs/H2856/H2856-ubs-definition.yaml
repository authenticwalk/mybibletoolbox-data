strongs_number: H2856
lemma: חתם
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 002628001001000
  domain: Attach
  definition: = to put a seal on a written document; ► in order to confirm that the
    document is authentic and to keep unauthorized readers from having access to it;
    ≈ associated with both authenticity and secrecy
  glosses:
  - to seal
  forms:
  - vbqal-
  - vbpeal
  - vbnif- (passive)
  references:
  - 1KI-021-008
  - NEH-010-001
  - NEH-010-002
  - EST-003-012
  - EST-008-008
  - EST-008-008
  - EST-008-010
  - ISA-008-016
  - ISA-029-011
  - ISA-029-011
  - JER-032-010
  - JER-032-011
  - JER-032-014
  - JER-032-044
  - DAN-006-018
  - DAN-012-004
  - DAN-012-009
- sense_id: 002628001002000
  domain: Close
  definition: 'literally: to put a seal on an object; hence: = causative action by
    which an opening or entrance is closed so that nothing can enter or leave, ◄ as
    if kept from being opened with a seal'
  glosses:
  - to seal
  - to block
  - to close off
  forms:
  - vbqal-
  - vbhif- (passive)
  references:
  - LEV-015-003
  - SNG-004-012
- sense_id: 002628001003000
  domain: Hide
  definition: 'literally: to put a seal on oneself; hence: = action by which humans
    cause themselves not to be seen by others, ◄ as if made inaccessible by a seal'
  glosses:
  - to hide oneself
  forms:
  - vbpiel
  references:
  - JOB-024-016
- sense_id: 002628001004000
  domain: Unable
  definition: 'literally: put a seal on an object; hence: = causative action by which
    deities keep an object from performing an activity, ◄ as a scroll that cannot
    be opened because of a seal'
  glosses:
  - to seal
  - to keep from functioning
  forms:
  - vbqal-
  references:
  - JOB-009-007
  - JOB-037-007
- sense_id: 002628001005000
  domain: Know
  definition: 'literally: to put a seal on an event; hence: = action by which deities
    hide an event in their memory in order to process it later'
  glosses:
  - to seal off
  - to store in memory
  forms:
  - vbqal-
  references:
  - DEU-032-034
- sense_id: 002628001006000
  domain: Know
  definition: 'literally: to put a seal (of authenticity) on something; hence: = causative
    action by which something is confirmed as an authentic example of a particular
    characteristic or quality, ◄ as if authenticated with a seal'
  glosses:
  - model
  - example
  forms:
  - vbqal-
  references:
  - EZK-028-012
- sense_id: 002628001007000
  domain: 'True'
  definition: 'literally: to put a seal on an event; hence: = causative action by
    which  a deity affirms or proves that an event is true and authentic, ◄ as if
    authenticating it with a seal'
  glosses:
  - to seal
  - to ratify
  forms:
  - vbqal-
  references:
  - JOB-033-016
  - DAN-009-024
- sense_id: 002628001008000
  domain: Innocent
  definition: 'literally: to seal up (someone''s) sins in a bag; hence: = causative
    action by which a deity forgives a wrongful act, ◄ as if by putting it in a sealed
    bag and so removing it from reality'
  glosses:
  - to seal (someone's) sins in a bag > to forgive (someone's sins)
  forms:
  - vbqal-
  references:
  - JOB-014-017
- sense_id: 002628002001000
  definition: read {L:תמם<SDBH:תמם>} with MT-Q
  glosses:
  - to put an end (to something)
  references:
  - DAN-009-024
related_lemmas:
- word: חֹותָם
- word: חֹתֶמֶת
