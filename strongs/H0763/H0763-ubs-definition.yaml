strongs_number: H0763
lemma: אֲרַם נַהֲרַיִם
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 000699001001000
  domain: Names of Locations
  definition: = region, also known as {L:Paddan-Aram<SDBH:פַּדַּן אֲרָם>}; ◄ located
    in upper {L:Mesopotamia<SDBH:אֲרַם נַהֲרַיִם>}, around the great bend of the {L:Euphrates<SDBH:פְּרָת>}
    River in northern {L:Syria<SDBH:אֲרָם>}; ► ancestral home of {L:Abraham<SDBH:אַבְרָהָם>}’s
    family, homeland of {L:Balaam<SDBH:בִּלְעָם>}, the son of {L:Beor<SDBH:בְּעֹור>},
    and the country of {L:Cushan-Rishathaim<SDBH:כּוּשַׁן רִשְׁעָתַיִם>}, the first
    of the kings who oppressed {L:Israel<SDBH:יִשְׂרָאֵל>} in the book of Judges ({A:ABD})
  glosses:
  - Aram Naharaim
  - Mesopotamia
  references:
