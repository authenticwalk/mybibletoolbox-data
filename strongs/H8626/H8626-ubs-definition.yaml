senses:
- sense_id: 007918001001000
  domain: Shape
  definition: = state in which an object extends uniformly in one direction only,
    without a curve or bend; ≈ associated with just behavior
  glosses:
  - to be, become straight
  forms:
  - vbqal-
  references:
  - ECC-001-015
- sense_id: 007918001002000
  domain: Shape
  definition: = causative action by which humans cause an object to extend uniformly
    in one direction only, without a curve or bend
  glosses:
  - to make straight (what God has made crooked)
  forms:
  - vbpiel
  references:
  - ECC-007-013
- sense_id: 007918001003000
  domain: Compile
  definition: = causative action by which humans arrange short passages of text in
    an orderly fashion so that it becomes a well organized text
  glosses:
  - to arrange in order
  - to organize
  forms:
  - vbpiel
  references:
  - ECC-012-009
- sense_id: 007918001004000
  domain: Strong
  definition: = state in which humans are firmly in a position of power
  glosses:
  - to be established
  forms:
  - vbhof-
  references:
  - DAN-004-033
