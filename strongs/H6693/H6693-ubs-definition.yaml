senses:
- sense_id: '006156001001000'
  domain: Grieve
  definition: = causative action by which humans or deities cause (other) humans to
    experience distress, either with words or with actions, ► usually with the purpose
    of forcing that person to make certain concessions
  glosses:
  - to nag
  - to pester
  - to oppress
  - to cause distress
  forms:
  - vbhif-
  references:
  - DEU-028-053
  - DEU-028-055
  - DEU-028-057
  - JDG-014-017
  - JDG-016-016
  - ISA-029-002
  - ISA-029-007
  - ISA-051-013
  - ISA-051-013
  - JER-019-009
- sense_id: '006156001002000'
  domain: Urge
  definition: = causative action by which humans experience pressure from a force
    within themselves to pursue a course of action
  glosses:
  - to be urged (to speak)
  - to be compelled (to speak)
  forms:
  - vbhif-
  references:
  - JOB-032-018
- sense_id: '006156002001000'
  domain: Exist
  definition: 'literally: to cause to flow; hence: = causative action by which a substance
    brings into existence a liquid ◄ as if it comes pouring from that substance'
  glosses:
  - to cause to flow > to yield
  forms:
  - vbqal-
  references:
  - JOB-028-002
  - JOB-029-006
- sense_id: '006156002002000'
  domain: Speak
  definition: = action by which humans let words flow from their mouths ◄ as if they
    were a liquid
  glosses:
  - to pour out (a prayer) > to pray
  forms:
  - vbqal-
  references:
  - ISA-026-016
