  louw_nida_code: '6.114'
  domain: Artifacts
  definition: any type of altar or object where gifts may be placed and ritual observances
    carried out in honor of supernatural beings (in the NT θυσιαστήριον is employed
    to refer to a number of different types of altars; including the altar for burnt
    offerings in the Temple; the altar of incense; the altar which Abraham built;
    and the heavenly altar mentioned in the book of Revelation)
