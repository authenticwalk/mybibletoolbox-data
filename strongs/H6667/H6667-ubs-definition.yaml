- sense_id: '006131001002000'
  domain: Names of People
  definition: = man; ◄ third son of {L:Josiah<SDBH:יֹאשִׁיָּהוּ>}; former name was
    {L:Mattaniah<SDBH:מַתַּנְיָה>}; ► described as one "who did evil in the sight
    of the Lord"; uncle of King {L:Jehoiachin<SDBH:יְהֹויָכִין>}; {L:Nebuchadnezzar<SDBH:נְבוּכַדְנֶאצַּר>}
    of {L:Babylon<SDBH:בָּבֶל>} appointed him king of {L:Judah<SDBH:יְהוּדָה>} (597-587)
    following Jehoiachin's rebellion; he too rebelled against Babylon and was eventually
    taken captive to Babylon, his sons were killed and his own eyes put out; contemporary
    of {L:Jeremiah<SDBH:יִרְמְיָהוּ>}
  glosses:
  - Zedekiah
