- sense_id: '006131001001000'
  domain: Names of People
  definition: = man; ◄ son of {L:Chenaanah<SDBH:כְּנַעֲנָה>}; ► false prophet; time
    of king {L:Ahab<SDBH:אַחְאָב>}
  glosses:
