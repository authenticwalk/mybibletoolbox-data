  domain: Trees
  definition: = a large, wide-spreading tree with big branches and lobed, hairy leaves
    shaped like a hand; up to 20 m high; the bark can easily be peeled off in strips,
    exposing the white or yellow inner layer; ◄ Platanus orientalis; ► it provides
    good shade ≈ and is regarded as having special beauty
