- sense_id: 006394001001000
  domain: Holy
  definition: = state in which a deity differs from humans and other deities in that
    he cannot be associated with anything that is in any way profane or tainted by
    sin or other impurities, which is a quality that he desires to see in everything
    else as well
  glosses:
  - holiness
  - holy
  references:
