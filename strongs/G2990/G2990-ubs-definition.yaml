  definition: to not recall information and thus to lose sight of its significance
  glosses:
  - to forget
  - to not remember
  - to lose sight of
  - to ignore
  references:
  - 2PE-003-005
  - 2PE-003-008
- sense_id: 003008001003000
  louw_nida_code: '28.14'
  domain: Know
  definition: to not have knowledge about or to be unaware of something, with the
