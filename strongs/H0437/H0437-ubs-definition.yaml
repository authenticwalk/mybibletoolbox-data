- sense_id: '000403001001000'
  domain: Trees
  definition: = a large-size tree found either alone or in clumps or forests; ◄ one
    of the varieties of |iQuercus|i*; ► functioned as landmarks, grave marks or gathering
    places; since its groves were considered sacred by Canaanites, ritual practices
    under them was always a temptation to Israelites, denounced in the texts as idolatry;
    ≈ their characteristics made them suitable symbols of a variety of attributes
    or attitudes
