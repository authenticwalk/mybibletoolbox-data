- sense_id: 001248001001000
  domain: Waterbodies
  definition: = a depression at the bottom of a waterbody, ► where water can still
    be found even when most of the water has dried up
  glosses:
  - pool
  - puddle
  references:
  - 2KI-003-016
  - 2KI-003-016
