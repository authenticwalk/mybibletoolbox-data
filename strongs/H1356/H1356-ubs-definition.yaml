- sense_id: 001248002001000
  domain: Swarming Creatures
  definition: = six-legged, winged insect that is characterized by the fact that its
    third pair of legs is elongated and adapted to hopping; insects of this type move
    in swarms at certain periods and migrate to new areas, which they colonize; at
    other times they live either solitary or in small groups; ◄ Acrididae family;
    ► normally eaten cooked by toasting, grilling, frying, or broiling, though in
    some places they are also eaten raw; clean animal, that may be eaten; ≈ associated
    with destruction
  glosses:
  - locust
  - grasshopper
  references:
  - ISA-033-004
- sense_id: 001248003001000
  domain: Constructions
  definition: = a long sturdy piece of squared timber or metal used horizontally in
    a building to support a load above
  glosses:
  - beam
  references:
  - 1KI-006-009
