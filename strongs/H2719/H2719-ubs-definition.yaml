- sense_id: '002505001003000'
  domain: Weapons
  definition: = a long, heavy object, ◄ made of wood and covered on one end with metal,
    ► rammed by soldiers against the wall or gate of a city under siege; it sometimes
    had a point since the purpose of the ramming was to wedge a hole in the wall;
    others were blunt on the end; it could be held and swung by soldiers, or sometimes
    it was suspended by ropes from a moveable wooden tower
  glosses:
  - battering-ram
  references:
  - EZK-026-009
