- sense_id: 005568001002000
  domain: Chastise
  definition: 'literally: fine; hence: = causative action by which someone in authority
    administer some kind of punishment to other humans, ◄ usually as retribution for
    a certain offense'
  glosses:
  - penalty
  references:
  - PRO-019-019
