  domain: Crops
  definition: = type of vegetable from a low-branched plant with a weak stem; its
    flowers develop into a short pod with only one seed inside, about the size of
    a small pea, one type of which is reddish brown in color; ◄ Lens culinaris; ►
    typically used in soups and stews
