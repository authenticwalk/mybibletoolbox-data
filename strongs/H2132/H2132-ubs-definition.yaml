senses:
- sense_id: 001969001001000
  domain: Trees
  definition: = tree reaching up to 10 m. high, but usually pruned to around 5 m.;
    its leaves are grayish green above, and whitish underneath; its fruit is about
    2 cm. long and a bit more than 1 cm. thick with a hard stone inside and a soft
    skin that covers the oily flesh; ► its fruit is used for food and oil for cooking,
    for lamps, for rubbing on the body, for medicine, and for anointing; ≈  regarded
    as beautiful and associated with well-being
  glosses:
  - olive tree
