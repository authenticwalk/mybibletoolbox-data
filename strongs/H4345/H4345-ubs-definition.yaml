  domain: Furnishings
  definition: = a frame with a fine meshwork, ◄ made of bronze, ► probably intended
    to hold the burning coals and allow the ashes and grease to fall through to the
    ground, as well as to allow for a draft of air to pass through from underneath;
    there were four bronze {L:rings<SDBH:טַבַּעַת>} on the four upper corners of the
    grating. and {L:poles<SDBH:בַּד>} were inserted through these rings for transporting
    the altar
