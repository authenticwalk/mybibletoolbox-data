strongs_number: H0689
lemma: אַקֹּו
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '000636001001000'
  domain: Wild Animals
  definition: = fairly large wild goat, with adults being about ninety centimeters
    high at the shoulder; for most of the year its color is grayish but it turns browner
    in winter; males have thick long horns over 130 centimeters in length which curve
    backwards in a semicircle; the horns of the females are much slimmer and shorter,
    reaching a length of only about 40 centimeters; only the last few centimeters
    of the horns are smooth, the rest being ringed with ridges; these animals live
    in small herds in the mountains and prefer cliffs and crags, where they live off
    the bushes that grow on the ledges; ► clean animal, that may be eaten
  glosses:
  - ibex
  - wild goat
  - mountain goat
  references:
  - DEU-014-005
