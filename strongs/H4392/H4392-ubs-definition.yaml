senses:
- sense_id: '004014001001000'
  domain: Contain
  definition: = state in which a certain location, container, or surface is filled
    or covered with so many objects that little or no space is left
  glosses:
  - filled
  - full
  references:
  - GEN-041-007
  - GEN-041-022
  - 2KI-004-004
  - PSA-144-013
  - ECC-001-007
  - EZK-017-003
  - EZK-036-038
  - AMO-002-013
- sense_id: '004014001002000'
  domain: Complete
  definition: 'literally: full; hence: = state in which a particular process has come
    to a full end, without having been cut short'
  glosses:
  - full
  references:
  - PSA-075-009
  - NAM-001-010
- sense_id: '004014001003000'
  domain: Complete
  definition: 'literally: full silver; hence: = state in which the amount paid in
    a transaction is the full price, without any discount'
  glosses:
  - full
  references:
  - GEN-023-009
  - 1CH-021-022
  - 1CH-021-024
- sense_id: '004014001004000'
  domain: Happen
  definition: = state in which a location is dominated by a certain quality or activity,
    to the extent that it dominates everything else, ◄ as if it were completely filled
    with that quality of activity
  glosses:
  - full (of an activity)
  references:
  - ISA-001-021
  - EZK-028-012
- sense_id: '004014001005000'
  domain: Intense
  definition: 'literally: full; hence: = process by which a certain activity take
    place with maximum intensity'
  glosses:
  - full
  references:
  - JER-004-012
  - JER-012-006
- sense_id: '004014001006000'
  domain: Old
  definition: 'literally: full of days; hence: = state in which humans have reached
    a very advanced age'
  glosses:
  - aged
  references:
  - JER-006-011
- sense_id: '004014001007000'
  domain: Pregnant
  definition: 'literally: filled; hence: = state in which a woman is with child'
  glosses:
  - pregnant
  - with child
  references:
  - ECC-011-005
- sense_id: 004014001008000
  domain: Rich
  definition: 'literally: filled; hence: = state in which humans have ample resources'
  glosses:
  - rich
  references:
  - RUT-001-021
- sense_id: 004014001009000
  definition: read וּמֵי מָלֵא יִמָּצוּ as וּמוּם לאֹ יִמָּצוּ
  glosses:
  - --
  references:
  - PSA-073-010
