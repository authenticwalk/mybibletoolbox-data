senses:
- sense_id: 004595001001000
  louw_nida_code: '1.57'
  domain: Geographical Objects and Features
  definition: a cave or den generally large enough for at least temporary occupation
    by persons (since such places were often used for habitation or refuge by those
    who were refugees or thieves, σπήλαιον has in certain contexts the connotation
    of a ‘hideout’)
  glosses:
  - cave
  - den
  - hideout
