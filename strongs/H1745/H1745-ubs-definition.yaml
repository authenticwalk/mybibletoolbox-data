senses:
- sense_id: '001604001001000'
  domain: Regions Under the Earth
  definition: = location characterized by the absence of any sound or noise; ≈ a metaphor
    for the realm of death
  glosses:
  - land of silence
  references:
  - PSA-094-017
  - PSA-115-017
- sense_id: '001604002001000'
  domain: Names of People
  definition: = man; ◄ son of {L:Ishmael<SDBH:יִשְׁמָעֵאל>}, son of {L:Abraham<SDBH:אַבְרָהָם>}
  glosses:
  - Dumah
  references:
  - GEN-025-014
  - 1CH-001-030
- sense_id: '001604002002000'
  domain: Names of Locations
  definition: = location ◄ in north-central Arabia, ► inhabited by an ethnic group
    that were regarded as descendants of Dumah, the son of {L:Ishmael<SDBH:יִשְׁמָעֵאל>},
    the son of {L:Abraham<SDBH:אַבְרָהָם>}
  glosses:
  - Dumah
  references:
  - ISA-021-011
