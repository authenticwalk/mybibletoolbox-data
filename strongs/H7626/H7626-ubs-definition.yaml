- sense_id: 007159001002000
  domain: Weapons
  definition: = a relatively short, straight rod, usually made of wood, with a sharp
    metal head or point; used for piercing by thrusting
  glosses:
  - short spear
  references:
  - 2SA-018-014
  - 2SA-023-021
  - 1CH-011-023
- sense_id: 007159001003000
  domain: People
  definition: 'literally: stick, rod; hence: = a group that oppresses other people'
  glosses:
  - rod > people
  references:
  - ISA-010-005
- sense_id: 007159001004000
  domain: Leaders
  definition: 'literally: staff; hence: = a person with the authority represented
    by a scepter'
  glosses:
  - scepter > ruler
  references:
  - NUM-024-017
- sense_id: 007159001005000
  domain: Control
  definition: 'literally: staff; hence: = state of authority over someone else symbolized
