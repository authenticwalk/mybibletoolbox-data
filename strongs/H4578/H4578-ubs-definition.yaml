- sense_id: 004192001001000
  domain: People
  definition: literally =  the bowels or inner parts of a human body; sometimes used
    collectively to refer to all the internal organs and even the whole being, and
    sometimes used to refer to a specific part of the human body, for example, the
    stomach, the heart, the womb, the soul, the breast, the genitals; ≈ associated
    with emotions such as anguish but also compassion
  glosses:
