senses:
- sense_id: '000707001001000'
  domain: Wild Animals
  definition: = relatively small, light brown animal about half a meter (20 inches)
    long, with long ears and a short fluffy tail; it has long hind legs and is a good
    jumper; it hides during the day and comes out to feed on vegetation at night;
    ► unclean animal and therefore not to be eaten
  glosses:
  - hare
  references:
  - LEV-011-006
  - DEU-014-007
