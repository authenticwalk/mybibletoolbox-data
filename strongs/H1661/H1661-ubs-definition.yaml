  domain: Constructions
  definition: = basin ◄ hewn out of a rock or lined with plaster ► into which harvested
    grapes were thrown and trampled to squeeze out the juice, which from there flowed
    into a {L:trough or vat<SDBH:יֶקֶב>}; ≈ treading a winepress is often used as
    a figure of speech to refer to God's anger and punishment
