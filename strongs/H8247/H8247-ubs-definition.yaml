  domain: Trees
  definition: = a tree belonging to the peach family; growing wild, and reaching a
    height of 4.5 to 6 m; it sheds its oblong leaves in winter and produces white
    or pink flowers and blooms as early as January; the leaves appear much later;
    ◄ Prunis dulcis; ► the seed is fifty percent oil, and can be eaten raw or roasted
  glosses:
  - almond tree
  - almond
