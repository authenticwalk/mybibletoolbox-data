strongs_number: H1913
lemma: הֲדֹורָם
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '001763001001000'
  domain: Names of People
  definition: = man; ◄ son of {L:Joktan<SDBH:יָקְטָן>}; descendant of {L:Shem<SDBH:שֵׁם>};
    ► regarded as founder of ethnic group with the same name
  glosses:
  - Hadoram
  references:
  - GEN-010-027
  - 1CH-001-021
- sense_id: '001763001002000'
  domain: Names of People
  definition: = man; ◄ son of {L:Tou<SDBH:תֹּעוּ>}, king of {L:Hamath<SDBH:חֲמָת>};
    ► sent by his father to congratulate {L:David<SDBH:דָּוִד>} on his conquests
  glosses:
  - Hadoram
  references:
  - 1CH-018-010
- sense_id: '001763001003000'
  domain: Names of People
  definition: = man, also called {L:Adoram<SDBH:אֲדֹרָם>} and {L:Adoniram<SDBH:אֲדֹנִירָם>};
    ◄ son of {L:Abda<SDBH:עַבְדָּא>}; ► official during time of {L:David<SDBH:דָּוִד>},
    {L:Solomon<SDBH:שְׁלֹמֹה>}, and {L:Rehoboam<SDBH:רְחַבְעָם>}; stoned by people
    during rebellion against {L:Rehoboam<SDBH:רְחַבְעָם>}
  glosses:
  - Hadoram
  - Adoniram
  references:
  - 2CH-010-018
