strongs_number: H8166
lemma: שְׂעִירָה
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '007064001001000'
  domain: Domestic Animals
  definition: = a fairly small, female domestic animal, usually black and with floppy
    ears, hooves and long hair, and usually found in one single {L:flock<SDBH:צֹאן>}
    with sheep; ► raised for its hair, occasionally used for sacrifices; a clean animal
    and therefore to be eaten
  glosses:
  - (shaggy) she-goat
  references:
  - LEV-004-028
  - LEV-005-006
- sense_id: '007064002001000'
  domain: Names of Locations
  definition: = town; ◄ territory of {L:Benjamin<SDBH:בִּנְיָמִן>}; ► the place {L:Ehud<SDBH:אֵהוּד>}
    escaped to after he killed {L:Eglon<SDBH:עֶגְלֹון>}, the king of {L:Moab<SDBH:מֹואָב>}
  glosses:
  - Seirah
  references:
  - JDG-003-026
related_lemmas:
- word: שָׂעִיר
- word: שֵׂעָר
- word: שַׂעֲרָה
- word: שְׂעֹרָה
