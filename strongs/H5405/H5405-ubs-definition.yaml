strongs_number: H5405
lemma: נשׁת
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 004949001001000
  domain: Dry
  definition: = process by which a body of water or place that was formerly covered
    with moisture dries up, ◄ as a result of evaporation or draining; ► in the case
    of land, if this condition persists, sedentary life will become impossible
  glosses:
  - to become dry
  - to dry up
  forms:
  - vbqal-
  references:
  - ISA-019-005
- sense_id: 004949001002000
  domain: Dry
  definition: = process by which objects containing liquid essential to their existence
    lose these liquids ◄ due to some external or internal cause
  glosses:
  - to be parched
  forms:
  - vbqal-
  references:
  - ISA-041-017
- sense_id: 004949001003000
  domain: Lax
  definition: = process by which a quality is gradually reduced in intensity, ◄ as
    a liquid that slowly dries up
  glosses:
  - to dry up > to fail
  forms:
  - vbqal-
  references:
  - JER-051-030
