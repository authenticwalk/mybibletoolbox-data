strongs_number: H1409
lemma: גַּד
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 001291001001000
  domain: Plants
  definition: = a plant of about 60 cm in height; its upper leaves are finely divided
    and its lower ones broad; it has tiny white or reddish flowers, and a strong odor;
    its seeds are oily, brown or gray, and about the size of small peas; ◄ Coriandrum
    sativum; ► its leaves and seeds used in cooking; fragrant oil from the seeds is
    sometimes used in making perfume and medicine; ≈ it is used to describe the appearance
    of manna
  glosses:
  - coriander
  references:
  - EXO-016-031
  - NUM-011-007
- sense_id: 001291002001000
  domain: Names of Deities
  definition: = an unpredictable and uncontrollable force that shapes events favorably;
    ≈ it may have religious connotations, in that the force is attributed to a god
    of good fortune
  glosses:
  - good fortune
  - luck
  references:
  - GEN-030-011
  - GEN-030-011
  - ISA-065-011
