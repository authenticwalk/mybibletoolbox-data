senses:
- sense_id: '003476001001000'
  domain: Clothing
  definition: = an undergarment, ◄ woven of linen, ► and worn by the High Priest and
    his fellow priests; it was worn over the {L:breeches<SDBH:מִכְנָס>}, but from
    the waist up it was next to the skin; it was a kind of shirt and probably had
    long sleeves and reached nearly to the ankles and was held in place by a sash wound
    around the waist.
  glosses:
  - tunic
