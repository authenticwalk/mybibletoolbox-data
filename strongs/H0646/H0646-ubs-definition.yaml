- sense_id: 000590001002000
  domain: Clothing
  definition: = embroidered garment; reaching from the shoulders to the waist; ◄ made
    from linen; ► worn by the high-{L:priest<SDBH:כֹּהֵן>} over his {L:robe<SDBH:מְעִיל>};
    representing the visible glory of God; associated with divine oracles as the urim
