  louw_nida_code: '4.29'
  domain: Animals
  definition: large domesticated solid-hoofed quadruped; Equus caballus; stockily
    built in comparison to today’s horses, with shorter heads and thicker necks; about
    122–142 cm tall, and 2.1 m long; coat varies from dark to pale brown; eats plants;
    used in battle, both to ride and for pulling chariots; symbolic of military might;
    associated with the sun, which was said to ride across the sky in a chariot
