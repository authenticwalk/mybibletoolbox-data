senses:
- sense_id: 001695001001000
  domain: Names of People
  definition: = man; ► {L:priest<SDBH:כֹּהֵן>}; one of the family heads who accompanied
    {L:Ezra<SDBH:עֶזְרָא>} back to {L:Jerusalem<SDBH:יְרוּשָׁלַ͏ִם>} after the exile;
    one of the signatories to the {L:covenant<SDBH:בְּרִית>} document of {L:Nehemiah<SDBH:נְחֶמְיָה>}
  glosses:
  - Daniel
  references:
  - EZR-008-002
  - NEH-010-007
- sense_id: 001695001002000
  domain: Names of People
  definition: = man, also known as {L:Chileab<SDBH:כִּלְאָב>}; ◄ son of {L:David<SDBH:דָּוִד>}
    and his wife {L:Abigail<SDBH:אֲבִיגַיִל>}
  glosses:
  - Daniel
  references:
  - 1CH-003-001
- sense_id: 001695001003000
  domain: Names of People
  definition: = man; ► known as one of three righteous men, together with {L:Noah<SDBH:נֹחַ>}
    and {L:Job<SDBH:אִיֹּוב>}; possibly to be identified with the main character of
    the book Daniel
  glosses:
  - Daniel
  references:
  - EZK-014-014
  - EZK-014-014
  - EZK-014-020
  - EZK-014-020
  - EZK-028-003
  - EZK-028-003
- sense_id: 001695001004000
  domain: Names of People
  definition: = man, also known as Belteshazzar; ► main character of the book of Daniel;
    possibly to be identified with one of three righteous men mentioned in Ezekiel
  glosses:
  - Daniel
