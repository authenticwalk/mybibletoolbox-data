senses:
- sense_id: 002966001001000
  domain: Birds
  definition: 'exact meaning unknown; possibly: type of owl with a mottled gray-brown
    color; its eyes are outlined with pale circles, so that it looks as though it
    is wearing spectacles; it prefers wooded areas or orchards and roosts close to
    the trunk of a tree; ◄ Strix aluco; ► unclean and therefore not to be eaten'
  glosses:
  - tawny owl
  references:
  - LEV-011-017
  - DEU-014-016
  - ISA-034-011
