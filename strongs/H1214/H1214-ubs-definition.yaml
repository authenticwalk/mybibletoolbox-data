senses:
- sense_id: '001124001001000'
  domain: Detach
  definition: = causative action by which someone severs a link between one object
    and a larger object of which it used to be a part
  glosses:
  - to cut off
  - to break off
  forms:
  - vbqal-
  - vbpiel
  references:
  - ISA-038-012
  - AMO-009-001
- sense_id: '001124001002000'
  domain: Complete
  definition: = a causative process by which deities or humans bring a process to
    its end by completing it in its entirety
  glosses:
  - to complete
  - to carry out
  - to finish
  forms:
  - vbpiel
  references:
  - ISA-010-012
  - LAM-002-017
  - ZEC-004-009
- sense_id: '001124001003000'
  domain: Dead
  definition: = process by which someone's life comes to an end, as if being cut off
    from the community of the living
  glosses:
  - to be cut off
  forms:
  - vbqal-
  references:
  - JOB-027-008
  - JER-051-013
- sense_id: '001124001004000'
  domain: Dead
  definition: = causative action by which a deity ends someone's life, as if cutting
    that person off from the community of the living
  glosses:
  - to cut off
  - to do away with
  forms:
  - vbpiel
  references:
  - JOB-006-009
- sense_id: '001124001005000'
  domain: Non-Move
  definition: 'exact meaning unsure; possibly: = process by which an event comes to
    a standstill because someone or something makes it impossible to continue'
  glosses:
  - to be stopped
  - to be halted
  forms:
  - vbqal-
  references:
  - JOL-002-008
- sense_id: '001124001006000'
  domain: Wish
  definition: = pattern of actions by which someone makes an effort to get personal
    gain; ≈ with a negative connotation, of unjust gain
  glosses:
  - to pursue unjust gain
  forms:
  - vbqal-
  - vbpiel
  references:
  - PSA-010-003
  - PRO-001-019
  - PRO-015-027
  - JER-006-013
  - JER-008-010
  - EZK-022-012
  - EZK-022-027
  - HAB-002-009
