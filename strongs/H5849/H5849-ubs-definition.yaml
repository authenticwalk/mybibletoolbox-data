senses:
- sense_id: 005368001001000
  domain: Space
  definition: = action by which humans or deities place themselves around other humans
    or groups of people; ► either to attack or to protect
  glosses:
  - to surround
  - to close in
  forms:
  - vbqal-
  references:
  - 1SA-023-026
  - PSA-005-013
- sense_id: 005368001002000
  domain: Dress
  definition: = state in which humans wear a {L:crown or diadem<SDBH:עֲטָרָה>} on
    their head; ≈ associated with status and power
  glosses:
  - to  wear a crown
  forms:
  - vbhif-
  references:
  - ISA-023-008
- sense_id: 005368001003000
  domain: Dress
  definition: = causative action by which humans place a {L:crown or diadem<SDBH:עֲטָרָה>}
    on the head of other humans; ► as a symbol of that person's authority and status
    as king
  glosses:
  - to crown
  forms:
  - vbpiel
  references:
  - SNG-003-011
- sense_id: 005368001004000
  domain: Great
  definition: 'literally: to crown; hence: = causative action by which deities increase
    the status and well-being of humans by giving them certain qualities'
  glosses:
  - to crown > to bless
  forms:
  - vbpiel
  references:
  - PSA-008-006
  - PSA-103-004
- sense_id: 005368001005000
  domain: Extraordinary
  definition: 'literally: to crown; hence: = causative actions by which deities increase
    an event''s importance by giving it certain qualities'
  glosses:
  - to crown > to bless
  forms:
  - vbpiel
  references:
  - PSA-065-012
related_lemmas:
- word: עֲטָרָה
