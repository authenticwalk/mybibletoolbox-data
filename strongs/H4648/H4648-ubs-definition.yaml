senses:
- sense_id: '004256001001000'
  domain: Names of People
  definition: = man; ◄ son of king {L:Saul<SDBH:שָׁאוּל>} and his concubine {L:Rizpah<SDBH:רִצְפָּה>};
    tribe of {L:Benjamin<SDBH:בִּנְיָמִן>}; ► given by {L:David<SDBH:דָּוִד>} to the
    {L:Gibeonites<SDBH:גִּבְעֹונִי>} to be killed
  glosses:
  - Mephibosheth
  references:
  - 2SA-021-008
- sense_id: '004256001002000'
  domain: Names of People
  definition: = man; ◄ son of {L:Jonathan<SDBH:יְהֹונָתָן>} and grandson of king {L:Saul<SDBH:שָׁאוּל>};
    tribe of {L:Benjamin<SDBH:בִּנְיָמִן>}; ► father of {L:Micah<SDBH:מִיכָה>}; allowed
    to live in {L:David<SDBH:דָּוִד>}'s palace out of loyalty towards Jonathan
  glosses:
  - Mephibosheth
