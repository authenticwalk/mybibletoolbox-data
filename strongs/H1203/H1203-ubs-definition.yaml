senses:
- sense_id: '001112001001000'
  domain: Names of Locations
  definition: = town, possibly to be identified with {L:Ashtaroth<SDBH:עַשְׁתָּרֹת>},
    {L:Ashteroth-Karnaim<SDBH:עַשְׁתְּרֹת קַרְנַיִם>}, and {L:Karnaim<SDBH:קַרְנַיִם>};
    ◄ located in territory of {L:Manasseh<SDBH:מְנַשֶּׁה>}, east of river {L:Jordan<SDBH:יַרְדֵּן>};
    ► assigned to clan of {L:Gershon<SDBH:גֵּרְשֹׁון>}, tribe of {L:Levi<SDBH:לֵוִי>}
  glosses:
  - Beeshterah
  references:
  - JOS-021-027
