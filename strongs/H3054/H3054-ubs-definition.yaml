- sense_id: 002813001001000
  domain: Associate
  definition: = action or process by which someone presents oneself as a יְהוּדִי
    Jew, or makes oneself a Jew, ► which could suggest a temporary profession of convenience
    but more likely means adopting their customs, including, as {A:LXX} explicitly
    states, circumcision
  glosses:
  - to become a Jew
  - to make oneself a Jew
  forms:
  - vbhit-
  references:
  - EST-008-017
