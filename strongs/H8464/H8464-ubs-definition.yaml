senses:
- sense_id: '007766001001000'
  domain: Birds
  definition: 'exact meaning unknown; possibly: = type of owl, medium-sized and with
    a brown color, but with a paler face and ear tufts that are not very prominent;
    it makes a strange sound like an animal or a person snoring; it lives in grassland
    and semi desert regions; ◄ Asio flammeus; ► unclean and therefore not to be eaten'
  glosses:
  - short-eared owl
  references:
  - LEV-011-016
  - DEU-014-015
- sense_id: '007766001002000'
  domain: Birds
  definition: 'exact meaning unknown; possibly: = speckled brown bird that is about
    15 centimeters (6 inches) long, with a short beak that can open very wide; it
    flies by night and feeds on flying insects; during the day they roost on the ground
    or on thick branches; their presence in an area is known from their calls at night;
    ◄ Caprimulgus nubicus or Caprimulgus europaeus; ► unclean and therefore not to
    be eaten'
  glosses:
  - nightjar
  - nighthawk
  references:
  - LEV-011-016
  - DEU-014-015
