senses:
- sense_id: 007783001001000
  domain: Names of People
  definition: = man; ◄ son of {L:Ishmael<SDBH:יִשְׁמָעֵאל>}, son of {L:Abraham<SDBH:אַבְרָהָם>};
    ► regarded as founder of a nation bearing the same name
  glosses:
  - Tema
  references:
  - GEN-025-015
  - 1CH-001-030
- sense_id: 007783001002000
  domain: Names of Groups
  definition: = ethnic group; ► known for cutting the hair on their temples; regarded
    as descendants of one of {L:Abraham<SDBH:אַבְרָהָם>}'s sons
  glosses:
  - Tema
  references:
  - JER-025-023
- sense_id: 007783001003000
  domain: Names of Locations
  definition: = region, identified with Tayma, an oasis; ◄ located in N Arabia; regarded
    as founded by one of {L:Abraham<SDBH:אַבְרָהָם>}'s sons
  glosses:
  - Tema
  references:
  - JOB-006-019
  - ISA-021-014
