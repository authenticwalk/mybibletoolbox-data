strongs_number: H0231
lemma: אֵזֹוב
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 000219001001000
  domain: Plants
  definition: = plant with a shrub-like base and stems which are erect, stiff and
    strong; it reaches a height of just under one meter; it may grow from the ground
    but also spring out of crevices in walls, cliffs and rocks; its leaves and branches
    are hairy, and its flowers white; ◄ origanum maru; ► the plant is aromatic, and
    the dried leaves are used as a condiments; the leaves and little branches, when
    collected in bunches, are suitable for sprinkling purposes, as the hairy surface
    holds the liquid; used in the ritual purification of the Jews
  glosses:
  - hyssop
