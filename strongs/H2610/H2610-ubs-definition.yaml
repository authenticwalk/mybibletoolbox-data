strongs_number: H2610
lemma: חנף
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '002404001001000'
  domain: Unclean
  definition: = process by which land becomes impure as a result of the morally and
    ethically unacceptable things that happen there, ► and therefore unfit for God
    to associate with
  glosses:
  - to be polluted
  - to be defiled
  forms:
  - vbqal-
  references:
  - PSA-106-038
  - ISA-024-005
  - JER-003-001
  - JER-003-001
- sense_id: '002404001002000'
  domain: Unclean
  definition: = causative action by which humans cause land to become impure by their
    morally and ethically unacceptable behavior, ► as a result of which it is no longer
    fit for God to associate with
  glosses:
  - to pollute
  - to defile
  forms:
  - vbqal-
  - vbhif-
  references:
  - NUM-035-033
  - NUM-035-033
  - JER-003-002
  - JER-003-009
- sense_id: '002404001003000'
  domain: Impact
  definition: = process by which a town becomes unfit for anyone to live in it
  glosses:
  - to be defiled > to be destroyed
  forms:
  - vbqal-
  references:
  - MIC-004-011
- sense_id: '002404001004000'
  domain: Evil
  definition: = process by which humans become impure in character, without regard
    or respect for God
  glosses:
  - to be ungodly
  - to be godless
  forms:
  - vbqal-
  references:
  - JER-023-011
- sense_id: '002404001005000'
  domain: Evil
  definition: = causative action by which humans cause other humans to become impure
    in character, without regard or respect for God
  glosses:
  - to corrupt
  forms:
  - vbhif-
  references:
  - DAN-011-032
related_lemmas:
- word: חָנֵף
- word: חֹנֶף
- word: חֲנֻפָּה
