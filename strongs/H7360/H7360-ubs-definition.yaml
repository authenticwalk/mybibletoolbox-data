strongs_number: H7360
lemma: רָחָם
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '006760001001000'
  domain: Birds
  definition: = relatively small type of vulture with a long, untidy, light orange-brown
    feathers on its neck and head, a bare yellow face, and a yellow beak that is longer
    and less hooked than most vultures; the rest of the body and wings are white with
    black wing tips; it feeds on the scraps of carrion dropped by larger vultures,
    since its beak is not strong enough to tear skin and meat easily; usually scavenges
    scraps on beaches or rubbish dumps and eats the eggs of ground-nesting waterside
    birds such as plovers, sandpipers, curlews, and others, which it breaks by knocking
    them with a large stone; ◄ Neophron percnopterus; ► unclean and therefore not
    to be eaten
  glosses:
  - Egyptian vulture
  references:
  - LEV-011-018
  - DEU-014-017
