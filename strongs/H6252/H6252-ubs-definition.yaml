strongs_number: H6252
lemma: עַשְׁתָּרֹת
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '005733001001000'
  domain: Names of Locations
  definition: = town, possibly to be identified with {L:Beeshterah<SDBH:בְּעֶשְׁתְּרָה>},
    {L:Ashteroth-Karnaim<SDBH:עַשְׁתְּרֹת קַרְנַיִם>} and {L:Karnaim<SDBH:קַרְנַיִם>};
    ◄ territory of {L:Manasseh<SDBH:מְנַשֶּׁה>}, east of river {L:Jordan<SDBH:יַרְדֵּן>};
    ► former residence of king {L:Sihon<SDBH:סִיחֹון>} of {L:Heshbon<SDBH:חֶשְׁבֹּון>}
    and king {L:Og<SDBH:עֹוג>} of {L:Bashan<SDBH:בָּשָׁן>}; conquered by {L:Israelites<SDBH:יִשְׂרָאֵל>};
    assigned to clan of {L:Gershon<SDBH:גֵּרְשֹׁון>}, tribe of {L:Levi<SDBH:לֵוִי>}
  glosses:
  - Ashtaroth
  references:
  - DEU-001-004
  - JOS-009-010
  - JOS-012-004
  - JOS-013-012
  - JOS-013-031
  - 1CH-006-056
