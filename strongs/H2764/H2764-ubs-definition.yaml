- sense_id: '002544001001000'
  domain: Traps
  definition: = long net hanging vertically in the water with floats at the upper
    edge and weights at the lower edge; ► drawn in by men working in boats or from
    shore; as the ends are drawn together to the boat or drawn ashore, fish are trapped
    in the area enclosed by the net; drawn in immediately after it has been spread
    out; ≈ associated with aggression and control
  glosses:
  - dragnet
