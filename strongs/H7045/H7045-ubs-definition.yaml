senses:
- sense_id: 006483001001000
  domain: Curse
  definition: = actions by which humans or deities consign other humans or deities
    or inanimate objects to death, damage, or destruction, usually by invoking the
    name of a deity if the agent is human; ◄ this is done as punishment, out of contempt,
    fear, anger, or hostility, or because one was paid to do so; ► the effectiveness
    of a curse partially depends on the authority of the one pronouncing it
