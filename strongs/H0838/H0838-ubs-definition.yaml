- sense_id: '000774001001000'
  domain: Act
  definition: 'literally: the act or movement of putting one leg in front of the other
    in walking, used exclusively in a figurative way to denote part of one''s journey
    through life; hence: = something that is being done and, when God is the agent,
    something that other people ought to do as well; at the same time one can easily
    slip and fall, which is a metaphor for failure'
