senses:
- sense_id: '001630001001000'
  domain: Birds
  definition: 'exact meaning unknown, possibly: = dark brown bird with a grayish head
    and a long triangular tail that looks V-shaped as it maneuvers the two outer feathers;
    ◄ Milvus migrans; ► it feeds on insects, frogs, lizards, and food scraps from
    human dwellings, and scavenges dead fish and shellfish along the beaches of oceans,
    lakes, and rivers; they also pick off small bits of meat from animal carcasses;
    unclean and therefore not to be eaten'
  glosses:
  - black kite
  references:
  - DEU-014-013
  - ISA-034-015
related_lemmas:
- word: דאה
