strongs_number: H6322
lemma: פּוּל
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 005805001001000
  domain: Names of People
  definition: = man, to be identified with {L:Tiglath-Pileser<SDBH:תִּגְלַת פִּלְאֶסֶר>}
    III; ► king of {L:Assyria<SDBH:אַשּׁוּר>}, contemporary of {L:Ahaz<SDBH:אָחָז>}
    king of {L:Judah<SDBH:יְהוּדָה>}, who attacked the northern kingdom of {L:Israel<SDBH:יִשְׂרָאֵל>}
    during the reign of {L:Menahem<SDBH:מְנַחֵם>}, and exiled part of the population
    during the reign of king {L:Pekah<SDBH:פֶּקַח>}
  glosses:
  - Pul
  - Tiglath-Pileser
  references:
  - 2KI-015-019
  - 2KI-015-019
  - 1CH-005-026
- sense_id: 005805001002000
  domain: Names of Groups
  definition: = ethnic group, possibly to be identified with {L:Put<SDBH:פּוּט>}
  glosses:
  - Pul
  references:
  - ISA-066-019
