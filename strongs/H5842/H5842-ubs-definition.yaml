senses:
- sense_id: '005360001001000'
  domain: Tools
  definition: = reed of about 20 centimeters long and sharpened on one end and split
    to form a nib; sometimes made of a rush cut at an angle and then frayed to form
    a fine brush; ► used for making marks with ink on writing material
  glosses:
  - pen
  references:
  - PSA-045-002
  - JER-008-008
- sense_id: '005360001002000'
  domain: Tools
  definition: = short, sharp piece of iron; ► used for engraving marks, usually writing
    or drawing, on stone or metal; ≈ associated with conditions that are permanent
    and are not likely to change
  glosses:
  - stylus
  references:
  - JOB-019-024
  - JER-017-001
