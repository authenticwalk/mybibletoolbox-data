senses:
- sense_id: '001132001001000'
  domain: Stalls
  definition: = area enclosed by a stone wall or hedge made of branches and thorns,
    with a narrow opening which can be closed with brush or by the shepherd’s body;
    ► used for keeping sheep at night to protect them from thieves or wild animals
  glosses:
  - sheep pen
  - sheepfold
  references:
  - MIC-002-012
- sense_id: '001132002001000'
  domain: Names of Locations
  definition: = town; ◄ capital of {L:Edom<SDBH:אֱדֹום>}
  glosses:
  - Bozrah
  references:
  - GEN-036-033
  - 1CH-001-044
  - ISA-034-006
  - ISA-063-001
  - JER-049-013
  - JER-049-022
  - AMO-001-012
  - MIC-002-012
- sense_id: '001132002002000'
  domain: Names of Locations
  definition: = location; ◄ in {L:Moab<SDBH:מֹואָב>}
  glosses:
  - Bozrah
  references:
  - JER-048-024
