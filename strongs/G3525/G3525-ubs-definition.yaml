strongs_number: G3525
lemma: νήφω
source: UBS/SDGNT
license: CC-BY-SA 4.0
senses:
- sense_id: 003429001001000
  louw_nida_code: '30.25'
  domain: Think
  definition: (a figurative extension of meaning of νήφω ‘to be sober, to not be drunk,’
    probably not occurring in the NT; see {D:88.86}) to be in control of one’s thought
    processes and thus not be in danger of irrational thinking
  glosses:
  - to be sober-minded
  - to be well composed in mind
  references:
  - 1TH-005-006
  - 1TH-005-008
  - 1PE-001-013
  - 1PE-004-007
  - 1PE-005-008
- sense_id: 003429001002000
  louw_nida_code: '88.86'
  domain: Moral and Ethical Qualities and Related Behavior
  definition: (a figurative extension of meaning of νήφω ‘to be sober,’ in the sense
    of ‘not being drunk,’ probably not occurring in the NT) to behave with restraint
    and moderation, thus not permitting excess
  glosses:
  - to be self-controlled
  - to be restrained
  - to be moderate in one’s behavior
  - to be sober
  references:
  - 1TH-005-006
  - 1TH-005-008
  - 2TI-004-005
  - 1PE-004-007
related_lemmas:
- word: ἀνανήφω
- word: ἐκνήφω
- word: νηφάλιος
