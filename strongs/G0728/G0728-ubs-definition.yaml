strongs_number: G0728
lemma: ἀρραβών
source: UBS/SDGNT
license: CC-BY-SA 4.0
senses:
- sense_id: '000725001001000'
  louw_nida_code: '57.170'
  domain: Possess, Transfer, Exchange
  definition: the first or initial payment of money or assets, as a guarantee for
    the completion of a transaction or pledge (in the NT ἀρραβών is used only figuratively
    in referring to the Holy Spirit as the pledge or guarantee of the blessings promised
    by God){N:001}
  glosses:
  - first installment
  - downpayment
  - pledge
  - guarantee
  references:
  - 2CO-001-022
  - 2CO-005-005
  - EPH-001-014
