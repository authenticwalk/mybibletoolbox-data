strongs_number: H6168
lemma: ערה
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: '005655001001000'
  domain: Uncover
  definition: = causative action by which humans or deities cause the outer layer
    covering an object to be removed
  glosses:
  - to uncover
  - to make bare
  - to strip
  forms:
  - vbpiel
  references:
  - ISA-022-006
  - HAB-003-013
  - ZEP-002-014
- sense_id: '005655001002000'
  domain: Impact
  definition: 'literally: to make bare; hence: = causative action by which humans
    completely demolish a construction, uncovering its foundations'
  glosses:
  - to tear down
  references:
  - PSA-137-007
  - PSA-137-007
- sense_id: '005655001003000'
  domain: Undress
  definition: 'literally: to uncover oneself; hence: = action by which humans take
    off their clothes and become naked, ≈ which is regarded as shameful'
  glosses:
  - to make oneself naked
  forms:
  - vbhit-
  references:
  - LAM-004-021
- sense_id: '005655001004000'
  domain: Undress
  definition: 'literally: to uncover; hence: = causative action by which humans or
    deities cause (other) humans to take off their clothes and become (fully or partially)
    naked, ≈ which is regarded as shameful'
  glosses:
  - to make bare
  - to lay bare
  forms:
  - vbpiel
  - vbhif-
  references:
  - LEV-020-018
  - LEV-020-019
  - ISA-003-017
  - HAB-003-013
- sense_id: '005655001005000'
  domain: Unsafe
  definition: 'literally: to lay bare; hence: = causative action by which deities
    remove their protection from humans'
  glosses:
  - to leave defenseless
  forms:
  - vbpiel
  references:
  - PSA-141-008
- sense_id: '005655001006000'
  domain: Non-Contain
  definition: 'literally: to lay bare; hence: = causative action by which humans remove
    the contents from a container, which is normally done by pouring it out'
  glosses:
  - to empty
  forms:
  - vbpiel
  references:
  - GEN-024-020
  - 2CH-024-011
- sense_id: '005655001007000'
  domain: Engage
  definition: 'literally: to pour out (one''s) spirit; hence: = causative action by
    which deities impart their spirit on humans'
  glosses:
  - to pour out (one's) spirit
  forms:
  - vbnif- (passive)
  references:
  - ISA-032-015
- sense_id: 005655001008000
  domain: Willing
  definition: 'literally: to lay one''s self bare to death; hence: = state in which
    humans are willing to undergo death'
  glosses:
  - to expose (oneself) to death
  forms:
  - vbhif-
  references:
  - ISA-053-012
- sense_id: '005655002001000'
  domain: Great
  definition: 'literally: to come up; hence: = process by which humans increase in
    status and importance ◄ like a spreading tree'
  glosses:
  - to ascend
  - to rise (in status)
  forms:
  - vbhit-
  references:
  - PSA-037-035
