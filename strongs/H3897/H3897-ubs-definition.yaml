senses:
- sense_id: '003562001001000'
  domain: Ingest
  definition: = action by which animals ingest food with the help of their tongue
  glosses:
  - to lick up
  forms:
  - vbqal-
  references:
  - NUM-022-004
- sense_id: '003562001002000'
  domain: Insignificant
  definition: 'literally: to lick the dust; hence: = process by which humans are deeply
    humiliated by being forced to lie prostrate on the ground before those in authority,
    and, in some cases, having to lick the dust from their feet'
  glosses:
  - to lick the dust
  forms:
  - vbpiel
  references:
  - PSA-072-009
  - ISA-049-023
  - MIC-007-017
- sense_id: '003562001003000'
  domain: Non-Exist
  definition: 'literally: to lick up; hence: = a process by which humans completely
    use up all vegetation in a certain area'
  glosses:
  - to lick up > to consume
  forms:
  - vbpiel
  references:
  - NUM-022-004
- sense_id: '003562001004000'
  domain: Non-Exist
  definition: 'literally: to lick up; hence: = process by which liquids are completely
    vaporized by fire'
  glosses:
  - to lick up > to consume
  forms:
  - vbpiel
  references:
  - 1KI-018-038
