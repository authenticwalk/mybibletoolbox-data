- sense_id: '003714001003000'
  domain: Chastise
  definition: 'literally: to measure out on (someone''s) lap; hence: = causative process
    by which deities cause humans to receive the appropriate return for their evil
    actions, which are mostly evil'
  glosses:
  - to pay back
  forms:
  - vbqal-
  references:
  - ISA-065-007
- sense_id: '003714001004000'
  domain: Divide
  definition: 'literally: to measure off; hence: = action by which deities divide
    an object into portions in order to share them out among different parties'
  glosses:
  - to divide up
  - to parcel out
  forms:
  - vbpiel
  references:
  - PSA-060-008
  - PSA-108-008
- sense_id: '003714001005000'
  domain: Endure
  definition: = process by which a certain condition lasts longer than expected or
    hoped
  glosses:
  - to last
  - to drag on
  forms:
  - vbpiel
  references:
  - JOB-007-004
- sense_id: '003714001006000'
  domain: Stance
  definition: = action by which humans straighten their body to its full length
  glosses:
  - stretching oneself out
  forms:
  - vbhit-
  references:
  - 1KI-017-021
