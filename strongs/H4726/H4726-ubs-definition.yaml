senses:
- sense_id: '004325001001000'
  domain: Waterbodies
  definition: = an opening in the earth that gives access to the subterranean water
    which either comes to the surface or can be drawn from it; ≈ its water is regarded
    as a source of life and well-being
  glosses:
  - spring
  references:
  - PRO-025-026
  - JER-051-036
  - HOS-013-015
  - ZEC-013-001
- sense_id: '004325001002000'
  domain: Alive
  definition: 'literally: spring of life; hence: = a reference to God or wisdom as
    a sources of life, ◄ as a spring is a source of life to a community'
  glosses:
  - spring of life
  - source of life
  references:
  - PSA-036-010
  - PRO-010-011
  - PRO-013-014
  - PRO-014-027
  - PRO-016-022
- sense_id: '004325001003000'
  domain: Alive
  definition: 'literally: spring of living water; hence: = a reference to God as a
    source of life, ◄ as a spring is a source of life to a community'
  glosses:
  - spring of life
  - source of life
  references:
  - JER-002-013
  - JER-017-013
- sense_id: '004325001004000'
  domain: Flow
