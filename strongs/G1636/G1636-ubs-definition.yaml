  louw_nida_code: '3.9'
  domain: Plants
  definition: tree reaching up to 10 m. high, but usually pruned to around 5 m.; leaves
    are grayish green above, and whitish underneath; fruit of the olive is about 2
    cm. long and a bit more than a cm thick with a hard stone inside and a soft skin
    that covers the oily flesh; fruit is used for food and oil for cooking, for lamps,
    for rubbing on the body, for medicine, and in religion (anointing)
