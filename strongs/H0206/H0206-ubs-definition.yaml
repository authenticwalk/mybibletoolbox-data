- sense_id: 000194001004000
  domain: Names of Locations
  definition: = town and cult centre, normally referred to as {L:Bethel<SDBH:בֵּית־אֵל>}
    or {L:Beth-Aven<SDBH:בֵּית אָוֶן>}; ◄ territory of {L:Ephraim<SDBH:אֶפְרַיִם>},
    near the border of {L:Benjamin<SDBH:בִּנְיָמִן>}; ≈ probably a pun featuring the
    meaning of אָוֶן "evil, iniquity" because of the idolatry that was practiced in
    this town
  glosses:
  - Aven
  references:
  - HOS-010-008
