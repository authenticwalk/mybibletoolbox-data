  domain: Crops
  definition: = a cultivated plant that grows to around 30 cm high and has a lacy
    leaf like dill or carrot and a greenish-blue flower with five petals; the base
    of the flower becomes a seedpod that contains many round, black, sharp-smelling
    seeds; ► used in cooking
