senses:
  - gloss: to answer, reply
    definition: To give a verbal response to a question or statement, often in a formal or deliberate manner.
    frequency: primary
    example: "Matt 3:15"
  - gloss: to begin to speak
    definition: A Semitic idiom where "answering" introduces discourse even without a prior question.
    frequency: secondary
    example: "Matt 11:25"

etymology: From apo (from) + krino (to judge/separate); literally "to judge from" or "give a verdict"
