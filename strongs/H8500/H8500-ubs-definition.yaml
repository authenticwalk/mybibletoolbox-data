lemma: תֻּכִּי
source: UBS/SDBH
license: CC-BY-SA 4.0
senses:
- sense_id: 007796001001000
  domain: Wild Animals
  definition: = relatively small, long-tailed monkey, which have gray fur with a greenish
    or bluish tinge; the skin on their eyelids and the genitals of the males is also
    greenish or bluish; mainly vegetarian, eating fruit and young leaves with occasional
    insects and spiders; spend most of their time in trees, but they also forage for
    grass seeds and fallen fruit on the ground; ◄ |iguenon|i*; ► kept as pets; brought
    to Israel from Tarsis
  glosses:
  - vervet monkey
  references:
  - 1KI-010-022
  - 2CH-009-021
