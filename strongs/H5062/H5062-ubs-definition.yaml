- sense_id: 004639001001000
  domain: Impact
  definition: = process by which a human's foot or both feet come in forcible contact
    with a stone or other object while travelling, ► which may result in stumbling
    and injury; ≈ usually used in a figurative way to denote sustaining any kind of
    hardship in life
  glosses:
  - to hurt one's foot (on something) > to hurt oneself
  - to stumble
