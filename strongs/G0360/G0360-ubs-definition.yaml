senses:
- sense_id: '000361001001000'
  louw_nida_code: '15.89'
  domain: Linear Movement
  definition: to move back to a point or area from which one has previously departed,
    but with more explicit emphasis upon the return (compare {L:ὑποστρέφω<SDBG:ὑποστρέφω:000000>}[a],
    {D:15.88})
  glosses:
  - to move back
  - to return
  references:
  - LUK-012-036
- sense_id: '000361001002000'
  louw_nida_code: '23.101'
  domain: Physiological Processes and States
  definition: (a figurative extension of meaning of ἀναλύω to depart, not occurring
    in the NT) to depart from life, as a euphemistic expression for death{N:001}
  glosses:
  - to leave this life
  - to die
  - death
  - departure
  references:
  - PHP-001-023
