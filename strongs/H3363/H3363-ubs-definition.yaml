- sense_id: '003073001002000'
  domain: Dead
  definition: 'exact meaning unsure, with several possibilities: = causative action
    by which humans put other humans to death, though the exact way is unsure; possibly
    interpretations include (1) hanging the body from a gibbet which results in dislocating
    some of the bones, (2) throwing the body down from a rock which results in dislocating
    some of the bones, (3) placing the body in a vertically position on a sharpened
    upright pole that will pierce it, (4) cutting the body to pieces'
  glosses:
