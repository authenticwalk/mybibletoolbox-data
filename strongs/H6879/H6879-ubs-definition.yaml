senses:
- sense_id: '006330001001000'
  domain: Impact
  definition: = state in which humans suffer from a condition that affects the skin,
    which probably covers diseases such as psoriasis, favus, leucoderma; ► a person
    who suffers from this disease is considered ritually unclean, and therefore unable
    to participate in worship; ≈ regarded as infectious, and seen as a curse and a
    punishment from God
  glosses:
  - to suffer from a skin disease
  - to be affected by mildew
