senses:
- sense_id: 002942001001000
  domain: Swarming Creatures
  definition: 'term found primarily in poetic contexts: = six-legged, winged insect
    that is characterized by the fact that its third pair of legs is elongated and
    adapted to hopping; insects of this type move in swarms at certain periods and
    migrate to new areas, which they colonize; at other times they live either solitary
    or in small groups; ◄ Acrididae family; ► normally eaten cooked by toasting, grilling,
    frying, or broiling, though in some places they are also eaten raw'
  glosses:
  - locust
