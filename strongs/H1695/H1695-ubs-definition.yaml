senses:
- sense_id: '001554001001000'
  domain: Attach
  definition: = state of being positioned against another object in such a way that
    the two cannot be separated easily
  glosses:
  - joined to
  - touching
  references:
  - 2CH-003-012
- sense_id: '001554001002000'
  domain: Associate
  definition: = state in which someone is closely involved with another person or
    deity, out of affection and/or solidarity
  glosses:
  - commited
  - devoted
  references:
  - DEU-004-004
  - PRO-018-024
