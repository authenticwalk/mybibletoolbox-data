- sense_id: 002184001001000
  domain: Jewellery
  definition: = engraved object; ◄ made out of metal; ► used to make a mark denoting
    ownership, approval, or closure of something (normally done by pressing into clay
    or heated wax and usually attached to a document or letter); sometimes worn on
    a chain around the neck, or in the form of a ring on one's hand; ≈ regarded as
    valuable and associated with exclusivity
