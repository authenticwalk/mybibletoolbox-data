senses:
- sense_id: '006374001001000'
  domain: Space
  definition: = action by which humans place themselves in front of individuals or
    groups, facing either forward or backward, ► and either with good or with evil
    intentions; ≈ sometimes used figuratively in situations where humans come before
    God in worship, or where God confronts enemies, or when certain conditions are
    personified
  glosses:
  - to approach
  - to come before
  - to stand before
  - to confront
  forms:
  - vbpiel
  references:
  - 2SA-022-019
  - PSA-017-013
  - PSA-018-019
  - PSA-068-026
  - PSA-089-015
  - PSA-095-002
  - MIC-006-006
  - MIC-006-006
- sense_id: '006374001002000'
  domain: Space
  definition: = causative action by which humans place an object in front of another
    object
  glosses:
  - to bring
  - to put in front of
  forms:
  - vbpiel
  references:
  - 2KI-019-032
  - ISA-037-033
- sense_id: '006374001003000'
  domain: Meet
  definition: = action by which humans meet other humans that are travelling from
    one location to another ► either with good or with evil intentions; ≈ often extended
    to describe certain events that happen in people's lives
  glosses:
  - to meet
  - to receive
  - to welcome
  forms:
  - vbpiel
  - vbhif-
  references:
  - DEU-023-005
  - 2SA-022-006
  - NEH-013-002
  - JOB-003-012
  - JOB-030-027
  - JOB-041-003
  - PSA-018-006
  - PSA-021-004
  - PSA-059-011
  - PSA-079-008
  - PSA-088-014
  - ISA-021-014
  - AMO-009-010
- sense_id: '006374001004000'
  domain: Happen
  definition: = action by which humans come into action before a certain event starts
    taking place ◄ as if meeting that event on its way
  glosses:
  - to be in action before (another event)
  forms:
  - vbpiel
  references:
  - PSA-119-147
  - PSA-119-148
- sense_id: '006374001005000'
  domain: Happen
  definition: = action by which humans perform an event in haste before it can be
    prevented
  glosses:
  - to do something beforehand
  forms:
  - vbpiel
  references:
  - JON-004-002
