  domain: Fortifications
  definition: = area shaped and located in such a way that it is hard to access and
    can be easily defended against enemies; ◄ this can be a natural stronghold in
    the mountains (e.g. caves) or a construction erected by humans in populated areas;
    ≈ often associated with security and sometimes used as an epithet for leaders
    or deities that are considered providers of security
