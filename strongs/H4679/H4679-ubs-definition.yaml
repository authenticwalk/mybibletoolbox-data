- sense_id: 004291001002000
  domain: Traps
  definition: = combination of two or three nets in layers, usually a small-mesh inner
    net sandwiched between two nets of looser mesh; ► set out vertically in the water,
    held in place by floats on the surface of the water and weighted down by a single
    weighted rope at the bottom; left in place for several hours to give time for
    fish to accumulate in it; ≈ associated with aggression and control
  glosses:
  - (trammel) net
  references:
