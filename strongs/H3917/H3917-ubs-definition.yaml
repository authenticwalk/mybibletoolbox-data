senses:
- sense_id: 003582001001000
  domain: Birds
  definition: 'exact meaning unknown; possibly another name for the {L:tawny owl<SDBH:יַנְשֹׁוף>},
    or: = type of owl with tiny ears that is a mottled gray in color; by day it perches
    close to the trunk of a tree, where its mottled coloring blends in with the tree
    bark, making the owl look like the stump of a broken branch; it has a soft, trilled
    call; ≈ associated with demons'
  glosses:
  - tawny owl
  - scops owl
  references:
  - ISA-034-014
