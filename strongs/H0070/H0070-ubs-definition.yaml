senses:
- sense_id: '000066001001000'
  domain: Tools
  definition: = flat, horizontal wheel made of stone, with a pointed projection on
    the underside; this projection sat in an indentation on a stationary lower stone
    and served as an axis around which the upper stone turned; ► used by a potter
    for making pottery
  glosses:
  - pottery wheel
  references:
  - JER-018-003
- sense_id: '000066001002000'
  domain: Tools
  definition: = set of two flat objects ◄ made of stone and used in Egypt ► on which
    a woman used to sit or kneel while giving birth
  glosses:
  - birthstool
  references:
  - EXO-001-016
related_lemmas:
- word: אֶבֶן
