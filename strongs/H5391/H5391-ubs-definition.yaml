senses:
- sense_id: 004935001001000
  domain: Impact
  definition: = action by which a person or animal uses teeth to cut into something,
    like another person or animal
  glosses:
  - to bite
  forms:
  - vbqal-
  - vbpiel
  references:
  - GEN-049-017
  - NUM-021-006
  - NUM-021-008
  - NUM-021-009
  - PRO-023-032
  - ECC-010-008
  - ECC-010-011
  - JER-008-017
  - AMO-005-019
  - AMO-009-003
- sense_id: 004935001002000
  domain: Ingest
  definition: 'literally: to bite; hence: = to ingest food'
  glosses:
  - to bite > to eat
  forms:
  - vbqal-
  references:
  - MIC-003-005
- sense_id: 004935002001000
  domain: Non-Possess
  definition: = action in which a person is required to pay interest to someone else
    for having borrowed money, food, or something of value
  glosses:
  - to pay interest
  forms:
  - vbqal-
  references:
  - DEU-023-020
- sense_id: 004935002002000
  domain: Non-Possess
  definition: = action in which a person requires someone to pay interest for having
    borrowed money, food, or something of value
  glosses:
  - to charge interest
  - to collect interest
  forms:
  - vbhif-
  references:
  - DEU-023-020
  - DEU-023-021
  - DEU-023-021
- sense_id: 004935002003000
  domain: People
  definition: = a person who has lent money, food, or something of value to someone
    else and requires that person to pay interest
  glosses:
  - creditor
  forms:
  - vbqal-ptca
  references:
  - HAB-002-007
