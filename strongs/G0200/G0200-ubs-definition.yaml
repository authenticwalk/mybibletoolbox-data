strongs_number: G0200
lemma: ἀκρίς
source: UBS/SDGNT
license: CC-BY-SA 4.0
senses:
- sense_id: 000196001001000
  louw_nida_code: '4.47'
  domain: Animals
  definition: six-legged winged insect characterized by the fact that its third pair
    of legs is elongated and adapted to hopping; Acrididae family; moves in swarms
    that migrate to new areas, which they colonize; at other times lives solitary
    or in small groups; eaten cooked by toasting, grilling, frying, or broiling, though
    in some places they are also eaten raw; because of their large numbers and swarming
    characteristics, locusts were a symbol of a vast attacking army against which
    there was no defense and also a symbol of divine punishment
  glosses:
  - grasshopper
  - locust
  references:
  - MAT-003-004
  - MRK-001-006
  - REV-009-003
  - REV-009-007
