  domain: Domestic Animals
  definition: = male bovine; ≈ symbol of deities and associated with power and strength,
    but also with aggression and therefore often used to denote people who behave
    as such
  glosses:
  - bull
  references:
  - PSA-050-013
- sense_id: '000045001002000'
  domain: Titles
  definition: = epithet for Apis, a deity shaped like a bull, ◄ worshiped by Egyptians
  glosses:
  - mighty (bull)
  references:
  - JER-046-015
- sense_id: '000045001003000'
  domain: Strong
  definition: = powerful person ◄ compared with a bull; ≈ associated with power, authority,
    and/or aggression
  glosses:
