- sense_id: '004702001003000'
  domain: Apart
  definition: 'literally: to wave; hence: = causative action by which humans hold
    a {L:sieve<SDBH:נָפָה>} and shake it in order to separate the grain from the remaining
    chaff and other particles to complete the process of winnowing; ≈ winnowing is
    often used as a figure of speech to denote the process of distinguishing between
    good and bad'
  glosses:
  - to sieve
  - to sift
  forms:
  - vbhif-
  references:
  - ISA-030-028
- sense_id: '004702001004000'
  domain: Stance
  definition: 'literally: to wave (one''s) hand; hence: = action by which humans or
    deities stretch out their arm and move it, ► often as a gesture or signal'
  glosses:
  - to wave (one's) hand
