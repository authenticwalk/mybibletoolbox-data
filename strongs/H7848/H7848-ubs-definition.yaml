senses:
- sense_id: 007308001001000
  domain: Plants
  definition: = a desert tree, reaching a height of 3-5 m, with a wide crown; it has
    sharp spines, finely divided leaves, and tiny pale yellow flowers arranged in
    drooping bunches; it produces a bean pod that is twisted and looped when dry;
    ◄ a member of the Mimosa family, Acacia tortilis or Acacia raddiana; ► its wood
    is used for construction
