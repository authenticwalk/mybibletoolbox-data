- sense_id: '006502001002000'
  domain: Angry
  definition: = process by which humans experience a sentiment of anger with regard
    to someone else, ◄ because that other person has qualities, privileges, or possessions
    that one feels one should have as well, or because that person lavishes favors
    on another party that one feels should be directed to oneself
  glosses:
  - to envy
  - to be envious
  - to be jealous of (someone else)
