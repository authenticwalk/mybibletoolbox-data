- sense_id: '006502001001000'
  domain: Angry
  definition: = process by which humans or deities experience a sentiment of anger
    for the sake of someone else, ◄ because that other person does not receive the
    attention, commitment, or treatment that they are entitled to
  glosses:
  - to be zealous
  - to be wrought up
  - to be concerned for
  forms:
  - vbpiel
