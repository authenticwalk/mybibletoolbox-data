    consisting of sheep and goats; ► hair or wool shorn for weaving into cloth; female
    milked for food; may be killed and eaten for meat; used as sacrificial animal;
    ≈ associated with large quantities and also with God's people, who are often seen
    as a flock with God as their shepherd
