verse: GEN 27:46
text: וַתֹּ֤אמֶר רִבְקָה֙ אֶל־יִצְחָ֔ק קַ֣צְתִּי בְחַיַּ֔י מִפְּנֵ֖י בְּנ֣וֹת חֵ֑ת
  אִם־לֹקֵ֣חַ יַ֠עֲקֹב אִשָּׁ֨ה מִבְּנֽוֹת־חֵ֤ת כָּאֵ֨לֶּה֙ מִבְּנ֣וֹת הָאָ֔רֶץ לָ֥מָּה
  לִּ֖י חַיִּֽים׃
