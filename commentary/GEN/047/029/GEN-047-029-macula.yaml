verse: GEN 47:29
text: וַיִּקְרְב֣וּ יְמֵֽי־יִשְׂרָאֵ֘ללָמוּת֒ וַיִּקְרָ֣א׀לִבְנ֣וֹ לְיוֹסֵ֗ף וַיֹּ֤אמֶר
  לוֹ֙ אִם־נָ֨א מָצָ֤אתִי חֵן֙ בְּעֵינֶ֔יךָ שִֽׂים־נָ֥א יָדְךָ֖ תַּ֣חַת יְרֵכִ֑י וְעָשִׂ֤יתָ
  עִמָּדִי֙ חֶ֣סֶד וֶאֱמֶ֔ת אַל־נָ֥א תִקְבְּרֵ֖נִי בְּמִצְרָֽיִם׃
