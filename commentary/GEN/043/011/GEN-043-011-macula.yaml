text: וַיֹּ֨אמֶר אֲלֵהֶ֜ם יִשְׂרָאֵ֣ל אֲבִיהֶ֗ם אִם־כֵּ֣ן׀אֵפוֹא֮ זֹ֣את עֲשׂוּ֒ קְח֞וּ
