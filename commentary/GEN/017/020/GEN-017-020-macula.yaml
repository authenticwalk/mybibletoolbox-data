text: וּֽלְיִשְׁמָעֵ֘אלשְׁמַעְתִּיךָ֒ הִנֵּ֣ה׀בֵּרַ֣כְתִּי אֹת֗וֹ וְהִפְרֵיתִ֥י אֹת֛וֹ
  וְהִרְבֵּיתִ֥י אֹת֖וֹ בִּמְאֹ֣ד מְאֹ֑ד שְׁנֵים־עָשָׂ֤ר נְשִׂיאִם֙ יוֹלִ֔יד וּנְתַתִּ֖יו
  לְג֥וֹי גָּדֽוֹל׃
