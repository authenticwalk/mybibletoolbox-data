text: וַיְדַבֵּ֨ר אֶל־עֶפְר֜וֹן בְּאָזְנֵ֤י עַם־הָאָ֨רֶץ֙ לֵאמֹ֔ר אַ֛ךְ אִם־אַתָּ֥ה
