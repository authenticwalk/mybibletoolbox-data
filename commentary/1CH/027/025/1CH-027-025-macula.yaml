text: 1CH 27:25 וְעַל֙ אֹצְר֣וֹת הַמֶּ֔לֶךְ עַזְמָ֖וֶת בֶּן־עֲדִיאֵ֑לסוְעַ֣ל הָֽאֹצָר֡וֹת
