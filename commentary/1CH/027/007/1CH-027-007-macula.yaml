text: 1CH 27:7 הָֽרְבִיעִ֞י לַחֹ֣דֶשׁ הָרְבִיעִ֗י עֲשָׂה־אֵל֙ אֲחִ֣י יוֹאָ֔ב וּזְבַדְיָ֥ה
