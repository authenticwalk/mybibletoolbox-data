verse: 1CH 27:1
text: 1CH 27:1 וּבְנֵ֣י יִשְׂרָאֵ֣ל׀לְֽמִסְפָּרָ֡ם רָאשֵׁ֣י הָאָב֣וֹת וְשָׂרֵ֣י הָֽאֲלָפִ֣ים׀וְהַמֵּא֡וֹת
  וְשֹׁטְרֵיהֶם֩ הַמְשָׁרְתִ֨ים אֶת־הַמֶּ֜לֶךְ לְכֹ֣ל׀דְּבַ֣ר הַֽמַּחְלְק֗וֹת הַבָּאָ֤ה
  וְהַיֹּצֵאת֙ חֹ֣דֶשׁ בְּחֹ֔דֶשׁ לְכֹ֖ל חָדְשֵׁ֣י הַשָּׁנָ֑ה הַֽמַּחֲלֹ֨קֶת֙ הָֽאַחַ֔ת
  עֶשְׂרִ֥ים וְאַרְבָּעָ֖ה אָֽלֶף׃ס
