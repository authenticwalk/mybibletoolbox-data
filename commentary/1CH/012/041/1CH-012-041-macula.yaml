verse: 1CH 12:41
text: 1CH 12:41 וְגַ֣ם הַקְּרֽוֹבִים־אֲ֠לֵיהֶם עַד־יִשָׂשכָ֨ר וּזְבֻל֜וּן וְנַפְתָּלִ֗י
  מְבִיאִ֣ים לֶ֡חֶם בַּחֲמוֹרִ֣ים וּבַגְּמַלִּ֣ים וּבַפְּרָדִ֣ים׀וּֽבַבָּקָ֡ר מַאֲכָ֡ל
  קֶ֠מַח דְּבֵלִ֨ים וְצִמּוּקִ֧ים וְיַֽיִן־וְשֶׁ֛מֶן וּבָקָ֥ר וְצֹ֖אן לָרֹ֑ב כִּ֥י
  שִׂמְחָ֖ה בְּיִשְׂרָאֵֽל׃פ
