text: 1CH 12:19 וְר֣וּחַ לָבְשָׁ֗ה אֶת־עֲמָשַׂי֮ רֹ֣אשׁ הַשָּׁלִישִׁים֒ לְךָ֤ דָוִיד֙
  וְעִמְּךָ֣ בֶן־יִשַׁ֔י שָׁל֨וֹם׀שָׁל֜וֹם לְךָ֗ וְשָׁלוֹם֙ לְעֹ֣זְרֶ֔ךָ כִּ֥י עֲזָרְךָ֖
  אֱלֹהֶ֑יךָ וַיְקַבְּלֵ֣ם דָּוִ֔יד וַֽיִּתְּנֵ֖ם בְּרָאשֵׁ֥י הַגְּדֽוּד׃פ
