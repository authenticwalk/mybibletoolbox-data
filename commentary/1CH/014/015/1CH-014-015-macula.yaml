text: 1CH 14:15 וִ֠יהִי כְּֽשָׁמְעֲךָ֞ אֶת־ק֤וֹל הַצְּעָדָה֙ בְּרָאשֵׁ֣י הַבְּכָאִ֔ים
  אָ֖ז תֵּצֵ֣א בַמִּלְחָמָ֑ה כִּֽי־יָצָ֤א הָֽאֱלֹהִים֙ לְפָנֶ֔יךָ לְהַכּ֖וֹת אֶת־מַחֲנֵ֥ה
  פְלִשְׁתִּֽים׃
