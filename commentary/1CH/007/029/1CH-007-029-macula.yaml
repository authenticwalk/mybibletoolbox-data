text: 1CH 7:29 וְעַל־יְדֵ֣י בְנֵי־מְנַשֶּׁ֗ה בֵּית־שְׁאָ֤ן וּבְנֹתֶ֨יהָ֙ תַּעְנַ֣ךְ
  וּבְנֹתֶ֔יהָ מְגִדּ֥וֹ וּבְנוֹתֶ֖יהָ דּ֣וֹר וּבְנוֹתֶ֑יהָ בְּאֵ֨לֶּה֙ יָשְׁב֔וּ
  בְּנֵ֥י יוֹסֵ֖ף בֶּן־יִשְׂרָאֵֽל׃פ
