verse: 1CH 25:3
text: 1CH 25:3 לִידוּת֑וּן בְּנֵ֣י יְדוּת֡וּן גְּדַלְיָ֡הוּ וּצְרִ֡י וִֽ֠ישַׁעְיָהוּ
  חֲשַׁבְיָ֨הוּ וּמַתִּתְיָ֜הוּ שִׁשָּׁ֗ה עַל֩ יְדֵ֨י אֲבִיהֶ֤ם יְדוּתוּן֙ בַּכִּנּ֔וֹר
  הַנִּבָּ֕א עַל־הֹד֥וֹת וְהַלֵּ֖ל לַיהוָֽה׃ס
