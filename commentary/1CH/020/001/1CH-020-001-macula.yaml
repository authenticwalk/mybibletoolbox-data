verse: 1CH 20:1
text: 1CH 20:1 וַיְהִ֡י לְעֵת֩ תְּשׁוּבַ֨ת הַשָּׁנָ֜ה לְעֵ֣ת׀צֵ֣את הַמְּלָכִ֗ים וַיִּנְהַ֣ג
  יוֹאָב֩ אֶת־חֵ֨יל הַצָּבָ֜א וַיַּשְׁחֵ֣ת׀אֶת־אֶ֣רֶץ בְּנֵֽי־עַמּ֗וֹן וַיָּבֹא֙ וַיָּ֣צַר
  אֶת־רַבָּ֔ה וְדָוִ֖יד יֹשֵׁ֣ב בִּירֽוּשָׁלִָ֑ם וַיַּ֥ךְ יוֹאָ֛ב אֶת־רַבָּ֖ה וַיֶּֽהֶרְסֶֽהָ׃
