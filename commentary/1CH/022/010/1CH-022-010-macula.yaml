text: 1CH 22:10 הֽוּא־יִבְנֶ֥ה בַ֨יִת֙ לִשְׁמִ֔י וְהוּא֙ יִהְיֶה־לִּ֣י לְבֵ֔ן וַאֲנִי־ל֖וֹ
