text: 1CH 22:13 אָ֣ז תַּצְלִ֔יחַ אִם־תִּשְׁמ֗וֹר לַעֲשׂוֹת֙ אֶת־הַֽחֻקִּ֣ים וְאֶת־הַמִּשְׁפָּטִ֔ים
