verse: 1CH 18:11
text: 1CH 18:11 גַּם־אֹתָ֗ם הִקְדִּ֞ישׁ הַמֶּ֤לֶךְ דָּוִיד֙ לַיהוָ֔ה עִם־הַכֶּ֨סֶף֙
  וְהַזָּהָ֔ב אֲשֶׁ֥ר נָשָׂ֖א מִכָּל־הַגּוֹיִ֑ם מֵֽאֱד֤וֹם וּמִמּוֹאָב֙ וּמִבְּנֵ֣י
  עַמּ֔וֹן וּמִפְּלִשְׁתִּ֖ים וּמֵֽעֲמָלֵֽק׃
