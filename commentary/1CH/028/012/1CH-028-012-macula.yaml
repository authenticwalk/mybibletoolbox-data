text: 1CH 28:12 וְתַבְנִ֗ית כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה בָר֨וּחַ֙ עִמּ֔וֹ לְחַצְר֧וֹת בֵּית־יְהוָ֛ה
