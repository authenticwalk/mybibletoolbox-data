text: 1CH 28:21 וְהִנֵּ֗ה מַחְלְקוֹת֙ הַכֹּהֲנִ֣ים וְהַלְוִיִּ֔ם לְכָל־עֲבוֹדַ֖ת בֵּ֣ית
