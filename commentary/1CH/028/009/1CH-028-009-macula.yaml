verse: 1CH 28:9
text: 1CH 28:9 וְאַתָּ֣ה שְׁלֹמֹֽה־בְנִ֡י דַּע֩ אֶת־אֱלֹהֵ֨י אָבִ֜יךָ וְעָבְדֵ֗הוּ
  בְּלֵ֤ב שָׁלֵם֙ וּבְנֶ֣פֶשׁ חֲפֵצָ֔ה כִּ֤י כָל־לְבָבוֹת֙ דּוֹרֵ֣שׁ יְהוָ֔ה וְכָל־יֵ֥צֶר
  מַחֲשָׁב֖וֹת מֵבִ֑ין אִֽם־תִּדְרְשֶׁ֨נּוּ֙ יִמָּ֣צֵא לָ֔ךְ וְאִם־תַּֽעַזְבֶ֖נּוּ
  יַזְנִיחֲךָ֥ לָעַֽד׃
