text: 1CH 28:17 וְהַמִּזְלָג֧וֹת וְהַמִּזְרָק֛וֹת וְהַקְּשָׂוֺ֖ת זָהָ֣ב טָה֑וֹר וְלִכְפוֹרֵ֨י
  הַזָּהָ֤ב בְּמִשְׁקָל֙ לִכְפ֣וֹר וּכְפ֔וֹר וְלִכְפוֹרֵ֥י הַכֶּ֛סֶף בְּמִשְׁקָ֖ל
  לִכְפ֥וֹר וּכְפֽוֹר׃
