text: 1CH 19:5 וַיֵּלְכוּ֩ וַיַּגִּ֨ידוּ לְדָוִ֤יד עַל־הָֽאֲנָשִׁים֙ וַיִּשְׁלַ֣ח
  לִקְרָאתָ֔ם כִּי־הָי֥וּ הָאֲנָשִׁ֖ים נִכְלָמִ֣ים מְאֹ֑ד וַיֹּ֤אמֶר הַמֶּ֨לֶךְ֙ שְׁב֣וּ
  בִֽירֵח֔וֹ עַ֛ד אֲשֶׁר־יְצַמַּ֥ח זְקַנְכֶ֖ם וְשַׁבְתֶּֽם׃
