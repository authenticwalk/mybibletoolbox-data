text: 1CH 24:31 וַיַּפִּילוּ֩ גַם־הֵ֨ם גּוֹרָל֜וֹת לְעֻמַּ֣ת׀אֲחֵיהֶ֣ם בְּנֵֽי־אַהֲרֹ֗ן
  לִפְנֵ֨י דָוִ֤יד הַמֶּ֨לֶךְ֙ וְצָד֣וֹק וַאֲחִימֶ֔לֶךְ וְרָאשֵׁי֙ הָֽאָב֔וֹת לַכֹּהֲנִ֖ים
  וְלַלְוִיִּ֑ם אָב֣וֹת הָרֹ֔אשׁ לְעֻמַּ֖ת אָחִ֥יו הַקָּטָֽן׃ס
