verse: 1CH 23:28
text: 1CH 23:28 כִּ֣י מַעֲמָדָ֞ם לְיַד־בְּנֵ֣י אַהֲרֹ֗ן לַעֲבֹדַת֙ בֵּ֣ית יְהוָ֔ה
  עַל־הַחֲצֵרוֹת֙ וְעַל־הַלְּשָׁכ֔וֹת וְעַֽל־טָהֳרַ֖ת לְכָל־קֹ֑דֶשׁ וּמַֽעֲשֵׂ֔ה עֲבֹדַ֖ת
  בֵּ֥ית הָאֱלֹהִֽים׃
