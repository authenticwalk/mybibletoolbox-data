verse: 1CH 10:7
text: 1CH 10:7 וַ֠יִּרְאוּ כָּל־אִ֨ישׁ יִשְׂרָאֵ֤ל אֲשֶׁר־בָּעֵ֨מֶק֙ כִּ֣י נָ֔סוּ
  וְכִי־מֵ֖תוּ שָׁא֣וּל וּבָנָ֑יו וַיַּעַזְב֤וּ עָרֵיהֶם֙ וַיָּנֻ֔סוּ וַיָּבֹ֣אוּ
  פְלִשְׁתִּ֔ים וַיֵּשְׁב֖וּ בָּהֶֽם׃ס
