text: 1CH 6:34 וְֽאַהֲרֹ֨ן וּבָנָ֜יו מַקְטִירִ֨ים עַל־מִזְבַּ֤ח הָֽעוֹלָה֙ וְעַל־מִזְבַּ֣ח
