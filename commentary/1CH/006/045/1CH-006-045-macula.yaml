text: 1CH 6:45 וּמִמַּטֵּ֣ה בִנְיָמִ֗ן אֶת־גֶּ֤בַע וְאֶת־מִגְרָשֶׁ֨יהָ֙ וְאֶת־עָלֶ֣מֶת
