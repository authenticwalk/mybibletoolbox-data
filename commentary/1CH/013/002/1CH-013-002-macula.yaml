verse: 1CH 13:2
text: 1CH 13:2 וַיֹּ֨אמֶר דָּוִ֜יד לְכֹ֣ל׀קְהַ֣ל יִשְׂרָאֵ֗ל אִם־עֲלֵיכֶ֨ם ט֜וֹב וּמִן־יְהוָ֣ה
  אֱלֹהֵ֗ינוּ נִפְרְצָה֙ נִשְׁלְחָ֞ה עַל־אַחֵ֣ינוּ הַנִּשְׁאָרִ֗ים בְּכֹל֙ אַרְצ֣וֹת
  יִשְׂרָאֵ֔ל וְעִמָּהֶ֛ם הַכֹּהֲנִ֥ים וְהַלְוִיִּ֖ם בְּעָרֵ֣י מִגְרְשֵׁיהֶ֑ם וְיִקָּבְצ֖וּ
  אֵלֵֽינוּ׃
