text: 1CH 29:20 וַיֹּ֤אמֶר דָּוִיד֙ לְכָל־הַקָּהָ֔ל בָּֽרְכוּ־נָ֖א אֶת־יְהוָ֣ה אֱלֹהֵיכֶ֑ם
