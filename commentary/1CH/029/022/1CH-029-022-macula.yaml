text: 1CH 29:22 וַיֹּאכְל֨וּ וַיִּשְׁתּ֜וּ לִפְנֵ֧י יְהוָ֛ה בַּיּ֥וֹם הַה֖וּא בְּשִׂמְחָ֣ה
