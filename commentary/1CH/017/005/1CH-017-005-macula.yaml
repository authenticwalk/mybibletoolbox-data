text: 1CH 17:5 כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּבַ֔יִת מִן־הַיּ֗וֹם אֲשֶׁ֤ר הֶעֱלֵ֨יתִי֙
