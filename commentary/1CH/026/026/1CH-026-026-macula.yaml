text: 1CH 26:26 ה֧וּא שְׁלֹמ֣וֹת וְאֶחָ֗יו עַ֣ל כָּל־אֹצְר֤וֹת הַקֳּדָשִׁים֙ אֲשֶׁ֨ר
  הִקְדִּ֜ישׁ דָּוִ֣יד הַמֶּ֗לֶךְ וְרָאשֵׁ֧י הָאָב֛וֹת לְשָׂרֵֽי־הָאֲלָפִ֥ים וְהַמֵּא֖וֹת
  וְשָׂרֵ֥י הַצָּבָֽא׃
