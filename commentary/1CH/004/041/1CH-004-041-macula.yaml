verse: 1CH 4:41
text: 1CH 4:41 וַיָּבֹ֡אוּ אֵלֶּה֩ הַכְּתוּבִ֨ים בְּשֵׁמ֜וֹת בִּימֵ֣י׀יְחִזְקִיָּ֣הוּ
  מֶֽלֶךְ־יְהוּדָ֗ה וַיַּכּ֨וּ אֶת־אָהֳלֵיהֶ֜ם וְאֶת־הַמְּעוּנִ֨ים אֲשֶׁ֤ר נִמְצְאוּ־שָׁ֨מָּה֙
  וַיַּחֲרִימֻם֙ עַד־הַיּ֣וֹם הַזֶּ֔ה וַיֵּשְׁב֖וּ תַּחְתֵּיהֶ֑ם כִּֽי־מִרְעֶ֥ה לְצֹאנָ֖ם
  שָֽׁם׃
