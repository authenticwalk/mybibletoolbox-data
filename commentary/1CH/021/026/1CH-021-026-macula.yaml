text: 1CH 21:26 וַיִּבֶן֩ שָׁ֨ם דָּוִ֤יד מִזְבֵּ֨חַ֙ לַיהוָ֔ה וַיַּ֥עַל עֹל֖וֹת וּשְׁלָמִ֑ים
