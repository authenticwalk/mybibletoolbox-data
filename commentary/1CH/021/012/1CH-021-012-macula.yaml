verse: 1CH 21:12
text: 1CH 21:12 אִם־שָׁל֨וֹשׁ שָׁנִ֜ים רָעָ֗ב וְאִם־שְׁלֹשָׁ֨ה חֳדָשִׁ֜ים נִסְפֶּ֥ה
  מִפְּנֵי־צָרֶיךָ֮ וְחֶ֣רֶב אוֹיְבֶ֣ךָ׀לְמַשֶּׂגֶת֒ וְאִם־שְׁלֹ֣שֶׁת יָ֠מִים חֶ֣רֶב
  יְהוָ֤ה וְדֶ֨בֶר֙ בָּאָ֔רֶץ וּמַלְאַ֣ךְ יְהוָ֔ה מַשְׁחִ֖ית בְּכָל־גְּב֣וּל יִשְׂרָאֵ֑ל
  וְעַתָּ֣ה רְאֵ֔ה מָֽה־אָשִׁ֥יב אֶת־שֹׁלְחִ֖י דָּבָֽר׃פ
