text: יִ֠שָּׂאֻהוּ עַל־כָּתֵ֨ף יִסְבְּלֻ֜הוּ וְיַנִּיחֻ֤הוּ תַחְתָּיו֙ וְיַֽעֲמֹ֔ד
  מִמְּקוֹמ֖וֹ לֹ֣א יָמִ֑ישׁ אַף־יִצְעַ֤ק אֵלָיו֙ וְלֹ֣א יַעֲנֶ֔ה מִצָּרָת֖וֹ לֹ֥א
  יוֹשִׁיעֶֽנּוּ׃ס
