verse: ISA 22:24
text: וְתָל֨וּ עָלָ֜יו כֹּ֣ל׀כְּב֣וֹד בֵּית־אָבִ֗יו הַצֶּֽאֱצָאִים֙ וְהַצְּפִע֔וֹת
  כֹּ֖ל כְּלֵ֣י הַקָּטָ֑ן מִכְּלֵי֙ הָֽאַגָּנ֔וֹת וְעַ֖ד כָּל־כְּלֵ֥י הַנְּבָלִֽים׃
