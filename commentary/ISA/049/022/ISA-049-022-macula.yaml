text: כֹּֽה־אָמַ֞ר אֲדֹנָ֣י יְהוִ֗ה הִנֵּ֨ה אֶשָּׂ֤א אֶל־גּוֹיִם֙ יָדִ֔י וְאֶל־עַמִּ֖ים
