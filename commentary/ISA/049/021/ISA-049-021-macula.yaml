verse: ISA 49:21
text: וְאָמַ֣רְתְּ בִּלְבָבֵ֗ךְ מִ֤י יָֽלַד־לִי֙ אֶת־אֵ֔לֶּה וַאֲנִ֥י שְׁכוּלָ֖ה וְגַלְמוּדָ֑ה
  גֹּלָ֣ה׀וְסוּרָ֗ה וְאֵ֨לֶּה֙ מִ֣י גִדֵּ֔ל הֵ֤ן אֲנִי֙ נִשְׁאַ֣רְתִּי לְבַדִּ֔י אֵ֖לֶּה
  אֵיפֹ֥ה הֵֽם׃פ
