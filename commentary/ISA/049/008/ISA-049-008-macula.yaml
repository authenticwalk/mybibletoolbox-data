verse: ISA 49:8
text: כֹּ֣ה׀אָמַ֣ר יְהוָ֗ה בְּעֵ֤ת רָצוֹן֙ עֲנִיתִ֔יךָ וּבְי֥וֹם יְשׁוּעָ֖ה עֲזַרְתִּ֑יךָ
