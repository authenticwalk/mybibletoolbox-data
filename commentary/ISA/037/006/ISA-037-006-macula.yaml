verse: ISA 37:6
text: וַיֹּ֤אמֶר אֲלֵיהֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּן אֶל־אֲדֹנֵיכֶ֑ם כֹּ֣ה׀אָמַ֣ר
