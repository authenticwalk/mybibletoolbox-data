text: עַ֣ל הַר־גָּבֹ֤הַ עֲלִי־לָךְ֙ מְבַשֶּׂ֣רֶת צִיּ֔וֹן הָרִ֤ימִי בַכֹּ֨חַ֙ קוֹלֵ֔ךְ
