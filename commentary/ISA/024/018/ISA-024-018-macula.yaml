text: וְֽ֠הָיָה הַנָּ֞ס מִקּ֤וֹל הַפַּ֨חַד֙ יִפֹּ֣ל אֶל־הַפַּ֔חַת וְהָֽעוֹלֶה֙ מִתּ֣וֹךְ
  הַפַּ֔חַת יִלָּכֵ֖ד בַּפָּ֑ח כִּֽי־אֲרֻבּ֤וֹת מִמָּרוֹם֙ נִפְתָּ֔חוּ וַֽיִּרְעֲשׁ֖וּ
  מ֥וֹסְדֵי אָֽרֶץ׃
