text: וַיֹּאמַ֗ר אָנָּ֤ה יְהוָה֙ זְכָר־נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְפָנֶ֗יךָ
