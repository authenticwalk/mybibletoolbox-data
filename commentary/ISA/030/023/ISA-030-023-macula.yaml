text: וְנָתַן֩ מְטַ֨ר זַרְעֲךָ֜ אֲשֶׁר־תִּזְרַ֣ע אֶת־הָאֲדָמָ֗ה וְלֶ֨חֶם֙ תְּבוּאַ֣ת
