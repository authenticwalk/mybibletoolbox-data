verse: ISA 54:17
text: כָּל־כְּלִ֞י יוּצַ֤ר עָלַ֨יִךְ֙ לֹ֣א יִצְלָ֔ח וְכָל־לָשׁ֛וֹן תָּֽקוּם־אִתָּ֥ךְ
  לַמִּשְׁפָּ֖ט תַּרְשִׁ֑יעִי זֹ֡את נַחֲלַת֩ עַבְדֵ֨י יְהוָ֧ה וְצִדְקָתָ֛ם מֵאִתִּ֖י
  נְאֻם־יְהוָֽה׃ס
