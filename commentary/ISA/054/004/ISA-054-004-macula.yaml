verse: ISA 54:4
text: אַל־תִּֽירְאִי֙ כִּי־לֹ֣א תֵב֔וֹשִׁי וְאַל־תִּכָּלְמִ֖י כִּ֣י לֹ֣א תַחְפִּ֑ירִי
  כִּ֣י בֹ֤שֶׁת עֲלוּמַ֨יִךְ֙ תִּשְׁכָּ֔חִי וְחֶרְפַּ֥ת אַלְמְנוּתַ֖יִךְ לֹ֥א תִזְכְּרִי־עֽוֹד׃
