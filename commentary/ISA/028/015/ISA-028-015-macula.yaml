verse: ISA 28:15
text: כִּ֣י אֲמַרְתֶּ֗ם כָּרַ֤תְנֽוּ בְרִית֙ אֶת־מָ֔וֶת וְעִם־שְׁא֖וֹל עָשִׂ֣ינוּ
  חֹזֶ֑ה שׁ֣וֹט שׁוֹטֵ֤ף כִּֽי־יַֽעֲבֹר֙ לֹ֣א יְבוֹאֵ֔נוּ כִּ֣י שַׂ֧מְנוּ כָזָ֛ב מַחְסֵ֖נוּ
  וּבַשֶּׁ֥קֶר נִסְתָּֽרְנוּ׃ס
