verse: ISA 36:12
text: וַיֹּ֣אמֶר רַב־שָׁקֵ֗ה הַאֶ֨ל אֲדֹנֶ֤יךָ וְאֵלֶ֨יךָ֙ שְׁלָחַ֣נִי אֲדֹנִ֔י לְדַבֵּ֖ר
  אֶת־הַדְּבָרִ֣ים הָאֵ֑לֶּה הֲלֹ֣א עַל־הָאֲנָשִׁ֗ים הַיֹּֽשְׁבִים֙ עַל־הַ֣חוֹמָ֔ה
  לֶאֱכֹ֣ל אֶת־צוֹאָתָ֗ם וְלִשְׁתּ֛וֹת אֶת־מֵימֵ֥י רַגְלֵיהֶ֖ם עִמָּכֶֽם׃
