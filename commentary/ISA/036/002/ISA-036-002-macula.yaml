verse: ISA 36:2
text: וַיִּשְׁלַ֣ח מֶֽלֶךְ־אַשּׁ֣וּר׀אֶת־רַב־שָׁקֵ֨ה מִלָּכִ֧ישׁ יְרוּשָׁלְַ֛מָה אֶל־הַמֶּ֥לֶךְ
  חִזְקִיָּ֖הוּ בְּחֵ֣יל כָּבֵ֑ד וַֽיַּעֲמֹ֗ד בִּתְעָלַת֙ הַבְּרֵכָ֣ה הָעֶלְיוֹנָ֔ה
  בִּמְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס׃
