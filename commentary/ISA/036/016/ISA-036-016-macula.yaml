verse: ISA 36:16
text: אַֽל־תִּשְׁמְע֖וּ אֶל־חִזְקִיָּ֑הוּסכִּי֩ כֹ֨ה אָמַ֜ר הַמֶּ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ־אִתִּ֤י
  בְרָכָה֙ וּצְא֣וּ אֵלַ֔י וְאִכְל֤וּ אִישׁ־גַּפְנוֹ֙ וְאִ֣ישׁ תְּאֵנָת֔וֹ וּשְׁת֖וּ
  אִ֥ישׁ מֵי־בוֹרֽוֹ׃
