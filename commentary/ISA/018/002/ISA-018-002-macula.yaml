verse: ISA 18:2
text: הַשֹּׁלֵ֨חַ בַּיָּ֜ם צִירִ֗ים וּבִכְלֵי־גֹמֶא֮ עַל־פְּנֵי־מַיִם֒ לְכ֣וּ׀מַלְאָכִ֣ים
  קַלִּ֗ים אֶל־גּוֹי֙ מְמֻשָּׁ֣ךְ וּמוֹרָ֔ט אֶל־עַ֥ם נוֹרָ֖א מִן־ה֣וּא וָהָ֑לְאָה
  גּ֚וֹי קַו־קָ֣ו וּמְבוּסָ֔ה אֲשֶׁר־בָּזְא֥וּ נְהָרִ֖ים אַרְצֽוֹ׃
