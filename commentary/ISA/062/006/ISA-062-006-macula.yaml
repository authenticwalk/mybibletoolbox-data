verse: ISA 62:6
text: עַל־חוֹמֹתַ֣יִךְ יְרוּשָׁלִַ֗ם הִפְקַ֨דְתִּי֙ שֹֽׁמְרִ֔ים כָּל־הַיּ֧וֹם וְכָל־הַלַּ֛יְלָה
  תָּמִ֖יד לֹ֣א יֶחֱשׁ֑וּ הַמַּזְכִּרִים֙ אֶת־יְהוָ֔ה אַל־דֳּמִ֖י לָכֶֽם׃
