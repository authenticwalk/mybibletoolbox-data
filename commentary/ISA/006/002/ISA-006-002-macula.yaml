text: שְׂרָפִ֨ים עֹמְדִ֤ים׀מִמַּ֨עַל֙ ל֔וֹ שֵׁ֧שׁ כְּנָפַ֛יִם שֵׁ֥שׁ כְּנָפַ֖יִם לְאֶחָ֑ד
  בִּשְׁתַּ֣יִם׀יְכַסֶּ֣ה פָנָ֗יו וּבִשְׁתַּ֛יִם יְכַסֶּ֥ה רַגְלָ֖יו וּבִשְׁתַּ֥יִם
  יְעוֹפֵֽף׃
