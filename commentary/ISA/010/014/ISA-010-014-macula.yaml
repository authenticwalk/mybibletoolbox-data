text: וַתִּמְצָ֨א כַקֵּ֤ן׀יָדִי֙ לְחֵ֣יל הָֽעַמִּ֔ים וְכֶאֱסֹף֙ בֵּיצִ֣ים עֲזֻב֔וֹת
