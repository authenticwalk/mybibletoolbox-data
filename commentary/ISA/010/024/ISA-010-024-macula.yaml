verse: ISA 10:24
text: לָכֵ֗ן כֹּֽה־אָמַ֞ר אֲדֹנָ֤י יְהוִה֙ צְבָא֔וֹת אַל־תִּירָ֥א עַמִּ֛י יֹשֵׁ֥ב
  צִיּ֖וֹן מֵֽאַשּׁ֑וּר בַּשֵּׁ֣בֶט יַכֶּ֔כָּה וּמַטֵּ֥הוּ יִשָּֽׂא־עָלֶ֖יךָ בְּדֶ֥רֶךְ
  מִצְרָֽיִם׃
