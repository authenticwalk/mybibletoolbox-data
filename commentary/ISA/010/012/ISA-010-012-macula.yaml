text: וְהָיָ֗ה כִּֽי־יְבַצַּ֤ע אֲדֹנָי֙ אֶת־כָּל־מַֽעֲשֵׂ֔הוּ בְּהַ֥ר צִיּ֖וֹן וּבִירוּשָׁלִָ֑ם
