text: בָּעֵ֣ת הַהִ֗יא דִּבֶּ֣ר יְהוָה֮ בְּיַ֣ד יְשַׁעְיָ֣הוּ בֶן־אָמוֹץ֮ לֵאמֹר֒ לֵ֗ךְ
