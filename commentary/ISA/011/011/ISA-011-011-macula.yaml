text: וְהָיָ֣ה׀בַּיּ֣וֹם הַה֗וּא יוֹסִ֨יף אֲדֹנָ֤י׀שֵׁנִית֙ יָד֔וֹ לִקְנ֖וֹת אֶת־שְׁאָ֣ר
