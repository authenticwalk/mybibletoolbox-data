verse: ISA 65:13
text: לָכֵ֞ן כֹּה־אָמַ֣ר׀אֲדֹנָ֣י יְהוִ֗ה הִנֵּ֨ה עֲבָדַ֤י׀יֹאכֵ֨לוּ֙ וְאַתֶּ֣ם תִּרְעָ֔בוּ
  הִנֵּ֧ה עֲבָדַ֛י יִשְׁתּ֖וּ וְאַתֶּ֣ם תִּצְמָ֑אוּ הִנֵּ֧ה עֲבָדַ֛י יִשְׂמָ֖חוּ וְאַתֶּ֥ם
  תֵּבֹֽשׁוּ׃
