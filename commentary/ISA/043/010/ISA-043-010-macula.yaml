verse: ISA 43:10
text: אַתֶּ֤ם עֵדַי֙ נְאֻם־יְהוָ֔ה וְעַבְדִּ֖י אֲשֶׁ֣ר בָּחָ֑רְתִּי לְמַ֣עַן תֵּ֠דְעוּ
  וְתַאֲמִ֨ינוּ לִ֤י וְתָבִ֨ינוּ֙ כִּֽי־אֲנִ֣י ה֔וּא לְפָנַי֙ לֹא־נ֣וֹצַר אֵ֔ל וְאַחֲרַ֖י
  לֹ֥א יִהְיֶֽה׃ס
