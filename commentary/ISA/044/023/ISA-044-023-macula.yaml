verse: ISA 44:23
text: רָנּ֨וּ שָׁמַ֜יִם כִּֽי־עָשָׂ֣ה יְהוָ֗ה הָרִ֨יעוּ֙ תַּחְתִּיּ֣וֹת אָ֔רֶץ פִּצְח֤וּ
  הָרִים֙ רִנָּ֔ה יַ֖עַר וְכָל־עֵ֣ץ בּ֑וֹ כִּֽי־גָאַ֤ל יְהוָה֙ יַֽעֲקֹ֔ב וּבְיִשְׂרָאֵ֖ל
  יִתְפָּאָֽר׃פ
