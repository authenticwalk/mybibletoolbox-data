text: וְכִֽי־יֹאמְר֣וּ אֲלֵיכֶ֗ם דִּרְשׁ֤וּ אֶל־הָאֹבוֹת֙ וְאֶל־הַיִּדְּעֹנִ֔ים הַֽמְצַפְצְפִ֖ים
