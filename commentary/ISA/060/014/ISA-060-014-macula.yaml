text: וְהָלְכ֨וּ אֵלַ֤יִךְ שְׁח֨וֹחַ֙ בְּנֵ֣י מְעַנַּ֔יִךְ וְהִֽשְׁתַּחֲו֛וּ עַל־כַּפּ֥וֹת
