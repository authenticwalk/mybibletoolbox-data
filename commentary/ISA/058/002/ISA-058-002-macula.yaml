verse: ISA 58:2
text: וְאוֹתִ֗י י֥וֹם יוֹם֙ יִדְרֹשׁ֔וּן וְדַ֥עַת דְּרָכַ֖י יֶחְפָּצ֑וּן כְּג֞וֹי
  אֲשֶׁר־צְדָקָ֣ה עָשָׂ֗ה וּמִשְׁפַּ֤ט אֱלֹהָיו֙ לֹ֣א עָזָ֔ב יִשְׁאָל֨וּנִי֙ מִשְׁפְּטֵי־צֶ֔דֶק
  קִרְבַ֥ת אֱלֹהִ֖ים יֶחְפָּצֽוּן׃
