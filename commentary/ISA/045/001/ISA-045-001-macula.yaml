verse: ISA 45:1
text: כֹּה־אָמַ֣ר יְהוָה֮ לִמְשִׁיחוֹ֮ לְכ֣וֹרֶשׁ אֲשֶׁר־הֶחֱזַ֣קְתִּי בִֽימִינ֗וֹ
  לְרַד־לְפָנָיו֙ גּוֹיִ֔ם וּמָתְנֵ֥י מְלָכִ֖ים אֲפַתֵּ֑חַ לִפְתֹּ֤חַ לְפָנָיו֙ דְּלָתַ֔יִם
  וּשְׁעָרִ֖ים לֹ֥א יִסָּגֵֽרוּ׃
