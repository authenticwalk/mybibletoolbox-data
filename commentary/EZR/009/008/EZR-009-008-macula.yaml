text: וְעַתָּ֡ה כִּמְעַט־רֶגַע֩ הָיְתָ֨ה תְחִנָּ֜ה מֵאֵ֣ת׀יְהוָ֣ה אֱלֹהֵ֗ינוּ לְהַשְׁאִ֥יר
