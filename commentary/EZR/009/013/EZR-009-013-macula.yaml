verse: EZR 9:13
text: וְאַֽחֲרֵי֙ כָּל־הַבָּ֣א עָלֵ֔ינוּ בְּמַעֲשֵׂ֨ינוּ֙ הָרָעִ֔ים וּבְאַשְׁמָתֵ֖נוּ
  הַגְּדֹלָ֑ה כִּ֣י׀אַתָּ֣ה אֱלֹהֵ֗ינוּ חָשַׂ֤כְתָּֽ לְמַ֨טָּה֙ מֵֽעֲוֺנֵ֔נוּ וְנָתַ֥תָּה
  לָּ֛נוּ פְּלֵיטָ֖ה כָּזֹֽאת׃
