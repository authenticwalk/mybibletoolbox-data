verse: EZR 4:7
text: וּבִימֵ֣י אַרְתַּחְשַׁ֗שְׂתָּא כָּתַ֨ב בִּשְׁלָ֜ם מִתְרְדָ֤ת טָֽבְאֵל֙ וּשְׁאָ֣ר
  כְּנָוֺתָ֔יו עַל־אַרְתַּחְשַׁ֖שְׂתְּ מֶ֣לֶךְ פָּרָ֑ס וּכְתָב֙הַֽנִּשְׁתְּוָ֔ן כָּת֥וּב
  אֲרָמִ֖ית וּמְתֻרְגָּ֥ם אֲרָמִֽית׃פ
