text: יְדִ֨יעַ֙ לֶהֱוֵ֣א לְמַלְכָּ֔א דִּ֣י יְהוּדָיֵ֗א דִּ֤י סְלִ֨קוּ֙ מִן־לְוָתָ֔ךְ
