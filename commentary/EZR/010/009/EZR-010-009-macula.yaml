text: וַיִּקָּבְצ֣וּ כָל־אַנְשֵֽׁי־יְהוּדָה֩ וּבִנְיָמִ֨ן׀יְרוּשָׁלִַ֜ם לִשְׁלֹ֣שֶׁת
