verse: EZR 6:22
text: וַיַּֽעֲשׂ֧וּ חַג־מַצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּשִׂמְחָ֑ה כִּ֣י׀שִׂמְּחָ֣ם יְהוָ֗ה
