verse: EZR 8:31
text: וַֽנִּסְעָ֞ה מִנְּהַ֣ר אַֽהֲוָ֗א בִּשְׁנֵ֤ים עָשָׂר֙ לַחֹ֣דֶשׁ הָרִאשׁ֔וֹן לָלֶ֖כֶת
  יְרוּשָׁלִָ֑ם וְיַד־אֱלֹהֵ֨ינוּ֙ הָיְתָ֣ה עָלֵ֔ינוּ וַיַּ֨צִּילֵ֔נוּ מִכַּ֥ף אוֹיֵ֛ב
  וְאוֹרֵ֖ב עַל־הַדָּֽרֶךְ׃
