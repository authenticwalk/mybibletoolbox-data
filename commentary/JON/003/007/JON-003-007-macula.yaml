verse: JON 3:7
text: וַיַּזְעֵ֗ק וַיֹּ֨אמֶר֙ בְּנִֽינְוֵ֔ה מִטַּ֧עַם הַמֶּ֛לֶךְ וּגְדֹלָ֖יו לֵאמֹ֑ר
