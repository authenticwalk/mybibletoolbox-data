verse: EST 3:6
text: וַיִּ֣בֶז בְּעֵינָ֗יו לִשְׁלֹ֤חיָד֙ בְּמָרְדֳּכַ֣י לְבַדּ֔וֹ כִּֽי־הִגִּ֥ידוּ
