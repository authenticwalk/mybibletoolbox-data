verse: EST 3:1
text: אַחַ֣ר׀הַדְּבָרִ֣ים הָאֵ֗לֶּה גִּדַּל֩ הַמֶּ֨לֶךְ אֲחַשְׁוֵר֜וֹשׁ אֶת־הָמָ֧ן
  בֶּֽן־הַמְּדָ֛תָא הָאֲגָגִ֖י וַֽיְנַשְּׂאֵ֑הוּ וַיָּ֨שֶׂם֙ אֶת־כִּסְא֔וֹ מֵעַ֕ל
  כָּל־הַשָּׂרִ֖ים אֲשֶׁ֥ר אִתּֽוֹ׃
