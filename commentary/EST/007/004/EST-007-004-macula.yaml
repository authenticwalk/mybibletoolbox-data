verse: EST 7:4
text: כִּ֤י נִמְכַּ֨רְנוּ֙ אֲנִ֣י וְעַמִּ֔י לְהַשְׁמִ֖יד לַהֲר֣וֹג וּלְאַבֵּ֑ד וְ֠אִלּוּ
  לַעֲבָדִ֨ים וְלִשְׁפָח֤וֹת נִמְכַּ֨רְנוּ֙ הֶחֱרַ֔שְׁתִּי כִּ֣י אֵ֥ין הַצָּ֛ר שֹׁוֶ֖ה
  בְּנֵ֥זֶק הַמֶּֽלֶךְ׃ס
