version: 1.0.0
language: heb
verse: EST 4:16
text: לֵךְ֩ כְּנ֨וֹס אֶת־כָּל־הַיְּהוּדִ֜ים הַֽנִּמְצְאִ֣ים בְּשׁוּשָׁ֗ן וְצ֣וּמוּ
  עָ֠לַי וְאַל־תֹּאכְל֨וּ וְאַל־תִּשְׁתּ֜וּ שְׁלֹ֤שֶׁת יָמִים֙ לַ֣יְלָה וָי֔וֹם גַּם־אֲנִ֥י
  וְנַעֲרֹתַ֖י אָצ֣וּם כֵּ֑ן וּבְכֵ֞ן אָב֤וֹא אֶל־הַמֶּ֨לֶךְ֙ אֲשֶׁ֣ר לֹֽא־כַדָּ֔ת
  וְכַאֲשֶׁ֥ר אָבַ֖דְתִּי אָבָֽדְתִּי׃
