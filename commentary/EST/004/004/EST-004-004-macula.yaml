text: וַ֠תָּבוֹאינָהנַעֲר֨וֹת אֶסְתֵּ֤ר וְסָרִיסֶ֨יהָ֙ וַיַּגִּ֣ידוּ לָ֔הּ וַתִּתְחַלְחַ֥ל
