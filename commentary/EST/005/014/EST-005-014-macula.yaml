verse: EST 5:14
text: וַתֹּ֣אמֶר לוֹ֩ זֶ֨רֶשׁ אִשְׁתּ֜וֹ וְכָל־אֹֽהֲבָ֗יו יַֽעֲשׂוּ־עֵץ֮ גָּבֹ֣הַּ
  חֲמִשִּׁ֣ים אַמָּה֒ וּבַבֹּ֣קֶר׀אֱמֹ֣ר לַמֶּ֗לֶךְ וְיִתְל֤וּ אֶֽת־מָרְדֳּכַי֙ עָלָ֔יו
  וּבֹֽא־עִם־הַמֶּ֥לֶךְ אֶלהַמִּשְׁתֶּ֖ה שָׂמֵ֑חַ וַיִּיטַ֧ב הַדָּבָ֛ר לִפְנֵ֥י הָמָ֖ן
  וַיַּ֥עַשׂ הָעֵֽץ׃פ
