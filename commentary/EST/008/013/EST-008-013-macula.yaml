verse: EST 8:13
text: פַּתְשֶׁ֣גֶן הַכְּתָ֗ב לְהִנָּ֤תֵֽן דָּת֙ בְּכָל־מְדִינָ֣ה וּמְדִינָ֔ה גָּל֖וּי
  לְכָל־הָעַמִּ֑ים וְלִהְי֨וֹת הַיְּהוּדִ֤ים עֲתִידִים֙ לַיּ֣וֹם הַזֶּ֔ה לְהִנָּקֵ֖ם
  מֵאֹיְבֵיהֶֽם׃
