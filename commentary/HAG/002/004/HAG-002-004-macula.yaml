text: וְעַתָּ֣ה חֲזַ֣ק זְרֻבָּבֶ֣ל׀נְאֻם־יְהוָ֡ה וַחֲזַ֣ק יְהוֹשֻׁ֣עַ בֶּן־יְהוֹצָדָק֩
