text: 2KI 2:16 וַיֹּאמְר֣וּ אֵלָ֡יו הִנֵּה־נָ֣א יֵֽשׁ־אֶת־עֲבָדֶיךָ֩ חֲמִשִּׁ֨ים אֲנָשִׁ֜ים
  בְּנֵֽי־חַ֗יִל יֵ֣לְכוּ נָא֮ וִיבַקְשׁ֣וּ אֶת־אֲדֹנֶיךָ֒ פֶּן־נְשָׂאוֹ֙ ר֣וּחַ יְהוָ֔ה
  וַיַּשְׁלִכֵ֨הוּ֙ בְּאַחַ֣ד הֶהָרִ֔ים א֖וֹ בְּאַחַ֣ת הַגֵּאָי֑וֹת וַיֹּ֖אמֶר לֹ֥א
  תִשְׁלָֽחוּ׃
