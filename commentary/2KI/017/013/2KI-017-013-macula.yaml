verse: 2KI 17:13
text: 2KI 17:13 וַיָּ֣עַד יְהוָ֡ה בְּיִשְׂרָאֵ֣ל וּבִיהוּדָ֡ה בְּיַד֩ כָּל־נְבִיאֵ֨י
  כָל־חֹזֶ֜ה לֵאמֹ֗ר שֻׁ֝֠בוּ מִדַּרְכֵיכֶ֤ם הָֽרָעִים֙ וְשִׁמְרוּ֙ מִצְוֺתַ֣י חֻקּוֹתַ֔י
  כְּכָ֨ל־הַתּוֹרָ֔ה אֲשֶׁ֥ר צִוִּ֖יתִי אֶת־אֲבֹֽתֵיכֶ֑ם וַֽאֲשֶׁר֙ שָׁלַ֣חְתִּי אֲלֵיכֶ֔ם
  בְּיַ֖ד עֲבָדַ֥י הַנְּבִיאִֽים׃
