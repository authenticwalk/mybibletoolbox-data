  כְּשָׁנָ֣ה בְשָׁנָ֑ה וַֽיַּעַצְרֵ֨הוּ֙ מֶ֣לֶךְ אַשּׁ֔וּר וַיַּאַסְרֵ֖הוּ בֵּ֥ית
  כֶּֽלֶא׃
