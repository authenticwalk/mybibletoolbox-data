text: 2KI 17:4 וַיִּמְצָא֩ מֶֽלֶךְ־אַשּׁ֨וּר בְּהוֹשֵׁ֜עַ קֶ֗שֶׁר אֲשֶׁ֨ר שָׁלַ֤ח
