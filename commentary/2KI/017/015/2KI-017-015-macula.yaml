verse: 2KI 17:15
text: 2KI 17:15 וַיִּמְאֲס֣וּ אֶת־חֻקָּ֗יו וְאֶת־בְּרִיתוֹ֙ אֲשֶׁ֣ר כָּרַ֣ת אֶת־אֲבוֹתָ֔ם
  וְאֵת֙ עֵֽדְוֺתָ֔יו אֲשֶׁ֥ר הֵעִ֖יד בָּ֑ם וַיֵּ֨לְכ֜וּאַחֲרֵ֤י הַהֶ֨בֶל֙ וַיֶּהְבָּ֔לוּ
  וְאַחֲרֵ֤י הַגּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתָ֔ם אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֹתָ֔ם לְבִלְתִּ֖י
  עֲשׂ֥וֹת כָּהֶֽם׃
