text: 2KI 17:16 וַיַּעַזְב֗וּ אֶת־כָּל־מִצְוֺת֙ יְהוָ֣ה אֱלֹהֵיהֶ֔ם וַיַּעֲשׂ֥וּ לָהֶ֛ם
