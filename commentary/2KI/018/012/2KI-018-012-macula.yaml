text: 2KI 18:12 עַ֣ל׀אֲשֶׁ֣ר לֹֽא־שָׁמְע֗וּ בְּקוֹל֙ יְהוָ֣ה אֱלֹהֵיהֶ֔ם וַיַּעַבְרוּ֙
