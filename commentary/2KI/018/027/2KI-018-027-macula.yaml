text: 2KI 18:27 וַיֹּ֨אמֶר אֲלֵיהֶ֜ם רַב־שָׁקֵ֗ה הַעַ֨ל אֲדֹנֶ֤יךָ וְאֵלֶ֨יךָ֙ שְׁלָחַ֣נִי
  אֲדֹנִ֔י לְדַבֵּ֖ר אֶת־הַדְּבָרִ֣ים הָאֵ֑לֶּה הֲלֹ֣א עַל־הָאֲנָשִׁ֗ים הַיֹּֽשְׁבִים֙
  עַל־הַ֣חֹמָ֔ה לֶאֱכֹ֣ל אֶתצוֹאָתָ֗ם וְלִשְׁתּ֛וֹת אֶת־מימֵ֥י רַגְלֵיהֶ֖םעִמָּכֶֽם׃
