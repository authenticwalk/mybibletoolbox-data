verse: 2KI 23:29
text: 2KI 23:29 בְּיָמָ֡יו עָלָה֩ פַרְעֹ֨ה נְכֹ֧ה מֶֽלֶךְ־מִצְרַ֛יִם עַל־מֶ֥לֶךְ אַשּׁ֖וּר
  עַל־נְהַר־פְּרָ֑ת וַיֵּ֨לֶךְ הַמֶּ֤לֶךְ יֹאשִׁיָּ֨הוּ֙ לִקְרָאת֔וֹ וַיְמִיתֵ֨הוּ֙
  בִּמְגִדּ֔וֹ כִּרְאֹת֖וֹ אֹתֽוֹ׃
