text: 2KI 23:19 וְגַם֩ אֶת־כָּל־בָּתֵּ֨י הַבָּמ֜וֹת אֲשֶׁ֣ר׀בְּעָרֵ֣י שֹׁמְר֗וֹן אֲשֶׁ֨ר
