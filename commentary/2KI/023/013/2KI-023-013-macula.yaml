verse: 2KI 23:13
text: 2KI 23:13 וְֽאֶת־הַבָּמ֞וֹת אֲשֶׁ֣ר׀עַל־פְּנֵ֣י יְרוּשָׁלִַ֗ם אֲשֶׁר֮ מִימִ֣ין
  לְהַר־הַמַּשְׁחִית֒ אֲשֶׁ֣ר בָּ֠נָה שְׁלֹמֹ֨ה מֶֽלֶךְ־יִשְׂרָאֵ֜ל לְעַשְׁתֹּ֣רֶת׀שִׁקֻּ֣ץ
  צִידֹנִ֗ים וְלִכְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב וּלְמִלְכֹּ֖ם תּוֹעֲבַ֣ת בְּנֵֽי־עַמּ֑וֹן
  טִמֵּ֖א הַמֶּֽלֶךְ׃
