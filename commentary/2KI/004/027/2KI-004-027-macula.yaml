text: 2KI 4:27 וַתָּבֹ֞א אֶל־אִ֤ישׁ הָֽאֱלֹהִים֙ אֶל־הָהָ֔ר וַֽתַּחֲזֵ֖ק בְּרַגְלָ֑יו
