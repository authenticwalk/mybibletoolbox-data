text: 2KI 4:25 וַתֵּ֗לֶךְ וַתָּב֛וֹא אֶל־אִ֥ישׁ הָאֱלֹהִ֖ים אֶל־הַ֣ר הַכַּרְמֶ֑ל וַ֠יְהִי
