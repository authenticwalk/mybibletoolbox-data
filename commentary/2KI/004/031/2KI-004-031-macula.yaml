text: 2KI 4:31 וְגֵחֲזִ֞י עָבַ֣ר לִפְנֵיהֶ֗ם וַיָּ֤שֶׂם אֶת־הַמִּשְׁעֶ֨נֶת֙ עַל־פְּנֵ֣י
