text: 2KI 4:39 וַיֵּצֵ֨א אֶחָ֣ד אֶל־הַשָּׂדֶה֮ לְלַקֵּ֣ט אֹרֹת֒ וַיִּמְצָא֙ גֶּ֣פֶן
  שָׂדֶ֔ה וַיְלַקֵּ֥ט מִמֶּ֛נּוּ פַּקֻּעֹ֥ת שָׂדֶ֖ה מְלֹ֣א בִגְד֑וֹ וַיָּבֹ֗א וַיְפַלַּ֛ח
  אֶל־סִ֥יר הַנָּזִ֖יד כִּֽי־לֹ֥א יָדָֽעוּ׃
