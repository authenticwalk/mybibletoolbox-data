text: 2KI 4:35 וַיָּ֜שָׁב וַיֵּ֣לֶךְ בַּבַּ֗יִת אַחַ֥ת הֵ֨נָּה֙ וְאַחַ֣ת הֵ֔נָּה וַיַּ֖עַל
