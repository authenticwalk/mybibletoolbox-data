text: 2KI 14:13 וְאֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ־יְהוּדָ֜ה בֶּן־יְהוֹאָ֣שׁ בֶּן־אֲחַזְיָ֗הוּ
  תָּפַ֛שׂ יְהוֹאָ֥שׁ מֶֽלֶךְ־יִשְׂרָאֵ֖ל בְּבֵ֣ית שָׁ֑מֶשׁ וַיָּבֹא֙ יְר֣וּשָׁלִַ֔ם
  וַיִּפְרֹץ֩ בְּחוֹמַ֨ת יְרוּשָׁלִַ֜ם בְּשַׁ֤עַר אֶפְרַ֨יִם֙ עַד־שַׁ֣עַר הַפִּנָּ֔ה
  אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה׃
