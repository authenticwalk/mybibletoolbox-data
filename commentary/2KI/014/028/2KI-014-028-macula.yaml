text: 2KI 14:28 וְיֶתֶר֩ דִּבְרֵ֨י יָרָבְעָ֜ם וְכָל־אֲשֶׁ֤ר עָשָׂה֙ וּגְבוּרָת֣וֹ
  אֲשֶׁר־נִלְחָ֔ם וַאֲשֶׁ֨ר הֵשִׁ֜יב אֶת־דַּמֶּ֧שֶׂק וְאֶת־חֲמָ֛ת לִיהוּדָ֖ה בְּיִשְׂרָאֵ֑ל
  הֲלֹא־הֵ֣ם כְּתוּבִ֗ים עַל־סֵ֛פֶר דִּבְרֵ֥י הַיָּמִ֖ים לְמַלְכֵ֥י יִשְׂרָאֵֽל׃
