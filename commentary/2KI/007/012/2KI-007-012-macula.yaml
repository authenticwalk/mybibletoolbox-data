verse: 2KI 7:12
text: 2KI 7:12 וַיָּ֨קָם הַמֶּ֜לֶךְ לַ֗יְלָה וַיֹּ֨אמֶר֙ אֶל־עֲבָדָ֔יו אַגִּֽידָה־נָּ֣א
  לָכֶ֔ם אֵ֛ת אֲשֶׁר־עָ֥שׂוּ לָ֖נוּ אֲרָ֑ם יָדְע֞וּ כִּי־רְעֵבִ֣ים אֲנַ֗חְנוּ וַיֵּצְא֤וּ
  מִן־הַֽמַּחֲנֶה֙ לְהֵחָבֵ֤ה בַשָּׂדֶה֙ לֵאמֹ֔ר כִּֽי־יֵצְא֤וּ מִן־הָעִיר֙ וְנִתְפְּשֵׂ֣ם
  חַיִּ֔ים וְאֶל־הָעִ֖יר נָבֹֽא׃
