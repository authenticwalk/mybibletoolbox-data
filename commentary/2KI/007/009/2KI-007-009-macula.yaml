text: 2KI 7:9 וַיֹּאמְרוּ֩ אִ֨ישׁ אֶל־רֵעֵ֜הוּ לֹֽא־כֵ֣ן׀אֲנַ֣חְנוּ עֹשִׂ֗ים הַיּ֤וֹם
