text: 2KI 3:13 וַיֹּ֨אמֶר אֱלִישָׁ֜ע אֶל־מֶ֤לֶךְ יִשְׂרָאֵל֙ מַה־לִּ֣י וָלָ֔ךְ לֵ֚ךְ
  אֶל־נְבִיאֵ֣י אָבִ֔יךָ וְאֶל־נְבִיאֵ֖י אִמֶּ֑ךָ וַיֹּ֤אמֶר לוֹ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל
