text: 2KI 3:25 וְהֶעָרִ֣ים יַהֲרֹ֡סוּ וְכָל־חֶלְקָ֣ה ט֠וֹבָה יַשְׁלִ֨יכוּ אִישׁ־אַבְנ֜וֹ
  וּמִלְא֗וּהָ וְכָל־מַעְיַן־מַ֤יִם יִסְתֹּ֨מוּ֙ וְכָל־עֵֽץ־ט֣וֹב יַפִּ֔ילוּ עַד־הִשְׁאִ֧יר
  אֲבָנֶ֛יהָ בַּקִּ֖יר חֲרָ֑שֶׂת וַיָּסֹ֥בּוּ הַקַּלָּעִ֖ים וַיַּכּֽוּהָ׃
