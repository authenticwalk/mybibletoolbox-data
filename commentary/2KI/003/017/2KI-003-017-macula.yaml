text: 2KI 3:17 כִּֽי־כֹ֣ה׀אָמַ֣ר יְהוָ֗ה לֹֽא־תִרְא֥וּ ר֨וּחַ֙ וְלֹֽא־תִרְא֣וּ גֶ֔שֶׁם
