text: 2KI 20:20 וְיֶ֨תֶר דִּבְרֵ֤י חִזְקִיָּ֨הוּ֙ וְכָל־גְּב֣וּרָת֔וֹ וַאֲשֶׁ֣ר עָשָׂ֗ה
