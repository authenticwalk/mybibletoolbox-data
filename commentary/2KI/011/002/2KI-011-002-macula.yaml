verse: 2KI 11:2
text: 2KI 11:2 וַתִּקַּ֣ח יְהוֹשֶׁ֣בַע בַּת־הַמֶּֽלֶךְ־י֠וֹרָם אֲח֨וֹת אֲחַזְיָ֜הוּ
  אֶת־יוֹאָ֣שׁ בֶּן־אֲחַזְיָ֗ה וַתִּגְנֹ֤ב אֹתוֹ֙ מִתּ֤וֹךְ בְּנֵֽי־הַמֶּ֨לֶךְ֙ הַמּ֣וּמָתִ֔ים
  אֹת֥וֹ וְאֶת־מֵינִקְתּ֖וֹ בַּחֲדַ֣ר הַמִּטּ֑וֹת וַיַּסְתִּ֧רוּ אֹת֛וֹ מִפְּנֵ֥י
  עֲתַלְיָ֖הוּ וְלֹ֥א הוּמָֽת׃
