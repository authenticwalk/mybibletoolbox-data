text: 2KI 11:9 וַֽיַּעֲשׂ֞וּ שָׂרֵ֣י הַמֵּא֗וֹת כְּכֹ֣ל אֲשֶׁר־צִוָּה֮ יְהוֹיָדָ֣ע
