text: 2KI 22:19 יַ֠עַן רַךְ־לְבָ֨בְךָ֜ וַתִּכָּנַ֣ע׀מִפְּנֵ֣י יְהוָ֗ה בְּֽשָׁמְעֲךָ֡
  אֲשֶׁ֣ר דִּבַּרְתִּי֩ עַל־הַמָּק֨וֹם הַזֶּ֜ה וְעַל־יֹשְׁבָ֗יו לִהְי֤וֹת לְשַׁמָּה֙
  וְלִקְלָלָ֔ה וַתִּקְרַע֙ אֶת־בְּגָדֶ֔יךָ וַתִּבְכֶּ֖ה לְפָנָ֑י וְגַ֧ם אָנֹכִ֛י שָׁמַ֖עְתִּי
  נְאֻם־יְהוָֽה׃
