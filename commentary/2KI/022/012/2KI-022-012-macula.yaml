text: 2KI 22:12 וַיְצַ֣ו הַמֶּ֡לֶךְ אֶת־חִלְקִיָּ֣ה הַכֹּהֵ֡ן וְאֶת־אֲחִיקָ֣ם בֶּן־שָׁ֠פָן
