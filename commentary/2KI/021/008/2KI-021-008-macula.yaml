text: 2KI 21:8 וְלֹ֣א אֹסִ֗יף לְהָנִיד֙ רֶ֣גֶל יִשְׂרָאֵ֔ל מִן־הָ֣אֲדָמָ֔ה אֲשֶׁ֥ר
  נָתַ֖תִּי לַֽאֲבוֹתָ֑ם רַ֣ק׀אִם־יִשְׁמְר֣וּ לַעֲשׂ֗וֹת כְּכֹל֙ אֲשֶׁ֣ר צִוִּיתִ֔ים
  וּלְכָל־הַ֨תּוֹרָ֔ה אֲשֶׁר־צִוָּ֥ה אֹתָ֖ם עַבְדִּ֥י מֹשֶֽׁה׃
