text: 2KI 5:23 וַיֹּ֣אמֶר נַעֲמָ֔ן הוֹאֵ֖ל קַ֣ח כִּכָּרָ֑יִם וַיִּפְרָץ־בּ֗וֹ וַיָּצַר֩
