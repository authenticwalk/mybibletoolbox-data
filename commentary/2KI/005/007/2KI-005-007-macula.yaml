text: 2KI 5:7 וַיְהִ֡י כִּקְרֹא֩ מֶֽלֶךְ־יִשְׂרָאֵ֨ל אֶת־הַסֵּ֜פֶר וַיִּקְרַ֣ע בְּגָדָ֗יו
  וַיֹּ֨אמֶר֙ הַאֱלֹהִ֥ים אָ֨נִי֙ לְהָמִ֣ית וּֽלְהַחֲי֔וֹת כִּֽי־זֶה֙ שֹׁלֵ֣חַ אֵלַ֔י
  לֶאֱסֹ֥ף אִ֖ישׁ מִצָּֽרַעְתּ֑וֹ כִּ֤י אַךְ־דְּעֽוּ־נָא֙ וּרְא֔וּ כִּֽי־מִתְאַנֶּ֥ה
  ה֖וּא לִֽי׃
