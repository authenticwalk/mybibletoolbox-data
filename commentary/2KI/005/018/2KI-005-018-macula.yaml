text: 2KI 5:18 לַדָּבָ֣ר הַזֶּ֔ה יִסְלַ֥ח יְהוָ֖ה לְעַבְדֶּ֑ךָ בְּב֣וֹא אֲדֹנִ֣י בֵית־רִמּוֹן֩
  לְהִשְׁתַּחֲוֺ֨ת שָׁ֜מָּה וְה֣וּא׀נִשְׁעָ֣ן עַל־יָדִ֗י וְהִֽשְׁתַּחֲוֵ֨יתִי֙ בֵּ֣ית
  רִמֹּ֔ן בְּהִשְׁתַּחֲוָיָ֨תִי֙ בֵּ֣ית רִמֹּ֔ן יִסְלַח־יְהוָ֥ה לְעַבְדְּךָ֖ בַּדָּבָ֥ר
  הַזֶּֽה׃
