text: 2KI 9:18 וַיֵּלֶךְ֩ רֹכֵ֨ב הַסּ֜וּס לִקְרָאת֗וֹ וַיֹּ֨אמֶר֙ כֹּֽה־אָמַ֤ר הַמֶּ֨לֶךְ֙
