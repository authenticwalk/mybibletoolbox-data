text: 2KI 9:25 וַיֹּ֗אמֶר אֶל־בִּדְקַר֙ שָֽׁלִשׁ֔וֹ שָׂ֚א הַשְׁלִכֵ֔הוּ בְּחֶלְקַ֕ת
