text: 2KI 9:26 אִם־לֹ֡א אֶת־דְּמֵ֣י נָבוֹת֩ וְאֶת־דְּמֵ֨י בָנָ֜יו רָאִ֤יתִי אֶ֨מֶשׁ֙
