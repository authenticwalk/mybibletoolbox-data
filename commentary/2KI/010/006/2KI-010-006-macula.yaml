text: 2KI 10:6 וַיִּכְתֹּ֣ב אֲלֵיהֶם֩ סֵ֨פֶר׀שֵׁנִ֜ית לֵאמֹ֗ר אִם־לִ֨י אַתֶּ֜ם וּלְקֹלִ֣י׀אַתֶּ֣ם
  שֹׁמְעִ֗ים קְחוּ֙ אֶת־רָאשֵׁי֙ אַנְשֵׁ֣י בְנֵֽי־אֲדֹנֵיכֶ֔ם וּבֹ֧אוּ אֵלַ֛י כָּעֵ֥ת
  מָחָ֖ר יִזְרְעֶ֑אלָה וּבְנֵ֤י הַמֶּ֨לֶךְ֙ שִׁבְעִ֣ים אִ֔ישׁ אֶת־גְּדֹלֵ֥י הָעִ֖יר
  מְגַדְּלִ֥ים אוֹתָֽם׃
