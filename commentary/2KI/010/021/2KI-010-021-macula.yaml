verse: 2KI 10:21
text: 2KI 10:21 וַיִּשְׁלַ֤ח יֵהוּא֙ בְּכָל־יִשְׂרָאֵ֔ל וַיָּבֹ֨אוּ֙ כָּל־עֹבְדֵ֣י
  הַבַּ֔עַל וְלֹֽא־נִשְׁאַ֥ר אִ֖ישׁ אֲשֶׁ֣ר לֹֽא־בָ֑א וַיָּבֹ֨אוּ֙ בֵּ֣ית הַבַּ֔עַל
  וַיִּמָּלֵ֥א בֵית־הַבַּ֖עַל פֶּ֥ה לָפֶֽה׃
