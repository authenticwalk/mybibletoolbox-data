text: 2KI 13:21 וַיְהִ֞י הֵ֣ם׀קֹבְרִ֣ים אִ֗ישׁ וְהִנֵּה֙ רָא֣וּ אֶֽת־הַגְּד֔וּד וַיַּשְׁלִ֥יכוּ
