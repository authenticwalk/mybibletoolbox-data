text: 2KI 13:12 וְיֶ֨תֶר דִּבְרֵ֤י יוֹאָשׁ֙ וְכָל־אֲשֶׁ֣ר עָשָׂ֔ה וּגְב֣וּרָת֔וֹ אֲשֶׁ֣ר
