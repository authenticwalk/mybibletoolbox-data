text: 2KI 1:3 וּמַלְאַ֣ךְ יְהוָ֗ה דִּבֶּר֙ אֶל־אֵלִיָּ֣ה הַתִּשְׁבִּ֔י ק֣וּם עֲלֵ֔ה
