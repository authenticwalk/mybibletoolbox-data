text: 2KI 1:16 וַיְדַבֵּ֨ר אֵלָ֜יו כֹּֽה־אָמַ֣ר יְהוָ֗ה יַ֜עַן אֲשֶׁר־שָׁלַ֣חְתָּ
  מַלְאָכִים֮ לִדְרֹשׁ֮ בְּבַ֣עַל זְבוּב֮ אֱלֹהֵ֣י עֶקְרוֹן֒ הַֽמִבְּלִ֤י אֵין־אֱלֹהִים֙
  בְּיִשְׂרָאֵ֔ל לִדְרֹ֖שׁ בִּדְבָר֑וֹ לָ֠כֵן הַמִּטָּ֞ה אֲשֶׁר־עָלִ֥יתָ שָּׁ֛ם לֹֽא־תֵרֵ֥ד
  מִמֶּ֖נָּה כִּֽי־מ֥וֹת תָּמֽוּת׃
