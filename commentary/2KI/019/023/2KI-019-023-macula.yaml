text: 2KI 19:23 בְּיַ֣ד מַלְאָכֶיךָ֮ חֵרַ֣פְתָּ׀אֲדֹנָי֒ וַתֹּ֗אמֶר בְּרֹ֥ב רִכְבִּ֛י
  אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְאֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָיו֙
  מִבְח֣וֹר בְּרֹשָׁ֔יו וְאָב֨וֹאָה֙ מְל֣וֹן קִצֹּ֔היַ֖עַר כַּרְמִלּֽוֹ׃
