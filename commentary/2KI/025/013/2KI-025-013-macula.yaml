text: 2KI 25:13 וְאֶת־עַמּוּדֵ֨י הַנְּחֹ֜שֶׁת אֲשֶׁ֣ר בֵּית־יְהוָ֗ה וְֽאֶת־הַמְּכֹנ֞וֹת
