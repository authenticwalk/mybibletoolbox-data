verse: 2KI 25:19
text: 2KI 25:19 וּמִן־הָעִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר־ה֥וּא פָקִ֣יד׀עַל־אַנְשֵׁ֣י
  הַמִּלְחָמָ֗ה וַחֲמִשָּׁ֨ה אֲנָשִׁ֜ים מֵרֹאֵ֤י פְנֵֽי־הַמֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ
  בָעִ֔יר וְאֵ֗ת הַסֹּפֵר֙ שַׂ֣ר הַצָּבָ֔א הַמַּצְבִּ֖א אֶת־עַ֣ם הָאָ֑רֶץ וְשִׁשִּׁ֥ים
  אִישׁ֙ מֵעַ֣ם הָאָ֔רֶץ הַֽנִּמְצְאִ֖ים בָּעִֽיר׃
