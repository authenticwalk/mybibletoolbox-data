text: 2KI 25:17 שְׁמֹנֶה֩ עֶשְׂרֵ֨ה אַמָּ֜ה קוֹמַ֣ת׀הָעַמּ֣וּד הָאֶחָ֗ד וְכֹתֶ֨רֶת
  עָלָ֥יו׀נְחֹשֶׁת֮ וְקוֹמַ֣ת הַכֹּתֶרֶת֮ שָׁלֹ֣שׁ אַמּוֹת֒ וּשְׂבָכָ֨ה וְרִמֹּנִ֧ים
  עַֽל־הַכֹּתֶ֛רֶת סָבִ֖יב הַכֹּ֣ל נְחֹ֑שֶׁת וְכָאֵ֛לֶּה לַֽעַמּ֥וּד הַשֵּׁנִ֖י עַל־הַשְּׂבָכָֽה׃
