verse: 2KI 25:11
text: 2KI 25:11 וְאֵת֩ יֶ֨תֶר הָעָ֜ם הַנִּשְׁאָרִ֣ים בָּעִ֗יר וְאֶת־הַנֹּֽפְלִים֙
  אֲשֶׁ֤ר נָפְלוּ֙ עַל־הַמֶּ֣לֶךְ בָּבֶ֔ל וְאֵ֖ת יֶ֣תֶר הֶהָמ֑וֹן הֶגְלָ֕ה נְבוּזַרְאֲדָ֖ן
  רַב־טַבָּחִֽים׃
