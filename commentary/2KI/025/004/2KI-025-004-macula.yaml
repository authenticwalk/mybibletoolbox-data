text: 2KI 25:4 וַתִּבָּקַ֣ע הָעִ֗יר וְכָל־אַנְשֵׁ֨י הַמִּלְחָמָ֤ה׀הַלַּ֨יְלָה֙ דֶּ֜רֶךְ
