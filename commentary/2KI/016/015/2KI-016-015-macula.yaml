verse: 2KI 16:15
text: 2KI 16:15 וַיְצַוֶּ֣ה הַמֶּֽלֶךְ־אָ֠חָז אֶת־אוּרִיָּ֨ה הַכֹּהֵ֜ן לֵאמֹ֗ר עַ֣ל
  הַמִּזְבֵּ֣חַ הַגָּד֡וֹל הַקְטֵ֣ר אֶת־עֹֽלַת־הַבֹּקֶר֩ וְאֶת־מִנְחַ֨ת הָעֶ֜רֶב וְֽאֶת־עֹלַ֧ת
  הַמֶּ֣לֶךְ וְאֶת־מִנְחָת֗וֹ וְ֠אֵת עֹלַ֞ת כָּל־עַ֤ם הָאָ֨רֶץ֙ וּמִנְחָתָ֣ם וְנִסְכֵּיהֶ֔ם
  וְכָל־דַּ֥ם עֹלָ֛ה וְכָל־דַּם־זֶ֖בַח עָלָ֣יו תִּזְרֹ֑ק וּמִזְבַּ֧ח הַנְּחֹ֛שֶׁת
  יִֽהְיֶה־לִּ֖י לְבַקֵּֽר׃
