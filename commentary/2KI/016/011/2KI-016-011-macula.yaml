text: 2KI 16:11 וַיִּ֛בֶן אוּרִיָּ֥ה הַכֹּהֵ֖ן אֶת־הַמִּזְבֵּ֑חַ כְּכֹ֣ל אֲשֶׁר־שָׁלַח֩
