text: 2KI 16:10 וַיֵּ֣לֶךְ הַמֶּ֣לֶךְ אָחָ֡ז לִ֠קְרַאת תִּגְלַ֨ת פִּלְאֶ֤סֶר מֶֽלֶךְ־אַשּׁוּר֙
  דּוּמֶּ֔שֶׂק וַיַּ֥רְא אֶת־הַמִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּדַמָּ֑שֶׂק וַיִּשְׁלַח֩ הַמֶּ֨לֶךְ
  אָחָ֜ז אֶל־אוּרִיָּ֣ה הַכֹּהֵ֗ן אֶת־דְּמ֧וּת הַמִּזְבֵּ֛חַ וְאֶת־תַּבְנִית֖וֹ לְכָֽל־מַעֲשֵֽׂהוּ׃
