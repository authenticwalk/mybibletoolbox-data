text: וַיְהִ֞י כַּֽאֲשֶׁר־שָׁמְע֤וּ אוֹיְבֵ֨ינוּ֙ כִּי־נ֣וֹדַֽעלָ֔נוּ וַיָּ֥פֶר הָאֱלֹהִ֖ים
