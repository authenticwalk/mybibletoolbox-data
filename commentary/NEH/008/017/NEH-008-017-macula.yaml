text: וַיַּֽעֲשׂ֣וּ כָֽל־הַ֠קָּהָל הַשָּׁבִ֨ים מִן־הַשְּׁבִ֥י׀סֻכּוֹת֮ וַיֵּשְׁב֣וּ
