verse: NEH 8:7
text: וְיֵשׁ֡וּעַ וּבָנִ֡י וְשֵׁרֵ֥בְיָ֣ה׀יָמִ֡ין עַקּ֡וּב שַׁבְּתַ֣י׀הֽוֹדִיָּ֡ה
