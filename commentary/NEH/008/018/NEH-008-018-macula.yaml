verse: NEH 8:18
text: וַ֠יִּקְרָא בְּסֵ֨פֶר תּוֹרַ֤ת הָאֱלֹהִים֙ י֣וֹם׀בְּי֔וֹם מִן־הַיּוֹם֙ הָֽרִאשׁ֔וֹן
  עַ֖ד הַיּ֣וֹם הָאַחֲר֑וֹן וַיַּֽעֲשׂוּ־חָג֙ שִׁבְעַ֣ת יָמִ֔ים וּבַיּ֧וֹם הַשְּׁמִינִ֛י
  עֲצֶ֖רֶת כַּמִּשְׁפָּֽט׃פ
