verse: NEH 8:15
text: וַאֲשֶׁ֣ר יַשְׁמִ֗יעוּ וְיַעֲבִ֨ירוּ ק֥וֹל בְּכָל־עָרֵיהֶם֮ וּבִירוּשָׁלִַ֣ם
  לֵאמֹר֒ צְא֣וּ הָהָ֗ר וְהָבִ֨יאוּ֙ עֲלֵי־זַ֨יִת֙ וַעֲלֵי־עֵ֣ץ שֶׁ֔מֶן וַעֲלֵ֤י הֲדַס֙
  וַעֲלֵ֣י תְמָרִ֔ים וַעֲלֵ֖י עֵ֣ץ עָבֹ֑ת לַעֲשֹׂ֥ת סֻכֹּ֖ת כַּכָּתֽוּב׃פ
