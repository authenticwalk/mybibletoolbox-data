verse: NEH 8:13
text: וּבַיּ֣וֹם הַשֵּׁנִ֡י נֶאֶסְפוּ֩ רָאשֵׁ֨י הָאָב֜וֹת לְכָל־הָעָ֗ם הַכֹּֽהֲנִים֙
