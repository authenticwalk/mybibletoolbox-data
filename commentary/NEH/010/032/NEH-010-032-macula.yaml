verse: NEH 10:32
text: וְעַמֵּ֣י הָאָ֡רֶץ הַֽמְבִיאִים֩ אֶת־הַמַּקָּח֨וֹת וְכָל־שֶׁ֜בֶר בְּי֤וֹם הַשַּׁבָּת֙
  לִמְכּ֔וֹר לֹא־נִקַּ֥ח מֵהֶ֛ם בַּשַּׁבָּ֖ת וּבְי֣וֹם קֹ֑דֶשׁ וְנִטֹּ֛שׁ אֶת־הַשָּׁנָ֥ה
  הַשְּׁבִיעִ֖ית וּמַשָּׁ֥א כָל־יָֽד׃
