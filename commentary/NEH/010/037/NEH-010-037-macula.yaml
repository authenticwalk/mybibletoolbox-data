text: וְאֶת־בְּכֹר֤וֹת בָּנֵ֨ינוּ֙ וּבְהֶמְתֵּ֔ינוּ כַּכָּת֖וּב בַּתּוֹרָ֑ה וְאֶת־בְּכוֹרֵ֨י
