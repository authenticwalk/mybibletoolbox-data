verse: NEH 9:26
text: וַיַּמְר֨וּ וַֽיִּמְרְד֜וּ בָּ֗ךְ וַיַּשְׁלִ֤כוּ אֶת־תּוֹרָֽתְךָ֙ אַחֲרֵ֣י גַוָּ֔ם
