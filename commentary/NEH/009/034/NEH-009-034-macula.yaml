verse: NEH 9:34
text: וְאֶת־מְלָכֵ֤ינוּ שָׂרֵ֨ינוּ֙ כֹּהֲנֵ֣ינוּ וַאֲבֹתֵ֔ינוּ לֹ֥א עָשׂ֖וּ תּוֹרָתֶ֑ךָ
