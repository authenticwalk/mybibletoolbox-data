verse: NEH 2:12
text: וָאָק֣וּם׀לַ֗יְלָה אֲנִי֮ וַאֲנָשִׁ֣ים׀מְעַט֮ עִמִּי֒ וְלֹא־הִגַּ֣דְתִּי לְאָדָ֔ם
