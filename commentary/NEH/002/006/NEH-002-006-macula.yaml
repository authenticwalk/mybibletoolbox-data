verse: NEH 2:6
text: וַיֹּאמֶר֩ לִ֨י הַמֶּ֜לֶךְ וְהַשֵּׁגַ֣ל׀יוֹשֶׁ֣בֶת אֶצְל֗וֹ עַד־מָתַ֛י יִהְיֶ֥ה
  מַֽהֲלָכֲךָ֖ וּמָתַ֣י תָּשׁ֑וּב וַיִּיטַ֤ב לִפְנֵֽי־הַמֶּ֨לֶךְ֙ וַיִּשְׁלָחֵ֔נִי
  וָֽאֶתְּנָ֥ה ל֖וֹ זְמָֽן׃
