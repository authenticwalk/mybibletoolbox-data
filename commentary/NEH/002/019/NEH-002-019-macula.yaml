text: וַיִּשְׁמַע֩ סַנְבַלַּ֨ט הַחֹרֹנִ֜י וְטֹבִיָּ֣ה׀הָעֶ֣בֶד הָֽעַמּוֹנִ֗י וְגֶ֨שֶׁם֙
