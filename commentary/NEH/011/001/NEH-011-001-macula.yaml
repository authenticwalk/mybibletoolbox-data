verse: NEH 11:1
text: וַיֵּשְׁב֥וּ שָׂרֵֽי־הָעָ֖ם בִּירוּשָׁלִָ֑ם וּשְׁאָ֣ר הָ֠עָם הִפִּ֨ילוּ גוֹרָל֜וֹת
  לְהָבִ֣יא׀אֶחָ֣ד מִן־הָעֲשָׂרָ֗ה לָשֶׁ֨בֶת֙ בִּֽירוּשָׁלִַ֨ם֙ עִ֣יר הַקֹּ֔דֶשׁ וְתֵ֥שַׁע
  הַיָּד֖וֹת בֶּעָרִֽים׃
