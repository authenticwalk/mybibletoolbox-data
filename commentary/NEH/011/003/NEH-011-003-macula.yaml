text: וְאֵ֨לֶּה֙ רָאשֵׁ֣י הַמְּדִינָ֔ה אֲשֶׁ֥ר יָשְׁב֖וּ בִּירוּשָׁלִָ֑ם וּבְעָרֵ֣י
