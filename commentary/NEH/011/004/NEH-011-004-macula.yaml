verse: NEH 11:4
text: וּבִֽירוּשָׁלִַ֨ם֙ יָֽשְׁב֔וּ מִבְּנֵ֥י יְהוּדָ֖ה וּמִבְּנֵ֣י בִנְיָמִ֑ן מִבְּנֵ֣י
  יְ֠הוּדָה עֲתָיָ֨ה בֶן־עֻזִּיָּ֜ה בֶּן־זְכַרְיָ֧ה בֶן־אֲמַרְיָ֛ה בֶּן־שְׁפַטְיָ֥ה
  בֶן־מַהֲלַלְאֵ֖ל מִבְּנֵי־פָֽרֶץ׃
