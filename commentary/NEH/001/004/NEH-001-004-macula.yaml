verse: NEH 1:4
text: וַיְהִ֞י כְּשָׁמְעִ֣י׀אֶת־הַדְּבָרִ֣ים הָאֵ֗לֶּה יָשַׁ֨בְתִּי֙ וָֽאֶבְכֶּ֔ה
