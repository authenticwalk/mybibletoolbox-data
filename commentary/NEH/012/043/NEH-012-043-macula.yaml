verse: NEH 12:43
text: וַיִּזְבְּח֣וּ בַיּוֹם־הַ֠הוּא זְבָחִ֨ים גְּדוֹלִ֜ים וַיִּשְׂמָ֗חוּ כִּ֤י הָאֱלֹהִים֙
  שִׂמְּחָם֙ שִׂמְחָ֣ה גְדוֹלָ֔ה וְגַ֧ם הַנָּשִׁ֛ים וְהַיְלָדִ֖ים שָׂמֵ֑חוּ וַתִּשָּׁמַ֛ע
  שִׂמְחַ֥ת יְרוּשָׁלִַ֖ם מֵרָחֽוֹק׃
