text: וְי֨וֹם֙ הַשְּׁבִיעִ֔ישַׁבָּ֖תלַיהוָ֣האֱלֹהֶ֑יךָלֹ֣א תַעֲשֶׂ֣ה כָל־מְלָאכָ֡ה
  אַתָּ֣ה וּבִנְךָֽ־וּבִתֶּ֣ךָ וְעַבְדְּךָֽ־וַ֠אֲמָתֶךָ וְשׁוֹרְךָ֨ וַחֲמֹֽרְךָ֜ וְכָל־בְּהֶמְתֶּ֗ךָ
  וְגֵֽרְךָ֙ אֲשֶׁ֣ר בִּשְׁעָרֶ֔יךָ לְמַ֗עַן יָנ֛וּחַ עַבְדְּךָ֥ וַאֲמָתְךָ֖ כָּמֽוֹךָ
