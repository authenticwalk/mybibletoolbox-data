text: וְהַיָּמִ֞ים אֲשֶׁר־הָלַ֣כְנוּ׀מִקָּדֵ֣שׁ בַּרְנֵ֗עַ עַ֤ד אֲשֶׁר־עָבַ֨רְנוּ֙
