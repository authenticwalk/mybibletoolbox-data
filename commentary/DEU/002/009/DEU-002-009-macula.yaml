text: וַיֹּ֨אמֶר יְהוָ֜ה אֵלַ֗י אֶל־תָּ֨צַר֙אֶת־מוֹאָ֔ב וְאַל־תִּתְגָּ֥ר בָּ֖ם מִלְחָמָ֑ה
