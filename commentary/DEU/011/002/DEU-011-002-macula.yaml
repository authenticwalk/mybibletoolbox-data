text: וִֽידַעְתֶּם֮ הַיּוֹם֒ כִּ֣י׀לֹ֣א אֶת־בְּנֵיכֶ֗ם אֲשֶׁ֤ר לֹֽא־יָדְעוּ֙ וַאֲשֶׁ֣ר
