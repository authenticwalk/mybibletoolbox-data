verse: DEU 11:25
text: לֹא־יִתְיַצֵּ֥ב אִ֖ישׁ בִּפְנֵיכֶ֑ם פַּחְדְּכֶ֨ם וּמֽוֹרַאֲכֶ֜ם יִתֵּ֣ן׀יְהוָ֣ה
  אֱלֹֽהֵיכֶ֗ם עַל־פְּנֵ֤י כָל־הָאָ֨רֶץ֙ אֲשֶׁ֣ר תִּדְרְכוּ־בָ֔הּ כַּאֲשֶׁ֖ר דִּבֶּ֥ר
  לָכֶֽם׃ס
