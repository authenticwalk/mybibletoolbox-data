text: כִּֽי־יַרְחִיב֩ יְהוָ֨ה אֱלֹהֶ֥יךָ אֶֽת־גְּבֽוּלְךָ֮ כַּאֲשֶׁ֣ר דִּבֶּר־לָךְ֒
