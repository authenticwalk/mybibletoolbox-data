verse: DEU 12:3
text: וְנִתַּצְתֶּ֣ם אֶת־מִזְבּחֹתָ֗םוְשִׁבַּרְתֶּם֙ אֶת־מַצֵּ֣בֹתָ֔ם וַאֲשֵֽׁרֵיהֶם֙
