verse: DEU 17:8
text: כִּ֣י יִפָּלֵא֩ מִמְּךָ֨דָבָ֜ר לַמִּשְׁפָּ֗ט בֵּֽין־דָּ֨ם׀לְדָ֜ם בֵּֽין־דִּ֣ין
  לְדִ֗ין וּבֵ֥ין נֶ֨גַע֙ לָנֶ֔גַע דִּבְרֵ֥י רִיבֹ֖ת בִּשְׁעָרֶ֑יךָ וְקַמְתָּ֣ וְעָלִ֔יתָ
  אֶל־הַמָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖יךָ בּֽוֹ׃
