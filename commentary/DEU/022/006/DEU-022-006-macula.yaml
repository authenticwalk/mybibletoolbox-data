verse: DEU 22:6
text: כִּ֣י יִקָּרֵ֣א קַן־צִפּ֣וֹר׀לְפָנֶ֡יךָ בַּדֶּ֜רֶךְ בְּכָל־עֵ֣ץ׀א֣וֹ עַל־הָאָ֗רֶץ
  אֶפְרֹחִים֙ א֣וֹ בֵיצִ֔ים וְהָאֵ֤ם רֹבֶ֨צֶת֙ עַל־הָֽאֶפְרֹחִ֔ים א֖וֹ עַל־הַבֵּיצִ֑ים
  לֹא־תִקַּ֥ח הָאֵ֖ם עַל־הַבָּנִֽים׃
