verse: DEU 29:12
text: לְמַ֣עַן הָקִֽים־אֹתְךָ֩ הַיּ֨וֹם׀ל֜וֹ לְעָ֗ם וְה֤וּא יִֽהְיֶה־לְּךָ֙ לֵֽאלֹהִ֔ים
  כַּאֲשֶׁ֖ר דִּבֶּר־לָ֑ךְ וְכַאֲשֶׁ֤ר נִשְׁבַּע֙ לַאֲבֹתֶ֔יךָ לְאַבְרָהָ֥ם לְיִצְחָ֖ק
  וּֽלְיַעֲקֹֽב׃
