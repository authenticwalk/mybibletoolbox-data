verse: DEU 21:23
text: לֹא־תָלִ֨ין נִבְלָת֜וֹ עַל־הָעֵ֗ץ כִּֽי־קָב֤וֹר תִּקְבְּרֶ֨נּוּ֙ בַּיּ֣וֹם הַה֔וּא
