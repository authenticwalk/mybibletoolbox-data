verse: DEU 28:12
text: יִפְתַּ֣ח יְהוָ֣ה׀לְ֠ךָ אֶת־אוֹצָר֨וֹ הַטּ֜וֹב אֶת־הַשָּׁמַ֗יִם לָתֵ֤ת מְטַֽר־אַרְצְךָ֙
  בְּעִתּ֔וֹ וּלְבָרֵ֕ךְ אֵ֖ת כָּל־מַעֲשֵׂ֣ה יָדֶ֑ךָ וְהִלְוִ֨יתָ֙ גּוֹיִ֣ם רַבִּ֔ים
  וְאַתָּ֖ה לֹ֥א תִלְוֶֽה׃
