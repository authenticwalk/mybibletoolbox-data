text: וּנְתָֽנְךָ֨ יְהוָ֤ה לְרֹאשׁ֙ וְלֹ֣א לְזָנָ֔ב וְהָיִ֨יתָ֙ רַ֣ק לְמַ֔עְלָה וְלֹ֥א
