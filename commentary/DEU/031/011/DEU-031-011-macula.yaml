verse: DEU 31:11
text: בְּב֣וֹא כָל־יִשְׂרָאֵ֗ל לֵרָאוֹת֙ אֶת־פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔יךָ בַּמָּק֖וֹם
