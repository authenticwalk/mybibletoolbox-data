text: 1KI 20:10 וַיִּשְׁלַ֤ח אֵלָיו֙ בֶּן־הֲדַ֔ד וַיֹּ֕אמֶר כֹּֽה־יַעֲשׂ֥וּן לִ֛י
  אֱלֹהִ֖ים וְכֹ֣ה יוֹסִ֑פוּ אִם־יִשְׂפֹּק֙ עֲפַ֣ר שֹׁמְר֔וֹן לִשְׁעָלִ֕ים לְכָל־הָעָ֖ם
  אֲשֶׁ֥ר בְּרַגְלָֽי׃
