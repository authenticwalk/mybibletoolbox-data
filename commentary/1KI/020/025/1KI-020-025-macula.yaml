text: 1KI 20:25 וְאַתָּ֣ה תִֽמְנֶה־לְךָ֣׀חַ֡יִל כַּחַיִל֩ הַנֹּפֵ֨ל מֵאוֹתָ֜ךְ וְס֣וּס
  כַּסּ֣וּס׀וְרֶ֣כֶב כָּרֶ֗כֶב וְנִֽלָּחֲמָ֤ה אוֹתָם֙ בַּמִּישׁ֔וֹר אִם־לֹ֥א נֶחֱזַ֖ק
  מֵהֶ֑ם וַיִּשְׁמַ֥ע לְקֹלָ֖ם וַיַּ֥עַשׂ כֵּֽן׃פ
