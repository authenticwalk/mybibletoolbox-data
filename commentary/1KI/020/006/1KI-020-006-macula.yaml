text: 1KI 20:6 כִּ֣י׀אִם־כָּעֵ֣ת מָחָ֗ר אֶשְׁלַ֤ח אֶת־עֲבָדַי֙ אֵלֶ֔יךָ וְחִפְּשׂוּ֙
  אֶת־בֵּ֣יתְךָ֔ וְאֵ֖ת בָּתֵּ֣י עֲבָדֶ֑יךָ וְהָיָה֙ כָּל־מַחְמַ֣ד עֵינֶ֔יךָ יָשִׂ֥ימוּ
  בְיָדָ֖ם וְלָקָֽחוּ׃
