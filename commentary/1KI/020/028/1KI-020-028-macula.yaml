verse: 1KI 20:28
text: 1KI 20:28 וַיִּגַּ֞שׁ אִ֣ישׁ הָאֱלֹהִ֗ים וַיֹּאמֶר֮ אֶל־מֶ֣לֶךְ יִשְׂרָאֵל֒
  וַיֹּ֜אמֶר כֹּֽה־אָמַ֣ר יְהוָ֗ה יַ֠עַן אֲשֶׁ֨ר אָמְר֤וּ אֲרָם֙ אֱלֹהֵ֤י הָרִים֙
  יְהוָ֔ה וְלֹֽא־אֱלֹהֵ֥י עֲמָקִ֖ים ה֑וּא וְ֠נָתַתִּי אֶת־כָּל־הֶהָמ֨וֹן הַגָּ֤דוֹל
  הַזֶּה֙ בְּיָדֶ֔ךָ וִֽידַעְתֶּ֖ם כִּֽי־אֲנִ֥י יְהוָֽה׃
