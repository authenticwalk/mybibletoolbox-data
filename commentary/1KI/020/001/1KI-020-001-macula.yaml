text: 1KI 20:1 וּבֶן־הֲדַ֣ד מֶֽלֶךְ־אֲרָ֗ם קָבַץ֙ אֶת־כָּל־חֵיל֔וֹ וּשְׁלֹשִׁ֨ים וּשְׁנַ֥יִם
