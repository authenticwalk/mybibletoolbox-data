verse: 1KI 20:39
text: 1KI 20:39 וַיְהִ֤י הַמֶּ֨לֶךְ֙ עֹבֵ֔ר וְה֖וּא צָעַ֣ק אֶל־הַמֶּ֑לֶךְ וַיֹּ֜אמֶר
  עַבְדְּךָ֣׀יָצָ֣א בְקֶֽרֶב־הַמִּלְחָמָ֗ה וְהִנֵּֽה־אִ֨ישׁ סָ֜ר וַיָּבֵ֧א אֵלַ֣י
  אִ֗ישׁ וַיֹּ֨אמֶר֙ שְׁמֹר֙ אֶת־הָאִ֣ישׁ הַזֶּ֔ה אִם־הִפָּקֵד֙ יִפָּקֵ֔ד וְהָיְתָ֤ה
  נַפְשְׁךָ֙ תַּ֣חַת נַפְשׁ֔וֹ א֥וֹ כִכַּר־כֶּ֖סֶף תִּשְׁקֽוֹל׃
