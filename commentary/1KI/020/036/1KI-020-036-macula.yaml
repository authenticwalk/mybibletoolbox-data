text: 1KI 20:36 וַיֹּ֣אמֶר ל֗וֹ יַ֚עַן אֲשֶׁ֤ר לֹֽא־שָׁמַ֨עְתָּ֙ בְּק֣וֹל יְהוָ֔ה
