text: 1KI 20:30 וַיָּנֻ֨סוּ הַנּוֹתָרִ֥ים׀אֲפֵקָה֮ אֶל־הָעִיר֒ וַתִּפֹּל֙ הַחוֹמָ֔ה
  עַל־עֶשְׂרִ֨ים וְשִׁבְעָ֥ה אֶ֛לֶף אִ֖ישׁ הַנּוֹתָרִ֑ים וּבֶן־הֲדַ֣ד נָ֔ס וַיָּבֹ֥א
  אֶל־הָעִ֖יר חֶ֥דֶר בְּחָֽדֶר׃ס
