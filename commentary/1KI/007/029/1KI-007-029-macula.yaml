text: 1KI 7:29 וְעַֽל־הַמִּסְגְּר֞וֹת אֲשֶׁ֣ר׀בֵּ֣ין הַשְׁלַבִּ֗ים אֲרָי֤וֹת׀בָּקָר֙
  וּכְרוּבִ֔ים וְעַל־הַשְׁלַבִּ֖ים כֵּ֣ן מִמָּ֑עַל וּמִתַּ֨חַת֙ לַאֲרָי֣וֹת וְלַבָּקָ֔ר
  לֹי֖וֹת מַעֲשֵׂ֥ה מוֹרָֽד׃
