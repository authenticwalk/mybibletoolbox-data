text: 1KI 7:2 וַיִּ֜בֶן אֶת־בֵּ֣ית׀יַ֣עַר הַלְּבָנ֗וֹן מֵאָ֨ה אַמָּ֤ה אָרְכּוֹ֙ וַחֲמִשִּׁ֤ים
