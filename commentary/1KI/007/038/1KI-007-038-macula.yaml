text: 1KI 7:38 וַיַּ֛עַשׂ עֲשָׂרָ֥ה כִיֹּר֖וֹת נְחֹ֑שֶׁת אַרְבָּעִ֨ים בַּ֜ת יָכִ֣יל׀הַכִּיּ֣וֹר
  הָאֶחָ֗ד אַרְבַּ֤ע בָּֽאַמָּה֙ הַכִּיּ֣וֹר הָאֶחָ֔ד כִּיּ֤וֹר אֶחָד֙ עַל־הַמְּכוֹנָ֣ה
  הָאַחַ֔ת לְעֶ֖שֶׂר הַמְּכֹנֽוֹת׃
