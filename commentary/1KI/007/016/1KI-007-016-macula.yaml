text: 1KI 7:16 וּשְׁתֵּ֨י כֹתָרֹ֜ת עָשָׂ֗ה לָתֵ֛ת עַל־רָאשֵׁ֥י הָֽעַמּוּדִ֖ים מֻצַ֣ק
