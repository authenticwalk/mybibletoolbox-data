text: 1KI 7:39 וַיִּתֵּן֙ אֶת־הַמְּכֹנ֔וֹת חָמֵ֞שׁ עַל־כֶּ֤תֶף הַבַּ֨יִת֙ מִיָּמִ֔ין
  וְחָמֵ֛שׁ עַל־כֶּ֥תֶף הַבַּ֖יִת מִשְּׂמֹאל֑וֹ וְאֶת־הַיָּ֗ם נָתַ֞ן מִכֶּ֨תֶף הַבַּ֧יִת
  הַיְמָנִ֛ית קֵ֖דְמָה מִמּ֥וּל נֶֽגֶב׃ס
