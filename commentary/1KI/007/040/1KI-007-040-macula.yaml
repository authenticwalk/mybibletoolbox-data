text: 1KI 7:40 וַיַּ֣עַשׂ חִיר֔וֹם אֶת־הַ֨כִּיֹּר֔וֹת וְאֶת־הַיָּעִ֖ים וְאֶת־הַמִּזְרָק֑וֹת
