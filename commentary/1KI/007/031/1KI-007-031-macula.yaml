text: 1KI 7:31 וּ֠פִיהוּ מִבֵּ֨ית לַכֹּתֶ֤רֶת וָמַ֨עְלָה֙ בָּֽאַמָּ֔ה וּפִ֨יהָ֙ עָגֹ֣ל
  מַעֲשֵׂה־כֵ֔ן אַמָּ֖ה וַחֲצִ֣י הָֽאַמָּ֑ה וְגַם־עַל־פִּ֨יהָ֙ מִקְלָע֔וֹת וּמִסְגְּרֹתֵיהֶ֥ם
  מְרֻבָּע֖וֹת לֹ֥א עֲגֻלּֽוֹת׃
