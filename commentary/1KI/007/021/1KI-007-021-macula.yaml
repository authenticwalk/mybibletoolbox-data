text: 1KI 7:21 וַיָּ֨קֶם֙ אֶת־הָֽעַמֻּדִ֔ים לְאֻלָ֖ם הַֽהֵיכָ֑ל וַיָּ֜קֶם אֶת־הָעַמּ֣וּד
