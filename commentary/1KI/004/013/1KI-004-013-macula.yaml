text: 1KI 4:13 בֶּן־גֶּ֖בֶר בְּרָמֹ֣ת גִּלְעָ֑ד ל֡וֹ חַוֺּת֩ יָאִ֨יר בֶּן־מְנַשֶּׁ֜ה
