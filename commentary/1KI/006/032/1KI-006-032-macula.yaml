text: 1KI 6:32 וּשְׁתֵּי֮ דַּלְת֣וֹת עֲצֵי־שֶׁמֶן֒ וְקָלַ֣ע עֲ֠לֵיהֶם מִקְלְע֨וֹת
  כְּרוּבִ֧ים וְתִמֹר֛וֹת וּפְטוּרֵ֥י צִצִּ֖ים וְצִפָּ֣ה זָהָ֑ב וַיָּ֛רֶד עַל־הַכְּרוּבִ֥ים
  וְעַל־הַתִּֽמֹר֖וֹת אֶת־הַזָּהָֽב׃
