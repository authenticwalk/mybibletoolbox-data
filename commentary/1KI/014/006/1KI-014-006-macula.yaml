text: 1KI 14:6 וַיְהִי֩ כִשְׁמֹ֨עַ אֲחִיָּ֜הוּ אֶת־ק֤וֹל רַגְלֶ֨יהָ֙ בָּאָ֣ה בַפֶּ֔תַח
