text: 1KI 12:20 וַיְהִ֞י כִּשְׁמֹ֤עַ כָּל־יִשְׂרָאֵל֙ כִּֽי־שָׁ֣ב יָרָבְעָ֔ם וַֽיִּשְׁלְח֗וּ
  וַיִּקְרְא֤וּ אֹתוֹ֙ אֶל־הָ֣עֵדָ֔ה וַיַּמְלִ֥יכוּ אֹת֖וֹ עַל־כָּל־יִשְׂרָאֵ֑ל לֹ֤א
  הָיָה֙ אַחֲרֵ֣י בֵית־דָּוִ֔ד זוּלָתִ֥י שֵֽׁבֶט־יְהוּדָ֖ה לְבַדּֽוֹ׃
