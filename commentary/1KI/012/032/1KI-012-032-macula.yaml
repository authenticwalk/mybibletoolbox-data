verse: 1KI 12:32
text: 1KI 12:32 וַיַּ֣עַשׂ יָרָבְעָ֣ם׀חָ֡ג בַּחֹ֣דֶשׁ הַשְּׁמִינִ֣י בַּחֲמִשָּֽׁה־עָשָׂר֩
  י֨וֹם׀לַחֹ֜דֶשׁ כֶּחָ֣ג׀אֲשֶׁ֣ר בִּיהוּדָ֗ה וַיַּ֨עַל֙ עַל־הַמִּזְבֵּ֔חַ כֵּ֤ן עָשָׂה֙
  בְּבֵֽית־אֵ֔ל לְזַבֵּ֖חַ לָעֲגָלִ֣ים אֲשֶׁר־עָשָׂ֑ה וְהֶעֱמִיד֙ בְּבֵ֣ית אֵ֔ל אֶת־כֹּהֲנֵ֥י
  הַבָּמ֖וֹת אֲשֶׁ֥ר עָשָֽׂה׃
