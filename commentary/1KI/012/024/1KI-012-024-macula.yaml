text: 1KI 12:24 כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹֽא־תַעֲלוּ֩ וְלֹא־תִלָּ֨חֲמ֜וּן עִם־אֲחֵיכֶ֣ם
  בְּנֵֽי־יִשְׂרָאֵ֗ל שׁ֚וּבוּ אִ֣ישׁ לְבֵית֔וֹ כִּ֧י מֵאִתִּ֛י נִהְיָ֖ה הַדָּבָ֣ר
  הַזֶּ֑ה וַיִּשְׁמְעוּ֙ אֶת־דְּבַ֣ר יְהוָ֔ה וַיָּשֻׁ֥בוּ לָלֶ֖כֶת כִּדְבַ֥ר יְהוָֽה׃ס
