text: 1KI 17:12 וַתֹּ֗אמֶר חַי־יְהוָ֤ה אֱלֹהֶ֨יךָ֙ אִם־יֶשׁ־לִ֣י מָע֔וֹג כִּ֣י אִם־מְלֹ֤א
