text: 1KI 17:10 וַיָּ֣קָם׀וַיֵּ֣לֶךְ צָרְפַ֗תָה וַיָּבֹא֙ אֶל־פֶּ֣תַח הָעִ֔יר וְהִנֵּֽה־שָׁ֛ם
  אִשָּׁ֥ה אַלְמָנָ֖ה מְקֹשֶׁ֣שֶׁת עֵצִ֑ים וַיִּקְרָ֤א אֵלֶ֨יהָ֙ וַיֹּאמַ֔ר קְחִי־נָ֨א
  לִ֧י מְעַט־מַ֛יִם בַּכְּלִ֖י וְאֶשְׁתֶּֽה׃
