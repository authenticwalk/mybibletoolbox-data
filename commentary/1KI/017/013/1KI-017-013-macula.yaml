text: 1KI 17:13 וַיֹּ֨אמֶר אֵלֶ֤יהָ אֵלִיָּ֨הוּ֙ אַל־תִּ֣ירְאִ֔י בֹּ֖אִי עֲשִׂ֣י כִדְבָרֵ֑ךְ
