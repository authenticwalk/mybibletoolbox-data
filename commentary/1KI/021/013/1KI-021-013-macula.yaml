verse: 1KI 21:13
text: 1KI 21:13 וַ֠יָּבֹאוּ שְׁנֵ֨י הָאֲנָשִׁ֥ים בְּנֵֽי־בְלִיַּעַל֮ וַיֵּשְׁב֣וּ
  נֶגְדּוֹ֒ וַיְעִדֻהוּ֩ אַנְשֵׁ֨י הַבְּלִיַּ֜עַל אֶת־נָב֗וֹת נֶ֤גֶד הָעָם֙ לֵאמֹ֔ר
  בֵּרַ֥ךְ נָב֛וֹת אֱלֹהִ֖ים וָמֶ֑לֶךְ וַיֹּצִאֻ֨הוּ֙ מִח֣וּץ לָעִ֔יר וַיִּסְקְלֻ֥הוּ
  בָאֲבָנִ֖ים וַיָּמֹֽת׃
