text: 1KI 10:19 שֵׁ֧שׁ מַעֲל֣וֹת לַכִּסֵּ֗ה וְרֹאשׁ־עָגֹ֤ל לַכִּסֵּה֙ מֵאַֽחֲרָ֔יו
