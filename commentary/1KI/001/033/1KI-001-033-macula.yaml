text: 1KI 1:33 וַיֹּ֨אמֶר הַמֶּ֜לֶךְ לָהֶ֗ם קְח֤וּ עִמָּכֶם֙ אֶת־עַבְדֵ֣י אֲדֹנֵיכֶ֔ם
  וְהִרְכַּבְתֶּם֙ אֶת־שְׁלֹמֹ֣ה בְנִ֔י עַל־הַפִּרְדָּ֖ה אֲשֶׁר־לִ֑י וְהוֹרַדְתֶּ֥ם
  אֹת֖וֹ אֶל־גִּחֽוֹן׃
