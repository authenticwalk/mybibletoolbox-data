text: 1KI 1:39 וַיִּקַּח֩ צָד֨וֹק הַכֹּהֵ֜ן אֶת־קֶ֤רֶן הַשֶּׁ֨מֶן֙ מִן־הָאֹ֔הֶל וַיִּמְשַׁ֖ח
