verse: 1KI 1:38
text: 1KI 1:38 וַיֵּ֣רֶד צָד֣וֹק הַ֠כֹּהֵן וְנָתָ֨ן הַנָּבִ֜יא וּבְנָיָ֣הוּ בֶן־יְהוֹיָדָ֗ע
  וְהַכְּרֵתִי֙ וְהַפְּלֵתִ֔י וַיַּרְכִּ֨בוּ֙ אֶת־שְׁלֹמֹ֔ה עַל־פִּרְדַּ֖ת הַמֶּ֣לֶךְ
  דָּוִ֑ד וַיֹּלִ֥כוּ אֹת֖וֹ עַל־גִּחֽוֹן׃
