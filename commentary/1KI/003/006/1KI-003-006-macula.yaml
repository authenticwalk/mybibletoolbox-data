text: 1KI 3:6 וַיֹּ֣אמֶר שְׁלֹמֹ֗ה אַתָּ֨ה עָשִׂ֜יתָ עִם־עַבְדְּךָ֙ דָוִ֣ד אָבִי֮
  חֶ֣סֶד גָּדוֹל֒ כַּאֲשֶׁר֩ הָלַ֨ךְ לְפָנֶ֜יךָ בֶּאֱמֶ֧ת וּבִצְדָקָ֛ה וּבְיִשְׁרַ֥ת
  לֵבָ֖ב עִמָּ֑ךְ וַתִּשְׁמָר־ל֗וֹ אֶת־הַחֶ֤סֶד הַגָּדוֹל֙ הַזֶּ֔ה וַתִּתֶּן־ל֥וֹ
  בֵ֛ן יֹשֵׁ֥ב עַל־כִּסְא֖וֹ כַּיּ֥וֹם הַזֶּֽה׃
