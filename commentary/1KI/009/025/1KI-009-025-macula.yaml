verse: 1KI 9:25
text: 1KI 9:25 וְהֶעֱלָ֣ה שְׁלֹמֹ֡ה שָׁלֹשׁ֩ פְּעָמִ֨ים בַּשָּׁנָ֜ה עֹל֣וֹת וּשְׁלָמִ֗ים
  עַל־הַמִּזְבֵּ֨חַ֙ אֲשֶׁ֣ר בָּנָ֣ה לַיהוָ֔ה וְהַקְטֵ֣יר אִתּ֔וֹאֲשֶׁ֖ר לִפְנֵ֣י
  יְהוָ֑ה וְשִׁלַּ֖ם אֶת־הַבָּֽיִת׃
