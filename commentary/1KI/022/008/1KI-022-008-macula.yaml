text: 1KI 22:8 וַיֹּ֣אמֶר מֶֽלֶךְ־יִשְׂרָאֵ֣ל׀אֶֽל־יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ־אֶחָ֡ד
  לִדְרֹשׁ֩ אֶת־יְהוָ֨ה מֵאֹת֜וֹ וַאֲנִ֣י שְׂנֵאתִ֗יו כִּ֠י לֹֽא־יִתְנַבֵּ֨א עָלַ֥י
  טוֹב֙ כִּ֣י אִם־רָ֔ע מִיכָ֖יְהוּ בֶּן־יִמְלָ֑ה וַיֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל־יֹאמַ֥ר
  הַמֶּ֖לֶךְ כֵּֽן׃
