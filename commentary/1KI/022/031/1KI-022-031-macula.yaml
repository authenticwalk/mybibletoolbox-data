text: 1KI 22:31 וּמֶ֣לֶךְ אֲרָ֡ם צִוָּ֣ה אֶת־שָׂרֵי֩ הָרֶ֨כֶב אֲשֶׁר־ל֜וֹ שְׁלֹשִׁ֤ים
