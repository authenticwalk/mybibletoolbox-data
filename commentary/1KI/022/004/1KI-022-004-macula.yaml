text: 1KI 22:4 וַיֹּ֨אמֶר֙ אֶל־יְה֣וֹשָׁפָ֔ט הֲתֵלֵ֥ךְ אִתִּ֛י לַמִּלְחָמָ֖ה רָמֹ֣ת
