verse: 1KI 13:4
text: 1KI 13:4 וַיְהִי֩ כִשְׁמֹ֨עַ הַמֶּ֜לֶךְ אֶת־דְּבַ֣ר אִישׁ־הָאֱלֹהִ֗ים אֲשֶׁ֨ר
  קָרָ֤א עַל־הַמִּזְבֵּ֨חַ֙ בְּבֵֽית־אֵ֔ל וַיִּשְׁלַ֨ח יָרָבְעָ֧ם אֶת־יָד֛וֹ מֵעַ֥ל
  הַמִּזְבֵּ֖חַ לֵאמֹ֣ר׀תִּפְשֻׂ֑הוּ וַתִּיבַ֤שׁ יָדוֹ֙ אֲשֶׁ֣ר שָׁלַ֣ח עָלָ֔יו וְלֹ֥א
  יָכֹ֖ל לַהֲשִׁיבָ֥הּ אֵלָֽיו׃
