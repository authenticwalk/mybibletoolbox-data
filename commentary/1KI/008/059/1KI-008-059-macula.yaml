text: 1KI 8:59 וְיִֽהְי֨וּ דְבָרַ֜י אֵ֗לֶּה אֲשֶׁ֤ר הִתְחַנַּ֨נְתִּי֙ לִפְנֵ֣י יְהוָ֔ה
