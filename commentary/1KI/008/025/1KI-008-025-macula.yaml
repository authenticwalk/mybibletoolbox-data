verse: 1KI 8:25
text: 1KI 8:25 וְעַתָּ֞ה יְהוָ֣ה׀אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְעַבְדְּךָ֨דָוִ֤ד אָבִי֙
  אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּוֹ֙ לֵאמֹ֔ר לֹא־יִכָּרֵ֨ת לְךָ֥ אִישׁ֙ מִלְּפָנַ֔י יֹשֵׁ֖ב
  עַל־כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם־יִשְׁמְר֨וּ בָנֶ֤יךָ אֶת־דַּרְכָּם֙ לָלֶ֣כֶת לְפָנַ֔י
  כַּאֲשֶׁ֥ר הָלַ֖כְתָּ לְפָנָֽי׃
