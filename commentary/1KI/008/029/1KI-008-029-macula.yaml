verse: 1KI 8:29
text: 1KI 8:29 לִהְיוֹת֩ עֵינֶ֨ךָ פְתֻח֜וֹת אֶל־הַבַּ֤יִת הַזֶּה֙ לַ֣יְלָה וָי֔וֹם
  אֶל־הַ֨מָּק֔וֹם אֲשֶׁ֣ר אָמַ֔רְתָּ יִהְיֶ֥ה שְׁמִ֖י שָׁ֑ם לִשְׁמֹ֨עַ֙ אֶל־הַתְּפִלָּ֔ה
  אֲשֶׁ֣ר יִתְפַּלֵּ֣ל עַבְדְּךָ֔ אֶל־הַמָּק֖וֹם הַזֶּֽה׃
