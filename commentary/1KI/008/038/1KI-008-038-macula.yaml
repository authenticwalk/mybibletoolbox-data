text: 1KI 8:38 כָּל־תְּפִלָּ֣ה כָל־תְּחִנָּ֗ה אֲשֶׁ֤ר תִֽהְיֶה֙ לְכָל־הָ֣אָדָ֔ם לְכֹ֖ל
