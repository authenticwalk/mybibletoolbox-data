text: 1KI 8:32 וְאַתָּ֣ה׀תִּשְׁמַ֣ע הַשָּׁמַ֗יִם וְעָשִׂ֨יתָ֙ וְשָׁפַטְתָּ֣ אֶת־עֲבָדֶ֔יךָ
