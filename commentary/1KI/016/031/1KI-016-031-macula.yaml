text: 1KI 16:31 וַיְהִי֙ הֲנָקֵ֣ל לֶכְתּ֔וֹ בְּחַטֹּ֖אות יָרָבְעָ֣ם בֶּן־נְבָ֑ט וַיִּקַּ֨ח
  אִשָּׁ֜ה אֶת־אִיזֶ֗בֶל בַּת־אֶתְבַּ֨עַל֙ מֶ֣לֶךְ צִידֹנִ֔ים וַיֵּ֨לֶךְ֙ וַֽיַּעֲבֹ֣ד
  אֶת־הַבַּ֔עַל וַיִּשְׁתַּ֖חוּ לֽוֹ׃
