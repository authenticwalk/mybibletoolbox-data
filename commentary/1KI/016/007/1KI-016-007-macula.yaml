verse: 1KI 16:7
text: 1KI 16:7 וְגַ֡ם בְּיַד־יֵה֨וּא בֶן־חֲנָ֜נִי הַנָּבִ֗יא דְּבַר־יְהוָ֡ה הָיָה֩
  אֶל־בַּעְשָׁ֨א וְאֶל־בֵּית֜וֹ וְעַ֥ל כָּל־הָרָעָ֣ה׀אֲשֶׁר־עָשָׂ֣ה׀בְּעֵינֵ֣י יְהוָ֗ה
  לְהַכְעִיסוֹ֙ בְּמַעֲשֵׂ֣ה יָדָ֔יו לִהְי֖וֹת כְּבֵ֣ית יָרָבְעָ֑ם וְעַ֥ל אֲשֶׁר־הִכָּ֖ה
  אֹתֽוֹ׃פ
