text: 1KI 16:2 יַ֗עַן אֲשֶׁ֤ר הֲרִימֹתִ֨יךָ֙ מִן־הֶ֣עָפָ֔ר וָאֶתֶּנְךָ֣ נָגִ֔יד עַ֖ל
  עַמִּ֣י יִשְׂרָאֵ֑ל וַתֵּ֣לֶךְ׀בְּדֶ֣רֶךְ יָרָבְעָ֗ם וַֽתַּחֲטִא֙ אֶת־עַמִּ֣י יִשְׂרָאֵ֔ל
  לְהַכְעִיסֵ֖נִי בְּחַטֹּאתָֽם׃
