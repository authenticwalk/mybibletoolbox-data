verse: 1KI 18:36
text: 1KI 18:36 וַיְהִ֣י׀בַּעֲל֣וֹת הַמִּנְחָ֗ה וַיִּגַּ֞שׁ אֵלִיָּ֣הוּ הַנָּבִיא֮
  וַיֹּאמַר֒ יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְיִשְׂרָאֵ֔ל הַיּ֣וֹם יִוָּדַ֗ע
  כִּֽי־אַתָּ֧ה אֱלֹהִ֛ים בְּיִשְׂרָאֵ֖ל וַאֲנִ֣י עַבְדֶּ֑ךָ וּבִדְבָרְךָ֣ עָשִׂ֔יתִי
  אֵ֥ת כָּל־הַדְּבָרִ֖ים הָאֵֽלֶּה׃
