text: 1KI 18:40 וַיֹּאמֶר֩ אֵלִיָּ֨הוּ לָהֶ֜ם תִּפְשׂ֣וּ׀אֶת־נְבִיאֵ֣י הַבַּ֗עַל אִ֛ישׁ
  אַל־יִמָּלֵ֥ט מֵהֶ֖ם וַֽיִּתְפְּשׂ֑וּם וַיּוֹרִדֵ֤ם אֵלִיָּ֨הוּ֙ אֶל־נַ֣חַל קִישׁ֔וֹן
  וַיִּשְׁחָטֵ֖ם שָֽׁם׃
