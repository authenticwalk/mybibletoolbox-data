text: 1KI 5:15 וַ֠יִּשְׁלַח חִירָ֨ם מֶֽלֶךְ־צ֤וֹר אֶת־עֲבָדָיו֙ אֶל־שְׁלֹמֹ֔ה כִּ֣י
