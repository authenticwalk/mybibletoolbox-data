verse: 1KI 2:32
text: 1KI 2:32 וְהֵשִׁיב֩ יְהוָ֨ה אֶת־דָּמ֜וֹ עַל־רֹאשׁ֗וֹ אֲשֶׁ֣ר פָּגַ֣ע בִּשְׁנֵֽי־אֲ֠נָשִׁים
  צַדִּקִ֨ים וְטֹבִ֤ים מִמֶּ֨נּוּ֙ וַיַּהַרְגֵ֣ם בַּחֶ֔רֶב וְאָבִ֥י דָוִ֖ד לֹ֣א יָדָ֑ע
  אֶת־אַבְנֵ֤ר בֶּן־נֵר֙ שַׂר־צְבָ֣א יִשְׂרָאֵ֔ל וְאֶת־עֲמָשָׂ֥א בֶן־יֶ֖תֶר שַׂר־צְבָ֥א
  יְהוּדָֽה׃
