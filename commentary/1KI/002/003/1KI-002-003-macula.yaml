text: 1KI 2:3 וְשָׁמַרְתָּ֞ אֶת־מִשְׁמֶ֣רֶת׀יְהוָ֣ה אֱלֹהֶ֗יךָ לָלֶ֤כֶת בִּדְרָכָיו֙
