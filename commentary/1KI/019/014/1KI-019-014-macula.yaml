text: 1KI 19:14 וַיֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַיהוָ֣ה׀אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי־עָזְב֤וּ
