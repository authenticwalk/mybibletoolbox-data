text: וַיֹּ֨אמֶר יְהוָ֣ה אֶל־יְהוֹשֻׁעַ֮ אַל־תִּירָ֣א מִפְּנֵיהֶם֒ כִּֽי־מָחָ֞ר כָּעֵ֣ת
