verse: JOS 22:25
text: וּגְב֣וּל נָֽתַן־יְ֠הוָה בֵּינֵ֨נוּ וּבֵינֵיכֶ֜ם בְּנֵי־רְאוּבֵ֤ן וּבְנֵי־גָד֙
  אֶת־הַיַּרְדֵּ֔ן אֵין־לָכֶ֥ם חֵ֖לֶק בַּֽיהוָ֑ה וְהִשְׁבִּ֤יתוּ בְנֵיכֶם֙ אֶת־בָּנֵ֔ינוּ
  לְבִלְתִּ֖י יְרֹ֥א אֶת־יְהוָֽה׃
