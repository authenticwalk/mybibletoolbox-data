verse: JOS 24:15
text: וְאִם֩ רַ֨ע בְּֽעֵינֵיכֶ֜ם לַעֲבֹ֣ד אֶת־יְהוָ֗ה בַּחֲר֨וּ לָכֶ֣ם הַיּוֹם֮ אֶת־מִ֣י
  תַעֲבֹדוּן֒ אִ֣ם אֶת־אֱלֹהִ֞ים אֲשֶׁר־עָבְד֣וּ אֲבוֹתֵיכֶ֗ם אֲשֶׁר֙ מֵעֵ֣בֶרהַנָּהָ֔ר
  וְאִם֙ אֶת־אֱלֹהֵ֣י הָאֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֣ים בְּאַרְצָ֑ם וְאָנֹכִ֣י
  וּבֵיתִ֔י נַעֲבֹ֖ד אֶת־יְהוָֽה׃פ
