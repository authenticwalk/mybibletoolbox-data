text: וַיִּצְעֲק֣וּ אֶל־יְהוָ֗ה וַיָּ֨שֶׂם מַֽאֲפֵ֜ל בֵּינֵיכֶ֣ם׀וּבֵ֣ין הַמִּצְרִ֗ים
  וַיָּבֵ֨א עָלָ֤יו אֶת־הַיָּם֙ וַיְכַסֵּ֔הוּ וַתִּרְאֶ֨ינָה֙ עֵינֵיכֶ֔ם אֵ֥ת אֲשֶׁר־עָשִׂ֖יתִי
  בְּמִצְרָ֑יִם וַתֵּשְׁב֥וּ בַמִּדְבָּ֖ר יָמִ֥ים רַבִּֽים׃
