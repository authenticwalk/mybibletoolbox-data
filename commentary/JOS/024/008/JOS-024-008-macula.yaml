text: וָאָבִ֣יא אֶתְכֶ֗ם אֶל־אֶ֤רֶץ הָאֱמֹרִי֙ הַיּוֹשֵׁב֙ בְּעֵ֣בֶר הַיַּרְדֵּ֔ן
