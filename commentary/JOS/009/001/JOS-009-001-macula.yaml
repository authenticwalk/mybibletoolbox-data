text: וַיְהִ֣י כִשְׁמֹ֣עַ כָּֽל־הַמְּלָכִ֡ים אֲשֶׁר֩ בְּעֵ֨בֶר הַיַּרְדֵּ֜ן בָּהָ֣ר
