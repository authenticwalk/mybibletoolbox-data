verse: JOS 10:28
text: וְאֶת־מַקֵּדָה֩ לָכַ֨ד יְהוֹשֻׁ֜עַ בַּיּ֣וֹם הַה֗וּא וַיַּכֶּ֣הָ לְפִי־חֶרֶב֮
  וְאֶת־מַלְכָּהּ֒ הֶחֱרִ֣ם אוֹתָ֗ם וְאֶת־כָּל־הַנֶּ֨פֶשׁ֙ אֲשֶׁר־בָּ֔הּ לֹ֥א הִשְׁאִ֖יר
  שָׂרִ֑יד וַיַּ֨עַשׂ֙ לְמֶ֣לֶךְ מַקֵּדָ֔ה כַּאֲשֶׁ֥ר עָשָׂ֖ה לְמֶ֥לֶךְ יְרִיחֽוֹ׃
