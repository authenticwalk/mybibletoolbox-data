verse: JOS 10:39
text: וַֽיִּלְכְּדָ֞הּ וְאֶת־מַלְכָּ֤הּ וְאֶת־כָּל־עָרֶ֨יהָ֙ וַיַּכּ֣וּם לְפִי־חֶ֔רֶב
  וַֽיַּחֲרִ֨ימוּ֙ אֶת־כָּל־נֶ֣פֶשׁ אֲשֶׁר־בָּ֔הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד כַּאֲשֶׁ֨ר
  עָשָׂ֜ה לְחֶבְר֗וֹן כֵּן־עָשָׂ֤ה לִדְבִ֨רָה֙ וּלְמַלְכָּ֔הּ וְכַאֲשֶׁ֥ר עָשָׂ֛ה
  לְלִבְנָ֖ה וּלְמַלְכָּֽהּ׃
