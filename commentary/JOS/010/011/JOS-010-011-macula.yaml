verse: JOS 10:11
text: וַיְהִ֞י בְּנֻסָ֣ם׀מִפְּנֵ֣י יִשְׂרָאֵ֗ל הֵ֞ם בְּמוֹרַ֤ד בֵּית־חוֹרֹן֙ וַֽיהוָ֡ה
  הִשְׁלִ֣יךְ עֲלֵיהֶם֩ אֲבָנִ֨ים גְּדֹל֧וֹת מִן־הַשָּׁמַ֛יִם עַד־עֲזֵקָ֖ה וַיָּמֻ֑תוּ
  רַבִּ֗ים אֲשֶׁר־מֵ֨תוּ֙ בְּאַבְנֵ֣י הַבָּרָ֔ד מֵאֲשֶׁ֥ר הָרְג֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל
  בֶּחָֽרֶב׃ס
