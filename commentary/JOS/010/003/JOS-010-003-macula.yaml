verse: JOS 10:3
text: וַיִּשְׁלַ֨ח אֲדֹנִי־צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם אֶל־הוֹהָ֣ם מֶֽלֶךְ־חֶ֠בְרוֹן
