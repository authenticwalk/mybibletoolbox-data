text: וַיִּתֵּן֩ יְהוָ֨ה גַּם־אוֹתָ֜הּ בְּיַ֣ד יִשְׂרָאֵ֘לוְאֶת־מַלְכָּהּ֒ וַיַּכֶּ֣הָ
  לְפִי־חֶ֗רֶב וְאֶת־כָּל־הַנֶּ֨פֶשׁ֙ אֲשֶׁר־בָּ֔הּ לֹֽא־הִשְׁאִ֥יר בָּ֖הּ שָׂרִ֑יד
