text: וַיְהִ֞י לְעֵ֣ת׀בּ֣וֹא הַשֶּׁ֗מֶשׁ צִוָּ֤ה יְהוֹשֻׁ֨עַ֙ וַיֹּֽרִידוּם֙ מֵעַ֣ל
