verse: JOS 3:17
text: וַיַּעַמְד֣וּ הַכֹּהֲנִ֡ים נֹ֠שְׂאֵי הָאָר֨וֹן בְּרִית־יְהוָ֜ה בֶּחָֽרָבָ֛ה
  בְּת֥וֹךְ הַיַּרְדֵּ֖ן הָכֵ֑ן וְכָל־יִשְׂרָאֵ֗ל עֹֽבְרִים֙ בֶּחָ֣רָבָ֔ה עַ֤ד אֲשֶׁר־תַּ֨מּוּ֙
  כָּל־הַגּ֔וֹי לַעֲבֹ֖ר אֶת־הַיַּרְדֵּֽן׃
