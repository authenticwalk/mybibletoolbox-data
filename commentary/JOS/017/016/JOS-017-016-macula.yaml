verse: JOS 17:16
text: וַיֹּֽאמְרוּ֙ בְּנֵ֣י יוֹסֵ֔ף לֹֽא־יִמָּ֥צֵא לָ֖נוּ הָהָ֑ר וְרֶ֣כֶב בַּרְזֶ֗ל
  בְּכָל־הַֽכְּנַעֲנִי֙ הַיֹּשֵׁ֣ב בְּאֶֽרֶץ־הָעֵ֔מֶק לַֽאֲשֶׁ֤ר בְּבֵית־שְׁאָן֙ וּבְנוֹתֶ֔יהָ
  וְלַֽאֲשֶׁ֖ר בְּעֵ֥מֶק יִזְרְעֶֽאל׃
