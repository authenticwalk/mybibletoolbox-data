text: וַתִּקְרַ֡בְנָה לִפְנֵי֩ אֶלְעָזָ֨ר הַכֹּהֵ֜ן וְלִפְנֵ֣י׀יְהוֹשֻׁ֣עַ בִּן־נ֗וּן
