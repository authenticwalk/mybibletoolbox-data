text: וְנָ֞ס אֶל־אַחַ֣ת׀מֵהֶעָרִ֣ים הָאֵ֗לֶּה וְעָמַד֙ פֶּ֚תַח שַׁ֣עַר הָעִ֔יר וְדִבֶּ֛ר
  בְּאָזְנֵ֛י זִקְנֵ֥י־הָעִֽירהַהִ֖יא אֶת־דְּבָרָ֑יו וְאָסְפ֨וּ אֹת֤וֹ הָעִ֨ירָה֙
