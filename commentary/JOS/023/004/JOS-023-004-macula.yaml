text: רְאוּ֩ הִפַּ֨לְתִּי לָכֶ֜ם אֶֽת־הַ֠גּוֹיִם הַנִּשְׁאָרִ֥ים הָאֵ֛לֶּה בְּנַחֲלָ֖ה
