verse: JOS 8:1
text: וַיֹּ֨אמֶר יְהוָ֤ה אֶל־יְהוֹשֻׁ֨עַ֙ אַל־תִּירָ֣א וְאַל־תֵּחָ֔ת קַ֣ח עִמְּךָ֗
  אֵ֚ת כָּל־עַ֣ם הַמִּלְחָמָ֔ה וְק֖וּם עֲלֵ֣ה הָעָ֑י רְאֵ֣ה׀נָתַ֣תִּי בְיָדְךָ֗ אֶת־מֶ֤לֶךְ
  הָעַי֙ וְאֶת־עַמּ֔וֹ וְאֶת־עִיר֖וֹ וְאֶת־אַרְצֽוֹ׃
