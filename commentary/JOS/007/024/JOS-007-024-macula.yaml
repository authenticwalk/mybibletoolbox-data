verse: JOS 7:24
text: וַיִּקַּ֣ח יְהוֹשֻׁ֣עַ אֶת־עָכָ֣ן בֶּן־זֶ֡רַח וְאֶת־הַכֶּ֣סֶף וְאֶת־הָאַדֶּ֣רֶת
  וְֽאֶת־לְשׁ֣וֹן הַזָּהָ֡ב וְֽאֶת־בָּנָ֡יו וְֽאֶת־בְּנֹתָ֡יו וְאֶת־שׁוֹרוֹ֩ וְאֶת־חֲמֹר֨וֹ
  וְאֶת־צֹאנ֤וֹ וְאֶֽת־אָהֳלוֹ֙ וְאֶת־כָּל־אֲשֶׁר־ל֔וֹ וְכָל־יִשְׂרָאֵ֖ל עִמּ֑וֹ וַיַּעֲל֥וּ
  אֹתָ֖ם עֵ֥מֶק עָכֽוֹר׃
