text: וּמִמַּטֵּ֨ה נַפְתָּלִ֜י אֶת־עִ֣יר׀מִקְלַ֣ט הָֽרֹצֵ֗חַ אֶת־קֶ֨דֶשׁ בַּגָּלִ֤יל
