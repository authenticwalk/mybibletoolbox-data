verse: JOS 21:6
text: וְלִבְנֵ֣י גֵרְשׁ֗וֹן מִמִּשְׁפְּח֣וֹת מַטֵּֽה־יִשָּׂשכָ֣ר וּמִמַּטֵּֽה־אָ֠שֵׁר
