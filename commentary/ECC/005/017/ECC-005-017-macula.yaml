verse: ECC 5:17
text: הִנֵּ֞ה אֲשֶׁר־רָאִ֣יתִי אָ֗נִי ט֣וֹב אֲשֶׁר־יָפֶ֣ה לֶֽאֶכוֹל־וְ֠לִשְׁתּוֹת
  וְלִרְא֨וֹת טוֹבָ֜ה בְּכָל־עֲמָל֣וֹ׀שֶׁיַּעֲמֹ֣ל תַּֽחַת־הַשֶּׁ֗מֶשׁ מִסְפַּ֧ר יְמֵי־חַיָּ֛יואֲשֶׁר־נָֽתַן־ל֥וֹ
  הָאֱלֹהִ֖ים כִּי־ה֥וּא חֶלְקֽוֹ׃
