verse: ECC 12:5
text: גַּ֣ם מִגָּבֹ֤הַּ יִרָ֨אוּ֙ וְחַתְחַתִּ֣ים בַּדֶּ֔רֶךְ וְיָנֵ֤אץ הַשָּׁקֵד֙
  וְיִסְתַּבֵּ֣ל הֶֽחָגָ֔ב וְתָפֵ֖ר הָֽאֲבִיּוֹנָ֑ה כִּֽי־הֹלֵ֤ךְ הָאָדָם֙ אֶל־בֵּ֣ית
  עוֹלָמ֔וֹ וְסָבְב֥וּ בָשּׁ֖וּקהַסֹּפְדִֽים׃
