text: יֶשׁ־הֶבֶל֮ אֲשֶׁ֣ר נַעֲשָׂ֣ה עַל־הָאָרֶץ֒ אֲשֶׁ֣ר׀יֵ֣שׁ צַדִּיקִ֗ים אֲשֶׁ֨ר
