verse: ECC 4:1
text: וְשַׁ֣בְתִּֽי אֲנִ֗י וָאֶרְאֶה֙ אֶת־כָּל־הָ֣עֲשֻׁקִ֔ים אֲשֶׁ֥ר נַעֲשִׂ֖ים תַּ֣חַת
  הַשָּׁ֑מֶשׁ וְהִנֵּ֣ה׀דִּמְעַ֣ת הָעֲשֻׁקִ֗ים וְאֵ֤ין לָהֶם֙ מְנַחֵ֔ם וּמִיַּ֤ד עֹֽשְׁקֵיהֶם֙
  כֹּ֔חַ וְאֵ֥ין לָהֶ֖ם מְנַחֵֽם׃
