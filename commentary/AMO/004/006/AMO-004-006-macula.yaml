verse: AMO 4:6
text: וְגַם־אֲנִי֩ נָתַ֨תִּי לָכֶ֜ם נִקְי֤וֹן שִׁנַּ֨יִם֙ בְּכָל־עָ֣רֵיכֶ֔ם וְחֹ֣סֶר
