verse: AMO 9:7
text: הֲל֣וֹא כִבְנֵי֩ כֻשִׁיִּ֨ים אַתֶּ֥ם לִ֛י בְּנֵ֥י יִשְׂרָאֵ֖ל נְאֻם־יְהוָ֑ה
  הֲל֣וֹא אֶת־יִשְׂרָאֵ֗ל הֶעֱלֵ֨יתִי֙ מֵאֶ֣רֶץ מִצְרַ֔יִם וּפְלִשְׁתִּיִּ֥ים מִכַּפְתּ֖וֹר
  וַאֲרָ֥ם מִקִּֽיר׃
