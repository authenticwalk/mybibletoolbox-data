verse: AMO 9:5
text: וַאדֹנָ֨י יְהוִ֜ה הַצְּבָא֗וֹת הַנּוֹגֵ֤עַ בָּאָ֨רֶץ֙ וַתָּמ֔וֹג וְאָבְל֖וּ
