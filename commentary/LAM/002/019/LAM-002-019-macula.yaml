text: ק֣וּמִי׀רֹ֣נִּי בַלַּ֗יְלָה לְרֹאשׁ֙ אַשְׁמֻר֔וֹת שִׁפְכִ֤י כַמַּ֨יִם֙ לִבֵּ֔ךְ
