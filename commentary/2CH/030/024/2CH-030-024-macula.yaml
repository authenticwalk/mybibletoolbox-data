verse: 2CH 30:24
text: 2CH 30:24 כִּ֣י חִזְקִיָּ֣הוּ מֶֽלֶךְ־יְ֠הוּדָה הֵרִ֨ים לַקָּהָ֜ל אֶ֣לֶף פָּרִים֮
  וְשִׁבְעַ֣ת אֲלָפִ֣ים צֹאן֒סוְהַשָּׂרִ֞ים הֵרִ֤ימוּ לַקָּהָל֙ פָּרִ֣ים אֶ֔לֶף וְצֹ֖אן
  עֲשֶׂ֣רֶת אֲלָפִ֑ים וַיִּֽתְקַדְּשׁ֥וּ כֹהֲנִ֖ים לָרֹֽב׃
