verse: 2CH 30:25
text: 2CH 30:25 וַֽיִּשְׂמְח֣וּ׀כָּל־קְהַ֣ל יְהוּדָ֗ה וְהַכֹּהֲנִים֙ וְהַלְוִיִּ֔ם
  וְכָל־הַקָּהָ֖ל הַבָּאִ֣ים מִיִּשְׂרָאֵ֑ל וְהַגֵּרִ֗ים הַבָּאִים֙ מֵאֶ֣רֶץ יִשְׂרָאֵ֔ל
  וְהַיּוֹשְׁבִ֖ים בִּיהוּדָֽה׃
