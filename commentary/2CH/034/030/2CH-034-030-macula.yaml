text: 2CH 34:30 וַיַּ֣עַל הַמֶּ֣לֶךְ בֵּית־יְ֠הוָה וְכָל־אִ֨ישׁ יְהוּדָ֜ה וְיֹשְׁבֵ֣י
  יְרוּשָׁלִַ֗ם וְהַכֹּֽהֲנִים֙ וְהַלְוִיִּ֔ם וְכָל־הָעָ֖ם מִגָּד֣וֹל וְעַד־קָטָ֑ן
  וַיִּקְרָ֣א בְאָזְנֵיהֶ֗ם אֶת־כָּל־דִּבְרֵי֙ סֵ֣פֶר הַבְּרִ֔ית הַנִּמְצָ֖א בֵּ֥ית
  יְהוָֽה׃
