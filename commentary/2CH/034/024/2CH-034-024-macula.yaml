text: 2CH 34:24 כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְנִ֨י מֵבִ֥יא רָעָ֛ה עַל־הַמָּק֥וֹם הַזֶּ֖ה
  וְעַל־יוֹשְׁבָ֑יו אֵ֤ת כָּל־הָאָלוֹת֙ הַכְּתוּב֣וֹת עַל־הַסֵּ֔פֶר אֲשֶׁ֣ר קָֽרְא֔וּ
  לִפְנֵ֖י מֶ֥לֶךְ יְהוּדָֽה׃
