verse: 2CH 34:27
text: 2CH 34:27 יַ֠עַן רַךְ־לְבָ֨בְךָ֜ וַתִּכָּנַ֣ע׀מִלִּפְנֵ֣י אֱלֹהִ֗ים בְּשָׁמְעֲךָ֤
  אֶת־דְּבָרָיו֙ עַל־הַמָּק֤וֹם הַזֶּה֙ וְעַל־יֹ֣שְׁבָ֔יו וַתִּכָּנַ֣ע לְפָנַ֔י וַתִּקְרַ֥ע
  אֶת־בְּגָדֶ֖יךָ וַתֵּ֣בְךְּ לְפָנָ֑י וְגַם־אֲנִ֥י שָׁמַ֖עְתִּי נְאֻם־יְהוָֽה׃
