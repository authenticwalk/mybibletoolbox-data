verse: 2CH 34:21
text: 2CH 34:21 לְכוּ֩ דִרְשׁ֨וּ אֶת־יְהוָ֜ה בַּעֲדִ֗י וּבְעַד֙ הַנִּשְׁאָר֙ בְּיִשְׂרָאֵ֣ל
  וּבִֽיהוּדָ֔ה עַל־דִּבְרֵ֥י הַסֵּ֖פֶר אֲשֶׁ֣ר נִמְצָ֑א כִּֽי־גְדוֹלָ֤ה חֲמַת־יְהוָה֙
  אֲשֶׁ֣ר נִתְּכָ֣ה בָ֔נוּ עַל֩ אֲשֶׁ֨ר לֹא־שָׁמְר֤וּ אֲבוֹתֵ֨ינוּ֙ אֶת־דְּבַ֣ר יְהוָ֔ה
  לַעֲשׂ֕וֹת כְּכָל־הַכָּת֖וּב עַל־הַסֵּ֥פֶר הַזֶּֽה׃פ
