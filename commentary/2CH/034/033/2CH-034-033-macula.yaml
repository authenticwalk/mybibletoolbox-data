text: 2CH 34:33 וַיָּ֨סַר יֹֽאשִׁיָּ֜הוּ אֶת־כָּל־הַתּוֹעֵב֗וֹת מִֽכָּל־הָאֲרָצוֹת֮
  אֲשֶׁ֣ר לִבְנֵ֣י יִשְׂרָאֵל֒ וַֽיַּעֲבֵ֗ד אֵ֤ת כָּל־הַנִּמְצָא֙ בְּיִשְׂרָאֵ֔ל לַעֲב֖וֹד
  אֶת־יְהוָ֣ה אֱלֹהֵיהֶ֑ם כָּל־יָמָ֕יו לֹ֣א סָ֔רוּ מֵֽאַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵיהֶֽם׃פ
