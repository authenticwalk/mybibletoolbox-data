verse: 2CH 34:31
text: 2CH 34:31 וַיַּעֲמֹ֨ד הַמֶּ֜לֶךְ עַל־עָמְד֗וֹ וַיִּכְרֹ֣ת אֶֽת־הַבְּרִית֮ לִפְנֵ֣י
  יְהוָה֒ לָלֶ֜כֶת אַחֲרֵ֣י יְהוָ֗ה וְלִשְׁמ֤וֹר אֶת־מִצְוֺתָיו֙ וְעֵֽדְוֺתָ֣יו וְחֻקָּ֔יו
  בְּכָל־לְבָב֖וֹ וּבְכָל־נַפְשׁ֑וֹ לַעֲשׂוֹת֙ אֶת־דִּבְרֵ֣י הַבְּרִ֔ית הַכְּתוּבִ֖ים
  עַל־הַסֵּ֥פֶר הַזֶּֽה׃
