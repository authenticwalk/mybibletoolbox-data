text: 2CH 34:25 תַּ֣חַת׀אֲשֶׁ֣ר עֲזָב֗וּנִי וַֽיְקַטְּרוּ֙לֵֽאלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙
