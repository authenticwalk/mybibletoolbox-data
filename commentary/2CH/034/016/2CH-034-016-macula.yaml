text: 2CH 34:16 וַיָּבֵ֨א שָׁפָ֤ן אֶת־הַסֵּ֨פֶר֙ אֶל־הַמֶּ֔לֶךְ וַיָּ֨שֶׁב ע֧וֹד אֶת־הַמֶּ֛לֶךְ
