verse: 2CH 10:16
text: 2CH 10:16 וְכָל־יִשְׂרָאֵ֗ל כִּ֠י לֹא־שָׁמַ֣ע הַמֶּלֶךְ֮ לָהֶם֒ וַיָּשִׁ֣יבוּ
  הָעָ֣ם אֶת־הַמֶּ֣לֶךְ׀לֵאמֹ֡ר מַה־לָּנוּ֩ חֵ֨לֶק בְּדָוִ֜יד וְלֹֽא־נַחֲלָ֣ה בְּבֶן־יִשַׁ֗י
  אִ֤ישׁ לְאֹהָלֶ֨יךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְךָ֖ דָּוִ֑יד וַיֵּ֥לֶךְ כָּל־יִשְׂרָאֵ֖ל
  לְאֹהָלָֽיו׃ס
