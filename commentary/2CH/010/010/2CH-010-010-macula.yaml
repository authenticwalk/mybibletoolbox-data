verse: 2CH 10:10
text: 2CH 10:10 וַיְדַבְּר֣וּ אִתּ֗וֹ הַיְלָדִים֙ אֲשֶׁ֨ר גָּדְל֣וּ אִתּוֹ֮ לֵאמֹר֒
  כֹּֽה־תֹאמַ֡ר לָעָם֩ אֲשֶׁר־דִּבְּר֨וּ אֵלֶ֜יךָ לֵאמֹ֗ר אָבִ֨יךָ֙ הִכְבִּ֣יד אֶת־עֻלֵּ֔נוּ
  וְאַתָּ֖ה הָקֵ֣ל מֵעָלֵ֑ינוּ כֹּ֚ה תֹּאמַ֣ר אֲלֵהֶ֔ם קָֽטָנִּ֥י עָבָ֖ה מִמָּתְנֵ֥י
  אָבִֽי׃
