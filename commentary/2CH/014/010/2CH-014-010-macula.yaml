verse: 2CH 14:10
text: 2CH 14:10 וַיִּקְרָ֨א אָסָ֜א אֶל־יְהוָ֣ה אֱלֹהָיו֮ וַיֹּאמַר֒ יְהוָ֗ה אֵֽין־עִמְּךָ֤
  לַעְזוֹר֙ בֵּ֥ין רַב֙ לְאֵ֣ין כֹּ֔חַ עָזְרֵ֜נוּ יְהוָ֤ה אֱלֹהֵ֨ינוּ֙ כִּֽי־עָלֶ֣יךָ
  נִשְׁעַ֔נּוּ וּבְשִׁמְךָ֣ בָ֔אנוּ עַל־הֶהָמ֖וֹן הַזֶּ֑ה יְהוָ֤ה אֱלֹהֵ֨ינוּ֙ אַ֔תָּה
  אַל־יַעְצֹ֥ר עִמְּךָ֖ אֱנֽוֹשׁ׃ס
