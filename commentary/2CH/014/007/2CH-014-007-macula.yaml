text: 2CH 14:7 וַיְהִ֣י לְאָסָ֗א חַיִל֮ נֹשֵׂ֣א צִנָּ֣ה וָרֹמַח֒ מִֽיהוּדָה֙ שְׁלֹ֣שׁ
  מֵא֣וֹת אֶ֔לֶףסוּמִבִּנְיָמִ֗ן נֹשְׂאֵ֤י מָגֵן֙ וְדֹ֣רְכֵי קֶ֔שֶׁת מָאתַ֥יִם וּשְׁמוֹנִ֖ים
  אָ֑לֶף כָּל־אֵ֖לֶּה גִּבּ֥וֹרֵי חָֽיִל׃
