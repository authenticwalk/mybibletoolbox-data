text: 2CH 18:3 וַיֹּ֜אמֶר אַחְאָ֣ב מֶֽלֶךְ־יִשְׂרָאֵ֗ל אֶל־יְהֽוֹשָׁפָט֙ מֶ֣לֶךְ יְהוּדָ֔ה
