text: 2CH 18:30 וּמֶ֣לֶךְ אֲרָ֡ם צִוָּה֩ אֶת־שָׂרֵ֨י הָרֶ֤כֶב אֲשֶׁר־לוֹ֙ לֵאמֹ֔ר
