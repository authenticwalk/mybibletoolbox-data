text: 2CH 29:30 וַ֠יֹּאמֶר יְחִזְקִיָּ֨הוּ הַמֶּ֤לֶךְ וְהַשָּׂרִים֙ לַלְוִיִּ֔ם לְהַלֵּל֙
  לַֽיהוָ֔ה בְּדִבְרֵ֥י דָוִ֖יד וְאָסָ֣ף הַחֹזֶ֑ה וַֽיְהַלְלוּ֙ עַד־לְשִׂמְחָ֔ה וַֽיִּקְּד֖וּ
  וַיִּֽשְׁתַּחֲוֽוּ׃פ
