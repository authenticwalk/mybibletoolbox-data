text: 2CH 36:17 וַיַּ֨עַל עֲלֵיהֶ֜ם אֶת־מֶ֣לֶךְ כַּשְׂדִּ֗ים וַיַּהֲרֹ֨ג בַּחוּרֵיהֶ֤ם
  בַּחֶ֨רֶב֙ בְּבֵ֣ית מִקְדָּשָׁ֔ם וְלֹ֥א חָמַ֛ל עַל־בָּח֥וּר וּבְתוּלָ֖ה זָקֵ֣ן וְיָשֵׁ֑שׁ
  הַכֹּ֖ל נָתַ֥ן בְּיָדֽוֹ׃
