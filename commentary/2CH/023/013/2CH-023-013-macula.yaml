verse: 2CH 23:13
text: 2CH 23:13 וַתֵּ֡רֶא וְהִנֵּ֣ה הַמֶּלֶךְ֩ עוֹמֵ֨ד עַֽל־עַמּוּד֜וֹ בַּמָּב֗וֹא
  וְהַשָּׂרִ֣ים וְהַחֲצֹצְרוֹת֮ עַל־הַמֶּלֶךְ֒ וְכָל־עַ֨ם הָאָ֜רֶץ שָׂמֵ֗חַ וְתוֹקֵ֨עַ֙
  בַּחֲצֹ֣צְר֔וֹת וְהַמְשֽׁוֹרֲרִים֙ בִּכְלֵ֣י הַשִּׁ֔יר וּמוֹדִיעִ֖ים לְהַלֵּ֑ל וַתִּקְרַ֤ע
  עֲתַלְיָ֨הוּ֙ אֶת־בְּגָדֶ֔יהָ וַתֹּ֖אמֶר קֶ֥שֶׁר קָֽשֶׁר׃ס
