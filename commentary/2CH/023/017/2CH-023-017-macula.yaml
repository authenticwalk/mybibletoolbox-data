text: 2CH 23:17 וַיָּבֹ֨אוּ כָל־הָעָ֤ם בֵּית־הַבַּ֨עַל֙ וַֽיִּתְּצֻ֔הוּ וְאֶת־מִזְבְּחֹתָ֥יו
