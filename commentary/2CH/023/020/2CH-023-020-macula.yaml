verse: 2CH 23:20
text: 2CH 23:20 וַיִּקַּ֣ח אֶת־שָׂרֵ֣י הַמֵּא֡וֹת וְאֶת־הָֽאַדִּירִים֩ וְאֶת־הַמּֽוֹשְׁלִ֨ים
  בָּעָ֜ם וְאֵ֣ת׀כָּל־עַ֣ם הָאָ֗רֶץ וַיּ֤וֹרֶד אֶת־הַמֶּ֨לֶךְ֙ מִבֵּ֣ית יְהוָ֔ה וַיָּבֹ֛אוּ
  בְּתֽוֹךְ־שַׁ֥עַר הָֽעֶלְי֖וֹן בֵּ֣ית הַמֶּ֑לֶךְ וַיּוֹשִׁ֨יבוּ֙ אֶת־הַמֶּ֔לֶךְ
  עַ֖ל כִּסֵּ֥א הַמַּמְלָכָֽה׃
