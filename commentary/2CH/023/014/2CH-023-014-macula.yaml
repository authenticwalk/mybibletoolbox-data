text: 2CH 23:14 וַיּוֹצֵא֩ יְהוֹיָדָ֨ע הַכֹּהֵ֜ן אֶת־שָׂרֵ֥י הַמֵּא֣וֹת׀פְּקוּדֵ֣י
  הַחַ֗יִל וַיֹּ֤אמֶר אֲלֵהֶם֙ הֽוֹצִיא֨וּהָ֙ אֶל־מִבֵּ֣ית הַשְּׂדֵר֔וֹת וְהַבָּ֥א
  אַחֲרֶ֖יהָ יוּמַ֣ת בֶּחָ֑רֶב כִּ֚י אָמַ֣ר הַכֹּהֵ֔ן לֹ֥א תְמִית֖וּהָ בֵּ֥ית יְהוָֽה׃
