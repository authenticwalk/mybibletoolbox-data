text: 2CH 26:21 וַיְהִי֩ עֻזִּיָּ֨הוּ הַמֶּ֜לֶךְ מְצֹרָ֣ע׀עַד־י֣וֹם מוֹת֗וֹ וַיֵּ֜שֶׁב
