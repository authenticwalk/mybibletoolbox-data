text: 2CH 26:18 וַיַּעַמְד֞וּ עַל־עֻזִּיָּ֣הוּ הַמֶּ֗לֶךְ וַיֹּ֤אמְרוּ לוֹ֙ לֹא־לְךָ֣
  עֻזִּיָּ֗הוּ לְהַקְטִיר֙ לַֽיהוָ֔ה כִּ֣י לַכֹּהֲנִ֧ים בְּנֵי־אַהֲרֹ֛ן הַמְקֻדָּשִׁ֖ים
  לְהַקְטִ֑יר צֵ֤א מִן־הַמִּקְדָּשׁ֙ כִּ֣י מָעַ֔לְתָּ וְלֹֽא־לְךָ֥ לְכָב֖וֹד מֵיְהוָ֥ה
  אֱלֹהִֽים׃
