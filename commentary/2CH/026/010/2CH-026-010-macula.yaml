text: 2CH 26:10 וַיִּ֨בֶן מִגְדָּלִ֜ים בַּמִּדְבָּ֗ר וַיַּחְצֹב֙ בֹּר֣וֹת רַבִּ֔ים
  כִּ֤י מִקְנֶה־רַּב֙ הָ֣יָה ל֔וֹ וּבַשְּׁפֵלָ֖ה וּבַמִּישׁ֑וֹר אִכָּרִ֣ים וְכֹֽרְמִ֗ים
  בֶּהָרִים֙ וּבַכַּרְמֶ֔ל כִּֽי־אֹהֵ֥ב אֲדָמָ֖ה הָיָֽה׃ס
