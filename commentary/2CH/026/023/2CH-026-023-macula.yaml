text: 2CH 26:23 וַיִּשְׁכַּ֨ב עֻזִּיָּ֜הוּ עִם־אֲבֹתָ֗יו וַיִּקְבְּר֨וּ אֹת֤וֹ עִם־אֲבֹתָיו֙
