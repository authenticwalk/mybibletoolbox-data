  עַד־לָר֔וֹב כִּ֤י יְהוָה֙ בֵּרַ֣ךְ אֶת־עַמּ֔וֹ וְהַנּוֹתָ֖ר אֶת־הֶהָמ֥וֹן הַזֶּֽה׃ס
