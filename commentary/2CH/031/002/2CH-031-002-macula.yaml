text: 2CH 31:2 וַיַּעֲמֵ֣ד יְחִזְקִיָּ֡הוּ אֶת־מַחְלְק֣וֹת הַכֹּהֲנִ֣ים וְ֠הַלְוִיִּם
  עַֽל־מַחְלְקוֹתָ֞ם אִ֣ישׁ׀כְּפִ֣י עֲבֹדָת֗וֹ לַכֹּהֲנִים֙ וְלַלְוִיִּ֔ם לְעֹלָ֖ה
  וְלִשְׁלָמִ֑ים לְשָׁרֵת֙ וּלְהֹד֣וֹת וּלְהַלֵּ֔ל בְּשַׁעֲרֵ֖י מַחֲנ֥וֹת יְהוָֽה׃ס
