text: 2CH 9:9 וַתִּתֵּ֨ן לַמֶּ֜לֶךְ מֵאָ֥ה וְעֶשְׂרִ֣ים׀כִּכַּ֣ר זָהָ֗ב וּבְשָׂמִ֛ים
