text: 2CH 9:21 כִּֽי־אֳנִיּ֤וֹת לַמֶּ֨לֶךְ֙ הֹלְכ֣וֹת תַּרְשִׁ֔ישׁ עִ֖ם עַבְדֵ֣י חוּרָ֑ם
