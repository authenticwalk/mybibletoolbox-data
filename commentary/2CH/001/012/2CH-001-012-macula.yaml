text: 2CH 1:12 הַֽחָכְמָ֥ה וְהַמַּדָּ֖ע נָת֣וּן לָ֑ךְ וְעֹ֨שֶׁר וּנְכָסִ֤ים וְכָבוֹד֙
  אֶתֶּן־לָ֔ךְ אֲשֶׁ֣ר׀לֹא־הָ֣יָה כֵ֗ן לַמְּלָכִים֙ אֲשֶׁ֣ר לְפָנֶ֔יךָ וְאַחֲרֶ֖יךָ
  לֹ֥א יִֽהְיֶה־כֵּֽן׃
