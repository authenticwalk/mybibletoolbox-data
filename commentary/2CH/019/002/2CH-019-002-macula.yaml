text: 2CH 19:2 וַיֵּצֵ֣א אֶל־פָּנָ֗יו יֵה֣וּא בֶן־חֲנָ֘נִי֮ הַחֹזֶה֒ וַיֹּ֨אמֶר֙ אֶל־הַמֶּ֣לֶךְ
