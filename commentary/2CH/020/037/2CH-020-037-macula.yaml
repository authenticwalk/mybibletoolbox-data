text: 2CH 20:37 וַיִּתְנַבֵּ֞א אֱלִיעֶ֤זֶר בֶּן־דֹּדָוָ֨הוּ֙ מִמָּ֣רֵשָׁ֔ה עַל־יְהוֹשָׁפָ֖ט
