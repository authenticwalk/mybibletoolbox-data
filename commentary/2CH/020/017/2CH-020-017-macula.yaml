verse: 2CH 20:17
text: 2CH 20:17 לֹ֥א לָכֶ֖ם לְהִלָּחֵ֣ם בָּזֹ֑את הִתְיַצְּב֣וּ עִמְד֡וּ וּרְא֣וּ אֶת־יְשׁוּעַת֩
  יְהוָ֨ה עִמָּכֶ֜ם יְהוּדָ֣ה וִֽירוּשָׁלִַ֗ם אַל־תִּֽירְאוּ֙ וְאַל־תֵּחַ֔תּוּ מָחָר֙
  צְא֣וּ לִפְנֵיהֶ֔ם וַיהוָ֖ה עִמָּכֶֽם׃
