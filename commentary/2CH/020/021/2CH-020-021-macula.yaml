text: 2CH 20:21 וַיִּוָּעַץ֙ אֶל־הָעָ֔ם וַיַּעֲמֵ֤ד מְשֹֽׁרֲרִים֙ לַיהוָ֔ה וּֽמְהַֽלְלִ֖ים
