text: 2CH 20:26 וּבַיּ֣וֹם הָרְבִעִ֗י נִקְהֲלוּ֙ לְעֵ֣מֶק בְּרָכָ֔ה כִּי־שָׁ֖ם בֵּרֲכ֣וּ
