verse: 2CH 20:15
text: 2CH 20:15 וַיֹּ֗אמֶר הַקְשִׁ֤יבוּ כָל־יְהוּדָה֙ וְיֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וְהַמֶּ֖לֶךְ
  יְהוֹשָׁפָ֑ט כֹּֽה־אָמַ֨ר יְהוָ֜ה לָכֶ֗ם אַ֠תֶּם אַל־תִּֽירְא֤וּ וְאַל־תֵּחַ֨תּוּ֙
  מִפְּנֵ֨י הֶהָמ֤וֹן הָרָב֙ הַזֶּ֔ה כִּ֣י לֹ֥א לָכֶ֛ם הַמִּלְחָמָ֖ה כִּ֥י לֵאלֹהִֽים׃
