text: 2CH 20:6 וַיֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י אֲבֹתֵ֨ינוּ֙ הֲלֹ֨א אַתָּֽה־ה֤וּא אֱלֹהִים֙
