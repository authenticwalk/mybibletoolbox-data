text: 2CH 20:31 וַיִּמְלֹ֥ךְ יְהוֹשָׁפָ֖ט עַל־יְהוּדָ֑ה בֶּן־שְׁלֹשִׁים֩ וְחָמֵ֨שׁ
  שָׁנָ֜ה בְּמָלְכ֗וֹ וְעֶשְׂרִ֨ים וְחָמֵ֤שׁ שָׁנָה֙ מָלַ֣ךְ בִּֽירוּשָׁלִַ֔ם וְשֵׁ֣ם
  אִמּ֔וֹ עֲזוּבָ֖ה בַּת־שִׁלְחִֽי׃
