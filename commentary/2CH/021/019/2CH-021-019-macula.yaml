text: 2CH 21:19 וַיְהִ֣י לְיָמִ֣ים׀מִיָּמִ֡ים וּכְעֵת֩ צֵ֨את הַקֵּ֜ץ לְיָמִ֣ים שְׁנַ֗יִם
