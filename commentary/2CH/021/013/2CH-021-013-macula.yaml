text: 2CH 21:13 וַתֵּ֗לֶךְ בְּדֶ֨רֶךְ֙ מַלְכֵ֣י יִשְׂרָאֵ֔ל וַתַּזְנֶ֤ה אֶת־יְהוּדָה֙
