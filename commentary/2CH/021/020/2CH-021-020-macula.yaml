text: 2CH 21:20 בֶּן־שְׁלֹשִׁ֤ים וּשְׁתַּ֨יִם֙ הָיָ֣ה בְמָלְכ֔וֹ וּשְׁמוֹנֶ֣ה שָׁנִ֔ים
  מָלַ֖ךְ בִּירוּשָׁלִָ֑ם וַיֵּ֨לֶךְ֙ בְּלֹ֣א חֶמְדָּ֔ה וַֽיִּקְבְּרֻ֨הוּ֙ בְּעִ֣יר
  דָּוִ֔יד וְלֹ֖א בְּקִבְר֥וֹת הַמְּלָכִֽים׃
