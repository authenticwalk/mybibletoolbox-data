text: 2CH 3:8 וַיַּ֨עַשׂ֙ אֶת־בֵּֽית־קֹ֣דֶשׁ הַקֳּדָשִׁ֔ים אָרְכּ֞וֹ עַל־פְּנֵ֤י רֹֽחַב־הַבַּ֨יִת֙
