text: 2CH 3:1 וַיָּ֣חֶל שְׁלֹמֹ֗ה לִבְנ֤וֹת אֶת־בֵּית־יְהוָה֙ בִּיר֣וּשָׁלִַ֔ם בְּהַר֙
