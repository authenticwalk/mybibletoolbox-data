verse: 2CH 35:3
text: 2CH 35:3 וַיֹּ֣אמֶר לַ֠לְוִיִּם הַמְּבִינִ֨ים לְכָל־יִשְׂרָאֵ֜ל הַקְּדוֹשִׁ֣ים
  לַיהוָ֗ה תְּנ֤וּ אֶת־אֲרוֹן־הַקֹּ֨דֶשׁ֙ בַּ֠בַּיִת אֲשֶׁ֨ר בָּנָ֜ה שְׁלֹמֹ֤ה בֶן־דָּוִיד֙
  מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֵין־לָכֶ֥ם מַשָּׂ֖א בַּכָּתֵ֑ף עַתָּ֗ה עִבְדוּ֙ אֶת־יְהוָ֣ה
  אֱלֹֽהֵיכֶ֔ם וְאֵ֖ת עַמּ֥וֹ יִשְׂרָאֵֽל׃
