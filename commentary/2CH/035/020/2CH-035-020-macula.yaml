text: 2CH 35:20 אַחֲרֵ֣י כָל־זֹ֗את אֲשֶׁ֨ר הֵכִ֤ין יֹֽאשִׁיָּ֨הוּ֙ אֶת־הַבַּ֔יִת עָלָ֞ה
