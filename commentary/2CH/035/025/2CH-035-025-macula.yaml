text: 2CH 35:25 וַיְקוֹנֵ֣ן יִרְמְיָהוּ֮ עַל־יֹאשִׁיָּהוּ֒ וַיֹּאמְר֣וּ כָֽל־הַשָּׁרִ֣ים׀וְ֠הַשָּׁרוֹת
  בְּקִינ֨וֹתֵיהֶ֤ם עַל־יֹאשִׁיָּ֨הוּ֙ עַד־הַיּ֔וֹם וַיִּתְּנ֥וּם לְחֹ֖ק עַל־יִשְׂרָאֵ֑ל
  וְהִנָּ֥ם כְּתוּבִ֖ים עַל־הַקִּינֽוֹת׃
