text: 2CH 11:4 כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹא־תַעֲלוּ֩ וְלֹא־תִלָּ֨חֲמ֜וּ עִם־אֲחֵיכֶ֗ם
