text: 2CH 13:12 וְהִנֵּה֩ עִמָּ֨נוּ בָרֹ֜אשׁ הָאֱלֹהִ֧ים׀וְכֹהֲנָ֛יו וַחֲצֹצְר֥וֹת
  הַתְּרוּעָ֖ה לְהָרִ֣יעַ עֲלֵיכֶ֑ם בְּנֵ֣י יִשְׂרָאֵ֗ל אַל־תִּלָּֽחֲמ֛וּ עִם־יְהוָ֥ה
  אֱלֹהֵֽי־אֲבֹתֵיכֶ֖ם כִּי־לֹ֥א תַצְלִֽיחוּ׃
