text: 2CH 32:4 וַיִּקָּבְצ֣וּ עַם־רָ֔ב וַֽיִּסְתְּמוּ֙ אֶת־כָּל־הַמַּעְיָנ֔וֹת וְאֶת־הַנַּ֛חַל
