verse: 2CH 32:15
text: 2CH 32:15 וְעַתָּ֡ה אַל־יַשִּׁיא֩ אֶתְכֶ֨ם חִזְקִיָּ֜הוּ וְאַל־יַסִּ֨ית אֶתְכֶ֣ם
  כָּזֹאת֮ וְאַל־תַּאֲמִ֣ינוּ לוֹ֒ כִּי־לֹ֣א יוּכַ֗ל כָּל־אֱל֨וֹהַ֙ כָּל־גּ֣וֹי וּמַמְלָכָ֔ה
  לְהַצִּ֥יל עַמּ֛וֹ מִיָּדִ֖י וּמִיַּ֣ד אֲבוֹתָ֑י אַ֚ף כִּ֣י אֱֽלֹהֵיכֶ֔ם לֹא־יַצִּ֥ילוּ
  אֶתְכֶ֖ם מִיָּדִֽי׃
