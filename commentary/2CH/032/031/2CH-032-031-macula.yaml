text: 2CH 32:31 וְכֵ֞ן בִּמְלִיצֵ֣י׀שָׂרֵ֣י בָּבֶ֗ל הַֽמְשַׁלְּחִ֤ים עָלָיו֙ לִדְרֹ֗שׁ
