text: 2CH 32:8 עִמּוֹ֙ זְר֣וֹעַ בָּשָׂ֔ר וְעִמָּ֜נוּ יְהוָ֤ה אֱלֹהֵ֨ינוּ֙ לְעָזְרֵ֔נוּ
