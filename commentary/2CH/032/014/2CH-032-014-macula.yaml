text: 2CH 32:14 מִ֠י בְּֽכָל־אֱלֹהֵ֞י הַגּוֹיִ֤ם הָאֵ֨לֶּה֙ אֲשֶׁ֣ר הֶחֱרִ֣ימוּ אֲבוֹתַ֔י
  אֲשֶׁ֣ר יָכ֔וֹל לְהַצִּ֥יל אֶת־עַמּ֖וֹ מִיָּדִ֑י כִּ֤י יוּכַל֙ אֱלֹ֣הֵיכֶ֔ם לְהַצִּ֥יל
  אֶתְכֶ֖ם מִיָּדִֽי׃
