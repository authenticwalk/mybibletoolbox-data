text: 2CH 32:5 וַיִּתְחַזַּ֡ק וַיִּבֶן֩ אֶת־כָּל־הַחוֹמָ֨ה הַפְּרוּצָ֜ה וַיַּ֣עַל
  עַל־הַמִּגְדָּל֗וֹת וְלַח֨וּצָה֙ הַחוֹמָ֣ה אַחֶ֔רֶת וַיְחַזֵּ֥ק אֶת־הַמִּלּ֖וֹא
  עִ֣יר דָּוִ֑יד וַיַּ֥עַשׂ שֶׁ֛לַח לָרֹ֖ב וּמָגִנִּֽים׃
