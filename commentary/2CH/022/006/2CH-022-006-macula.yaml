verse: 2CH 22:6
text: 2CH 22:6 וַיָּ֜שָׁב לְהִתְרַפֵּ֣א בְיִזְרְעֶ֗אל כִּ֤י הַמַּכִּים֙ אֲשֶׁ֣ר הִכֻּ֣הוּ
  בָֽרָמָ֔ה בְּהִלָּ֣חֲמ֔וֹ אֶת־חֲזָהאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַעֲזַרְיָ֨הוּ בֶן־יְהוֹרָ֜ם
  מֶ֣לֶךְ יְהוּדָ֗ה יָרַ֡ד לִרְא֞וֹת אֶת־יְהוֹרָ֧ם בֶּן־אַחְאָ֛ב בְּיִזְרְעֶ֖אל כִּי־חֹלֶ֥ה
  הֽוּא׃
