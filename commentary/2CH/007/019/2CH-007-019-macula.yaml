text: 2CH 7:19 וְאִם־תְּשׁוּב֣וּן אַתֶּ֔ם וַעֲזַבְתֶּם֙ חֻקּוֹתַ֣י וּמִצְוֺתַ֔י אֲשֶׁ֥ר
