text: 2CH 7:22 וְאָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָֽזְב֜וּ אֶת־יְהוָ֣ה׀אֱלֹהֵ֣י אֲבֹתֵיהֶ֗ם
