verse: 2CH 24:24
text: 2CH 24:24 כִּי֩ בְמִצְעַ֨ר אֲנָשִׁ֜ים בָּ֣אוּ׀חֵ֣יל אֲרָ֗ם וַֽיהוָה֙ נָתַ֨ן
  בְּיָדָ֥ם חַ֨יִל֙ לָרֹ֣ב מְאֹ֔ד כִּ֣י עָֽזְב֔וּ אֶת־יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵיהֶ֑ם
  וְאֶת־יוֹאָ֖שׁ עָשׂ֥וּ שְׁפָטִֽים׃
