verse: 2CH 24:5
text: 2CH 24:5 וַיִּקְבֹּץ֮ אֶת־הַכֹּהֲנִ֣ים וְהַלְוִיִּם֒ וַיֹּ֣אמֶר לָהֶ֡ם צְא֣וּ
  לְעָרֵ֪י יְהוּדָ֟ה וְקִבְצוּ֩ מִכָּל־יִשְׂרָאֵ֨ל כֶּ֜סֶף לְחַזֵּ֣ק׀אֶת־בֵּ֣ית אֱלֹֽהֵיכֶ֗ם
  מִדֵּ֤י שָׁנָה֙ בְּשָׁנָ֔ה וְאַתֶּ֖ם תְּמַהֲר֣וּ לַדָּבָ֑ר וְלֹ֥א מִֽהֲר֖וּ הַֽלְוִיִּֽם׃
