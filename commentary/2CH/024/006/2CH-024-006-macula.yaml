text: 2CH 24:6 וַיִּקְרָ֣א הַמֶּלֶךְ֮ לִֽיהוֹיָדָ֣ע הָרֹאשׁ֒ וַיֹּ֣אמֶר ל֗וֹ מַדּ֨וּעַ֙
