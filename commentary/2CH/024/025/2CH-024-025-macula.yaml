verse: 2CH 24:25
text: 2CH 24:25 וּבְלֶכְתָּ֣ם מִמֶּ֗נּוּ כִּֽי־עָזְב֣וּ אֹתוֹ֮ בְּמַחֲלוּיִ֣ם רַבִּים֒
  הִתְקַשְּׁר֨וּ עָלָ֜יו עֲבָדָ֗יו בִּדְמֵי֙ בְּנֵי֙ יְהוֹיָדָ֣ע הַכֹּהֵ֔ן וַיַּֽהַרְגֻ֥הוּ
  עַל־מִטָּת֖וֹ וַיָּמֹ֑ת וַֽיִּקְבְּרֻ֨הוּ֙ בְּעִ֣יר דָּוִ֔יד וְלֹ֥א קְבָרֻ֖הוּ בְּקִבְר֥וֹת
  הַמְּלָכִֽים׃ס
