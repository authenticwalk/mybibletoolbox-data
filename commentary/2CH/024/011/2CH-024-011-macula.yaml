verse: 2CH 24:11
text: 2CH 24:11 וַיְהִ֡י בְּעֵת֩ יָבִ֨יא אֶת־הָֽאָר֜וֹן אֶל־פְּקֻדַּ֣ת הַמֶּלֶךְ֮
  בְּיַ֣ד הַלְוִיִּם֒ וְכִרְאוֹתָ֞ם כִּי־רַ֣ב הַכֶּ֗סֶף וּבָ֨א סוֹפֵ֤ר הַמֶּ֨לֶךְ֙
  וּפְקִיד֙ כֹּהֵ֣ן הָרֹ֔אשׁ וִיעָ֨רוּ֙ אֶת־הָ֣אָר֔וֹן וְיִשָּׂאֻ֖הוּ וִֽישִׁיבֻ֣הוּ
  אֶל־מְקֹמ֑וֹ כֹּ֤ה עָשׂוּ֙ לְי֣וֹם׀בְּי֔וֹם וַיַּֽאַסְפוּ־כֶ֖סֶף לָרֹֽב׃
