verse: 2CH 24:12
text: 2CH 24:12 וַיִּתְּנֵ֨הוּ הַמֶּ֜לֶךְ וִֽיהוֹיָדָ֗ע אֶל־עוֹשֵׂה֙ מְלֶ֨אכֶת֙ עֲבוֹדַ֣ת
  בֵּית־יְהוָ֔ה וַיִּֽהְי֤וּ שֹׂכְרִים֙ חֹצְבִ֣ים וְחָרָשִׁ֔ים לְחַדֵּ֖שׁ בֵּ֣ית יְהוָ֑ה
  וְ֠גַם לְחָרָשֵׁ֤י בַרְזֶל֙ וּנְחֹ֔שֶׁת לְחַזֵּ֖ק אֶת־בֵּ֥ית יְהוָֽה׃
