verse: 2CH 2:13
text: 2CH 2:13 בֶּן־אִשָּׁ֞ה מִן־בְּנ֣וֹת דָּ֗ן וְאָבִ֣יו אִישׁ־צֹרִ֡י יוֹדֵ֡עַ לַעֲשׂ֣וֹת
  בַּזָּֽהָב־וּ֠בַכֶּסֶף בַּנְּחֹ֨שֶׁת בַּבַּרְזֶ֜ל בָּאֲבָנִ֣ים וּבָעֵצִ֗ים בָּאַרְגָּמָ֤ן
  בַּתְּכֵ֨לֶת֙ וּבַבּ֣וּץ וּבַכַּרְמִ֔יל וּלְפַתֵּ֨חַ֙ כָּל־פִּתּ֔וּחַ וְלַחְשֹׁ֖ב
  כָּל־מַחֲשָׁ֑בֶת אֲשֶׁ֤ר יִנָּֽתֶן־לוֹ֙ עִם־חֲכָמֶ֔יךָ וְֽחַכְמֵ֔י אֲדֹנִ֖י דָּוִ֥יד
  אָבִֽיךָ׃
