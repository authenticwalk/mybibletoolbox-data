text: 2CH 2:6 וְעַתָּ֡ה שְֽׁלַֽח־לִ֣י אִישׁ־חָכָ֡ם לַעֲשׂוֹת֩ בַּזָּהָ֨ב וּבַכֶּ֜סֶף
  וּבַנְּחֹ֣שֶׁת וּבַבַּרְזֶ֗ל וּבָֽאַרְגְּוָן֙ וְכַרְמִ֣יל וּתְכֵ֔לֶת וְיֹדֵ֖עַ לְפַתֵּ֣חַ
  פִּתּוּחִ֑ים עִם־הַֽחֲכָמִ֗ים אֲשֶׁ֤ר עִמִּי֙ בִּֽיהוּדָ֣ה וּבִֽירוּשָׁלִַ֔ם אֲשֶׁ֥ר
  הֵכִ֖ין דָּוִ֥יד אָבִֽי׃
