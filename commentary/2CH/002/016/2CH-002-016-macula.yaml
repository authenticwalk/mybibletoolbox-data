text: 2CH 2:16 וַיִּסְפֹּ֣ר שְׁלֹמֹ֗ה כָּל־הָאֲנָשִׁ֤ים הַגֵּירִים֙ אֲשֶׁר֙ בְּאֶ֣רֶץ
