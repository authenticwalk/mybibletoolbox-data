text: 2CH 2:11 וַיֹּאמֶר֮ חוּרָם֒ בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר עָשָׂ֔ה
  אֶת־הַשָּׁמַ֖יִם וְאֶת־הָאָ֑רֶץ אֲשֶׁ֣ר נָתַן֩ לְדָוִ֨יד הַמֶּ֜לֶךְ בֵּ֣ן חָכָ֗ם
  יוֹדֵ֨עַ֙ שֵׂ֣כֶל וּבִינָ֔ה אֲשֶׁ֤ר יִבְנֶה־בַּ֨יִת֙ לַיהוָ֔ה וּבַ֖יִת לְמַלְכוּתֽוֹ׃
