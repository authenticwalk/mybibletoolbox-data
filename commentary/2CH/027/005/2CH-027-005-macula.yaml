verse: 2CH 27:5
text: 2CH 27:5 וְ֠הוּא נִלְחַ֞ם עִם־מֶ֣לֶךְ בְּנֵי־עַמּוֹן֮ וַיֶּחֱזַ֣ק עֲלֵיהֶם֒
  וַיִּתְּנוּ־ל֨וֹ בְנֵֽי־עַמּ֜וֹן בַּשָּׁנָ֣ה הַהִ֗יא מֵאָה֙ כִּכַּר־כֶּ֔סֶף וַעֲשֶׂ֨רֶת
  אֲלָפִ֤ים כֹּרִים֙ חִטִּ֔ים וּשְׂעוֹרִ֖ים עֲשֶׂ֣רֶת אֲלָפִ֑ים זֹ֗את הֵשִׁ֤יבוּ לוֹ֙
  בְּנֵ֣י עַמּ֔וֹןסוּבַשָּׁנָ֥ה הַשֵּׁנִ֖ית וְהַשְּׁלִשִֽׁית׃
