verse: 2CH 28:15
text: 2CH 28:15 וַיָּקֻ֣מוּ הָאֲנָשִׁים֩ אֲשֶׁר־נִקְּב֨וּ בְשֵׁמ֜וֹת וַיַּחֲזִ֣יקוּ
  בַשִּׁבְיָ֗ה וְכָֽל־מַעֲרֻמֵּיהֶם֮ הִלְבִּ֣ישׁוּ מִן־הַשָּׁלָל֒ וַיַּלְבִּשׁ֣וּם
  וַ֠יַּנְעִלוּם וַיַּאֲכִל֨וּם וַיַּשְׁק֜וּם וַיְסֻכ֗וּם וַיְנַהֲל֤וּם בַּחֲמֹרִים֙
  לְכָל־כּוֹשֵׁ֔ל וַיְבִיא֛וּם יְרֵח֥וֹ עִיר־הַתְּמָרִ֖ים אֵ֣צֶל אֲחֵיהֶ֑ם וַיָּשׁ֖וּבוּ
  שֹׁמְרֽוֹן׃פ
