verse: 2CH 28:9
text: 2CH 28:9 וְ֠שָׁם הָיָ֨ה נָבִ֥יא לַֽיהוָה֮ עֹדֵ֣ד שְׁמוֹ֒ וַיֵּצֵ֗א לִפְנֵ֤י
  הַצָּבָא֙ הַבָּ֣א לְשֹׁמְר֔וֹן וַיֹּ֣אמֶר לָהֶ֗ם הִ֠נֵּה בַּחֲמַ֨ת יְהוָ֧ה אֱלֹהֵֽי־אֲבוֹתֵיכֶ֛ם
  עַל־יְהוּדָ֖ה נְתָנָ֣ם בְּיֶדְכֶ֑ם וַתַּֽהַרְגוּ־בָ֣ם בְזַ֔עַף עַ֥ד לַשָּׁמַ֖יִם
  הִגִּֽיעַ׃
