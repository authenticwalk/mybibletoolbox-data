text: 2CH 28:10 וְ֠עַתָּה בְּנֵֽי־יְהוּדָ֤ה וִֽירוּשָׁלִַ֨ם֙ אַתֶּ֣ם אֹמְרִ֔ים לִכְבֹּ֛שׁ
