text: 2CH 28:24 וַיֶּאֱסֹ֨ף אָחָ֜ז אֶת־כְּלֵ֣י בֵית־הָֽאֱלֹהִ֗ים וַיְקַצֵּץ֙ אֶת־כְּלֵ֣י
