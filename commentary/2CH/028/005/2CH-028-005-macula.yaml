text: 2CH 28:5 וַֽיִּתְּנֵ֜הוּ יְהוָ֣ה אֱלֹהָיו֮ בְּיַ֣ד מֶ֣לֶךְ אֲרָם֒ וַיַּ֨כּוּ־ב֔וֹ
  וַיִּשְׁבּ֤וּ מִמֶּ֨נּוּ֙ שִׁבְיָ֣ה גְדוֹלָ֔ה וַיָּבִ֖יאוּ דַּרְמָ֑שֶׂק וְ֠גַם בְּיַד־מֶ֤לֶךְ
  יִשְׂרָאֵל֙ נִתָּ֔ן וַיַּךְ־בּ֖וֹ מַכָּ֥ה גְדוֹלָֽה׃ס
