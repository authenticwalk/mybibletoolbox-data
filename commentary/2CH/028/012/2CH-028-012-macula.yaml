verse: 2CH 28:12
text: 2CH 28:12 וַיָּקֻ֨מוּ אֲנָשִׁ֜ים מֵרָאשֵׁ֣י בְנֵֽי־אֶפְרַ֗יִם עֲזַרְיָ֤הוּ בֶן־יְהֽוֹחָנָן֙
  בֶּרֶכְיָ֣הוּ בֶן־מְשִׁלֵּמ֔וֹת וִֽיחִזְקִיָּ֨הוּ֙ בֶּן־שַׁלֻּ֔ם וַעֲמָשָׂ֖א בֶּן־חַדְלָ֑י
  עַל־הַבָּאִ֖ים מִן־הַצָּבָֽא׃
