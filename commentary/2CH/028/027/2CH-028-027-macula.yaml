text: 2CH 28:27 וַיִּשְׁכַּ֨ב אָחָ֜ז עִם־אֲבֹתָ֗יו וַֽיִּקְבְּרֻ֤הוּ בָעִיר֙ בִּיר֣וּשָׁלִַ֔ם
