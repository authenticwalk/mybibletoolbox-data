verse: 2CH 28:18
text: 2CH 28:18 וּפְלִשְׁתִּ֣ים פָּשְׁט֗וּ בְּעָרֵ֨י הַשְּׁפֵלָ֣ה וְהַנֶּגֶב֮ לִֽיהוּדָה֒
  וַֽ֠יִּלְכְּדוּ אֶת־בֵּֽית־שֶׁ֨מֶשׁ וְאֶת־אַיָּל֜וֹן וְאֶת־הַגְּדֵר֗וֹת וְאֶת־שׂוֹכ֤וֹ
  וּבְנוֹתֶ֨יהָ֙ וְאֶת־תִּמְנָ֣ה וּבְנוֹתֶ֔יהָ וְאֶת־גִּמְז֖וֹ וְאֶת־בְּנֹתֶ֑יהָ וַיֵּשְׁב֖וּ
  שָֽׁם׃
