text: 2CH 12:9 וַיַּ֨עַל שִׁישַׁ֥ק מֶֽלֶךְ־מִצְרַיִם֮ עַל־יְרוּשָׁלִַם֒ וַיִּקַּ֞ח
  אֶת־אֹצְר֣וֹת בֵּית־יְהוָ֗ה וְאֶת־אֹֽצְרוֹת֙ בֵּ֣ית הַמֶּ֔לֶךְ אֶת־הַכֹּ֖ל לָקָ֑ח
  וַיִּקַּח֙ אֶת־מָגִנֵּ֣י הַזָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה׃
