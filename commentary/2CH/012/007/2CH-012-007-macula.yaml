text: 2CH 12:7 וּבִרְא֤וֹת יְהוָה֙ כִּ֣י נִכְנָ֔עוּ הָיָה֩ דְבַר־יְהוָ֨האֶל־שְׁמַֽעְיָ֧ה׀לֵאמֹ֛ר
