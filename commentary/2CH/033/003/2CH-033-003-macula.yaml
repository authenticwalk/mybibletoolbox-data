text: 2CH 33:3 וַיָּ֗שָׁב וַיִּ֨בֶן֙ אֶת־הַבָּמ֔וֹת אֲשֶׁ֥ר נִתַּ֖ץ יְחִזְקִיָּ֣הוּ
