verse: 2CH 33:8
text: 2CH 33:8 וְלֹ֣א אוֹסִ֗יף לְהָסִיר֙ אֶת־רֶ֣גֶל יִשְׂרָאֵ֔ל מֵעַל֙ הָֽאֲדָמָ֔ה
  אֲשֶׁ֥ר הֶֽעֱמַ֖דְתִּי לַאֲבֹֽתֵיכֶ֑ם רַ֣ק׀אִם־יִשְׁמְר֣וּ לַעֲשׂ֗וֹת אֵ֚ת כָּל־אֲשֶׁ֣ר
  צִוִּיתִ֔ים לְכָל־הַתּוֹרָ֛ה וְהַֽחֻקִּ֥ים וְהַמִּשְׁפָּטִ֖ים בְּיַד־מֹשֶֽׁה׃
