text: 2CH 33:11 וַיָּבֵ֨א יְהוָ֜ה עֲלֵיהֶ֗ם אֶת־שָׂרֵ֤י הַצָּבָא֙ אֲשֶׁר֙ לְמֶ֣לֶךְ
  אַשּׁ֔וּר וַיִּלְכְּד֥וּ אֶת־מְנַשֶּׁ֖ה בַּחֹחִ֑ים וַיַּֽאַסְרֻ֨הוּ֙ בַּֽנְחֻשְׁתַּ֔יִם
  וַיּוֹלִיכֻ֖הוּ בָּבֶֽלָה׃
