verse: 2CH 25:4
text: 2CH 25:4 וְאֶת־בְּנֵיהֶ֖ם לֹ֣א הֵמִ֑ית כִּ֣י כַכָּת֣וּב בַּתּוֹרָ֡ה בְּסֵ֣פֶר
  מֹשֶׁה֩ אֲשֶׁר־צִוָּ֨ה יְהוָ֜ה לֵאמֹ֗ר לֹא־יָמ֨וּתוּ אָב֤וֹת עַל־בָּנִים֙ וּבָנִים֙
  לֹא־יָמ֣וּתוּ עַל־אָב֔וֹת כִּ֛י אִ֥ישׁ בְּחֶטְא֖וֹ יָמֽוּתוּ׃פ
