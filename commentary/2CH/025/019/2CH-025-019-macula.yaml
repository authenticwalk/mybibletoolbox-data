text: 2CH 25:19 אָמַ֗רְתָּ הִנֵּ֤ה הִכִּ֨יתָ֙ אֶת־אֱד֔וֹם וּנְשָׂאֲךָ֥ לִבְּךָ֖ לְהַכְבִּ֑יד
