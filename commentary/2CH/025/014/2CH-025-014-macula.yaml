verse: 2CH 25:14
text: 2CH 25:14 וַיְהִ֗י אַחֲרֵ֨י ב֤וֹא אֲמַצְיָ֨הוּ֙ מֵֽהַכּ֣וֹת אֶת־אֲדוֹמִ֔ים וַיָּבֵ֗א
  אֶת־אֱלֹהֵי֙ בְּנֵ֣י שֵׂעִ֔יר וַיַּֽעֲמִידֵ֥ם ל֖וֹ לֵאלֹהִ֑ים וְלִפְנֵיהֶ֥ם יִֽשְׁתַּחֲוֶ֖ה
  וְלָהֶ֥ם יְקַטֵּֽר׃
