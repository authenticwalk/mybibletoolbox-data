verse: 2CH 25:23
text: 2CH 25:23 וְאֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ־יְהוּדָ֜ה בֶּן־יוֹאָ֣שׁ בֶּן־יְהוֹאָחָ֗ז
  תָּפַ֛שׂ יוֹאָ֥שׁ מֶֽלֶךְ־יִשְׂרָאֵ֖ל בְּבֵ֣ית שָׁ֑מֶשׁ וַיְבִיאֵ֨הוּ֙ יְר֣וּשָׁלִַ֔ם
  וַיִּפְרֹ֞ץ בְּחוֹמַ֣ת יְרוּשָׁלִַ֗ם מִשַּׁ֤עַר אֶפְרַ֨יִם֙ עַד־שַׁ֣עַר הַפּוֹנֶ֔ה
  אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה׃
