text: 2CH 25:9 וַיֹּ֤אמֶר אֲמַצְיָ֨הוּ֙ לְאִ֣ישׁ הָאֱלֹהִ֔ים וּמַֽה־לַּעֲשׂוֹת֙ לִמְאַ֣ת
  הַכִּכָּ֔ר אֲשֶׁ֥ר נָתַ֖תִּי לִגְד֣וּד יִשְׂרָאֵ֑ל וַיֹּ֨אמֶר֙ אִ֣ישׁ הָֽאֱלֹהִ֔ים
  יֵ֚שׁ לַֽיהוָ֔ה לָ֥תֶת לְךָ֖ הַרְבֵּ֥ה מִזֶּֽה׃
