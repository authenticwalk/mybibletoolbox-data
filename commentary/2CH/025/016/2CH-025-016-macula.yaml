text: 2CH 25:16 וַיְהִ֣י׀בְּדַבְּר֣וֹ אֵלָ֗יו וַיֹּ֤אמֶר לוֹ֙ הַלְיוֹעֵ֤ץ לַמֶּ֨לֶךְ֙
  נְתַנּ֔וּךָ חֲדַל־לְךָ֖ לָ֣מָּה יַכּ֑וּךָ וַיֶּחְדַּ֣ל הַנָּבִ֗יא וַיֹּ֨אמֶר֙ יָדַ֗עְתִּי
  כִּֽי־יָעַ֤ץ אֱלֹהִים֙ לְהַשְׁחִיתֶ֔ךָ כִּֽי־עָשִׂ֣יתָ זֹּ֔את וְלֹ֥א שָׁמַ֖עְתָּ
  לַעֲצָתִֽי׃פ
