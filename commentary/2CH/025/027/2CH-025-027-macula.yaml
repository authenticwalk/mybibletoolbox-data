text: 2CH 25:27 וּמֵעֵ֗ת אֲשֶׁר־סָ֤ר אֲמַצְיָ֨הוּ֙ מֵאַחֲרֵ֣י יְהוָ֔ה וַיִּקְשְׁר֨וּ
