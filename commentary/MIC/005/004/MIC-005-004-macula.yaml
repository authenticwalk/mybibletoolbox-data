verse: MIC 5:4
text: וְהָיָ֥ה זֶ֖ה שָׁל֑וֹם אַשּׁ֣וּר׀כִּֽי־יָב֣וֹא בְאַרְצֵ֗נוּ וְכִ֤י יִדְרֹךְ֙
