verse: MIC 5:6
text: וְהָיָ֣ה׀שְׁאֵרִ֣ית יַעֲקֹ֗ב בְּקֶ֨רֶב֙ עַמִּ֣ים רַבִּ֔ים כְּטַל֙ מֵאֵ֣ת יְהוָ֔ה
  כִּרְבִיבִ֖ים עֲלֵי־עֵ֑שֶׂב אֲשֶׁ֤ר לֹֽא־יְקַוֶּה֙ לְאִ֔ישׁ וְלֹ֥א יְיַחֵ֖ל לִבְנֵ֥י
  אָדָֽם׃
