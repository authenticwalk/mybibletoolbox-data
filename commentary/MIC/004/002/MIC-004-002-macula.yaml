text: וְֽהָלְכ֞וּ גּוֹיִ֣ם רַבִּ֗ים וְאָֽמְרוּ֙ לְכ֣וּ׀וְנַעֲלֶ֣ה אֶל־הַר־יְהוָ֗ה
