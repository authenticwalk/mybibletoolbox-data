verse: EZK 9:9
text: וַיֹּ֣אמֶר אֵלַ֗י עֲוֺ֨ן בֵּֽית־יִשְׂרָאֵ֤ל וִֽיהוּדָה֙ גָּדוֹל֙ בִּמְאֹ֣ד מְאֹ֔ד
