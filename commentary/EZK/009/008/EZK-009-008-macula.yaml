text: וַֽיְהִי֙ כְּהַכּוֹתָ֔ם וְנֵֽאשֲׁאַ֖ר אָ֑נִי וָאֶפְּלָ֨ה עַל־פָּנַ֜י וָאֶזְעַ֗ק
