verse: EZK 9:2
text: וְהִנֵּ֣ה שִׁשָּׁ֣ה אֲנָשִׁ֡ים בָּאִ֣ים׀מִדֶּרֶךְ־שַׁ֨עַר הָעֶלְי֜וֹן אֲשֶׁ֣ר׀מָפְנֶ֣ה
  צָפ֗וֹנָה וְאִ֨ישׁ כְּלִ֤י מַפָּצוֹ֙ בְּיָד֔וֹ וְאִישׁ־אֶחָ֤ד בְּתוֹכָם֙ לָבֻ֣שׁ
  בַּדִּ֔ים וְקֶ֥סֶת הַסֹּפֵ֖ר בְּמָתְנָ֑יו וַיָּבֹ֨אוּ֙ וַיַּ֣עַמְד֔וּ אֵ֖צֶל מִזְבַּ֥ח
  הַנְּחֹֽשֶׁת׃
