text: לָכֵ֣ן חַי־אָ֗נִי נְאֻם֮ אֲדֹנָ֣י יְהוִה֒ וְעָשִׂ֗יתִי כְּאַפְּךָ֙ וּכְקִנְאָ֣תְךָ֔
