text: כְּשִׂמְחָ֨תְךָ֜ לְנַחְלַ֧ת בֵּֽית־יִשְׂרָאֵ֛ל עַ֥ל אֲשֶׁר־שָׁמֵ֖מָה כֵּ֣ן אֶעֱשֶׂה־לָּ֑ךְ
  שְׁמָמָ֨ה תִֽהְיֶ֤ה הַר־שֵׂעִיר֙ וְכָל־אֱד֣וֹם כֻּלָּ֔הּ וְיָדְע֖וּ כִּֽי־אֲנִ֥י
  יְהוָֽה׃פ
