verse: EZK 7:27
text: הַמֶּ֣לֶךְ יִתְאַבָּ֗ל וְנָשִׂיא֙ יִלְבַּ֣שׁ שְׁמָמָ֔ה וִידֵ֥י עַם־הָאָ֖רֶץ
  תִּבָּהַ֑לְנָה מִדַּרְכָּ֞ם אֶעֱשֶׂ֤ה אוֹתָם֙ וּבְמִשְׁפְּטֵיהֶ֣ם אֶשְׁפְּטֵ֔ם וְיָדְע֖וּ
  כִּֽי־אֲנִ֥י יְהוָֽה׃פ
