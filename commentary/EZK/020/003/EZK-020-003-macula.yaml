verse: EZK 20:3
text: בֶּן־אָדָ֗ם דַּבֵּ֞ר אֶת־זִקְנֵ֤י יִשְׂרָאֵל֙ וְאָמַרְתָּ֣ אֲלֵהֶ֔ם כֹּ֤ה אָמַר֙
  אֲדֹנָ֣י יְהוִ֔ה הֲלִדְרֹ֥שׁ אֹתִ֖י אַתֶּ֣ם בָּאִ֑ים חַי־אָ֨נִי֙ אִם־אִדָּרֵ֣שׁ
  לָכֶ֔ם נְאֻ֖ם אֲדֹנָ֥י יְהוִֽה׃
