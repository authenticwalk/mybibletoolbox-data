verse: EZK 20:40
text: כִּ֣י בְהַר־קָדְשִׁ֞י בְּהַ֣ר׀מְר֣וֹם יִשְׂרָאֵ֗ל נְאֻם֙ אֲדֹנָ֣י יְהוִ֔ה שָׁ֣ם
  יַעַבְדֻ֜נִי כָּל־בֵּ֧ית יִשְׂרָאֵ֛ל כֻּלֹּ֖ה בָּאָ֑רֶץ שָׁ֣ם אֶרְצֵ֔ם וְשָׁ֞ם אֶדְר֣וֹשׁ
  אֶת־תְּרוּמֹֽתֵיכֶ֗ם וְאֶת־רֵאשִׁ֛ית מַשְׂאוֹתֵיכֶ֖ם בְּכָל־קָדְשֵׁיכֶֽם׃
