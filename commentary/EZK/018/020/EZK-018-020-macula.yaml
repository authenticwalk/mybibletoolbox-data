verse: EZK 18:20
text: הַנֶּ֥פֶשׁ הַחֹטֵ֖את הִ֣יא תָמ֑וּת בֵּ֞ן לֹא־יִשָּׂ֣א׀בַּעֲוֺ֣ן הָאָ֗ב וְאָב֙
  לֹ֤א יִשָּׂא֙ בַּעֲוֺ֣ן הַבֵּ֔ן צִדְקַ֤ת הַצַּדִּיק֙ עָלָ֣יו תִּֽהְיֶ֔ה וְרִשְׁעַ֥ת
  הָרָשָׁ֖ע עָלָ֥יו תִּֽהְיֶֽה׃ס
