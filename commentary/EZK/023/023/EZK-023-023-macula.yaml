verse: EZK 23:23
text: בְּנֵ֧י בָבֶ֣ל וְכָל־כַּשְׂדִּ֗ים פְּק֤וֹד וְשׁ֨וֹעַ֙ וְק֔וֹעַ כָּל־בְּנֵ֥י
  אַשּׁ֖וּר אוֹתָ֑ם בַּח֨וּרֵי חֶ֜מֶד פַּח֤וֹת וּסְגָנִים֙ כֻּלָּ֔ם שָֽׁלִשִׁים֙ וּקְרוּאִ֔ים
  רֹכְבֵ֥י סוּסִ֖ים כֻּלָּֽם׃
