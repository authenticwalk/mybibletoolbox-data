text: לָכֵ֞ן כֹּה־אָמַ֣ר׀אֲדֹנָ֣י יְהֹוִ֗ה הִנְנִי֙ אֶל־פַּרְעֹ֣ה מֶֽלֶךְ־מִצְרַ֔יִם
