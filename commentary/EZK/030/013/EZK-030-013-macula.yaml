verse: EZK 30:13
text: כֹּֽה־אָמַ֞ר אֲדֹנָ֣י יְהוִ֗ה וְהַאֲבַדְתִּ֨י גִלּוּלִ֜ים וְהִשְׁבַּתִּ֤י אֱלִילִים֙
  מִנֹּ֔ף וְנָשִׂ֥יא מֵאֶֽרֶץ־מִצְרַ֖יִם לֹ֣א יִֽהְיֶה־ע֑וֹד וְנָתַתִּ֥י יִרְאָ֖ה
  בְּאֶ֥רֶץ מִצְרָֽיִם׃
