verse: EZK 44:24
text: וְעַל־רִ֗יב הֵ֚מָּה יַעַמְד֣וּ לְמִשְׁפָּ֔ט בְּמִשְׁפָּטַ֖י יִשְׁפְּט֑וּהוּוְאֶת־תּוֹרֹתַ֤י
  וְאֶת־חֻקֹּתַי֙ בְּכָל־מוֹעֲדַ֣י יִשְׁמֹ֔רוּ וְאֶת־שַׁבְּתוֹתַ֖י יְקַדֵּֽשׁוּ׃
