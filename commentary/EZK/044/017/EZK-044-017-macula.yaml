verse: EZK 44:17
text: וְהָיָ֗ה בְּבוֹאָם֙ אֶֽל־שַׁעֲרֵי֙ הֶחָצֵ֣ר הַפְּנִימִ֔ית בִּגְדֵ֥י פִשְׁתִּ֖ים
