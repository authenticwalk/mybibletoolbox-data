text: כֹּה־אָמַר֮ אֲדֹנָ֣י יְהוִה֒ כָּל־בֶּן־נֵכָ֗ר עֶ֤רֶל לֵב֙ וְעֶ֣רֶל בָּשָׂ֔ר
