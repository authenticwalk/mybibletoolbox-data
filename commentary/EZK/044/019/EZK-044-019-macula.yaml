verse: EZK 44:19
text: וּ֠בְצֵאתָם אֶל־הֶחָצֵ֨ר הַחִיצוֹנָ֜ה אֶל־הֶחָצֵ֣ר הַחִיצוֹנָה֮ אֶל־הָעָם֒ יִפְשְׁט֣וּ
  אֶת־בִּגְדֵיהֶ֗ם אֲשֶׁר־הֵ֨מָּה֙ מְשָׁרְתִ֣ם בָּ֔ם וְהִנִּ֥יחוּ אוֹתָ֖ם בְּלִֽשְׁכֹ֣ת
  הַקֹּ֑דֶשׁ וְלָֽבְשׁוּ֙ בְּגָדִ֣ים אֲחֵרִ֔ים וְלֹֽא־יְקַדְּשׁ֥וּ אֶת־הָעָ֖ם בְּבִגְדֵיהֶֽם׃
