verse: EZK 44:11
text: וְהָי֤וּ בְמִקְדָּשִׁי֙ מְשָׁ֣רְתִ֔ים פְּקֻדּוֹת֙ אֶל־שַׁעֲרֵ֣י הַבַּ֔יִת וּֽמְשָׁרְתִ֖ים
  אֶת־הַבָּ֑יִת הֵ֠מָּה יִשְׁחֲט֨וּ אֶת־הָעֹלָ֤ה וְאֶת־הַזֶּ֨בַח֙ לָעָ֔ם וְהֵ֛מָּה
  יַעַמְד֥וּ לִפְנֵיהֶ֖ם לְשָֽׁרְתָֽם׃
