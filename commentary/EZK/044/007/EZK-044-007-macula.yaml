verse: EZK 44:7
text: בַּהֲבִיאֲכֶ֣ם בְּנֵֽי־נֵכָ֗ר עַרְלֵי־לֵב֙ וְעַרְלֵ֣י בָשָׂ֔ר לִהְי֥וֹת בְּמִקְדָּשִׁ֖י
  לְחַלְּל֣וֹ אֶת־בֵּיתִ֑י בְּהַקְרִֽיבְכֶ֤ם אֶת־לַחְמִי֙ חֵ֣לֶב וָדָ֔ם וַיָּפֵ֨רוּ֙
  אֶת־בְּרִיתִ֔י אֶ֖ל כָּל־תּוֹעֲבוֹתֵיכֶֽם׃
