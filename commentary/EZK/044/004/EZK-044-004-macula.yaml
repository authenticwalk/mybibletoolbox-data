text: וַיְבִיאֵ֜נִי דֶּֽרֶךְ־שַׁ֣עַר הַצָּפוֹן֮ אֶל־פְּנֵ֣י הַבַּיִת֒ וָאֵ֕רֶא וְהִנֵּ֛ה
