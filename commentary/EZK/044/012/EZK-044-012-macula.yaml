verse: EZK 44:12
text: יַ֗עַן אֲשֶׁ֨ר יְשָׁרְת֤וּ אוֹתָם֙ לִפְנֵ֣י גִלּֽוּלֵיהֶ֔ם וְהָי֥וּ לְבֵֽית־יִשְׂרָאֵ֖ל
  לְמִכְשׁ֣וֹל עָוֺ֑ן עַל־כֵּן֩ נָשָׂ֨אתִי יָדִ֜י עֲלֵיהֶ֗ם נְאֻם֙ אֲדֹנָ֣י יְהוִ֔ה
  וְנָשְׂא֖וּ עֲוֺנָֽם׃
