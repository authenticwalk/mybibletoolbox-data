verse: EZK 44:5
text: וַיֹּ֨אמֶר אֵלַ֜י יְהֹוָ֗ה בֶּן־אָדָ֡ם שִׂ֣ים לִבְּךָ֩ וּרְאֵ֨ה בְעֵינֶ֜יךָ
  וּבְאָזְנֶ֣יךָ שְּׁמָ֗ע אֵ֣ת כָּל־אֲשֶׁ֤ר אֲנִי֙ מְדַבֵּ֣ר אֹתָ֔ךְ לְכָל־חֻקּ֥וֹת
  בֵּית־יְהוָ֖ה וּלְכָל־תּֽוֹרֹתָ֑יו וְשַׂמְתָּ֤ לִבְּךָ֙ לִמְב֣וֹא הַבַּ֔יִת בְּכֹ֖ל
  מוֹצָאֵ֥י הַמִּקְדָּֽשׁ׃
