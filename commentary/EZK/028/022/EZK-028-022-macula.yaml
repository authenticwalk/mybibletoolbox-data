text: וְאָמַרְתָּ֗ כֹּ֤ה אָמַר֙ אֲדֹנָ֣י יְהוִ֔ה הִנְנִ֤י עָלַ֨יִךְ֙ צִיד֔וֹן וְנִכְבַּדְתִּ֖י
