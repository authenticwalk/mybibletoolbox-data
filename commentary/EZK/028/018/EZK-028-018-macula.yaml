text: מֵרֹ֣ב עֲוֺנֶ֗יךָ בְּעֶ֨וֶל֙ רְכֻלָּ֣תְךָ֔ חִלַּ֖לְתָּ מִקְדָּשֶׁ֑יךָ וָֽאוֹצִא־אֵ֤שׁ
