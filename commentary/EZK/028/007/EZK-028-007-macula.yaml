text: לָכֵ֗ן הִנְנִ֨י מֵבִ֤יא עָלֶ֨יךָ֙ זָרִ֔ים עָרִיצֵ֖י גּוֹיִ֑ם וְהֵרִ֤יקוּ חַרְבוֹתָם֙
