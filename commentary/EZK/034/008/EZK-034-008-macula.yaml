verse: EZK 34:8
text: חַי־אָ֜נִי נְאֻ֣ם׀אֲדֹנָ֣י יְהוִ֗ה אִם־לֹ֣א יַ֣עַן הֱיֽוֹת־צֹאנִ֣י׀לָבַ֡ז וַתִּֽהְיֶינָה֩
  צֹאנִ֨י לְאָכְלָ֜ה לְכָל־חַיַּ֤ת הַשָּׂדֶה֙ מֵאֵ֣ין רֹעֶ֔ה וְלֹֽא־דָרְשׁ֥וּ רֹעַ֖י
  אֶת־צֹאנִ֑י וַיִּרְע֤וּ הָֽרֹעִים֙ אוֹתָ֔ם וְאֶת־צֹאנִ֖י לֹ֥א רָעֽוּ׃ס
