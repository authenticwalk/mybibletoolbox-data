text: הַמְעַ֣ט מִכֶּ֗ם הַמִּרְעֶ֤ה הַטּוֹב֙ תִּרְע֔וּ וְיֶ֨תֶר֙ מִרְעֵיכֶ֔ם תִּרְמְס֖וּ
