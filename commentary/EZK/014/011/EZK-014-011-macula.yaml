verse: EZK 14:11
text: לְ֠מַעַן לֹֽא־יִתְע֨וּ ע֤וֹד בֵּֽית־יִשְׂרָאֵל֙ מֵאַֽחֲרַ֔י וְלֹֽא־יִטַּמְּא֥וּ
