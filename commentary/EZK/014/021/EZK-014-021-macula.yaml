text: כִּי֩ כֹ֨ה אָמַ֜ר אֲדֹנָ֣י יְהֹוִ֗ה אַ֣ף כִּֽי־אַרְבַּ֣עַת שְׁפָטַ֣י׀הָרָעִ֡ים
  חֶ֠רֶב וְרָעָ֞ב וְחַיָּ֤ה רָעָה֙ וָדֶ֔בֶר שִׁלַּ֖חְתִּי אֶל־יְרוּשָׁלִָ֑ם לְהַכְרִ֥ית
  מִמֶּ֖נָּה אָדָ֥ם וּבְהֵמָֽה׃
