verse: EZK 14:22
text: וְהִנֵּ֨ה נֽוֹתְרָה־בָּ֜הּ פְּלֵטָ֗ה הַֽמּוּצָאִים֮ בָּנִ֣ים וּבָנוֹת֒ הִנָּם֙
  יוֹצְאִ֣ים אֲלֵיכֶ֔ם וּרְאִיתֶ֥ם אֶת־דַּרְכָּ֖ם וְאֶת־עֲלִֽילוֹתָ֑ם וְנִחַמְתֶּ֗ם
  עַל־הָֽרָעָה֙ אֲשֶׁ֤ר הֵבֵ֨אתִי֙ עַל־יְר֣וּשָׁלִַ֔ם אֵ֛ת כָּל־אֲשֶׁ֥ר הֵבֵ֖אתִי
  עָלֶֽיהָ׃
