verse: EZK 14:23
text: וְנִחֲמ֣וּ אֶתְכֶ֔ם כִּֽי־תִרְא֥וּ אֶת־דַּרְכָּ֖ם וְאֶת־עֲלִֽילוֹתָ֑ם וִֽידַעְתֶּ֗ם
  כִּי֩ לֹ֨א חִנָּ֤ם עָשִׂ֨יתִי֙ אֵ֣ת כָּל־אֲשֶׁר־עָשִׂ֣יתִי בָ֔הּ נְאֻ֖ם אֲדֹנָ֥י
  יְהֹוִֽה׃פ
