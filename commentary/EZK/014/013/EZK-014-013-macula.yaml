text: בֶּן־אָדָ֗ם אֶ֚רֶץ כִּ֤י תֶחֱטָא־לִי֙ לִמְעָל־מַ֔עַל וְנָטִ֤יתִי יָדִי֙ עָלֶ֔יהָ
