verse: EZK 43:27
text: וִֽיכַלּ֖וּ אֶת־הַיָּמִ֑יםסוְהָיָה֩ בַיּ֨וֹם הַשְּׁמִינִ֜י וָהָ֗לְאָה יַעֲשׂ֨וּ
