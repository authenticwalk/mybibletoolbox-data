verse: EZK 43:3
text: וּכְמַרְאֵ֨ה הַמַּרְאֶ֜ה אֲשֶׁ֣ר רָאִ֗יתִי כַּמַּרְאֶ֤ה אֲשֶׁר־רָאִ֨יתִי֙ בְּבֹאִי֙
  לְשַׁחֵ֣ת אֶת־הָעִ֔יר וּמַרְא֕וֹת כַּמַּרְאֶ֕ה אֲשֶׁ֥ר רָאִ֖יתִי אֶל־נְהַר־כְּבָ֑ר
  וָאֶפֹּ֖ל אֶל־פָּנָֽי׃
