verse: EZK 43:11
text: וְאִֽם־נִכְלְמ֞וּ מִכֹּ֣ל אֲשֶׁר־עָשׂ֗וּ צוּרַ֣ת הַבַּ֡יִת וּתְכוּנָת֡וֹ וּמוֹצָאָ֡יו
  וּמוֹבָאָ֣יו וְֽכָל־צֽוּרֹתָ֡ווְאֵ֣ת כָּל־חֻקֹּתָיו֩ וְכָל־צ֨וּרֹתָ֤יו וְכָל־תּוֹרֹתָיו֙
  הוֹדַ֣ע אוֹתָ֔ם וּכְתֹ֖ב לְעֵֽינֵיהֶ֑ם וְיִשְׁמְר֞וּ אֶת־כָּל־צוּרָת֛וֹ וְאֶת־כָּל־חֻקֹּתָ֖יו
  וְעָשׂ֥וּ אוֹתָֽם׃
