text: וְאֵ֨לֶּה מִדּ֤וֹת הַמִּזְבֵּ֨חַ֙ בָּֽאַמּ֔וֹת אַמָּ֥ה אַמָּ֖ה וָטֹ֑פַח וְחֵ֨יק
