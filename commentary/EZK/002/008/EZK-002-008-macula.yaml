verse: EZK 2:8
text: וְאַתָּ֣ה בֶן־אָדָ֗ם שְׁמַע֙ אֵ֤ת אֲשֶׁר־אֲנִי֙ מְדַבֵּ֣ר אֵלֶ֔יךָ אַל־תְּהִי־מֶ֖רִי
