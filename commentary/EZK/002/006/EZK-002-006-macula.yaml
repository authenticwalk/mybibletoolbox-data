verse: EZK 2:6
text: וְאַתָּ֣ה בֶן־אָ֠דָם אַל־תִּירָ֨א מֵהֶ֜ם וּמִדִּבְרֵיהֶ֣ם אַל־תִּירָ֗א כִּ֣י
  סָרָבִ֤ים וְסַלּוֹנִים֙ אוֹתָ֔ךְ וְאֶל־עַקְרַבִּ֖ים אַתָּ֣ה יוֹשֵׁ֑ב מִדִּבְרֵיהֶ֤ם
  אַל־תִּירָא֙ וּמִפְּנֵיהֶ֣ם אַל־תֵּחָ֔ת כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה׃
