text: וַֽיְהִי֙ כְּהִנָּ֣בְאִ֔י וּפְלַטְיָ֥הוּ בֶן־בְּנָיָ֖ה מֵ֑ת וָאֶפֹּ֨ל עַל־פָּנַ֜י
