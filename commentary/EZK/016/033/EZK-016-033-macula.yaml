verse: EZK 16:33
text: לְכָל־זֹנ֖וֹת יִתְּנוּ־נֵ֑דֶה וְאַ֨תְּ נָתַ֤תְּ אֶת־נְדָנַ֨יִךְ֙ לְכָל־מְאַֽהֲבַ֔יִךְ
  וַתִּשְׁחֳדִ֣י אוֹתָ֗ם לָב֥וֹא אֵלַ֛יִךְ מִסָּבִ֖יב בְּתַזְנוּתָֽיִךְ׃
