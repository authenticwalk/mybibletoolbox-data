text: וָאֶעֱבֹ֨ר עָלַ֜יִךְ וָאֶרְאֵ֗ךְ וְהִנֵּ֤ה עִתֵּךְ֙ עֵ֣ת דֹּדִ֔ים וָאֶפְרֹ֤שׂ
