text: אֶל־כָּל־רֹ֣אשׁ דֶּ֗רֶךְ בָּנִית֙ רָֽמָתֵ֔ךְ וַתְּתַֽעֲבִי֙ אֶת־יָפְיֵ֔ךְ וַתְּפַשְּׂקִ֥י
  אֶת־רַגְלַ֖יִךְ לְכָל־עוֹבֵ֑ר וַתַּרְבִּ֖י אֶת־תַּזְנוּתָֽיִךְ׃
