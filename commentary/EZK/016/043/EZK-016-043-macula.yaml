verse: EZK 16:43
text: יַ֗עַן אֲשֶׁ֤ר לֹֽא־זָכַרְתְּ֙ אֶת־יְמֵ֣י נְעוּרַ֔יִךְ וַתִּרְגְּזִי־לִ֖י בְּכָל־אֵ֑לֶּה
  וְגַם־אֲנִ֨י הֵ֜א דַּרְכֵּ֣ךְ׀בְּרֹ֣אשׁ נָתַ֗תִּי נְאֻם֙ אֲדֹנָ֣י יְהוִ֔ה וְלֹ֤א
  עָשִׂית֙ אֶת־הַזִּמָּ֔ה עַ֖ל כָּל־תּוֹעֲבֹתָֽיִךְ׃
