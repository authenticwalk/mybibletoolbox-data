text: לְמַ֤עַן תִּזְכְּרִי֙ וָבֹ֔שְׁתְּ וְלֹ֨א יִֽהְיֶה־לָּ֥ךְ עוֹד֙ פִּתְח֣וֹן פֶּ֔ה
