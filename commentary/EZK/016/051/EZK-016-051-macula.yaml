verse: EZK 16:51
text: וְשֹׁ֣מְר֔וֹן כַּחֲצִ֥י חַטֹּאתַ֖יִךְ לֹ֣א חָטָ֑אָה וַתַּרְבִּ֤י אֶת־תּוֹעֲבוֹתַ֨יִךְ֙
  מֵהֵ֔נָּה וַתְּצַדְּקִי֙ אֶת־אֲחוֹתַ֔יִךְ בְּכָל־תּוֹעֲבוֹתַ֖יִךְ אֲשֶׁ֥ר עָשִֽׂית׃
