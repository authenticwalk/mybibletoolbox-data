verse: EZK 31:15
text: כֹּֽה־אָמַ֞ר אֲדֹנָ֣י יְהוִ֗ה בְּי֨וֹם רִדְתּ֤וֹ שְׁא֨וֹלָה֙ הֶאֱבַ֜לְתִּי כִּסֵּ֤תִי
  עָלָיו֙ אֶת־תְּה֔וֹם וָֽאֶמְנַע֙ נַהֲרוֹתֶ֔יהָ וַיִּכָּלְא֖וּ מַ֣יִם רַבִּ֑ים וָאַקְדִּ֤ר
  עָלָיו֙ לְבָנ֔וֹן וְכָל־עֲצֵ֥י הַשָּׂדֶ֖ה עָלָ֥יו עֻלְפֶּֽה׃
