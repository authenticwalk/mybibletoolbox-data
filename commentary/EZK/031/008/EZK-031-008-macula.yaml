verse: EZK 31:8
text: אֲרָזִ֣ים לֹֽא־עֲמָמֻהוּ֮ בְּגַן־אֱלֹהִים֒ בְּרוֹשִׁ֗ים לֹ֤א דָמוּ֙ אֶל־סְעַפֹּתָ֔יו
  וְעַרְמֹנִ֥ים לֹֽא־הָי֖וּ כְּפֹֽארֹתָ֑יו כָּל־עֵץ֙ בְּגַן־אֱלֹהִ֔ים לֹא־דָמָ֥ה אֵלָ֖יו
  בְּיָפְיֽוֹ׃
