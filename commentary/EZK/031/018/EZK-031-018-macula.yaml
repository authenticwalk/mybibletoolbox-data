text: אֶל־מִ֨י דָמִ֥יתָ כָּ֛כָה בְּכָב֥וֹד וּבְגֹ֖דֶל בַּעֲצֵי־עֵ֑דֶן וְהוּרַדְתָּ֨אֶת־עֲצֵי־עֵ֜דֶן
