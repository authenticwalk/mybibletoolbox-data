language: heb
verse: EZK 31:14
text: לְמַ֡עַן אֲשֶׁר֩ לֹא־יִגְבְּה֨וּ בְקוֹמָתָ֜ם כָּל־עֲצֵי־מַ֗יִם וְלֹֽא־יִתְּנ֤וּ
  אֶת־צַמַּרְתָּם֙ אֶל־בֵּ֣ין עֲבֹתִ֔ים וְלֹֽא־יַעַמְד֧וּ אֵלֵיהֶ֛ם בְּגָבְהָ֖ם כָּל־שֹׁ֣תֵי
  מָ֑יִם כִּֽי־כֻלָּם֩ נִתְּנ֨וּ לַמָּ֜וֶת אֶל־אֶ֣רֶץ תַּחְתִּ֗ית בְּת֛וֹךְ בְּנֵ֥י
  אָדָ֖ם אֶל־י֥וֹרְדֵי בֽוֹר׃ס
