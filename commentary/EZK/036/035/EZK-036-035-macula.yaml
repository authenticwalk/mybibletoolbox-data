text: וְאָמְר֗וּ הָאָ֤רֶץ הַלֵּ֨זוּ֙ הַנְּשַׁמָּ֔ה הָיְתָ֖ה כְּגַן־עֵ֑דֶן וְהֶעָרִ֧ים
