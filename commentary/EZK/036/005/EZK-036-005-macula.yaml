verse: EZK 36:5
text: לָכֵ֗ן כֹּֽה־אָמַר֮ אֲדֹנָ֣י יְהוִה֒ אִם־לֹ֠א בְּאֵ֨שׁ קִנְאָתִ֥י דִבַּ֛רְתִּי
  עַל־שְׁאֵרִ֥ית הַגּוֹיִ֖ם וְעַל־אֱד֣וֹם כֻּלָּ֑א אֲשֶׁ֣ר נָתְנֽוּ־אֶת־אַרְצִ֣י׀לָ֠הֶם
  לְמ֨וֹרָשָׁ֜ה בְּשִׂמְחַ֤ת כָּל־לֵבָב֙ בִּשְׁאָ֣ט נֶ֔פֶשׁ לְמַ֥עַן מִגְרָשָׁ֖הּ
  לָבַֽז׃
