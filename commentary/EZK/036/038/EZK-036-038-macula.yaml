text: כְּצֹ֣אן קָֽדָשִׁ֗ים כְּצֹ֤אן יְרוּשָׁלִַ֨ם֙ בְּמ֣וֹעֲדֶ֔יהָ כֵּ֤ן תִּהְיֶ֨ינָה֙
