verse: EZK 29:5
text: וּנְטַשְׁתִּ֣יךָ הַמִּדְבָּ֗רָה אוֹתְךָ֙ וְאֵת֙ כָּל־דְּגַ֣ת יְאֹרֶ֔יךָ עַל־פְּנֵ֤י
  הַשָּׂדֶה֙ תִּפּ֔וֹל לֹ֥א תֵאָסֵ֖ף וְלֹ֣א תִקָּבֵ֑ץ לְחַיַּ֥ת הָאָ֛רֶץ וּלְע֥וֹף
  הַשָּׁמַ֖יִם נְתַתִּ֥יךָ לְאָכְלָֽה׃
