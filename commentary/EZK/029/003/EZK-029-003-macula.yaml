text: דַּבֵּ֨ר וְאָמַרְתָּ֜ כֹּֽה־אָמַ֣ר׀אֲדֹנָ֣י יְהוִ֗ה הִנְנִ֤י עָלֶ֨יךָ֙ פַּרְעֹ֣ה
