verse: EZK 29:12
text: וְנָתַתִּ֣י אֶת־אֶרֶץ֩ מִצְרַ֨יִם שְׁמָמָ֜ה בְּת֣וֹךְ׀אֲרָצ֣וֹת נְשַׁמּ֗וֹת
  וְעָרֶ֨יהָ֙ בְּת֨וֹךְ עָרִ֤ים מָֽחֳרָבוֹת֙ תִּֽהְיֶ֣יןָ שְׁמָמָ֔ה אַרְבָּעִ֖ים שָׁנָ֑ה
  וַהֲפִצֹתִ֤י אֶת־מִצְרַ֨יִם֙ בַּגּוֹיִ֔ם וְֽזֵרִיתִ֖ים בָּאֲרָצֽוֹת׃פ
