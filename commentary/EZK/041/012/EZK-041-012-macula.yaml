verse: EZK 41:12
text: וְהַבִּנְיָ֡ן אֲשֶׁר֩ אֶל־פְּנֵ֨י הַגִּזְרָ֜ה פְּאַ֣ת דֶּֽרֶךְ־הַיָּ֗ם רֹ֚חַב
  שִׁבְעִ֣ים אַמָּ֔ה וְקִ֧יר הַבִּנְיָ֛ן חָֽמֵשׁ־אַמּ֥וֹת רֹ֖חַב סָבִ֣יב׀סָבִ֑יב וְאָרְכּ֖וֹ
  תִּשְׁעִ֥ים אַמָּֽה׃
