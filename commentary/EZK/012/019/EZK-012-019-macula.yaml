verse: EZK 12:19
text: וְאָמַרְתָּ֣ אֶל־עַ֣ם הָאָ֡רֶץ כֹּֽה־אָמַר֩ אֲדֹנָ֨י יְהוִ֜ה לְיוֹשְׁבֵ֤י יְרוּשָׁלִַ֨ם֙
  אֶל־אַדְמַ֣ת יִשְׂרָאֵ֔ל לַחְמָם֙ בִּדְאָגָ֣ה יֹאכֵ֔לוּ וּמֵֽימֵיהֶ֖ם בְּשִׁמָּמ֣וֹן
  יִשְׁתּ֑וּ לְמַ֜עַן תֵּשַׁ֤ם אַרְצָהּ֙ מִמְּלֹאָ֔הּ מֵחֲמַ֖ס כָּֽל־הַיֹּשְׁבִ֥ים
  בָּֽהּ׃
