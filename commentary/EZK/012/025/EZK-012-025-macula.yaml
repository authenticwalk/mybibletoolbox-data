verse: EZK 12:25
text: כִּ֣י׀אֲנִ֣י יְהוָ֗ה אֲדַבֵּר֙ אֵת֩ אֲשֶׁ֨ר אֲדַבֵּ֤ר דָּבָר֙ וְיֵ֣עָשֶׂ֔ה לֹ֥א
  תִמָּשֵׁ֖ךְ ע֑וֹד כִּ֣י בִֽימֵיכֶ֞ם בֵּ֣ית הַמֶּ֗רִי אֲדַבֵּ֤ר דָּבָר֙ וַעֲשִׂיתִ֔יו
  נְאֻ֖ם אֲדֹנָ֥י יְהוִֽה׃פ
