text: וְהַנָּשִׂ֨יא אֲשֶׁר־בְּתוֹכָ֜ם אֶל־כָּתֵ֤ף יִשָּׂא֙ בָּעֲלָטָ֣ה וְיֵצֵ֔א בַּקִּ֥יר
