verse: EZK 12:2
text: בֶּן־אָדָ֕ם בְּת֥וֹךְ בֵּית־הַמֶּ֖רִי אַתָּ֣ה יֹשֵׁ֑ב אֲשֶׁ֣ר עֵינַיִם֩ לָהֶ֨ם
