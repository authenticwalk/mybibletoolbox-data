verse: EZK 17:3
text: וְאָמַרְתָּ֞ כֹּה־אָמַ֣ר׀אֲדֹנָ֣י יְהוִ֗ה הַנֶּ֤שֶׁר הַגָּדוֹל֙ גְּד֤וֹל הַכְּנָפַ֨יִם֙
