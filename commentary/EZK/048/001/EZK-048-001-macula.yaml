verse: EZK 48:1
text: וְאֵ֖לֶּה שְׁמ֣וֹת הַשְּׁבָטִ֑ים מִקְצֵ֣ה צָפ֡וֹנָה אֶל־יַ֣ד דֶּֽרֶךְ־חֶתְלֹ֣ן׀לְֽבוֹא־חֲמָ֡ת
  חֲצַ֣ר עֵינָן֩ גְּב֨וּל דַּמֶּ֤שֶׂק צָפ֨וֹנָה֙ אֶל־יַ֣ד חֲמָ֔ת וְהָיוּ־ל֧וֹ פְאַת־קָדִ֛ים
  הַיָּ֖ם דָּ֥ן אֶחָֽד׃
