verse: EZK 48:17
text: וְהָיָ֣ה מִגְרָשׁ֮ לָעִיר֒ צָפ֨וֹנָה֙ חֲמִשִּׁ֣ים וּמָאתַ֔יִם וְנֶ֖גְבָּה חֲמִשִּׁ֣ים
  וּמָאתָ֑יִם וְקָדִ֨ימָה֙ חֲמִשִּׁ֣ים וּמָאתַ֔יִם וְיָ֖מָּה חֲמִשִּׁ֥ים וּמָאתָֽיִם׃
