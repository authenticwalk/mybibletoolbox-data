verse: EZK 48:10
text: וּ֠לְאֵ֜לֶּה תִּהְיֶ֣ה תְרֽוּמַת־הַקֹּדֶשׁ֮ לַכֹּֽהֲנִים֒ צָפ֜וֹנָה חֲמִשָּׁ֧ה
  וְעֶשְׂרִ֣ים אֶ֗לֶף וְיָ֨מָּה֙ רֹ֚חַב עֲשֶׂ֣רֶת אֲלָפִ֔ים וְקָדִ֗ימָה רֹ֚חַב עֲשֶׂ֣רֶת
  אֲלָפִ֔ים וְנֶ֕גְבָּה אֹ֕רֶךְ חֲמִשָּׁ֥ה וְעֶשְׂרִ֖ים אָ֑לֶף וְהָיָ֥ה מִקְדַּשׁ־יְהוָ֖ה
  בְּתוֹכֽוֹ׃
