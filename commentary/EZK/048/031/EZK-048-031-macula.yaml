verse: EZK 48:31
text: וְשַׁעֲרֵ֣י הָעִ֗יר עַל־שְׁמוֹת֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל שְׁעָרִ֥ים שְׁלוֹשָׁ֖ה
