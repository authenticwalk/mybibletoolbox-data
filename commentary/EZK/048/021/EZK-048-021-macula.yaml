verse: EZK 48:21
text: וְהַנּוֹתָ֣ר לַנָּשִׂ֣יא מִזֶּ֣ה׀וּמִזֶּ֣ה׀לִתְרֽוּמַת־הַקֹּ֣דֶשׁ וְלַאֲחֻזַּ֪ת
  הָעִ֟יר אֶל־פְּנֵ֣י חֲמִשָּׁה֩ וְעֶשְׂרִ֨ים אֶ֥לֶף׀תְּרוּמָה֮ עַד־גְּב֣וּל קָדִימָה֒
  וְיָ֗מָּה עַל־פְּ֠נֵי חֲמִשָּׁ֨ה וְעֶשְׂרִ֥ים אֶ֨לֶף֙ עַל־גְּב֣וּל יָ֔מָּה לְעֻמַּ֥ת
  חֲלָקִ֖ים לַנָּשִׂ֑יא וְהָֽיְתָה֙ תְּרוּמַ֣ת הַקֹּ֔דֶשׁ וּמִקְדַּ֥שׁ הַבַּ֖יִת בְּתוֹכֽוֹ׃
