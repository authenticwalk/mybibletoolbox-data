verse: EZK 48:18
text: וְהַנּוֹתָ֨ר בָּאֹ֜רֶךְ לְעֻמַּ֣ת׀תְּרוּמַ֣ת הַקֹּ֗דֶשׁ עֲשֶׂ֨רֶת אֲלָפִ֤ים
  קָדִ֨ימָה֙ וַעֲשֶׂ֤רֶת אֲלָפִים֙ יָ֔מָּה וְהָיָ֕ה לְעֻמַּ֖ת תְּרוּמַ֣ת הַקֹּ֑דֶשׁ
  וְהָיְתָ֤ה תְבֽוּאָתוֹ֙ לְלֶ֔חֶם לְעֹבְדֵ֖י הָעִֽיר׃
