verse: EZK 39:9
text: וְֽיָצְא֞וּ יֹשְׁבֵ֣י׀עָרֵ֣י יִשְׂרָאֵ֗ל וּבִעֲר֡וּ וְ֠הִשִּׂיקוּ בְּנֶ֨שֶׁק
