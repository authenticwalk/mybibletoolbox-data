verse: EZK 39:4
text: עַל־הָרֵ֨י יִשְׂרָאֵ֜ל תִּפּ֗וֹל אַתָּה֙ וְכָל־אֲגַפֶּ֔יךָ וְעַמִּ֖ים אֲשֶׁ֣ר
  אִתָּ֑ךְ לְעֵ֨יט צִפּ֧וֹר כָּל־כָּנָ֛ף וְחַיַּ֥ת הַשָּׂדֶ֖ה נְתַתִּ֥יךָ לְאָכְלָֽה׃
