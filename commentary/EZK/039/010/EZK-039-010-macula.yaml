text: וְלֹֽא־יִשְׂא֨וּ עֵצִ֜ים מִן־הַשָּׂדֶ֗ה וְלֹ֤א יַחְטְבוּ֙ מִן־הַיְּעָרִ֔ים כִּ֥י
