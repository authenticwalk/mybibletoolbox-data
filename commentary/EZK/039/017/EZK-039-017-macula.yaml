verse: EZK 39:17
text: וְאַתָּ֨ה בֶן־אָדָ֜ם כֹּֽה־אָמַ֣ר׀אֲדֹנָ֣י יְהֹוִ֗ה אֱמֹר֩ לְצִפּ֨וֹר כָּל־כָּנָ֜ף
  וּלְכֹ֣ל׀חַיַּ֣ת הַשָּׂדֶ֗ה הִקָּבְצ֤וּ וָבֹ֨אוּ֙ הֵאָסְפ֣וּ מִסָּבִ֔יב עַל־זִבְחִ֗י
  אֲשֶׁ֨ר אֲנִ֜י זֹבֵ֤חַ לָכֶם֙ זֶ֣בַח גָּד֔וֹל עַ֖ל הָרֵ֣י יִשְׂרָאֵ֑ל וַאֲכַלְתֶּ֥ם
  בָּשָׂ֖ר וּשְׁתִ֥יתֶם דָּֽם׃
