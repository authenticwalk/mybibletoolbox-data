verse: EZK 39:11
text: וְהָיָ֣ה בַיּ֣וֹם הַה֡וּא אֶתֵּ֣ן לְגוֹג֩׀מְקֽוֹם־שָׁ֨ם קֶ֜בֶר בְּיִשְׂרָאֵ֗ל
  גֵּ֤י הָעֹֽבְרִים֙ קִדְמַ֣ת הַיָּ֔ם וְחֹסֶ֥מֶת הִ֖יא אֶת־הָעֹֽבְרִ֑ים וְקָ֣בְרוּ
  שָׁ֗ם אֶת־גּוֹג֙ וְאֶת־כָּל־הֲמוֹנֹ֔הוְקָ֣רְא֔וּ גֵּ֖יא הֲמ֥וֹן גּֽוֹג׃
