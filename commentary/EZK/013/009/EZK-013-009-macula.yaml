verse: EZK 13:9
text: וְהָיְתָ֣ה יָדִ֗י אֶֽל־הַנְּבִיאִ֞ים הַחֹזִ֣ים שָׁוְא֮ וְהַקֹּסְמִ֣ים כָּזָב֒
  בְּס֧וֹד עַמִּ֣י לֹֽא־יִהְי֗וּ וּבִכְתָ֤ב בֵּֽית־יִשְׂרָאֵל֙ לֹ֣א יִכָּתֵ֔בוּ וְאֶל־אַדְמַ֥ת
  יִשְׂרָאֵ֖ל לֹ֣א יָבֹ֑אוּ וִידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥י יְהוִֽה׃
