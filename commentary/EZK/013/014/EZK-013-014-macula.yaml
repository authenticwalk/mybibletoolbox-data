text: וְהָ֨רַסְתִּ֜י אֶת־הַקִּ֨יר אֲשֶׁר־טַחְתֶּ֥ם תָּפֵ֛ל וְהִגַּעְתִּ֥יהוּ אֶל־הָאָ֖רֶץ
