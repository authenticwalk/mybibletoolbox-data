text: וְאָמַרְתָּ֞ כֹּה־אָמַ֣ר׀אֲדֹנָ֣י יְהוִ֗ה הוֹי֩ לִֽמְתַפְּר֨וֹת כְּסָת֜וֹת עַ֣ל׀כָּל־אַצִּילֵ֣י
  יָדַ֗י וְעֹשׂ֧וֹת הַמִּסְפָּח֛וֹת עַל־רֹ֥אשׁ כָּל־קוֹמָ֖ה לְצוֹדֵ֣ד נְפָשׁ֑וֹת הַנְּפָשׁוֹת֙
  תְּצוֹדֵ֣דְנָה לְעַמִּ֔י וּנְפָשׁ֖וֹת לָכֶ֥נָה תְחַיֶּֽינָה׃
