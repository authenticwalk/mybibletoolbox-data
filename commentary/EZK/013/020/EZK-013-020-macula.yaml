verse: EZK 13:20
text: לָכֵ֞ן כֹּה־אָמַ֣ר׀אֲדֹנָ֣י יְהוִ֗ה הִנְנִ֤י אֶל־כִּסְּתוֹתֵיכֶ֨נָה֙ אֲשֶׁ֣ר
  אַ֠תֵּנָה מְצֹדְד֨וֹת שָׁ֤ם אֶת־הַנְּפָשׁוֹת֙ לְפֹ֣רְח֔וֹת וְקָרַעְתִּ֣י אֹתָ֔ם
  מֵעַ֖ל זְרוֹעֹֽתֵיכֶ֑ם וְשִׁלַּחְתִּי֙ אֶת־הַנְּפָשׁ֔וֹת אֲשֶׁ֥ר אַתֶּ֛ם מְצֹדְד֥וֹת
  אֶת־נְפָשִׁ֖ים לְפֹרְחֹֽת׃
