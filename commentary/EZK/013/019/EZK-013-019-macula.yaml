text: וַתְּחַלֶּלְ֨נָהאֹתִ֜י אֶל־עַמִּ֗י בְּשַׁעֲלֵ֣י שְׂעֹרִים֮ וּבִפְת֣וֹתֵי לֶחֶם֒
