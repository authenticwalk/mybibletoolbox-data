text: וְלָקַ֨ח הַכֹּהֵ֜ן מִדַּ֣ם הַחַטָּ֗את וְנָתַן֙ אֶל־מְזוּזַ֣ת הַבַּ֔יִת וְאֶל־אַרְבַּ֛ע
