verse: EZK 45:7
text: וְלַנָּשִׂ֡יא מִזֶּ֣ה וּמִזֶּה֩ לִתְרוּמַ֨ת הַקֹּ֜דֶשׁ וְלַאֲחֻזַּ֣ת הָעִ֗יר
  אֶל־פְּנֵ֤י תְרֽוּמַת־הַקֹּ֨דֶשׁ֙ וְאֶל־פְּנֵי֙ אֲחֻזַּ֣ת הָעִ֔יר מִפְּאַת־יָ֣ם
  יָ֔מָּה וּמִפְּאַת־קֵ֖דְמָה קָדִ֑ימָה וְאֹ֗רֶךְ לְעֻמּוֹת֙ אַחַ֣ד הַחֲלָקִ֔ים מִגְּב֥וּל
  יָ֖ם אֶל־גְּב֥וּל קָדִֽימָה׃
