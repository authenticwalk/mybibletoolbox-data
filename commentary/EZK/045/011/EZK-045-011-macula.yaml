verse: EZK 45:11
text: הָאֵיפָ֣ה וְהַבַּ֗ת תֹּ֤כֶן אֶחָד֙ יִֽהְיֶ֔ה לָשֵׂ֕את מַעְשַׂ֥ר הַחֹ֖מֶר הַבָּ֑ת
