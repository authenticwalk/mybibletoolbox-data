text: כֹּֽה־אָמַ֞ר אֲדֹנָ֣י יְהוִ֗ה רַב־לָכֶם֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל חָמָ֤ס וָשֹׁד֙
