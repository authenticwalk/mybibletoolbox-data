verse: EZK 45:4
text: קֹ֣דֶשׁ מִן־הָאָ֜רֶץ ה֗וּא לַכֹּ֨הֲנִ֜ים מְשָׁרְתֵ֤י הַמִּקְדָּשׁ֙ יִֽהְיֶ֔ה
  הַקְּרֵבִ֖ים לְשָׁרֵ֣ת אֶת־יְהוָ֑ה וְהָיָ֨ה לָהֶ֤ם מָקוֹם֙ לְבָ֣תִּ֔ים וּמִקְדָּ֖שׁ
  לַמִּקְדָּֽשׁ׃
