verse: EZK 45:1
text: וּבְהַפִּֽילְכֶ֨ם אֶת־הָאָ֜רֶץ בְּנַחֲלָ֗ה תָּרִימוּ֩ תְרוּמָ֨ה לַיהוָ֥ה׀קֹדֶשׁ֮
  מִן־הָאָרֶץ֒ אֹ֗רֶךְ חֲמִשָּׁ֨ה וְעֶשְׂרִ֥ים אֶ֨לֶף֙ אֹ֔רֶךְ וְרֹ֖חַב עֲשָׂ֣רָה
  אָ֑לֶף קֹדֶשׁ־ה֥וּא בְכָל־גְּבוּלָ֖הּ סָבִֽיב׃
