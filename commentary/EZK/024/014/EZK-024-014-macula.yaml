verse: EZK 24:14
text: אֲנִ֨י יְהוָ֤ה דִּבַּ֨רְתִּי֙ בָּאָ֣ה וְעָשִׂ֔יתִי לֹֽא־אֶפְרַ֥ע וְלֹא־אָח֖וּס
  וְלֹ֣א אֶנָּחֵ֑ם כִּדְרָכַ֤יִךְ וְכַעֲלִילוֹתַ֨יִךְ֙ שְׁפָט֔וּךְ נְאֻ֖ם אֲדֹנָ֥י
  יְהֹוִֽה׃פ
