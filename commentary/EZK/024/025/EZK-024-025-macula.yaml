text: וְאַתָּ֣ה בֶן־אָדָ֔ם הֲל֗וֹא בְּי֨וֹם קַחְתִּ֤י מֵהֶם֙ אֶת־מָ֣עוּזָּ֔ם מְשׂ֖וֹשׂ
