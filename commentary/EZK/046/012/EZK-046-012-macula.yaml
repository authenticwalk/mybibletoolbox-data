verse: EZK 46:12
text: וְכִֽי־יַעֲשֶׂה֩ הַנָּשִׂ֨יא נְדָבָ֜ה עוֹלָ֣ה אֽוֹ־שְׁלָמִים֮ נְדָבָ֣ה לַֽיהוָה֒
  וּפָ֣תַֽח ל֗וֹ אֶתהַשַּׁ֨עַר֙ הַפֹּנֶ֣ה קָדִ֔ים וְעָשָׂ֤ה אֶת־עֹֽלָתוֹ֙ וְאֶת־שְׁלָמָ֔יו
  כַּאֲשֶׁ֥ר יַעֲשֶׂ֖ה בְּי֣וֹם הַשַּׁבָּ֑ת וְיָצָ֛א וְסָגַ֥ר אֶת־הַשַּׁ֖עַר אַחֲרֵ֥י
  צֵאתֽוֹ׃
