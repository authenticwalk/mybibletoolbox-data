text: וַיֹּ֣אמֶר אֵלַ֔י זֶ֣ה הַמָּק֗וֹם אֲשֶׁ֤ר יְבַשְּׁלוּ־שָׁם֙ הַכֹּ֣הֲנִ֔ים אֶת־הָאָשָׁ֖ם
  וְאֶת־הַחַטָּ֑את אֲשֶׁ֤ר יֹאפוּ֙ אֶת־הַמִּנְחָ֔ה לְבִלְתִּ֥י הוֹצִ֛יא אֶל־הֶחָצֵ֥ר
  הַחִֽיצוֹנָ֖ה לְקַדֵּ֥שׁ אֶת־הָעָֽם׃
