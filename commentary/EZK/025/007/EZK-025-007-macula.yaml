verse: EZK 25:7
text: לָכֵ֡ן הִנְנִי֩ נָטִ֨יתִי אֶת־יָדִ֜י עָלֶ֗יךָ וּנְתַתִּ֤יךָֽ־לְבַז֙לַגּוֹיִ֔ם
  וְהִכְרַתִּ֨יךָ֙ מִן־הָ֣עַמִּ֔ים וְהַאֲבַדְתִּ֖יךָ מִן־הָאֲרָצ֑וֹת אַשְׁמִ֣ידְךָ֔
  וְיָדַעְתָּ֖ כִּֽי־אֲנִ֥י יְהוָֽה׃ס
