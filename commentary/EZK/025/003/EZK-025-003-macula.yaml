verse: EZK 25:3
text: וְאָֽמַרְתָּ֙ לִבְנֵ֣י עַמּ֔וֹן שִׁמְע֖וּ דְּבַר־אֲדֹנָ֣י יְהוִ֑ה כֹּה־אָמַ֣ר
  אֲדֹנָ֣י יְהוִ֡ה יַעַן֩ אָמְרֵ֨ךְ הֶאָ֜ח אֶל־מִקְדָּשִׁ֣י כִֽי־נִחָ֗ל וְאֶל־אַדְמַ֤ת
  יִשְׂרָאֵל֙ כִּ֣י נָשַׁ֔מָּה וְאֶל־בֵּ֣ית יְהוּדָ֔ה כִּ֥י הָלְכ֖וּ בַּגּוֹלָֽה׃
