verse: EZK 25:13
text: לָכֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣י יְהוִ֔ה וְנָטִ֤תִי יָדִי֙ עַל־אֱד֔וֹם וְהִכְרַתִּ֥י
