verse: EZK 27:11
text: בְּנֵ֧י אַרְוַ֣ד וְחֵילֵ֗ךְ עַל־חוֹמוֹתַ֨יִךְ֙ סָבִ֔יב וְגַ֨מָּדִ֔ים בְּמִגְדְּלוֹתַ֖יִךְ
  הָי֑וּ שִׁלְטֵיהֶ֞ם תִּלּ֤וּ עַל־חוֹמוֹתַ֨יִךְ֙ סָבִ֔יב הֵ֖מָּה כָּלְל֥וּ יָפְיֵֽךְ׃
