verse: EZK 27:27
text: הוֹנֵךְ֙ וְעִזְבוֹנַ֔יִךְ מַעֲרָבֵ֕ךְ מַלָּחַ֖יִךְ וְחֹבְלָ֑יִךְ מַחֲזִיקֵ֣י
  בִדְקֵ֣ךוְֽעֹרְבֵ֣י מַ֠עֲרָבֵךְ וְכָל־אַנְשֵׁ֨י מִלְחַמְתֵּ֜ךְ אֲשֶׁר־בָּ֗ךְ וּבְכָל־קְהָלֵךְ֙
  אֲשֶׁ֣ר בְּתוֹכֵ֔ךְ יִפְּלוּ֙ בְּלֵ֣ב יַמִּ֔ים בְּי֖וֹם מַפַּלְתֵּֽךְ׃
