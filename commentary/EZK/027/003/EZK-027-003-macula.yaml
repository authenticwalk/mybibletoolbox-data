text: וְאָמַרְתָּ֣ לְצ֗וֹר הַיֹּשֶׁ֨בֶת֙ עַל־מְבוֹאֹ֣ת יָ֔ם רֹכֶ֨לֶת֙ הָֽעַמִּ֔ים
