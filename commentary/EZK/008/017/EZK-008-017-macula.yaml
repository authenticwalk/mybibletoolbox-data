verse: EZK 8:17
text: וַיֹּ֣אמֶר אֵלַי֮ הֲרָאִ֣יתָ בֶן־אָדָם֒ הֲנָקֵל֙ לְבֵ֣ית יְהוּדָ֔ה מֵעֲשׂ֕וֹת
  אֶת־הַתּוֹעֵב֖וֹת אֲשֶׁ֣ר עָֽשׂוּ־פֹ֑ה כִּֽי־מָלְא֨וּ אֶת־הָאָ֜רֶץ חָמָ֗ס וַיָּשֻׁ֨בוּ֙
  לְהַכְעִיסֵ֔נִי וְהִנָּ֛ם שֹׁלְחִ֥ים אֶת־הַזְּמוֹרָ֖ה אֶל־אַפָּֽם׃
