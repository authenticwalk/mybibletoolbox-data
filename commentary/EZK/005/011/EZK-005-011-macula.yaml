text: לָכֵ֣ן חַי־אָ֗נִי נְאֻם֮ אֲדֹנָ֣י יְהוִה֒ אִם־לֹ֗א יַ֚עַן אֶת־מִקְדָּשִׁ֣י טִמֵּ֔את
