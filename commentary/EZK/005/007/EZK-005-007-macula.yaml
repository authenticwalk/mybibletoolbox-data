text: לָכֵ֞ן כֹּֽה־אָמַ֣ר׀אֲדֹנָ֣י יְהוִ֗ה יַ֤עַן הֲמָנְכֶם֙ מִן־הַגּוֹיִם֙ אֲשֶׁ֣ר
