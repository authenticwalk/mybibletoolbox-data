verse: EZK 38:4
text: וְשׁ֣וֹבַבְתִּ֔יךָ וְנָתַתִּ֥י חַחִ֖ים בִּלְחָיֶ֑יךָ וְהוֹצֵאתִי֩ אוֹתְךָ֨וְאֶת־כָּל־חֵילֶ֜ךָ
  סוּסִ֣ים וּפָרָשִׁ֗ים לְבֻשֵׁ֤י מִכְלוֹל֙ כֻּלָּ֔ם קָהָ֥ל רָב֙ צִנָּ֣ה וּמָגֵ֔ן
  תֹּפְשֵׂ֥י חֲרָב֖וֹת כֻּלָּֽם׃
