text: וְעָלִ֨יתָ֙ עַל־עַמִּ֣י יִשְׂרָאֵ֔ל כֶּֽעָנָ֖ן לְכַסּ֣וֹת הָאָ֑רֶץ בְּאַחֲרִ֨ית
  הַיָּמִ֜ים תִּֽהְיֶ֗ה וַהֲבִאוֹתִ֨יךָ֙ עַל־אַרְצִ֔י לְמַעַן֩ דַּ֨עַת הַגּוֹיִ֜ם
