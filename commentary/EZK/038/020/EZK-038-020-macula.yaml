verse: EZK 38:20
text: וְרָעֲשׁ֣וּ מִפָּנַ֡י דְּגֵ֣י הַיָּם֩ וְע֨וֹף הַשָּׁמַ֜יִם וְחַיַּ֣ת הַשָּׂדֶ֗ה
  וְכָל־הָרֶ֨מֶשׂ֙ הָרֹמֵ֣שׂ עַל־הָֽאֲדָמָ֔ה וְכֹל֙ הָֽאָדָ֔ם אֲשֶׁ֖ר עַל־פְּנֵ֣י
  הָאֲדָמָ֑ה וְנֶהֶרְס֣וּ הֶהָרִ֗ים וְנָֽפְלוּ֙ הַמַּדְרֵג֔וֹת וְכָל־חוֹמָ֖ה לָאָ֥רֶץ
  תִּפּֽוֹל׃
