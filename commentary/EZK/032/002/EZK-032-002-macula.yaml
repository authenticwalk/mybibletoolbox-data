verse: EZK 32:2
text: בֶּן־אָדָ֗ם שָׂ֤א קִינָה֙ עַל־פַּרְעֹ֣ה מֶֽלֶךְ־מִצְרַ֔יִם וְאָמַרְתָּ֣ אֵלָ֔יו
  כְּפִ֥יר גּוֹיִ֖ם נִדְמֵ֑יתָ וְאַתָּה֙ כַּתַּנִּ֣ים בַּיַּמִּ֔ים וַתָּ֣גַח בְּנַהֲרוֹתֶ֗יךָ
  וַתִּדְלַח־מַ֨יִם֙ בְּרַגְלֶ֔יךָ וַתִּרְפֹּ֖ס נַהֲרוֹתָֽם׃
