text: בְּחַרְב֤וֹת גִּבּוֹרִים֙ אַפִּ֣יל הֲמוֹנֶ֔ךָ עָרִיצֵ֥י גוֹיִ֖ם כֻּלָּ֑ם וְשָֽׁדְדוּ֙
