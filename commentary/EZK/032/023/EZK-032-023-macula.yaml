text: אֲשֶׁ֨ר נִתְּנ֤וּ קִבְרֹתֶ֨יהָ֙ בְּיַרְכְּתֵי־ב֔וֹר וַיְהִ֣י קְהָלָ֔הּ סְבִיב֖וֹת
