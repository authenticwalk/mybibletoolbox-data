text: שָׁ֣מָּה נְסִיכֵ֥י צָפ֛וֹן כֻּלָּ֖ם וְכָל־צִֽדֹנִ֑י אֲשֶׁר־יָרְד֣וּ אֶת־חֲלָלִ֗ים
  בְּחִתִּיתָ֤םמִגְבֽוּרָתָם֙ בּוֹשִׁ֔ים וַיִּשְׁכְּב֤וּ עֲרֵלִים֙ אֶת־חַלְלֵי־חֶ֔רֶב
  וַיִּשְׂא֥וּ כְלִמָּתָ֖ם אֶת־י֥וֹרְדֵי בֽוֹר׃
