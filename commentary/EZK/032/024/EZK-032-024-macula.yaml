verse: EZK 32:24
text: שָׁ֤ם עֵילָם֙ וְכָל־הֲמוֹנָ֔הּ סְבִיב֖וֹת קְבֻרָתָ֑הּ כֻּלָּ֣ם חֲלָלִים֩ הַנֹּפְלִ֨ים
  בַּחֶ֜רֶב אֲֽשֶׁר־יָרְד֥וּ עֲרֵלִ֣ים׀אֶל־אֶ֣רֶץ תַּחְתִּיּ֗וֹת אֲשֶׁ֨ר נָתְנ֤וּ
  חִתִּיתָם֙ בְּאֶ֣רֶץ חַיִּ֔ים וַיִּשְׂא֥וּ כְלִמָּתָ֖ם אֶת־י֥וֹרְדֵי בֽוֹר׃
