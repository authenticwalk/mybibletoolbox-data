verse: EZK 42:13
text: וַיֹּ֣אמֶר אֵלַ֗י לִֽשְׁכ֨וֹת הַצָּפ֜וֹן לִֽשְׁכ֣וֹת הַדָּרוֹם֮ אֲשֶׁ֣ר אֶל־פְּנֵ֣י
  הַגִּזְרָה֒ הֵ֣נָּה׀לִֽשְׁכ֣וֹת הַקֹּ֗דֶשׁ אֲשֶׁ֨ר יֹאכְלוּ־שָׁ֧ם הַכֹּהֲנִ֛ים אֲשֶׁר־קְרוֹבִ֥ים
  לַֽיהוָ֖ה קָדְשֵׁ֣י הַקֳּדָשִׁ֑ים שָׁ֞ם יַנִּ֣יחוּ׀קָדְשֵׁ֣י הַקֳּדָשִׁ֗ים וְהַמִּנְחָה֙
  וְהַחַטָּ֣את וְהָאָשָׁ֔ם כִּ֥י הַמָּק֖וֹם קָדֹֽשׁ׃
