text: בְּבֹאָ֣ם הַכֹּהֲנִ֗ים וְלֹֽא־יֵצְא֤וּ מֵהַקֹּ֨דֶשׁ֙ אֶל־הֶחָצֵ֣ר הַחִיצוֹנָ֔ה
  וְשָׁ֞ם יַנִּ֧יחוּ בִגְדֵיהֶ֛ם אֲשֶׁר־יְשָׁרְת֥וּ בָהֶ֖ן כִּֽי־קֹ֣דֶשׁ הֵ֑נָּה וְלָבְשׁוּ֙
  בְּגָדִ֣ים אֲחֵרִ֔ים וְקָרְב֖וּ אֶל־אֲשֶׁ֥ר לָעָֽם׃
