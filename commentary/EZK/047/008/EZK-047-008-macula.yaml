text: וַיֹּ֣אמֶר אֵלַ֗י הַמַּ֤יִם הָאֵ֨לֶּה֙ יוֹצְאִ֗ים אֶל־הַגְּלִילָה֙ הַקַּדְמוֹנָ֔ה
