text: וַיּוֹצִאֵנִי֮ דֶּֽרֶךְ־שַׁ֣עַר צָפוֹנָה֒ וַיְסִבֵּ֨נִי֙ דֶּ֣רֶךְ ח֔וּץ אֶל־שַׁ֣עַר
