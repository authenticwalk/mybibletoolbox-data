verse: EZK 47:9
text: וְהָיָ֣ה כָל־נֶ֣פֶשׁ חַיָּ֣ה׀אֲֽשֶׁר־יִשְׁרֹ֡ץ אֶ֣ל כָּל־אֲשֶׁר֩ יָב֨וֹא שָׁ֤ם
  נַחֲלַ֨יִם֙ יִֽחְיֶ֔ה וְהָיָ֥ה הַדָּגָ֖ה רַבָּ֣ה מְאֹ֑ד כִּי֩ בָ֨אוּ שָׁ֜מָּה הַמַּ֣יִם
  הָאֵ֗לֶּה וְיֵרָֽפְאוּ֙ וָחָ֔י כֹּ֛ל אֲשֶׁר־יָ֥בוֹא שָׁ֖מָּה הַנָּֽחַל׃
