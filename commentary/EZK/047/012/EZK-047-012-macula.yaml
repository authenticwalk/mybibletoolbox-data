verse: EZK 47:12
text: וְעַל־הַנַּ֣חַל יַעֲלֶ֣ה עַל־שְׂפָת֣וֹ מִזֶּ֣ה׀וּמִזֶּ֣ה׀כָּל־עֵֽץ־מַ֠אֲכָל
  לֹא־יִבּ֨וֹל עָלֵ֜הוּ וְלֹֽא־יִתֹּ֣ם פִּרְי֗וֹ לָֽחֳדָשָׁיו֙ יְבַכֵּ֔ר כִּ֣י מֵימָ֔יו
  מִן־הַמִּקְדָּ֖שׁ הֵ֣מָּה יֽוֹצְאִ֑ים וְהָיָ֤ה פִרְיוֹ֙ לְמַֽאֲכָ֔ל וְעָלֵ֖הוּ לִתְרוּפָֽה׃ס
