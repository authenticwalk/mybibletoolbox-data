verse: EZK 47:1
text: וַיְשִׁבֵנִי֮ אֶל־פֶּ֣תַח הַבַּיִת֒ וְהִנֵּה־מַ֣יִם יֹצְאִ֗ים מִתַּ֨חַת מִפְתַּ֤ן
