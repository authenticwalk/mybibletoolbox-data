verse: EZK 47:18
text: וּפְאַ֣ת קָדִ֡ים מִבֵּ֣ין חַוְרָ֣ן וּמִבֵּין־דַּמֶּשֶׂק֩ וּמִבֵּ֨ין הַגִּלְעָ֜ד
