verse: EZK 26:16
text: וְֽיָרְד֞וּ מֵעַ֣ל כִּסְאוֹתָ֗ם כֹּ֚ל נְשִׂיאֵ֣י הַיָּ֔ם וְהֵסִ֨ירוּ֙ אֶת־מְעִ֣ילֵיהֶ֔ם
  וְאֶת־בִּגְדֵ֥י רִקְמָתָ֖ם יִפְשֹׁ֑טוּ חֲרָד֤וֹת׀יִלְבָּ֨שׁוּ֙ עַל־הָאָ֣רֶץ יֵשֵׁ֔בוּ
  וְחָֽרְדוּ֙ לִרְגָעִ֔ים וְשָׁמְמ֖וּ עָלָֽיִךְ׃
