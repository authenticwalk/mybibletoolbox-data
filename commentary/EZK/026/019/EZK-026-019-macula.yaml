text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣י יְהוִ֔ה בְּתִתִּ֤י אֹתָךְ֙ עִ֣יר נֶחֱרֶ֔בֶת כֶּעָרִ֖ים
  אֲשֶׁ֣ר לֹֽא־נוֹשָׁ֑בוּ בְּהַעֲל֤וֹת עָלַ֨יִךְ֙ אֶת־תְּה֔וֹם וְכִסּ֖וּךְ הַמַּ֥יִם
  הָרַבִּֽים׃
