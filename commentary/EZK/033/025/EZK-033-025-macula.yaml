text: לָכֵן֩ אֱמֹ֨ר אֲלֵיהֶ֜ם כֹּֽה־אָמַ֣ר׀אֲדֹנָ֣י יְהֹוִ֗ה עַל־הַדָּ֧ם׀תֹּאכֵ֛לוּ
