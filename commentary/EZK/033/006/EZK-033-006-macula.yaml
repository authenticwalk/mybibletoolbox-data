verse: EZK 33:6
text: וְ֠הַצֹּפֶה כִּֽי־יִרְאֶ֨ה אֶת־הַחֶ֜רֶב בָּאָ֗ה וְלֹֽא־תָקַ֤ע בַּשּׁוֹפָר֙ וְהָעָ֣ם
  לֹֽא־נִזְהָ֔ר וַתָּב֣וֹא חֶ֔רֶב וַתִּקַּ֥ח מֵהֶ֖ם נָ֑פֶשׁ ה֚וּא בַּעֲוֺנ֣וֹ נִלְקָ֔ח
  וְדָמ֖וֹ מִיַּֽד־הַצֹּפֶ֥ה אֶדְרֹֽשׁ׃ס
