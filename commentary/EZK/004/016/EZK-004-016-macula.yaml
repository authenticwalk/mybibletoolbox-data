verse: EZK 4:16
text: וַיֹּ֣אמֶר אֵלַ֗י בֶּן־אָדָם֙ הִנְנִ֨י שֹׁבֵ֤ר מַטֵּה־לֶ֨חֶם֙ בִּיר֣וּשָׁלִַ֔ם
  וְאָכְלוּ־לֶ֥חֶם בְּמִשְׁקָ֖ל וּבִדְאָגָ֑ה וּמַ֕יִם בִּמְשׂוּרָ֥ה וּבְשִׁמָּמ֖וֹן
  יִשְׁתּֽוּ׃
