verse: EZK 4:9
text: וְאַתָּ֣ה קַח־לְךָ֡ חִטִּ֡ין וּ֠שְׂעֹרִים וּפ֨וֹל וַעֲדָשִׁ֜ים וְדֹ֣חַן וְכֻסְּמִ֗ים
  וְנָתַתָּ֤ה אוֹתָם֙ בִּכְלִ֣י אֶחָ֔ד וְעָשִׂ֧יתָ אוֹתָ֛ם לְךָ֖ לְלָ֑חֶם מִסְפַּ֨ר
  הַיָּמִ֜ים אֲשֶׁר־אַתָּ֣ה׀שׁוֹכֵ֣ב עַֽל־צִדְּךָ֗ שְׁלֹשׁ־מֵא֧וֹת וְתִשְׁעִ֛ים י֖וֹם
  תֹּאכֲלֶֽנּוּ׃
