text: וְאַתָּ֤ה שְׁכַב֙ עַל־צִדְּךָ֣ הַשְּׂמָאלִ֔י וְשַׂמְתָּ֛ אֶת־עֲוֺ֥ן בֵּֽית־יִשְׂרָאֵ֖ל
