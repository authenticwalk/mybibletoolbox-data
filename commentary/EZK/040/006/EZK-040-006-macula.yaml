verse: EZK 40:6
text: וַיָּב֗וֹא אֶל־שַׁ֨עַר֙ אֲשֶׁ֤ר פָּנָיו֙ דֶּ֣רֶךְ הַקָּדִ֔ימָה וַיַּ֖עַל בְּמַֽעֲלוֹתָ֑יו
  וַיָּ֣מָד׀אֶת־סַ֣ף הַשַּׁ֗עַר קָנֶ֤ה אֶחָד֙ רֹ֔חַב וְאֵת֙ סַ֣ף אֶחָ֔ד קָנֶ֥ה אֶחָ֖ד
  רֹֽחַב׃
