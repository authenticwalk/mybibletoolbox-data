verse: EZK 40:4
text: וַיְדַבֵּ֨ר אֵלַ֜י הָאִ֗ישׁ בֶּן־אָדָ֡ם רְאֵ֣ה בְעֵינֶיךָ֩ וּבְאָזְנֶ֨יךָ שְּׁמָ֜ע
  וְשִׂ֣ים לִבְּךָ֗ לְכֹ֤ל אֲשֶׁר־אֲנִי֙ מַרְאֶ֣ה אוֹתָ֔ךְ כִּ֛י לְמַ֥עַן הַרְאוֹתְכָ֖ה
  הֻבָ֣אתָה הֵ֑נָּה הַגֵּ֛ד אֶת־כָּל־אֲשֶׁר־אַתָּ֥ה רֹאֶ֖ה לְבֵ֥ית יִשְׂרָאֵֽל׃
