verse: EZK 40:5
text: וְהִנֵּ֥ה חוֹמָ֛ה מִח֥וּץ לַבַּ֖יִת סָבִ֣יב׀סָבִ֑יב וּבְיַ֨ד הָאִ֜ישׁ קְנֵ֣ה
  הַמִּדָּ֗ה שֵׁשׁ־אַמּ֤וֹת בָּֽאַמָּה֙ וָטֹ֔פַח וַיָּ֜מָד אֶת־רֹ֤חַב הַבִּנְיָן֙
  קָנֶ֣ה אֶחָ֔ד וְקוֹמָ֖ה קָנֶ֥ה אֶחָֽד׃
