verse: EZK 40:49
text: אֹ֣רֶךְ הָאֻלָ֞ם עֶשְׂרִ֣ים אַמָּ֗ה וְרֹ֨חַב֙ עַשְׁתֵּ֣י עֶשְׂרֵ֣ה אַמָּ֔ה וּבַֽמַּעֲל֔וֹת
  אֲשֶׁ֥ר יַעֲל֖וּ אֵלָ֑יו וְעַמֻּדִים֙ אֶל־הָ֣אֵילִ֔ים אֶחָ֥ד מִפֹּ֖ה וְאֶחָ֥ד מִפֹּֽה׃
