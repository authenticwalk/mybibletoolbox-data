verse: EZK 40:16
text: וְחַלֹּנ֣וֹת אֲטֻמ֣וֹת אֶֽל־הַתָּאִ֡ים וְאֶל֩ אֵלֵיהֵ֨מָה לִפְנִ֤ימָה לַשַּׁ֨עַר֙
  סָבִ֣יב׀סָבִ֔יב וְכֵ֖ן לָאֵֽלַמּ֑וֹת וְחַלּוֹנ֞וֹת סָבִ֤יב׀סָבִיב֙ לִפְנִ֔ימָה וְאֶל־אַ֖יִל
  תִּמֹרִֽים׃
