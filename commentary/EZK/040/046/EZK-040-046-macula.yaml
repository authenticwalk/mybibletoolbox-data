text: וְהַלִּשְׁכָּ֗ה אֲשֶׁ֤ר פָּנֶ֨יהָ֙ דֶּ֣רֶךְ הַצָּפ֔וֹן לַכֹּ֣הֲנִ֔ים שֹׁמְרֵ֖י
