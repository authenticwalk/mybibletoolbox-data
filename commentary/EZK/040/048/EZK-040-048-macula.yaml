text: וַיְבִאֵנִי֮ אֶל־אֻלָ֣ם הַבַּיִת֒ וַיָּ֨מָד֙ אֵ֣ל אֻלָ֔ם חָמֵ֤שׁ אַמּוֹת֙ מִפֹּ֔ה
