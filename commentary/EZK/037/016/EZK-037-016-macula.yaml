verse: EZK 37:16
text: וְאַתָּ֣ה בֶן־אָדָ֗ם קַח־לְךָ֙ עֵ֣ץ אֶחָ֔ד וּכְתֹ֤ב עָלָיו֙ לִֽיהוּדָ֔ה וְלִבְנֵ֥י
  יִשְׂרָאֵ֖ל חֲבֵרָ֑יו וּלְקַח֙ עֵ֣ץ אֶחָ֔ד וּכְת֣וֹב עָלָ֗יו לְיוֹסֵף֙ עֵ֣ץ אֶפְרַ֔יִם
  וְכָל־בֵּ֥ית יִשְׂרָאֵ֖ל חֲבֵרָֽיו׃
