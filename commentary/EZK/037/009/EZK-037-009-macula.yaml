verse: EZK 37:9
text: וַיֹּ֣אמֶר אֵלַ֔י הִנָּבֵ֖א אֶל־הָר֑וּחַ הִנָּבֵ֣א בֶן־אָ֠דָם וְאָמַרְתָּ֨אֶל־הָר֜וּחַ
  כֹּֽה־אָמַ֣ר׀אֲדֹנָ֣י יְהוִ֗ה מֵאַרְבַּ֤ע רוּחוֹת֙ בֹּ֣אִי הָר֔וּחַ וּפְחִ֛י בַּהֲרוּגִ֥ים
  הָאֵ֖לֶּה וְיִֽחְיֽוּ׃
