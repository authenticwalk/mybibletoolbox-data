text: וּקְרָאתֶ֞ם בְּעֶ֣צֶם׀הַיּ֣וֹם הַזֶּ֗ה מִֽקְרָא־קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָכֶ֔ם כָּל־מְלֶ֥אכֶת
