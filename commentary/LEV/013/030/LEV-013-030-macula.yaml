text: וְרָאָ֨ה הַכֹּהֵ֜ן אֶת־הַנֶּ֗גַע וְהִנֵּ֤ה מַרְאֵ֨הוּ֙ עָמֹ֣ק מִן־הָע֔וֹר וּב֛וֹ
