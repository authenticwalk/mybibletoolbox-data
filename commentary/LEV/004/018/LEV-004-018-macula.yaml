verse: LEV 4:18
text: וּמִן־הַדָּ֞ם יִתֵּ֣ן׀עַל־קַרְנֹ֣ת הַמִּזְבֵּ֗חַ אֲשֶׁר֙ לִפְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר
  בְּאֹ֣הֶל מוֹעֵ֑ד וְאֵ֣ת כָּל־הַדָּ֗ם יִשְׁפֹּךְ֙ אֶל־יְסוֹד֙ מִזְבַּ֣ח הָעֹלָ֔ה
  אֲשֶׁר־פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃
