verse: LEV 8:26
text: וּמִסַּ֨ל הַמַּצּ֜וֹת אֲשֶׁ֣ר׀לִפְנֵ֣י יְהוָ֗ה לָ֠קַח חַלַּ֨ת מַצָּ֤ה אַחַת֙
  וְֽחַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְרָקִ֣יק אֶחָ֑ד וַיָּ֨שֶׂם֙ עַל־הַ֣חֲלָבִ֔ים וְעַ֖ל
  שׁ֥וֹק הַיָּמִֽין׃
