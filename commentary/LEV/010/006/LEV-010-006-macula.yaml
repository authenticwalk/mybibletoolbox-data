verse: LEV 10:6
text: וַיֹּ֣אמֶר מֹשֶׁ֣ה אֶֽל־אַהֲרֹ֡ן וּלְאֶלְעָזָר֩ וּלְאִֽיתָמָ֨ר׀בָּנָ֜יו רָֽאשֵׁיכֶ֥ם
  אַל־תִּפְרָ֣עוּ׀וּבִגְדֵיכֶ֤ם לֹֽא־תִפְרֹ֨מוּ֙ וְלֹ֣א תָמֻ֔תוּ וְעַ֥ל כָּל־הָעֵדָ֖ה
  יִקְצֹ֑ף וַאֲחֵיכֶם֙ כָּל־בֵּ֣ית יִשְׂרָאֵ֔ל יִבְכּוּ֙ אֶת־הַשְּׂרֵפָ֔ה אֲשֶׁ֖ר
  שָׂרַ֥ף יְהוָֽה׃
