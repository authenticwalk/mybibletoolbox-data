text: כָּל־הַמִּשְׁכָּ֞ב אֲשֶׁר־תִּשְׁכַּ֤ב עָלָיו֙ כָּל־יְמֵ֣י זוֹבָ֔הּ כְּמִשְׁכַּ֥ב
