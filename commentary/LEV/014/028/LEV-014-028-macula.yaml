text: וְנָתַ֨ן הַכֹּהֵ֜ן מִן־הַשֶּׁ֣מֶן׀אֲשֶׁ֣ר עַל־כַּפּ֗וֹ עַל־תְּנ֞וּךְ אֹ֤זֶן
