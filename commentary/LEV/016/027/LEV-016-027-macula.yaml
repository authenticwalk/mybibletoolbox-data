verse: LEV 16:27
text: וְאֵת֩ פַּ֨ר הַֽחַטָּ֜את וְאֵ֣ת׀שְׂעִ֣יר הַֽחַטָּ֗את אֲשֶׁ֨ר הוּבָ֤א אֶת־דָּמָם֙
  לְכַפֵּ֣ר בַּקֹּ֔דֶשׁ יוֹצִ֖יא אֶל־מִח֣וּץ לַֽמַּחֲנֶ֑ה וְשָׂרְפ֣וּ בָאֵ֔שׁ אֶת־עֹרֹתָ֥ם
  וְאֶת־בְּשָׂרָ֖ם וְאֶת־פִּרְשָֽׁם׃
