verse: JOB 2:11
text: וַֽיִּשְׁמְע֞וּ שְׁלֹ֣שֶׁת׀רֵעֵ֣י אִיּ֗וֹב אֵ֣ת כָּל־הָרָעָ֣ה הַזֹּאת֮ הַבָּ֣אָה
  עָלָיו֒ וַיָּבֹ֨אוּ֙ אִ֣ישׁ מִמְּקֹמ֔וֹ אֱלִיפַ֤ז הַתֵּימָנִי֙ וּבִלְדַּ֣ד הַשּׁוּחִ֔י
  וְצוֹפַ֖ר הַנַּֽעֲמָתִ֑י וַיִּוָּעֲד֣וּ יַחְדָּ֔ו לָב֥וֹא לָנֽוּד־ל֖וֹ וּֽלְנַחֲמֽוֹ׃
