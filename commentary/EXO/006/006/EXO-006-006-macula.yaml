text: לָכֵ֞ן אֱמֹ֥ר לִבְנֵֽי־יִשְׂרָאֵ֘לאֲנִ֣י יְהוָה֒ וְהוֹצֵאתִ֣י אֶתְכֶ֗ם מִתַּ֨חַת֙
