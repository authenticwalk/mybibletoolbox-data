verse: EXO 30:12
text: כִּ֣י תִשָּׂ֞א אֶת־רֹ֥אשׁ בְּנֵֽי־יִשְׂרָאֵ֘ללִפְקֻדֵיהֶם֒ וְנָ֨תְנ֜וּ אִ֣ישׁ
  כֹּ֧פֶר נַפְשׁ֛וֹ לַיהוָ֖ה בִּפְקֹ֣ד אֹתָ֑ם וְלֹא־יִהְיֶ֥ה בָהֶ֛ם נֶ֖גֶף בִּפְקֹ֥ד
  אֹתָֽם׃
