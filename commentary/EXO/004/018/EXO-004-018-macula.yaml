text: וַיֵּ֨לֶךְ מֹשֶׁ֜ה וַיָּ֣שָׁב׀אֶל־יֶ֣תֶר חֹֽתְנ֗וֹ וַיֹּ֤אמֶר לוֹ֙ אֵ֣לֲכָה
