verse: EXO 26:33
text: וְנָתַתָּ֣ה אֶת־הַפָּרֹכֶת֮ תַּ֣חַת הַקְּרָסִים֒ וְהֵבֵאתָ֥ שָׁ֨מָּה֙ מִבֵּ֣ית
