text: וּלְשַׁ֨עַר הֶֽחָצֵ֜ר מָסָ֣ךְ׀עֶשְׂרִ֣ים אַמָּ֗ה תְּכֵ֨לֶת וְאַרְגָּמָ֜ן וְתוֹלַ֧עַת
