text: וָאֵרֵ֞ד לְהַצִּיל֣וֹ׀מִיַּ֣ד מִצְרַ֗יִם וּֽלְהַעֲלֹתוֹ֮ מִן־הָאָ֣רֶץ הַהִוא֒
