text: וַיַּֽעֲשׂוּ־כֵ֗ן וַיֵּט֩ אַהֲרֹ֨ן אֶת־יָד֤וֹ בְמַטֵּ֨הוּ֙ וַיַּךְ֙ אֶת־עֲפַ֣ר
