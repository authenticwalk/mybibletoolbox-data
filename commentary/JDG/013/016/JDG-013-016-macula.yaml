verse: JDG 13:16
text: וַיֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל־מָנ֗וֹחַ אִם־תַּעְצְרֵ֨נִי֙ לֹא־אֹכַ֣ל בְּלַחְמֶ֔ךָ
