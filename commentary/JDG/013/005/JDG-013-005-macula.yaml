text: כִּי֩ הִנָּ֨ךְ הָרָ֜ה וְיֹלַ֣דְתְּ בֵּ֗ן וּמוֹרָה֙ לֹא־יַעֲלֶ֣ה עַל־רֹאשׁ֔וֹ
