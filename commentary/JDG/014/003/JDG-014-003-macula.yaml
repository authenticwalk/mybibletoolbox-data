verse: JDG 14:3
text: וַיֹּ֨אמֶר ל֜וֹ אָבִ֣יו וְאִמּ֗וֹ הַאֵין֩ בִּבְנ֨וֹת אַחֶ֤יךָ וּבְכָל־עַמִּי֙
  אִשָּׁ֔ה כִּֽי־אַתָּ֤ה הוֹלֵךְ֙ לָקַ֣חַת אִשָּׁ֔ה מִפְּלִשְׁתִּ֖ים הָעֲרֵלִ֑ים וַיֹּ֨אמֶר
  שִׁמְשׁ֤וֹן אֶל־אָבִיו֙ אוֹתָ֣הּ קַֽח־לִ֔י כִּֽי־הִ֖יא יָשְׁרָ֥ה בְעֵינָֽי׃
