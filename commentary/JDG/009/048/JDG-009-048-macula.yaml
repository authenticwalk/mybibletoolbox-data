verse: JDG 9:48
text: וַיַּ֨עַל אֲבִימֶ֜לֶךְ הַר־צַלְמ֗וֹן הוּא֮ וְכָל־הָעָ֣ם אֲשֶׁר־אִתּוֹ֒ וַיִּקַּח֩
  אֲבִימֶ֨לֶךְ אֶת־הַקַּרְדֻּמּ֜וֹת בְּיָד֗וֹ וַיִּכְרֹת֙ שׂוֹכַ֣ת עֵצִ֔ים וַיִּ֨שָּׂאֶ֔הָ
  וַיָּ֖שֶׂם עַל־שִׁכְמ֑וֹ וַיֹּ֜אמֶר אֶל־הָעָ֣ם אֲשֶׁר־עִמּ֗וֹ מָ֤ה רְאִיתֶם֙ עָשִׂ֔יתִי
  מַהֲר֖וּ עֲשׂ֥וּ כָמֽוֹנִי׃
