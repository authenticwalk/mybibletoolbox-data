verse: JDG 9:28
text: וַיֹּ֣אמֶר׀גַּ֣עַל בֶּן־עֶ֗בֶד מִֽי־אֲבִימֶ֤לֶךְ וּמִֽי־שְׁכֶם֙ כִּ֣י נַעַבְדֶ֔נּוּ
  הֲלֹ֥א בֶן־יְרֻבַּ֖עַל וּזְבֻ֣ל פְּקִיד֑וֹ עִבְד֗וּ אֶת־אַנְשֵׁ֤י חֲמוֹר֙ אֲבִ֣י
  שְׁכֶ֔ם וּמַדּ֖וּעַ נַעַבְדֶ֥נּוּ אֲנָֽחְנוּ׃
