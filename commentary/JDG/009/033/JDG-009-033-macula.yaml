verse: JDG 9:33
text: וְהָיָ֤ה בַבֹּ֨קֶר֙ כִּזְרֹ֣חַ הַשֶּׁ֔מֶשׁ תַּשְׁכִּ֖ים וּפָשַׁטְתָּ֣ עַל־הָעִ֑יר
