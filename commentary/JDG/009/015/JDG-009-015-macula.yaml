verse: JDG 9:15
text: וַיֹּ֣אמֶר הָאָטָד֮ אֶל־הָעֵצִים֒ אִ֡ם בֶּאֱמֶ֣ת אַתֶּם֩ מֹשְׁחִ֨ים אֹתִ֤י לְמֶ֨לֶךְ֙
  עֲלֵיכֶ֔ם בֹּ֖אוּ חֲס֣וּ בְצִלִּ֑י וְאִם־אַ֕יִן תֵּ֤צֵא אֵשׁ֙ מִן־הָ֣אָטָ֔ד וְתֹאכַ֖ל
  אֶת־אַרְזֵ֥י הַלְּבָנֽוֹן׃
