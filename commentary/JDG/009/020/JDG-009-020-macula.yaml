text: וְאִם־אַ֕יִן תֵּ֤צֵא אֵשׁ֙ מֵאֲבִימֶ֔לֶךְ וְתֹאכַ֛ל אֶת־בַּעֲלֵ֥י שְׁכֶ֖ם וְאֶת־בֵּ֣ית
  מִלּ֑וֹא וְתֵצֵ֨א אֵ֜שׁ מִבַּעֲלֵ֤י שְׁכֶם֙ וּמִבֵּ֣ית מִלּ֔וֹא וְתֹאכַ֖ל אֶת־אֲבִימֶֽלֶךְ׃
