text: וַיְדַבְּר֨וּ אֲחֵֽי־אִמּ֜וֹ עָלָ֗יו בְּאָזְנֵי֙ כָּל־בַּעֲלֵ֣י שְׁכֶ֔ם אֵ֥ת
