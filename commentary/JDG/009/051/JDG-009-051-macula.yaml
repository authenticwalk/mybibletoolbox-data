verse: JDG 9:51
text: וּמִגְדַּל־עֹז֮ הָיָ֣ה בְתוֹךְ־הָעִיר֒ וַיָּנֻ֨סוּ שָׁ֜מָּה כָּל־הָאֲנָשִׁ֣ים
  וְהַנָּשִׁ֗ים וְכֹל֙ בַּעֲלֵ֣י הָעִ֔יר וַֽיִּסְגְּר֖וּ בַּעֲדָ֑ם וַֽיַּעֲל֖וּ עַל־גַּ֥ג
  הַמִּגְדָּֽל׃
