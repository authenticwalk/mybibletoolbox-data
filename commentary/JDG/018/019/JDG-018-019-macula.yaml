text: וַיֹּאמְרוּ֩ ל֨וֹ הַחֲרֵ֜שׁ שִֽׂים־יָדְךָ֤ עַל־פִּ֨יךָ֙ וְלֵ֣ךְ עִמָּ֔נוּ וֶֽהְיֵה־לָ֖נוּ
  לְאָ֣ב וּלְכֹהֵ֑ן הֲט֣וֹב׀הֱיוֹתְךָ֣ כֹהֵ֗ן לְבֵית֙ אִ֣ישׁ אֶחָ֔ד א֚וֹ הֱיוֹתְךָ֣
