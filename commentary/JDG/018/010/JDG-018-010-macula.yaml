verse: JDG 18:10
text: כְּבֹאֲכֶ֞ם תָּבֹ֣אוּ׀אֶל־עַ֣ם בֹּטֵ֗חַ וְהָאָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם כִּֽי־נְתָנָ֥הּ
  אֱלֹהִ֖ים בְּיֶדְכֶ֑ם מָקוֹם֙ אֲשֶׁ֣ר אֵֽין־שָׁ֣ם מַחְס֔וֹר כָּל־דָּבָ֖ר אֲשֶׁ֥ר
  בָּאָֽרֶץ׃
