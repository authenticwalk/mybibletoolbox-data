verse: JDG 18:17
text: וַֽיַּעֲל֞וּ חֲמֵ֣שֶׁת הָאֲנָשִׁ֗ים הַהֹלְכִים֮ לְרַגֵּ֣ל אֶת־הָאָרֶץ֒ בָּ֣אוּ
  שָׁ֔מָּה לָקְח֗וּ אֶת־הַפֶּ֨סֶל֙ וְאֶת־הָ֣אֵפ֔וֹד וְאֶת־הַתְּרָפִ֖ים וְאֶת־הַמַּסֵּכָ֑ה
  וְהַכֹּהֵ֗ן נִצָּב֙ פֶּ֣תַח הַשַּׁ֔עַר וְשֵׁשׁ־מֵא֣וֹת הָאִ֔ישׁ הֶחָג֖וּר כְּלֵ֥י
  הַמִּלְחָמָֽה׃
