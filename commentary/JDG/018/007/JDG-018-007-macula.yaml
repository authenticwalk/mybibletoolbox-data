verse: JDG 18:7
text: וַיֵּלְכוּ֙ חֲמֵ֣שֶׁת הָאֲנָשִׁ֔ים וַיָּבֹ֖אוּ לָ֑יְשָׁה וַיִּרְא֣וּ אֶת־הָעָ֣ם
  אֲשֶׁר־בְּקִרְבָּ֣הּ יוֹשֶֽׁבֶת־לָ֠בֶטַח כְּמִשְׁפַּ֨ט צִדֹנִ֜ים שֹׁקֵ֣ט׀וּבֹטֵ֗חַ
  וְאֵין־מַכְלִ֨ים דָּבָ֤ר בָּאָ֨רֶץ֙ יוֹרֵ֣שׁ עֶ֔צֶר וּרְחֹקִ֥ים הֵ֨מָּה֙ מִצִּ֣דֹנִ֔ים
  וְדָבָ֥ר אֵין־לָהֶ֖ם עִם־אָדָֽם׃
