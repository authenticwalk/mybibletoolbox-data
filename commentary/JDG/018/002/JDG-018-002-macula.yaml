verse: JDG 18:2
text: וַיִּשְׁלְח֣וּ בְנֵי־דָ֣ן׀מִֽמִּשְׁפַּחְתָּ֡ם חֲמִשָּׁ֣ה אֲנָשִׁ֣ים מִקְצוֹתָם֩
  אֲנָשִׁ֨ים בְּנֵי־חַ֜יִל מִצָּרְעָ֣ה וּמֵֽאֶשְׁתָּאֹ֗ל לְרַגֵּ֤ל אֶת־הָאָ֨רֶץ֙ וּלְחָקְרָ֔הּ
  וַיֹּאמְר֣וּ אֲלֵהֶ֔ם לְכ֖וּ חִקְר֣וּ אֶת־הָאָ֑רֶץ וַיָּבֹ֤אוּ הַר־אֶפְרַ֨יִם֙ עַד־בֵּ֣ית
  מִיכָ֔ה וַיָּלִ֖ינוּ שָֽׁם׃
