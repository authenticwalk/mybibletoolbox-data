text: וַיַּגֶּד־לָ֣הּ אֶת־כָּל־לִבּ֗וֹ וַיֹּ֤אמֶר לָהּ֙ מוֹרָה֙ לֹֽא־עָלָ֣ה עַל־רֹאשִׁ֔י
