text: וַיִּרְא֤וּ אֹתוֹ֙ הָעָ֔ם וַֽיְהַלְל֖וּ אֶת־אֱלֹהֵיהֶ֑ם כִּ֣י אָמְר֗וּ נָתַ֨ן
