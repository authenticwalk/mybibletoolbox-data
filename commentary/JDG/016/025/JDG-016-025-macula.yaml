verse: JDG 16:25
text: וַֽיְהִי֙ כְּט֣וֹב לִבָּ֔ם וַיֹּ֣אמְר֔וּ קִרְא֥וּ לְשִׁמְשׁ֖וֹן וִישַֽׂחֶק־לָ֑נוּ
  וַיִּקְרְא֨וּ לְשִׁמְשׁ֜וֹן מִבֵּ֣ית הָאֲסוּרִ֗ים וַיְצַחֵק֙ לִפְנֵיהֶ֔ם וַיַּעֲמִ֥ידוּ
  אוֹת֖וֹ בֵּ֥ין הָעַמּוּדִֽים׃
