verse: JDG 16:23
text: וְסַרְנֵ֣י פְלִשְׁתִּ֗ים נֶֽאֱסְפוּ֙לִזְבֹּ֧חַ זֶֽבַח־גָּד֛וֹל לְדָג֥וֹן אֱלֹהֵיהֶ֖ם
  וּלְשִׂמְחָ֑ה וַיֹּ֣אמְר֔וּ נָתַ֤ן אֱלֹהֵ֨ינוּ֙ בְּיָדֵ֔נוּ אֵ֖ת שִׁמְשׁ֥וֹן אוֹיְבֵֽינוּ׃
