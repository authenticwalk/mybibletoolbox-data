text: וַיִּלְפֹּ֨ת שִׁמְשׁ֜וֹן אֶת־שְׁנֵ֣י׀עַמּוּדֵ֣י הַתָּ֗וֶךְ אֲשֶׁ֤ר הַבַּ֨יִת֙
