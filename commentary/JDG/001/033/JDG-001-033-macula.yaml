verse: JDG 1:33
text: נַפְתָּלִ֗י לֹֽא־הוֹרִ֞ישׁ אֶת־יֹשְׁבֵ֤י בֵֽית־שֶׁ֨מֶשׁ֙ וְאֶת־יֹשְׁבֵ֣י בֵית־עֲנָ֔ת
  וַיֵּ֕שֶׁב בְּקֶ֥רֶב הַֽכְּנַעֲנִ֖י יֹשְׁבֵ֣י הָאָ֑רֶץ וְיֹשְׁבֵ֤י בֵֽית־שֶׁ֨מֶשׁ֙
  וּבֵ֣ית עֲנָ֔ת הָי֥וּ לָהֶ֖ם לָמַֽס׃ס
