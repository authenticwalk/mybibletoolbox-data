text: אָשֵׁ֗ר לֹ֤א הוֹרִישׁ֙ אֶת־יֹשְׁבֵ֣י עַכּ֔וֹ וְאֶת־יוֹשְׁבֵ֖י צִיד֑וֹן וְאֶת־אַחְלָ֤ב
