language: heb
verse: JDG 1:27
text: וְלֹא־הוֹרִ֣ישׁ מְנַשֶּׁ֗ה אֶת־בֵּית־שְׁאָ֣ן וְאֶת־בְּנוֹתֶיהָ֮ וְאֶת־תַּעְנַ֣ךְ
  וְאֶת־בְּנֹתֶיהָ֒ וְאֶת־יֹשְׁבֵ֨י ד֜וֹר וְאֶת־בְּנוֹתֶ֗יהָ וְאֶת־יוֹשְׁבֵ֤י יִבְלְעָם֙
  וְאֶת־בְּנֹתֶ֔יהָ וְאֶת־יוֹשְׁבֵ֥י מְגִדּ֖וֹ וְאֶת־בְּנוֹתֶ֑יהָ וַיּ֨וֹאֶל֙ הַֽכְּנַעֲנִ֔י
  לָשֶׁ֖בֶת בָּאָ֥רֶץ הַזֹּֽאת׃
