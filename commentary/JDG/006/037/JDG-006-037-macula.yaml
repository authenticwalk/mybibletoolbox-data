text: הִנֵּ֣ה אָנֹכִ֗י מַצִּ֛יג אֶת־גִּזַּ֥ת הַצֶּ֖מֶר בַּגֹּ֑רֶן אִ֡ם טַל֩ יִהְיֶ֨ה
  עַֽל־הַגִּזָּ֜ה לְבַדָּ֗הּ וְעַל־כָּל־הָאָ֨רֶץ֙ חֹ֔רֶב וְיָדַעְתִּ֗י כִּֽי־תוֹשִׁ֧יעַ
  בְּיָדִ֛י אֶת־יִשְׂרָאֵ֖ל כַּאֲשֶׁ֥ר דִּבַּֽרְתָּ׃
