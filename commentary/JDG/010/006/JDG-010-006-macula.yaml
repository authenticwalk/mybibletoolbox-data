verse: JDG 10:6
text: וַיֹּסִ֣פוּ׀בְּנֵ֣י יִשְׂרָאֵ֗ל לַעֲשׂ֣וֹת הָרַע֮ בְּעֵינֵ֣י יְהוָה֒ וַיַּעַבְד֣וּ
  אֶת־הַבְּעָלִ֣ים וְאֶת־הָעַשְׁתָּר֡וֹת וְאֶת־אֱלֹהֵ֣י אֲרָם֩ וְאֶת־אֱלֹהֵ֨י צִיד֜וֹן
  וְאֵ֣ת׀אֱלֹהֵ֣י מוֹאָ֗ב וְאֵת֙ אֱלֹהֵ֣י בְנֵי־עַמּ֔וֹן וְאֵ֖ת אֱלֹהֵ֣י פְלִשְׁתִּ֑ים
  וַיַּעַזְב֥וּ אֶת־יְהוָ֖ה וְלֹ֥א עֲבָדֽוּהוּ׃
