text: וְהָיָ֡ה כִּֽי־יָבֹ֣אוּ אֲבוֹתָם֩ א֨וֹ אֲחֵיהֶ֜ם לָרִ֣יב׀אֵלֵ֗ינוּ וְאָמַ֤רְנוּ
