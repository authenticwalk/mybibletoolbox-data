text: וַיֵּ֣לֶךְ שִׁמְשׁ֔וֹן וַיִּלְכֹּ֖ד שְׁלֹשׁ־מֵא֣וֹת שׁוּעָלִ֑ים וַיִּקַּ֣ח לַפִּדִ֗ים
