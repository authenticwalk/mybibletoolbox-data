text: וַיְהִ֞י מִקֵּ֣ץ׀שְׁנַ֣יִם חֳדָשִׁ֗ים וַתָּ֨שָׁב֙ אֶל־אָבִ֔יהָ וַיַּ֣עַשׂ לָ֔הּ
