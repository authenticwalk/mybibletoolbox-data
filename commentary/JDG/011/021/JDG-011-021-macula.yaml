verse: JDG 11:21
text: וַ֠יִּתֵּן יְהוָ֨ה אֱלֹהֵֽי־יִשְׂרָאֵ֜ל אֶת־סִיח֧וֹן וְאֶת־כָּל־עַמּ֛וֹ בְּיַ֥ד
