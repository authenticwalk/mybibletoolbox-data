verse: JDG 11:33
text: וַיַּכֵּ֡ם מֵעֲרוֹעֵר֩ וְעַד־בּוֹאֲךָ֨מִנִּ֜ית עֶשְׂרִ֣ים עִ֗יר וְעַד֙ אָבֵ֣ל
  כְּרָמִ֔ים מַכָּ֖ה גְּדוֹלָ֣ה מְאֹ֑ד וַיִּכָּֽנְעוּ֙ בְּנֵ֣י עַמּ֔וֹן מִפְּנֵ֖י
  בְּנֵ֥י יִשְׂרָאֵֽל׃פ
