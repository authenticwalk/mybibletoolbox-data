text: וַיֹּאמֶר֩ מֶ֨לֶךְ בְּנֵי־עַמּ֜וֹן אֶל־מַלְאֲכֵ֣י יִפְתָּ֗ח כִּֽי־לָקַ֨ח יִשְׂרָאֵ֤ל
