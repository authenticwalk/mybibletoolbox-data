verse: JDG 8:5
text: וַיֹּ֨אמֶר֙ לְאַנְשֵׁ֣י סֻכּ֔וֹת תְּנוּ־נָא֙ כִּכְּר֣וֹת לֶ֔חֶם לָעָ֖ם אֲשֶׁ֣ר
