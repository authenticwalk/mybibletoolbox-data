text: וַיֹּ֤אמֶר אֲלֵהֶם֙ רִדְפ֣וּ אַחֲרַ֔י כִּֽי־נָתַ֨ן יְהוָ֧ה אֶת־אֹיְבֵיכֶ֛ם אֶת־מוֹאָ֖ב
