verse: JDG 3:10
text: וַתְּהִ֨י עָלָ֥יו רֽוּחַ־יְהוָה֮ וַיִּשְׁפֹּ֣ט אֶת־יִשְׂרָאֵל֒ וַיֵּצֵא֙ לַמִּלְחָמָ֔ה
  וַיִּתֵּ֤ן יְהוָה֙ בְּיָד֔וֹ אֶת־כּוּשַׁ֥ן רִשְׁעָתַ֖יִם מֶ֣לֶךְ אֲרָ֑ם וַתָּ֣עָז
  יָד֔וֹ עַ֖ל כּוּשַׁ֥ן רִשְׁעָתָֽיִם׃
