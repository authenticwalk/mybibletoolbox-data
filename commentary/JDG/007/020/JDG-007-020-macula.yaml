text: וַֽ֠יִּתְקְעוּ שְׁלֹ֨שֶׁת הָרָאשִׁ֥ים בַּשּֽׁוֹפָרוֹת֮ וַיִּשְׁבְּר֣וּ הַכַּדִּים֒
  וַיַּחֲזִ֤יקוּ בְיַד־שְׂמאוֹלָם֙בַּלַּפִּדִ֔ים וּבְיַ֨ד־יְמִינָ֔ם הַשּׁוֹפָר֖וֹת
  לִתְק֑וֹעַ וַֽיִּקְרְא֔וּ חֶ֥רֶב לַֽיהוָ֖ה וּלְגִדְעֽוֹן׃
