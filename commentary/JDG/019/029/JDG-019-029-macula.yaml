text: וַיָּבֹ֣א אֶל־בֵּית֗וֹ וַיִּקַּ֤ח אֶת־הַֽמַּאֲכֶ֨לֶת֙ וַיַּחֲזֵ֣ק בְּפִֽילַגְשׁ֔וֹ
