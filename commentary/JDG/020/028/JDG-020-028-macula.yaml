text: וּ֠פִינְחָס בֶּן־אֶלְעָזָ֨ר בֶּֽן־אַהֲרֹ֜ן עֹמֵ֣ד׀לְפָנָ֗יו בַּיָּמִ֣ים הָהֵם֮
