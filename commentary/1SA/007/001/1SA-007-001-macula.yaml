text: 1SA 7:1 וַיָּבֹ֜אוּ אַנְשֵׁ֣י׀קִרְיַ֣ת יְעָרִ֗ים וַֽיַּעֲלוּ֙ אֶת־אֲר֣וֹן יְהוָ֔ה
