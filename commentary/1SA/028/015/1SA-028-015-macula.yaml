verse: 1SA 28:15
text: 1SA 28:15 וַיֹּ֤אמֶר שְׁמוּאֵל֙ אֶל־שָׁא֔וּל לָ֥מָּה הִרְגַּזְתַּ֖נִי לְהַעֲל֣וֹת
  אֹתִ֑י וַיֹּ֣אמֶר שָׁ֠אוּל צַר־לִ֨י מְאֹ֜ד וּפְלִשְׁתִּ֣ים׀נִלְחָמִ֣ים בִּ֗י וֵֽאלֹהִ֞ים
  סָ֤ר מֵֽעָלַי֙ וְלֹֽא־עָנָ֣נִי ע֗וֹד גַּ֤ם בְּיַֽד־הַנְּבִיאִם֙ גַּם־בַּ֣חֲלֹמ֔וֹת
  וָאֶקְרָאֶ֣ה לְךָ֔ לְהוֹדִיעֵ֖נִי מָ֥ה אֶעֱשֶֽׂה׃ס
