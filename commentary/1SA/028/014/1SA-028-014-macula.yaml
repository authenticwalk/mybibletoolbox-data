text: 1SA 28:14 וַיֹּ֤אמֶר לָהּ֙ מַֽה־תָּאֳר֔וֹ וַתֹּ֗אמֶר אִ֤ישׁ זָקֵן֙ עֹלֶ֔ה וְה֥וּא
