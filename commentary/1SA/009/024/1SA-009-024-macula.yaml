verse: 1SA 9:24
text: 1SA 9:24 וַיָּ֣רֶם הַ֠טַּבָּח אֶת־הַשּׁ֨וֹק וְהֶעָלֶ֜יהָ וַיָּ֣שֶׂם׀לִפְנֵ֣י
  שָׁא֗וּל וַיֹּ֨אמֶר֙ הִנֵּ֤ה הַנִּשְׁאָר֙ שִׂים־לְפָנֶ֣יךָ אֱכֹ֔ל כִּ֧י לַמּוֹעֵ֛ד
  שָֽׁמוּר־לְךָ֥ לֵאמֹ֖ר הָעָ֣ם׀קָרָ֑אתִי וַיֹּ֧אכַל שָׁא֛וּל עִם־שְׁמוּאֵ֖ל בַּיּ֥וֹם
  הַהֽוּא׃
