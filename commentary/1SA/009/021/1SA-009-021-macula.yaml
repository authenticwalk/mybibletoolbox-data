text: 1SA 9:21 וַיַּ֨עַן שָׁא֜וּל וַיֹּ֗אמֶר הֲל֨וֹא בֶן־יְמִינִ֤י אָ֨נֹכִי֙ מִקַּטַנֵּי֙שִׁבְטֵ֣י
