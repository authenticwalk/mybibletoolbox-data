text: 1SA 19:7 וַיִּקְרָ֤א יְהוֹנָתָן֙ לְדָוִ֔ד וַיַּגֶּד־לוֹ֙ יְה֣וֹנָתָ֔ן אֵ֥ת כָּל־הַדְּבָרִ֖ים
