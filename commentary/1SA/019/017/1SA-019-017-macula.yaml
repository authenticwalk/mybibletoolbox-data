text: 1SA 19:17 וַיֹּ֨אמֶר שָׁא֜וּל אֶל־מִיכַ֗ל לָ֤מָּה כָּ֨כָה֙ רִמִּיתִ֔נִי וַתְּשַׁלְּחִ֥י
