text: 1SA 19:5 וַיָּשֶׂם֩ אֶת־נַפְשׁ֨וֹ בְכַפּ֜וֹ וַיַּ֣ךְ אֶת־הַפְּלִשְׁתִּ֗י וַיַּ֨עַשׂ
