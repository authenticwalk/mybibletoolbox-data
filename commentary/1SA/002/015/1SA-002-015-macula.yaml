text: 1SA 2:15 גַּם֮ בְּטֶרֶם֮ יַקְטִר֣וּן אֶת־הַחֵלֶב֒ וּבָ֣א׀נַ֣עַר הַכֹּהֵ֗ן וְאָמַר֙
