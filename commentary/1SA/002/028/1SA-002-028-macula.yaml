text: 1SA 2:28 וּבָחֹ֣ר אֹ֠תוֹ מִכָּל־שִׁבְטֵ֨י יִשְׂרָאֵ֥ל לִי֙ לְכֹהֵ֔ן לַעֲל֣וֹת
