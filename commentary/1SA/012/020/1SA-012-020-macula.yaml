verse: 1SA 12:20
text: 1SA 12:20 וַיֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל־הָעָם֙ אַל־תִּירָ֔אוּ אַתֶּ֣ם עֲשִׂיתֶ֔ם
  אֵ֥ת כָּל־הָרָעָ֖ה הַזֹּ֑את אַ֗ךְ אַל־תָּס֨וּרוּ֙ מֵאַחֲרֵ֣י יְהוָ֔ה וַעֲבַדְתֶּ֥ם
  אֶת־יְהוָ֖ה בְּכָל־לְבַבְכֶֽם׃
