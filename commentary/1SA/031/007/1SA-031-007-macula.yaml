verse: 1SA 31:7
text: 1SA 31:7 וַיִּרְא֣וּ אַנְשֵֽׁי־יִ֠שְׂרָאֵל אֲשֶׁר־בְּעֵ֨בֶר הָעֵ֜מֶק וַאֲשֶׁ֣ר׀בְּעֵ֣בֶר
  הַיַּרְדֵּ֗ן כִּֽי־נָ֨סוּ֙ אַנְשֵׁ֣י יִשְׂרָאֵ֔ל וְכִי־מֵ֖תוּ שָׁא֣וּל וּבָנָ֑יו
  וַיַּעַזְב֤וּ אֶת־הֶֽעָרִים֙ וַיָּנֻ֔סוּ וַיָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַיֵּֽשְׁב֖וּ
  בָּהֶֽן׃ס
