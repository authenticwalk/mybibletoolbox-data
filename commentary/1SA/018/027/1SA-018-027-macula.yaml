text: 1SA 18:27 וַיָּ֨קָם דָּוִ֜ד וַיֵּ֣לֶךְ׀ה֣וּא וַאֲנָשָׁ֗יו וַיַּ֣ךְ בַּפְּלִשְׁתִּים֮
