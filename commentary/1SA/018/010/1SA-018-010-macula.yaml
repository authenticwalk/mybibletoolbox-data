text: 1SA 18:10 וַיְהִ֣י מִֽמָּחֳרָ֗ת וַתִּצְלַ֣ח רוּחַ֩ אֱלֹהִ֨ים׀רָעָ֤ה׀אֶל־שָׁאוּל֙
