text: 1SA 18:21 וַיֹּ֨אמֶר שָׁא֜וּל אֶתְּנֶ֤נָּה לּוֹ֙ וּתְהִי־ל֣וֹ לְמוֹקֵ֔שׁ וּתְהִי־ב֖וֹ
