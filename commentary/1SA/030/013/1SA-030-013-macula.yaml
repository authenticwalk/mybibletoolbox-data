text: 1SA 30:13 וַיֹּ֨אמֶר ל֤וֹ דָוִד֙ לְֽמִי־אַ֔תָּה וְאֵ֥י מִזֶּ֖ה אָ֑תָּה וַיֹּ֜אמֶר
