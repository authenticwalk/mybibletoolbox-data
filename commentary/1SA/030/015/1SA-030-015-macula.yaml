text: 1SA 30:15 וַיֹּ֤אמֶר אֵלָיו֙ דָּוִ֔ד הֲתוֹרִדֵ֖נִי אֶל־הַגְּד֣וּד הַזֶּ֑ה וַיֹּ֡אמֶר
