text: 1SA 30:23 וַיֹּ֣אמֶר דָּוִ֔ד לֹֽא־תַעֲשׂ֥וּ כֵ֖ן אֶחָ֑י אֵ֠ת אֲשֶׁר־נָתַ֨ן יְהוָ֥ה
