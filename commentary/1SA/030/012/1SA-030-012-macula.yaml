text: 1SA 30:12 וַיִּתְּנוּ־לוֹ֩ פֶ֨לַח דְּבֵלָ֜ה וּשְׁנֵ֤י צִמֻּקִים֙ וַיֹּ֔אכַל
  וַתָּ֥שָׁב רוּח֖וֹ אֵלָ֑יו כִּ֠י לֹֽא־אָ֤כַל לֶ֨חֶם֙ וְלֹא־שָׁ֣תָה מַ֔יִם שְׁלֹשָׁ֥ה
  יָמִ֖ים וּשְׁלֹשָׁ֥ה לֵילֽוֹת׃ס
