text: 1SA 4:19 וְכַלָּת֣וֹ אֵֽשֶׁת־פִּינְחָס֮ הָרָ֣ה לָלַת֒ וַתִּשְׁמַ֣ע אֶת־הַשְּׁמֻעָ֔ה
