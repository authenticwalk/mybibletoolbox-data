text: 1SA 4:18 וַיְהִ֞י כְּהַזְכִּיר֣וֹ׀אֶת־אֲר֣וֹן הָאֱלֹהִ֗ים וַיִּפֹּ֣ל מֵֽעַל־הַ֠כִּסֵּא
  אֲחֹ֨רַנִּ֜ית בְּעַ֣ד׀יַ֣ד הַשַּׁ֗עַר וַתִּשָּׁבֵ֤ר מַפְרַקְתּוֹ֙ וַיָּמֹ֔ת כִּֽי־זָקֵ֥ן
  הָאִ֖ישׁ וְכָבֵ֑ד וְה֛וּא שָׁפַ֥ט אֶת־יִשְׂרָאֵ֖ל אַרְבָּעִ֥ים שָׁנָֽה׃
