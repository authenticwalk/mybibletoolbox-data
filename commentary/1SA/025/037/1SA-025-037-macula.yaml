text: 1SA 25:37 וַיְהִ֣י בַבֹּ֗קֶר בְּצֵ֤את הַיַּ֨יִן֙ מִנָּבָ֔ל וַתַּגֶּד־ל֣וֹ אִשְׁתּ֔וֹ
