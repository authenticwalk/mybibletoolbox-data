text: 1SA 25:36 וַתָּבֹ֣א אֲבִיגַ֣יִל׀אֶל־נָבָ֡ל וְהִנֵּה־לוֹ֩ מִשְׁתֶּ֨ה בְּבֵית֜וֹ
