text: 1SA 25:28 שָׂ֥א נָ֖א לְפֶ֣שַׁע אֲמָתֶ֑ךָ כִּ֣י עָשֹֽׂה־יַעֲשֶׂה֩ יְהוָ֨ה לַֽאדֹנִ֜י
  בַּ֣יִת נֶאֱמָ֗ן כִּי־מִלְחֲמ֤וֹת יְהוָה֙ אֲדֹנִ֣י נִלְחָ֔ם וְרָעָ֛ה לֹא־תִמָּצֵ֥א
  בְךָ֖ מִיָּמֶֽיךָ׃
