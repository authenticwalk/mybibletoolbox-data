text: 1SA 25:34 וְאוּלָ֗ם חַי־יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר מְנָעַ֔נִי מֵהָרַ֖ע
  אֹתָ֑ךְ כִּ֣י׀לוּלֵ֣י מִהַ֗רְתְּ וַתָּבֹאת֙ לִקְרָאתִ֔י כִּ֣י אִם־נוֹתַ֧ר לְנָבָ֛ל
  עַד־א֥וֹר הַבֹּ֖קֶר מַשְׁתִּ֥ין בְּקִֽיר׃
