verse: 1SA 25:18
text: 1SA 25:18 וַתְּמַהֵ֣ר אֲבִיגַ֡יִל וַתִּקַּח֩ מָאתַ֨יִם לֶ֜חֶם וּשְׁנַ֣יִם נִבְלֵי־יַ֗יִן
  וְחָמֵ֨שׁ צֹ֤אן עֲשׂוּיֹת֙וְחָמֵ֤שׁ סְאִים֙ קָלִ֔י וּמֵאָ֥ה צִמֻּקִ֖ים וּמָאתַ֣יִם
  דְּבֵלִ֑ים וַתָּ֖שֶׂם עַל־הַחֲמֹרִֽים׃
