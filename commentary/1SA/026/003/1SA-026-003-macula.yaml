text: 1SA 26:3 וַיִּ֨חַן שָׁא֜וּל בְּגִבְעַ֣ת הַחֲכִילָ֗ה אֲשֶׁ֛ר עַל־פְּנֵ֥י הַיְשִׁימֹ֖ן
