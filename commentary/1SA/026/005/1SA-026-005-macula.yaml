text: 1SA 26:5 וַיָּ֣קָם דָּוִ֗ד וַיָּבֹא֮ אֶֽל־הַמָּקוֹם֮ אֲשֶׁ֣ר חָנָה־שָׁ֣ם שָׁאוּל֒
  וַיַּ֣רְא דָּוִ֗ד אֶת־הַמָּקוֹם֙ אֲשֶׁ֣ר שָֽׁכַב־שָׁ֣ם שָׁא֔וּל וְאַבְנֵ֥ר בֶּן־נֵ֖ר
