text: 1SA 26:15 וַיֹּאמֶר֩ דָּוִ֨ד אֶל־אַבְנֵ֜ר הֲלוֹא־אִ֣ישׁ אַתָּ֗ה וּמִ֤י כָמ֨וֹךָ֙
  בְּיִשְׂרָאֵ֔ל וְלָ֨מָּה֙ לֹ֣א שָׁמַ֔רְתָּ אֶל־אֲדֹנֶ֖יךָ הַמֶּ֑לֶךְ כִּי־בָא֙ אַחַ֣ד
  הָעָ֔ם לְהַשְׁחִ֖ית אֶת־הַמֶּ֥לֶךְ אֲדֹנֶֽיךָ׃
