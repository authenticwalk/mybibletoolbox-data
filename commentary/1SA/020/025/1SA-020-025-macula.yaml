text: 1SA 20:25 וַיֵּ֣שֶׁב הַ֠מֶּלֶךְ עַל־מ֨וֹשָׁב֜וֹ כְּפַ֣עַם׀בְּפַ֗עַם אֶל־מוֹשַׁב֙
  הַקִּ֔יר וַיָּ֨קָם֙ יְה֣וֹנָתָ֔ן וַיֵּ֥שֶׁב אַבְנֵ֖ר מִצַּ֣ד שָׁא֑וּל וַיִּפָּקֵ֖ד
  מְק֥וֹם דָּוִֽד׃
