text: 1SA 20:2 וַיֹּ֨אמֶר ל֣וֹ חָלִילָה֮ לֹ֣א תָמוּת֒ הִנֵּ֡ה לֹֽא־יַעֲשֶׂ֨ה אָבִ֜י
