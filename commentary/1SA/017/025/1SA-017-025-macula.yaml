verse: 1SA 17:25
text: 1SA 17:25 וַיֹּ֣אמֶר׀אִ֣ישׁ יִשְׂרָאֵ֗ל הַרְּאִיתֶם֙ הָאִ֤ישׁ הָֽעֹלֶה֙ הַזֶּ֔ה
  כִּ֛י לְחָרֵ֥ף אֶת־יִשְׂרָאֵ֖ל עֹלֶ֑ה וְֽ֠הָיָה הָאִ֨ישׁ אֲשֶׁר־יַכֶּ֜נּוּ יַעְשְׁרֶ֥נּוּ
  הַמֶּ֣לֶךְ׀עֹ֣שֶׁר גָּד֗וֹל וְאֶת־בִּתּוֹ֙ יִתֶּן־ל֔וֹ וְאֵת֙ בֵּ֣ית אָבִ֔יו יַעֲשֶׂ֥ה
  חָפְשִׁ֖י בְּיִשְׂרָאֵֽל׃
