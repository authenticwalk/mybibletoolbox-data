text: 1SA 6:5 וַעֲשִׂיתֶם֩ צַלְמֵ֨י טְחֹרֵיכֶ֜ם וְצַלְמֵ֣י עַכְבְּרֵיכֶ֗ם הַמַּשְׁחִיתִם֙
