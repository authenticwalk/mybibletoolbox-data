text: 1SA 22:15 הַיּ֧וֹם הַחִלֹּ֛תִי לִשְׁאָל־ל֥וֹ בֵאלֹהִ֖ים חָלִ֣ילָה לִּ֑י אַל־יָשֵׂם֩
  הַמֶּ֨לֶךְ בְּעַבְדּ֤וֹ דָבָר֙ בְּכָל־בֵּ֣ית אָבִ֔י כִּ֠י לֹֽא־יָדַ֤ע עַבְדְּךָ֙
  בְּכָל־זֹ֔את דָּבָ֥ר קָטֹ֖ן א֥וֹ גָדֽוֹל׃
