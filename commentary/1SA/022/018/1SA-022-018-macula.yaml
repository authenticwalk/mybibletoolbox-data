text: 1SA 22:18 וַיֹּ֤אמֶר הַמֶּ֨לֶךְ֙ לְדוֹאֵ֔ג סֹ֣ב אַתָּ֔ה וּפְגַ֖ע בַּכֹּהֲנִ֑ים
