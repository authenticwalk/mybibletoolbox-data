text: 1SA 22:17 וַיֹּ֣אמֶר הַמֶּ֡לֶךְ לָרָצִים֩ הַנִּצָּבִ֨ים עָלָ֜יו סֹ֥בּוּ וְהָמִ֣יתוּ׀כֹּהֲנֵ֣י
  יְהוָ֗ה כִּ֤י גַם־יָדָם֙ עִם־דָּוִ֔ד וְכִ֤י יָֽדְעוּ֙ כִּֽי־בֹרֵ֣חַ ה֔וּא וְלֹ֥א
  גָל֖וּ אֶת־אָזְנִ֑י וְלֹֽא־אָב֞וּ עַבְדֵ֤י הַמֶּ֨לֶךְ֙ לִשְׁלֹ֣חַ אֶת־יָדָ֔ם לִפְגֹ֖עַ
  בְּכֹהֲנֵ֥י יְהוָֽה׃ס
