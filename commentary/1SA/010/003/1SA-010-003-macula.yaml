text: 1SA 10:3 וְחָלַפְתָּ֨ מִשָּׁ֜ם וָהָ֗לְאָה וּבָ֨אתָ֙ עַד־אֵל֣וֹן תָּב֔וֹר וּמְצָא֤וּךָ
  שָּׁם֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים עֹלִ֥ים אֶל־הָאֱלֹהִ֖ים בֵּֽית־אֵ֑ל אֶחָ֞ד נֹשֵׂ֣א׀שְׁלֹשָׁ֣ה
