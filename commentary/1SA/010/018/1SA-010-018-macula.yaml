text: 1SA 10:18 וַיֹּ֣אמֶר׀אֶל־בְּנֵ֣י יִשְׂרָאֵ֗לפכֹּֽה־אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל
