text: 1SA 21:9 וַיֹּ֤אמֶר דָּוִד֙ לַאֲחִימֶ֔לֶךְ וְאִ֛ין יֶשׁ־פֹּ֥ה תַֽחַת־יָדְךָ֖
  חֲנִ֣ית אוֹ־חָ֑רֶב כִּ֣י גַם־חַרְבִּ֤י וְגַם־כֵּלַי֙ לֹֽא־לָקַ֣חְתִּי בְיָדִ֔י כִּֽי־הָיָ֥ה
  דְבַר־הַמֶּ֖לֶךְ נָחֽוּץ׃ס
