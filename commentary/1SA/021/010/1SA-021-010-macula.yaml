text: 1SA 21:10 וַיֹּ֣אמֶר הַכֹּהֵ֗ן חֶרֶב֩ גָּלְיָ֨ת הַפְּלִשְׁתִּ֜י אֲשֶׁר־הִכִּ֣יתָ׀בְּעֵ֣מֶק
  הָאֵלָ֗ה הִנֵּה־הִ֞יא לוּטָ֣ה בַשִּׂמְלָה֮ אַחֲרֵ֣י הָאֵפוֹד֒ אִם־אֹתָ֤הּ תִּֽקַּח־לְךָ֙
