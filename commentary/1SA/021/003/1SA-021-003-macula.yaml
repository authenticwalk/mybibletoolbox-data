verse: 1SA 21:3
text: 1SA 21:3 וַיֹּ֨אמֶר דָּוִ֜ד לַאֲחִימֶ֣לֶךְ הַכֹּהֵ֗ן הַמֶּלֶךְ֮ צִוַּ֣נִי דָבָר֒
  וַיֹּ֣אמֶר אֵלַ֗י אִ֣ישׁ אַל־יֵ֧דַע מְא֛וּמָה אֶת־הַדָּבָ֛ר אֲשֶׁר־אָנֹכִ֥י שֹׁלֵֽחֲךָ֖
  וַאֲשֶׁ֣ר צִוִּיתִ֑ךָ וְאֶת־הַנְּעָרִ֣ים יוֹדַ֔עְתִּי אֶל־מְק֥וֹם פְּלֹנִ֖י אַלְמוֹנִֽי׃
