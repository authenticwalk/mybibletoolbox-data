verse: 1SA 29:6
text: 1SA 29:6 וַיִּקְרָ֨א אָכִ֜ישׁ אֶל־דָּוִ֗ד וַיֹּ֣אמֶר אֵ֠לָיו חַי־יְהוָ֞ה כִּי־יָשָׁ֣ר
  אַתָּ֗ה וְט֣וֹב בְּ֠עֵינַי צֵאתְךָ֨וּבֹאֲךָ֤ אִתִּי֙ בַּֽמַּחֲנֶ֔ה כִּ֠י לֹֽא־מָצָ֤אתִֽי
  בְךָ֙ רָעָ֔ה מִיּ֛וֹם בֹּאֲךָ֥ אֵלַ֖י עַד־הַיּ֣וֹם הַזֶּ֑ה וּבְעֵינֵ֥י הַסְּרָנִ֖ים
  לֹֽא־ט֥וֹב אָֽתָּה׃
