text: 1SA 29:9 וַיַּ֣עַן אָכִישׁ֮ וַיֹּ֣אמֶר אֶל־דָּוִד֒ יָדַ֕עְתִּי כִּ֣י ט֥וֹב אַתָּ֛ה
