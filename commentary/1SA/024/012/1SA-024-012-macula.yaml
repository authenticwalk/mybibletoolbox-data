verse: 1SA 24:12
text: 1SA 24:12 וְאָבִ֣י רְאֵ֔ה גַּ֗ם רְאֵ֛ה אֶת־כְּנַ֥ף מְעִילְךָ֖ בְּיָדִ֑י כִּ֡י
  בְּכָרְתִי֩ אֶת־כְּנַ֨ף מְעִֽילְךָ֜ וְלֹ֣א הֲרַגְתִּ֗יךָ דַּ֤ע וּרְאֵה֙ כִּי֩ אֵ֨ין
  בְּיָדִ֜י רָעָ֤ה וָפֶ֨שַׁע֙ וְלֹא־חָטָ֣אתִי לָ֔ךְ וְאַתָּ֛ה צֹדֶ֥ה אֶת־נַפְשִׁ֖י
  לְקַחְתָּֽהּ׃
