text: 1SA 14:6 וַיֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל־הַנַּ֣עַר׀נֹשֵׂ֣א כֵלָ֗יו לְכָה֙ וְנַעְבְּרָ֗ה
