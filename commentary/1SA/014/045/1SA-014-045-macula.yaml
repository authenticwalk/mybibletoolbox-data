verse: 1SA 14:45
text: 1SA 14:45 וַיֹּ֨אמֶר הָעָ֜ם אֶל־שָׁא֗וּל הֲֽיוֹנָתָ֤ן׀יָמוּת֙ אֲשֶׁ֣ר עָ֠שָׂה
  הַיְשׁוּעָ֨ה הַגְּדוֹלָ֣ה הַזֹּאת֮ בְּיִשְׂרָאֵל֒ חָלִ֗ילָה חַי־יְהוָה֙ אִם־יִפֹּ֞ל
  מִשַּׂעֲרַ֤ת רֹאשׁוֹ֙ אַ֔רְצָה כִּֽי־עִם־אֱלֹהִ֥ים עָשָׂ֖ה הַיּ֣וֹם הַזֶּ֑ה וַיִּפְדּ֥וּ
  הָעָ֛ם אֶת־יוֹנָתָ֖ן וְלֹא־מֵֽת׃ס
