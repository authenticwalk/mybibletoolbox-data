text: 1SA 14:43 וַיֹּ֤אמֶר שָׁאוּל֙ אֶל־י֣וֹנָתָ֔ן הַגִּ֥ידָה לִּ֖י מֶ֣ה עָשִׂ֑יתָה
  וַיַּגֶּד־ל֣וֹ יוֹנָתָ֗ן וַיֹּאמֶר֩ טָעֹ֨ם טָעַ֜מְתִּי בִּקְצֵ֨ה הַמַּטֶּ֧ה אֲשֶׁר־בְּיָדִ֛י
  מְעַ֥ט דְּבַ֖שׁ הִנְנִ֥י אָמֽוּת׃
