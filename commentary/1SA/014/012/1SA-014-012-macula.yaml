text: 1SA 14:12 וַיַּעֲנוּ֩ אַנְשֵׁ֨י הַמַּצָּבָ֜ה אֶת־יוֹנָתָ֣ן׀וְאֶת־נֹשֵׂ֣א כֵלָ֗יו
