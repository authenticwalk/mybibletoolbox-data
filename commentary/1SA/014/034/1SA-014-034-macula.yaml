verse: 1SA 14:34
text: 1SA 14:34 וַיֹּ֣אמֶר שָׁא֣וּל פֻּ֣צוּ בָעָ֡ם וַאֲמַרְתֶּ֣ם לָהֶ֡ם הַגִּ֣ישׁוּ
  אֵלַי֩ אִ֨ישׁ שׁוֹר֜וֹ וְאִ֣ישׁ שְׂיֵ֗הוּ וּשְׁחַטְתֶּ֤ם בָּזֶה֙ וַאֲכַלְתֶּ֔ם וְלֹֽא־תֶחֶטְא֥וּ
  לַֽיהוָ֖ה לֶאֱכֹ֣ל אֶל־הַדָּ֑ם וַיַּגִּ֨שׁוּ כָל־הָעָ֜ם אִ֣ישׁ שׁוֹר֧וֹ בְיָד֛וֹ
  הַלַּ֖יְלָה וַיִּשְׁחֲטוּ־שָֽׁם׃
