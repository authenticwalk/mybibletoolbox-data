text: 1SA 14:47 וְשָׁא֛וּל לָכַ֥ד הַמְּלוּכָ֖ה עַל־יִשְׂרָאֵ֑ל וַיִּלָּ֣חֶם סָבִ֣יב׀בְּֽכָל־אֹיְבָ֡יו
