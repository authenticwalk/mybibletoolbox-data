text: 1SA 14:27 וְיוֹנָתָ֣ן לֹֽא־שָׁמַ֗ע בְּהַשְׁבִּ֣יעַ אָבִיו֮ אֶת־הָעָם֒ וַיִּשְׁלַ֗ח
  אֶת־קְצֵ֤ה הַמַּטֶּה֙ אֲשֶׁ֣ר בְּיָד֔וֹ וַיִּטְבֹּ֥ל אוֹתָ֖הּ בְּיַעְרַ֣ת הַדְּבָ֑שׁ
  וַיָּ֤שֶׁב יָדוֹ֙ אֶל־פִּ֔יו וַתָּאֹ֖רְנָה עֵינָֽיו׃
