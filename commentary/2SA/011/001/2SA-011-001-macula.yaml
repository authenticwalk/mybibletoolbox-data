text: 2SA 11:1 וַיְהִי֩ לִתְשׁוּבַ֨ת הַשָּׁנָ֜ה לְעֵ֣ת׀צֵ֣את הַמַּלְאֿכִ֗יםוַיִּשְׁלַ֣ח
