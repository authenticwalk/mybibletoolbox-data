verse: 2SA 3:8
text: 2SA 3:8 וַיִּחַר֩ לְאַבְנֵ֨ר מְאֹ֜ד עַל־דִּבְרֵ֣י אִֽישׁ־בֹּ֗שֶׁת וַיֹּ֨אמֶר֙
  הֲרֹ֨אשׁ כֶּ֥לֶב אָנֹ֘כִי֮ אֲשֶׁ֣ר לִֽיהוּדָה֒ הַיּ֨וֹם אֶֽעֱשֶׂה־חֶ֜סֶד עִם־בֵּ֣ית׀שָׁא֣וּל
  אָבִ֗יךָ אֶל־אֶחָיו֙ וְאֶל־מֵ֣רֵעֵ֔הוּ וְלֹ֥א הִמְצִיתִ֖ךָ בְּיַד־דָּוִ֑ד וַתִּפְקֹ֥ד
  עָלַ֛י עֲוֺ֥ן הָאִשָּׁ֖ה הַיּֽוֹם׃
