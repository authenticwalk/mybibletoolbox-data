verse: 2SA 14:19
text: 2SA 14:19 וַיֹּ֣אמֶר הַמֶּ֔לֶךְ הֲיַ֥ד יוֹאָ֛ב אִתָּ֖ךְ בְּכָל־זֹ֑את וַתַּ֣עַן
  הָאִשָּׁ֣ה וַתֹּ֡אמֶר חֵֽי־נַפְשְׁךָ֩ אֲדֹנִ֨י הַמֶּ֜לֶךְ אִם־אִ֣שׁ׀לְהֵמִ֣ין וּלְהַשְׂמִ֗יל
  מִכֹּ֤ל אֲשֶׁר־דִּבֶּר֙ אֲדֹנִ֣י הַמֶּ֔לֶךְ כִּֽי־עַבְדְּךָ֤ יוֹאָב֙ ה֣וּא צִוָּ֔נִי
  וְה֗וּא שָׂ֚ם בְּפִ֣י שִׁפְחָֽתְךָ֔ אֵ֥ת כָּל־הַדְּבָרִ֖ים הָאֵֽלֶּה׃
