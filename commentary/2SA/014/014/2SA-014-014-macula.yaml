text: 2SA 14:14 כִּי־מ֣וֹת נָמ֔וּת וְכַמַּ֨יִם֙ הַנִּגָּרִ֣ים אַ֔רְצָה אֲשֶׁ֖ר לֹ֣א
  יֵאָסֵ֑פוּ וְלֹֽא־יִשָּׂ֤א אֱלֹהִים֙ נֶ֔פֶשׁ וְחָשַׁב֙ מַֽחֲשָׁב֔וֹת לְבִלְתִּ֛י
  יִדַּ֥ח מִמֶּ֖נּוּ נִדָּֽח׃
