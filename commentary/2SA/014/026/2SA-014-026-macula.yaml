text: 2SA 14:26 וּֽבְגַלְּחוֹ֮ אֶת־רֹאשׁוֹ֒ וְֽ֠הָיָה מִקֵּ֨ץיָמִ֤ים׀לַיָּמִים֙ אֲשֶׁ֣ר
