text: 2SA 14:18 וַיַּ֣עַן הַמֶּ֗לֶךְ וַיֹּ֨אמֶר֙ אֶל־הָ֣אִשָּׁ֔ה אַל־נָ֨א תְכַחֲדִ֤י
