text: 2SA 20:22 וַתָּבוֹא֩ הָאִשָּׁ֨ה אֶל־כָּל־הָעָ֜ם בְּחָכְמָתָ֗הּ וַֽיִּכְרְת֞וּ
  אֶת־רֹ֨אשׁ שֶׁ֤בַע בֶּן־בִּכְרִי֙ וַיַּשְׁלִ֣כוּ אֶל־יוֹאָ֔ב וַיִּתְקַע֙ בַּשּׁוֹפָ֔ר
  וַיָּפֻ֥צוּ מֵֽעַל־הָעִ֖יר אִ֣ישׁ לְאֹהָלָ֑יו וְיוֹאָ֛ב שָׁ֥ב יְרוּשָׁלִַ֖ם אֶל־הַמֶּֽלֶךְ׃ס
