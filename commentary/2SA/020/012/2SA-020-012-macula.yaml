text: 2SA 20:12 וַעֲמָשָׂ֛א מִתְגֹּלֵ֥ל בַּדָּ֖ם בְּת֣וֹךְ הַֽמְסִּלָּ֑הוַיַּ֨רְא
  הָאִ֜ישׁ כִּֽי־עָמַ֣ד כָּל־הָעָ֗ם וַיַּסֵּב֩ אֶת־עֲמָשָׂ֨א מִן־הַֽמְסִלָּ֤ה הַשָּׂדֶה֙
  וַיַּשְׁלֵ֤ךְ עָלָיו֙ בֶּ֔גֶד כַּאֲשֶׁ֣ר רָאָ֔ה כָּל־הַבָּ֥א עָלָ֖יו וְעָמָֽד׃
