text: 2SA 20:10 וַעֲמָשָׂ֨א לֹֽא־נִשְׁמַ֜ר בַּחֶ֣רֶב׀אֲשֶׁ֣ר בְּיַד־יוֹאָ֗ב וַיַּכֵּהוּ֩
  בָ֨הּ אֶל־הַחֹ֜מֶשׁ וַיִּשְׁפֹּ֨ךְ מֵעָ֥יו אַ֛רְצָה וְלֹא־שָׁ֥נָה ל֖וֹ וַיָּמֹ֑תסוְיוֹאָב֙
  וַאֲבִישַׁ֣י אָחִ֔יו רָדַ֕ף אַחֲרֵ֖י שֶׁ֥בַע בֶּן־בִּכְרִֽי׃
