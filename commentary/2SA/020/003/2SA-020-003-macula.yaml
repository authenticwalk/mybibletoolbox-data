verse: 2SA 20:3
text: 2SA 20:3 וַיָּבֹ֨א דָוִ֣ד אֶל־בֵּיתוֹ֮ יְרֽוּשָׁלִַם֒ וַיִּקַּ֣ח הַמֶּ֡לֶךְ
  אֵ֣ת עֶֽשֶׂר־נָשִׁ֣ים׀פִּלַגְשִׁ֡ים אֲשֶׁ֣ר הִנִּיחַ֩ לִשְׁמֹ֨ר הַבַּ֜יִת וַֽיִּתְּנֵ֤ם
  בֵּית־מִשְׁמֶ֨רֶת֙ וַֽיְכַלְכְּלֵ֔ם וַאֲלֵיהֶ֖ם לֹא־בָ֑א וַתִּהְיֶ֧ינָה צְרֻר֛וֹת
  עַד־י֥וֹם מֻתָ֖ן אַלְמְנ֥וּת חַיּֽוּת׃ס
