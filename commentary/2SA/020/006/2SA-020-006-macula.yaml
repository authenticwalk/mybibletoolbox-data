text: 2SA 20:6 וַיֹּ֤אמֶר דָּוִד֙ אֶל־אֲבִישַׁ֔י עַתָּ֗ה יֵ֧רַֽע לָ֛נוּ שֶׁ֥בַע בֶּן־בִּכְרִ֖י
  מִן־אַבְשָׁל֑וֹם אַ֠תָּה קַ֞ח אֶת־עַבְדֵ֤י אֲדֹנֶ֨יךָ֙ וּרְדֹ֣ף אַחֲרָ֔יו פֶּן־מָ֥צָא
  ל֛וֹ עָרִ֥ים בְּצֻר֖וֹת וְהִצִּ֥יל עֵינֵֽנוּ׃
