text: 2SA 21:4 וַיֹּ֧אמְרוּ ל֣וֹ הַגִּבְעֹנִ֗ים אֵֽין־לָ֜נוּ כֶּ֤סֶף וְזָהָב֙ עִם־שָׁא֣וּל
