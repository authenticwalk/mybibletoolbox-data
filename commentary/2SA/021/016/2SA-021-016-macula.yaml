text: 2SA 21:16 וְיִשְׁבִּ֨י בְּנֹ֜ב אֲשֶׁ֣ר׀בִּילִידֵ֣י הָרָפָ֗ה וּמִשְׁקַ֤ל קֵינוֹ֙
