text: 2SA 17:14 וַיֹּ֤אמֶר אַבְשָׁלוֹם֙ וְכָל־אִ֣ישׁ יִשְׂרָאֵ֔ל טוֹבָ֗ה עֲצַת֙ חוּשַׁ֣י
