text: 2SA 17:12 וּבָ֣אנוּ אֵלָ֗יו בְּאַחַ֤ד הַמְּקוֹמֹת֙ אֲשֶׁ֣ר נִמְצָ֣א שָׁ֔ם וְנַ֣חְנוּ
