text: 2SA 17:15 וַיֹּ֣אמֶר חוּשַׁ֗י אֶל־צָד֤וֹק וְאֶל־אֶבְיָתָר֙ הַכֹּ֣הֲנִ֔ים כָּזֹ֣את
  וְכָזֹ֗את יָעַ֤ץ אֲחִיתֹ֨פֶל֙ אֶת־אַבְשָׁלֹ֔ם וְאֵ֖ת זִקְנֵ֣י יִשְׂרָאֵ֑ל וְכָזֹ֥את
  וְכָזֹ֖את יָעַ֥צְתִּי אָֽנִי׃
