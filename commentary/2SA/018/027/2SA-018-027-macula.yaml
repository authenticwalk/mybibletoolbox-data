text: 2SA 18:27 וַיֹּ֨אמֶר֙ הַצֹּפֶ֔ה אֲנִ֤י רֹאֶה֙ אֶת־מְרוּצַ֣ת הָרִאשׁ֔וֹן כִּמְרֻצַ֖ת
