text: 2SA 18:29 וַיֹּ֣אמֶר הַמֶּ֔לֶךְ שָׁל֥וֹם לַנַּ֖עַר לְאַבְשָׁל֑וֹם וַיֹּ֣אמֶר
  אֲחִימַ֡עַץ רָאִיתִי֩ הֶהָמ֨וֹן הַגָּד֜וֹל לִ֠שְׁלֹחַ אֶת־עֶ֨בֶד הַמֶּ֤לֶךְ יוֹאָב֙
  וְאֶת־עַבְדֶּ֔ךָ וְלֹ֥א יָדַ֖עְתִּי מָֽה׃
