text: 2SA 18:32 וַיֹּ֤אמֶר הַמֶּ֨לֶךְ֙ אֶל־הַכּוּשִׁ֔י הֲשָׁל֥וֹם לַנַּ֖עַר לְאַבְשָׁל֑וֹם
