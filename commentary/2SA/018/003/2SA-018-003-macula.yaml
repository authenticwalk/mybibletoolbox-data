text: 2SA 18:3 וַיֹּ֨אמֶר הָעָ֜ם לֹ֣א תֵצֵ֗א כִּי֩ אִם־נֹ֨ס נָנ֜וּס לֹא־יָשִׂ֧ימוּ
  אֵלֵ֣ינוּ לֵ֗ב וְאִם־יָמֻ֤תוּ חֶצְיֵ֨נוּ֙ לֹֽא־יָשִׂ֤ימוּ אֵלֵ֨ינוּ֙ לֵ֔ב כִּֽי־עַתָּ֥ה
  כָמֹ֖נוּ עֲשָׂרָ֣ה אֲלָפִ֑ים וְעַתָּ֣ה ט֔וֹב כִּי־תִֽהְיֶה־לָּ֥נוּ מֵעִ֖יר לַעְזֽוֹר׃ס
