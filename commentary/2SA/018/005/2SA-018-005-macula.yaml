text: 2SA 18:5 וַיְצַ֣ו הַמֶּ֡לֶךְ אֶת־י֠וֹאָב וְאֶת־אֲבִישַׁ֤י וְאֶת־אִתַּי֙ לֵאמֹ֔ר
