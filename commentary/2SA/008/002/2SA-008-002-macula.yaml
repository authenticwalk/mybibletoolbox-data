text: 2SA 8:2 וַיַּ֣ךְ אֶת־מוֹאָ֗ב וַֽיְמַדְּדֵ֤ם בַּחֶ֨בֶל֙ הַשְׁכֵּ֣ב אוֹתָ֣ם אַ֔רְצָה
