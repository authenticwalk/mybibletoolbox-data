verse: 2SA 8:10
text: 2SA 8:10 וַיִּשְׁלַ֣ח תֹּ֣עִי אֶת־יֽוֹרָם־בְּנ֣וֹ אֶל־הַמֶּֽלֶךְ־דָּ֠וִד לִשְׁאָל־ל֨וֹ
  לְשָׁל֜וֹם וּֽלְבָרֲכ֗וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּהֲדַדְעֶ֨זֶר֙ וַיַּכֵּ֔הוּ כִּי־אִ֛ישׁ
  מִלְחֲמ֥וֹת תֹּ֖עִי הָיָ֣ה הֲדַדְעָ֑זֶר וּבְיָד֗וֹ הָי֛וּ כְּלֵֽי־כֶ֥סֶף וּכְלֵֽי־זָהָ֖ב
  וּכְלֵ֥י נְחֹֽשֶׁת׃
