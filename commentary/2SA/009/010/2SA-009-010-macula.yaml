verse: 2SA 9:10
text: 2SA 9:10 וְעָבַ֣דְתָּ לּ֣וֹ אֶֽת־הָאֲדָמָ֡ה אַתָּה֩ וּבָנֶ֨יךָ וַעֲבָדֶ֜יךָ
  וְהֵבֵ֗אתָ וְהָיָ֨ה לְבֶן־אֲדֹנֶ֤יךָ לֶּ֨חֶם֙ וַאֲכָל֔וֹ וּמְפִיבֹ֨שֶׁת֙ בֶּן־אֲדֹנֶ֔יךָ
  יֹאכַ֥ל תָּמִ֛יד לֶ֖חֶם עַל־שֻׁלְחָנִ֑י וּלְצִיבָ֗א חֲמִשָּׁ֥ה עָשָׂ֛ר בָּנִ֖ים
  וְעֶשְׂרִ֥ים עֲבָדִֽים׃
