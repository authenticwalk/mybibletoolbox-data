text: 2SA 9:7 וַיֹּאמֶר֩ ל֨וֹ דָוִ֜ד אַל־תִּירָ֗א כִּ֣י עָשֹׂה֩ אֶעֱשֶׂ֨ה עִמְּךָ֥
