text: 2SA 5:3 וַ֠יָּבֹאוּ כָּל־זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל־הַמֶּ֨לֶךְ֙ חֶבְר֔וֹנָה וַיִּכְרֹ֣ת
