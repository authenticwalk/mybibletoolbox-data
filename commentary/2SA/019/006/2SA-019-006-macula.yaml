text: 2SA 19:6 וַיָּבֹ֥א יוֹאָ֛ב אֶל־הַמֶּ֖לֶךְ הַבָּ֑יִת וַיֹּאמֶר֩ הֹבַ֨שְׁתָּ הַיּ֜וֹם
