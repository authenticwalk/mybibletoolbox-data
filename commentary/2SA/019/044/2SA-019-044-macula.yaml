text: 2SA 19:44 וַיַּ֣עַן אִֽישׁ־יִשְׂרָאֵל֩ אֶת־אִ֨ישׁ יְהוּדָ֜ה וַיֹּ֗אמֶר עֶֽשֶׂר־יָד֨וֹת
  לִ֣י בַמֶּלֶךְ֮ וְגַם־בְּדָוִד֮ אֲנִ֣י מִמְּךָ֒ וּמַדּ֨וּעַ֙ הֱקִלֹּתַ֔נִי וְלֹא־הָיָ֨ה
  דְבָרִ֥י רִאשׁ֛וֹן לִ֖י לְהָשִׁ֣יב אֶת־מַלְכִּ֑י וַיִּ֨קֶשׁ֙ דְּבַר־אִ֣ישׁ יְהוּדָ֔ה
  מִדְּבַ֖ר אִ֥ישׁ יִשְׂרָאֵֽל׃ס
