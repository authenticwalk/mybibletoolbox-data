text: 2SA 19:25 וּמְפִבֹ֨שֶׁת֙ בֶּן־שָׁא֔וּל יָרַ֖ד לִקְרַ֣את הַמֶּ֑לֶךְ וְלֹא־עָשָׂ֨ה
  רַגְלָ֜יו וְלֹא־עָשָׂ֣ה שְׂפָמ֗וֹ וְאֶת־בְּגָדָיו֙ לֹ֣א כִבֵּ֔ס לְמִן־הַיּוֹם֙ לֶ֣כֶת
  הַמֶּ֔לֶךְ עַד־הַיּ֖וֹם אֲשֶׁר־בָּ֥א בְשָׁלֽוֹם׃
