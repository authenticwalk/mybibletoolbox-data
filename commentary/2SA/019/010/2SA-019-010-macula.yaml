text: 2SA 19:10 וַיְהִ֤י כָל־הָעָם֙ נָד֔וֹן בְּכָל־שִׁבְטֵ֥י יִשְׂרָאֵ֖ל לֵאמֹ֑ר הַמֶּ֜לֶךְ
