text: 2SA 19:38 יָֽשָׁב־נָ֤א עַבְדְּךָ֙ וְאָמֻ֣ת בְּעִירִ֔י עִ֛ם קֶ֥בֶר אָבִ֖י וְאִמִּ֑י
  וְהִנֵּ֣ה׀עַבְדְּךָ֣ כִמְהָ֗ם יַֽעֲבֹר֙ עִם־אֲדֹנִ֣י הַמֶּ֔לֶךְ וַעֲשֵׂה־ל֕וֹ אֵ֥ת
  אֲשֶׁר־ט֖וֹב בְּעֵינֶֽיךָ׃ס
