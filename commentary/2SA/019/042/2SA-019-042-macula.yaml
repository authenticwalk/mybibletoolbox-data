text: 2SA 19:42 וְהִנֵּ֛ה כָּל־אִ֥ישׁ יִשְׂרָאֵ֖ל בָּאִ֣ים אֶל־הַמֶּ֑לֶךְ וַיֹּאמְר֣וּ
  אֶל־הַמֶּ֡לֶךְ מַדּוּעַ֩ גְּנָב֨וּךָ אַחֵ֜ינוּ אִ֣ישׁ יְהוּדָ֗ה וַיַּעֲבִ֨רוּ אֶת־הַמֶּ֤לֶךְ
  וְאֶת־בֵּיתוֹ֙ אֶת־הַיַּרְדֵּ֔ן וְכָל־אַנְשֵׁ֥י דָוִ֖ד עִמּֽוֹ׃ס
