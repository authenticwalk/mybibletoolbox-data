text: 2SA 19:29 כִּי֩ לֹ֨א הָיָ֜ה כָּל־בֵּ֣ית אָבִ֗י כִּ֤י אִם־אַנְשֵׁי־מָ֨וֶת֙ לַאדֹנִ֣י
  הַמֶּ֔לֶךְ וַתָּ֨שֶׁת֙ אֶֽת־עַבְדְּךָ֔ בְּאֹכְלֵ֖י שֻׁלְחָנֶ֑ךָ וּמַה־יֶּשׁ־לִ֥י
  עוֹד֙ צְדָקָ֔ה וְלִזְעֹ֥ק ע֖וֹד אֶל־הַמֶּֽלֶךְ׃פ
