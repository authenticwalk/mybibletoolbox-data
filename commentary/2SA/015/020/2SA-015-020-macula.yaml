text: 2SA 15:20 תְּמ֣וֹל׀בּוֹאֶ֗ךָ וְהַיּ֞וֹם אֲנִֽיעֲךָ֤ עִמָּ֨נוּ֙ לָלֶ֔כֶת וַאֲנִ֣י
