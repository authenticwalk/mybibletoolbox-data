text: 2SA 15:30 וְדָוִ֡ד עֹלֶה֩ בְמַעֲלֵ֨ה הַזֵּיתִ֜ים עֹלֶ֣ה׀וּבוֹכֶ֗ה וְרֹ֥אשׁ לוֹ֙
