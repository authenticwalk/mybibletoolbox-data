text: 2SA 15:2 וְהִשְׁכִּים֙ אַבְשָׁל֔וֹם וְעָמַ֕ד עַל־יַ֖ד דֶּ֣רֶךְ הַשָּׁ֑עַר וַיְהִ֡י
  כָּל־הָאִ֣ישׁ אֲשֶֽׁר־יִהְיֶה־לּוֹ־רִיב֩ לָב֨וֹא אֶל־הַמֶּ֜לֶךְ לַמִּשְׁפָּ֗ט וַיִּקְרָ֨א
