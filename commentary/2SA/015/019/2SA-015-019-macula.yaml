text: 2SA 15:19 וַיֹּ֤אמֶר הַמֶּ֨לֶךְ֙ אֶל־אִתַּ֣י הַגִּתִּ֔י לָ֧מָּה תֵלֵ֛ךְ גַּם־אַתָּ֖ה
