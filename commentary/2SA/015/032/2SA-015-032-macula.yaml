text: 2SA 15:32 וַיְהִ֤י דָוִד֙ בָּ֣א עַד־הָרֹ֔אשׁ אֲשֶֽׁר־יִשְׁתַּחֲוֶ֥ה שָׁ֖ם לֵאלֹהִ֑ים
