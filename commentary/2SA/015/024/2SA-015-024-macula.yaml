verse: 2SA 15:24
text: 2SA 15:24 וְהִנֵּ֨ה גַם־צָד֜וֹק וְכָֽל־הַלְוִיִּ֣ם אִתּ֗וֹ נֹֽשְׂאִים֙ אֶת־אֲרוֹן֙
  בְּרִ֣ית הָאֱלֹהִ֔ים וַיַּצִּ֨קוּ֙ אֶת־אֲר֣וֹן הָאֱלֹהִ֔ים וַיַּ֖עַל אֶבְיָתָ֑ר
  עַד־תֹּ֥ם כָּל־הָעָ֖ם לַעֲב֥וֹר מִן־הָעִֽיר׃
