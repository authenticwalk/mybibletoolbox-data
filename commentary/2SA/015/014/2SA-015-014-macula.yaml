verse: 2SA 15:14
text: 2SA 15:14 וַיֹּ֣אמֶר דָּ֠וִד לְכָל־עֲבָדָ֨יו אֲשֶׁר־אִתּ֤וֹ בִירוּשָׁלִַ֨ם֙
  ק֣וּמוּ וְנִבְרָ֔חָה כִּ֛י לֹא־תִֽהְיֶה־לָּ֥נוּ פְלֵיטָ֖ה מִפְּנֵ֣י אַבְשָׁל֑וֹם
  מַהֲר֣וּ לָלֶ֗כֶת פֶּן־יְמַהֵ֤ר וְהִשִּׂגָ֨נוּ֙ וְהִדִּ֤יחַ עָלֵ֨ינוּ֙ אֶת־הָ֣רָעָ֔ה
  וְהִכָּ֥ה הָעִ֖יר לְפִי־חָֽרֶב׃
