text: 2SA 12:11 כֹּ֣ה׀אָמַ֣ר יְהוָ֗ה הִנְנִי֩ מֵקִ֨ים עָלֶ֤יךָ רָעָה֙ מִבֵּיתֶ֔ךָ
  וְלָקַחְתִּ֤י אֶת־נָשֶׁ֨יךָ֙ לְעֵינֶ֔יךָ וְנָתַתִּ֖י לְרֵעֶ֑יךָ וְשָׁכַב֙ עִם־נָשֶׁ֔יךָ
  לְעֵינֵ֖י הַשֶּׁ֥מֶשׁ הַזֹּֽאת׃
