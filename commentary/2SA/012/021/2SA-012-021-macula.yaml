text: 2SA 12:21 וַיֹּאמְר֤וּ עֲבָדָיו֙ אֵלָ֔יו מָֽה־הַדָּבָ֥ר הַזֶּ֖ה אֲשֶׁ֣ר עָשִׂ֑יתָה
