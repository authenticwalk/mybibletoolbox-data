text: 2SA 10:2 וַיֹּ֨אמֶר דָּוִ֜ד אֶעֱשֶׂה־חֶ֣סֶד׀עִם־חָנ֣וּן בֶּן־נָחָ֗שׁ כַּאֲשֶׁר֩
