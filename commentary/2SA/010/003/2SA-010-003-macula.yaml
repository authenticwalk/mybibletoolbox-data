text: 2SA 10:3 וַיֹּאמְרוּ֩ שָׂרֵ֨י בְנֵֽי־עַמּ֜וֹן אֶל־חָנ֣וּן אֲדֹֽנֵיהֶ֗ם הַֽמְכַבֵּ֨ד
  דָּוִ֤ד אֶת־אָבִ֨יךָ֙ בְּעֵינֶ֔יךָ כִּֽי־שָׁלַ֥ח לְךָ֖ מְנַֽחֲמִ֑ים הֲ֠לוֹא בַּעֲב֞וּר
  חֲק֤וֹר אֶת־הָעִיר֙ וּלְרַגְּלָ֣הּ וּלְהָפְכָ֔הּ שָׁלַ֥ח דָּוִ֛ד אֶת־עֲבָדָ֖יו אֵלֶֽיךָ׃
