verse: 2SA 16:8
text: 2SA 16:8 הֵשִׁיב֩ עָלֶ֨יךָ יְהוָ֜ה כֹּ֣ל׀דְּמֵ֣י בֵית־שָׁא֗וּל אֲשֶׁ֤ר מָלַ֨כְתָּ֙
  תַּחְתָּ֔יו וַיִּתֵּ֤ן יְהוָה֙ אֶת־הַמְּלוּכָ֔ה בְּיַ֖ד אַבְשָׁל֣וֹם בְּנֶ֑ךָ וְהִנְּךָ֙
  בְּרָ֣עָתֶ֔ךָ כִּ֛י אִ֥ישׁ דָּמִ֖ים אָֽתָּה׃
