text: 2SA 16:21 וַיֹּ֤אמֶר אֲחִיתֹ֨פֶל֙ אֶל־אַבְשָׁלֹ֔ם בּ֚וֹא אֶל־פִּלַגְשֵׁ֣י אָבִ֔יךָ
