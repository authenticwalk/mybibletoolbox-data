text: וְהָיָה֩ בַיּ֨וֹם הַה֜וּא נְאֻ֣ם׀יְהוָ֣ה צְבָא֗וֹת אַכְרִ֞ית אֶת־שְׁמ֤וֹת הָֽעֲצַבִּים֙
