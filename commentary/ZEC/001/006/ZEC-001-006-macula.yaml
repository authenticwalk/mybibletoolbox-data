  לַעֲשׂ֣וֹת לָ֔נוּ כִּדְרָכֵ֨ינוּ֙ וּכְמַ֣עֲלָלֵ֔ינוּ כֵּ֖ן עָשָׂ֥ה אִתָּֽנוּ׃ס
