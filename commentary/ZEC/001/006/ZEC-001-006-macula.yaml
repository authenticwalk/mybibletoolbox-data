text: אַ֣ךְ׀דְּבָרַ֣י וְחֻקַּ֗י אֲשֶׁ֤ר צִוִּ֨יתִי֙ אֶת־עֲבָדַ֣י הַנְּבִיאִ֔ים הֲל֥וֹא
