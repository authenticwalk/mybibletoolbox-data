text: וְ֠הָיָה אֲשֶׁ֨ר לֹֽא־יַעֲלֶ֜ה מֵאֵ֨ת מִשְׁפְּח֤וֹת הָאָ֨רֶץ֙ אֶל־יְר֣וּשָׁלִַ֔ם
