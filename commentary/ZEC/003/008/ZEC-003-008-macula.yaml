text: שְֽׁמַֽע־נָ֞א יְהוֹשֻׁ֣עַ׀הַכֹּהֵ֣ן הַגָּד֗וֹל אַתָּה֙ וְרֵעֶ֨יךָ֙ הַיֹּשְׁבִ֣ים
