text: וַיִּשְׁמַ֣ע הַמֶּֽלֶךְ־יְ֠הוֹיָקִים וְכָל־גִּבּוֹרָ֤יו וְכָל־הַשָּׂרִים֙ אֶת־דְּבָרָ֔יו
