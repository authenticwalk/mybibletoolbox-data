verse: JER 26:12
text: וַיֹּ֤אמֶר יִרְמְיָ֨הוּ֙ אֶל־כָּל־הַשָּׂרִ֔ים וְאֶל־כָּל־הָעָ֖ם לֵאמֹ֑ר יְהוָ֣ה
  שְׁלָחַ֗נִי לְהִנָּבֵ֞א אֶל־הַבַּ֤יִת הַזֶּה֙ וְאֶל־הָעִ֣יר הַזֹּ֔את אֵ֥ת כָּל־הַדְּבָרִ֖ים
  אֲשֶׁ֥ר שְׁמַעְתֶּֽם׃
