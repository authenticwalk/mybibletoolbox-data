verse: JER 26:11
text: וַיֹּ֨אמְר֜וּ הַכֹּהֲנִ֤ים וְהַנְּבִאִים֙ אֶל־הַשָּׂרִ֔ים וְאֶל־כָּל־הָעָ֖ם
  לֵאמֹ֑ר מִשְׁפַּט־מָ֨וֶת֙ לָאִ֣ישׁ הַזֶּ֔ה כִּ֤י נִבָּא֙ אֶל־הָעִ֣יר הַזֹּ֔את כַּאֲשֶׁ֥ר
  שְׁמַעְתֶּ֖ם בְּאָזְנֵיכֶֽם׃
