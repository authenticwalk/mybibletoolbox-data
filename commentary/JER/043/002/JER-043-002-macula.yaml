text: וַיֹּ֨אמֶר עֲזַרְיָ֤ה בֶן־הוֹשַֽׁעְיָה֙ וְיוֹחָנָ֣ן בֶּן־קָרֵ֔חַ וְכָל־הָאֲנָשִׁ֖ים
