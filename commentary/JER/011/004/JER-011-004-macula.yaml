verse: JER 11:4
text: אֲשֶׁ֣ר צִוִּ֣יתִי אֶת־אֲבֽוֹתֵיכֶ֡ם בְּי֣וֹם הוֹצִיאִֽי־אוֹתָ֣ם מֵאֶֽרֶץ־מִצְרַיִם֩
  מִכּ֨וּר הַבַּרְזֶ֜ל לֵאמֹ֗ר שִׁמְע֤וּ בְקוֹלִי֙ וַעֲשִׂיתֶ֣ם אוֹתָ֔ם כְּכֹ֥ל אֲשֶׁר־אֲצַוֶּ֖ה
  אֶתְכֶ֑ם וִהְיִ֤יתֶם לִי֙ לְעָ֔ם וְאָ֣נֹכִ֔י אֶהְיֶ֥ה לָכֶ֖ם לֵאלֹהִֽים׃
