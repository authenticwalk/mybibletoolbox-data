verse: JER 8:1
text: בָּעֵ֣ת הַהִ֣יא נְאֻם־יְהוָ֡ה יוֹצִ֣יאוּ אֶת־עַצְמ֣וֹת מַלְכֵֽי־יְהוּדָ֣ה וְאֶת־עַצְמוֹת־שָׂרָיו֩
  וְאֶת־עַצְמ֨וֹת הַכֹּהֲנִ֜ים וְאֵ֣ת׀עַצְמ֣וֹת הַנְּבִיאִ֗ים וְאֵ֛ת עַצְמ֥וֹת יוֹשְׁבֵֽי־יְרוּשָׁלִָ֖ם
  מִקִּבְרֵיהֶֽם׃
