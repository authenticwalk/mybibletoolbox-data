verse: JER 42:16
text: וְהָיְתָ֣ה הַחֶ֗רֶב אֲשֶׁ֤ר אַתֶּם֙ יְרֵאִ֣ים מִמֶּ֔נָּה שָׁ֛ם תַּשִּׂ֥יג אֶתְכֶ֖ם
