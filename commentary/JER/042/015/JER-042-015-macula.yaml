verse: JER 42:15
text: וְעַתָּ֕ה לָכֵ֛ן שִׁמְע֥וּ דְבַר־יְהוָ֖ה שְׁאֵרִ֣ית יְהוּדָ֑ה כֹּֽה־אָמַר֩ יְהוָ֨ה
  צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אִם־אַ֠תֶּם שׂ֣וֹם תְּשִׂמ֤וּן פְּנֵיכֶם֙ לָבֹ֣א
  מִצְרַ֔יִם וּבָאתֶ֖ם לָג֥וּר שָֽׁם׃
