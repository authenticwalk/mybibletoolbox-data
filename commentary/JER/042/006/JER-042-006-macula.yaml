text: אִם־ט֣וֹב וְאִם־רָ֔ע בְּק֣וֹל׀יְהוָ֣ה אֱלֹהֵ֗ינוּ אֲשֶׁ֨ר אֲנַ֜חְנוּ שֹׁלְחִ֥ים
