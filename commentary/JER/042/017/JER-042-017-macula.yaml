text: וְיִֽהְי֣וּ כָל־הָאֲנָשִׁ֗ים אֲשֶׁר־שָׂ֨מוּ אֶת־פְּנֵיהֶ֜ם לָב֤וֹא מִצְרַ֨יִם֙
