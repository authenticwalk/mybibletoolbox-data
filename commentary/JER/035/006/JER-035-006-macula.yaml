verse: JER 35:6
text: וַיֹּאמְר֖וּ לֹ֣א נִשְׁתֶּה־יָּ֑יִן כִּי֩ יוֹנָדָ֨ב בֶּן־רֵכָ֜ב אָבִ֗ינוּ צִוָּ֤ה
