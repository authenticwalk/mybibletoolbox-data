verse: JER 35:14
text: הוּקַ֡ם אֶת־דִּבְרֵ֣י יְהוֹנָדָ֣ב בֶּן־רֵ֠כָב אֲשֶׁר־צִוָּ֨ה אֶת־בָּנָ֜יו לְבִלְתִּ֣י
  שְׁתֽוֹת־יַ֗יִן וְלֹ֤א שָׁתוּ֙ עַד־הַיּ֣וֹם הַזֶּ֔ה כִּ֣י שָֽׁמְע֔וּ אֵ֖ת מִצְוַ֣ת
  אֲבִיהֶ֑ם וְאָ֨נֹכִ֜י דִּבַּ֤רְתִּי אֲלֵיכֶם֙ הַשְׁכֵּ֣ם וְדַבֵּ֔ר וְלֹ֥א שְׁמַעְתֶּ֖ם
  אֵלָֽי׃
