verse: JER 16:5
text: כִּֽי־כֹ֣ה׀אָמַ֣ר יְהוָ֗ה אַל־תָּבוֹא֙ בֵּ֣ית מַרְזֵ֔חַ וְאַל־תֵּלֵ֣ךְ לִסְפּ֔וֹד
  וְאַל־תָּנֹ֖ד לָהֶ֑ם כִּֽי־אָסַ֨פְתִּי אֶת־שְׁלוֹמִ֜י מֵאֵ֨ת הָעָ֤ם־הַזֶּה֙ נְאֻם־יְהוָ֔ה
  אֶת־הַחֶ֖סֶד וְאֶת־הָֽרַחֲמִֽים׃
