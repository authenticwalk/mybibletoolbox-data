verse: JER 16:10
text: וְהָיָ֗ה כִּ֤י תַגִּיד֙ לָעָ֣ם הַזֶּ֔ה אֵ֥ת כָּל־הַדְּבָרִ֖ים הָאֵ֑לֶּה וְאָמְר֣וּ
  אֵלֶ֗יךָ עַל־מֶה֩ דִבֶּ֨ר יְהוָ֤ה עָלֵ֨ינוּ֙ אֵ֣ת כָּל־הָרָעָ֤ה הַגְּדוֹלָה֙ הַזֹּ֔את
  וּמֶ֤ה עֲוֺנֵ֨נוּ֙ וּמֶ֣ה חַטָּאתֵ֔נוּ אֲשֶׁ֥ר חָטָ֖אנוּ לַֽיהוָ֥ה אֱלֹהֵֽינוּ׃
