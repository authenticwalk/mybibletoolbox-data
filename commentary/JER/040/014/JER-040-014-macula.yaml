verse: JER 40:14
text: וַיֹּאמְר֣וּ אֵלָ֗יו הֲיָדֹ֤עַתֵּדַע֙ כִּ֞י בַּעֲלִ֣יס׀מֶ֣לֶךְ בְּנֵֽי־עַמּ֗וֹן
