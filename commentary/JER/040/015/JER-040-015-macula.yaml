verse: JER 40:15
text: וְיוֹחָנָ֣ן בֶּן־קָרֵ֡חַ אָמַ֣ר אֶל־גְּדַלְיָהוּ֩ בַסֵּ֨תֶר בַּמִּצְפָּ֜ה לֵאמֹ֗ר
  אֵ֤לְכָה נָּא֙ וְאַכֶּה֙ אֶת־יִשְׁמָעֵ֣אל בֶּן־נְתַנְיָ֔ה וְאִ֖ישׁ לֹ֣א יֵדָ֑ע לָ֧מָּה
  יַכֶּ֣כָּה נֶּ֗פֶשׁ וְנָפֹ֨צוּ֙ כָּל־יְהוּדָ֔ה הַנִּקְבָּצִ֣ים אֵלֶ֔יךָ וְאָבְדָ֖ה
  שְׁאֵרִ֥ית יְהוּדָֽה׃
