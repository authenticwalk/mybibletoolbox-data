text: וַיָּשֻׁ֣בוּ כָל־הַיְּהוּדִ֗ים מִכָּל־הַמְּקֹמוֹת֙ אֲשֶׁ֣ר נִדְּחוּ־שָׁ֔ם וַיָּבֹ֧אוּ
