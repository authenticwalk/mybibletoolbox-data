verse: JER 40:10
text: וַאֲנִ֗י הִנְנִ֤י יֹשֵׁב֙ בַּמִּצְפָּ֔ה לַֽעֲמֹד֙ לִפְנֵ֣י הַכַּשְׂדִּ֔ים אֲשֶׁ֥ר
  יָבֹ֖אוּ אֵלֵ֑ינוּ וְאַתֶּ֡ם אִסְפוּ֩ יַ֨יִן וְקַ֜יִץ וְשֶׁ֗מֶן וְשִׂ֨מוּ֙ בִּכְלֵיכֶ֔ם
  וּשְׁב֖וּ בְּעָרֵיכֶ֥ם אֲשֶׁר־תְּפַשְׂתֶּֽם׃
