verse: JER 19:3
text: וְאָֽמַרְתָּ֙ שִׁמְע֣וּ דְבַר־יְהוָ֔ה מַלְכֵ֣י יְהוּדָ֔ה וְיֹשְׁבֵ֖י יְרֽוּשָׁלִָ֑ם
  כֹּֽה־אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְנִ֨י מֵבִ֤יא רָעָה֙ עַל־הַמָּק֣וֹם
  הַזֶּ֔ה אֲשֶׁ֥ר כָּל־שֹׁמְעָ֖הּ תִּצַּ֥לְנָה אָזְנָֽיו׃
