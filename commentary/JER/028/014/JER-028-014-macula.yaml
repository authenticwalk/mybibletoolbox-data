verse: JER 28:14
text: כִּ֣י כֹֽה־אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל עֹ֣ל בַּרְזֶ֡ל נָתַ֜תִּי
  עַל־צַוַּ֣אר׀כָּל־הַגּוֹיִ֣ם הָאֵ֗לֶּה לַעֲבֹ֛ד אֶת־נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ־בָּבֶ֖ל
  וַעֲבָדֻ֑הוּ וְגַ֛ם אֶת־חַיַּ֥ת הַשָּׂדֶ֖ה נָתַ֥תִּי לֽוֹ׃
