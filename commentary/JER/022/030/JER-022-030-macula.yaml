text: כֹּ֣ה׀אָמַ֣ר יְהוָ֗ה כִּתְב֞וּ אֶת־הָאִ֤ישׁ הַזֶּה֙ עֲרִירִ֔י גֶּ֖בֶר לֹא־יִצְלַ֣ח
