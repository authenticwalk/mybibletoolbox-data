text: לָכֵ֞ן כֹּֽה־אָמַ֣ר יְהוָ֗ה אֶל־יְהוֹיָקִ֤ים בֶּן־יֹאשִׁיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה
