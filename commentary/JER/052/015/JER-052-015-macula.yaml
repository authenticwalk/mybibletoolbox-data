verse: JER 52:15
text: וּמִדַּלּ֨וֹת הָעָ֜ם וְֽאֶת־יֶ֥תֶר הָעָ֣ם׀הַנִּשְׁאָרִ֣ים בָּעִ֗יר וְאֶת־הַנֹּֽפְלִים֙
  אֲשֶׁ֤ר נָֽפְלוּ֙ אֶל־מֶ֣לֶךְ בָּבֶ֔ל וְאֵ֖ת יֶ֣תֶר הָֽאָמ֑וֹן הֶגְלָ֕ה נְבוּזַרְאֲדָ֖ן
  רַב־טַבָּחִֽים׃
