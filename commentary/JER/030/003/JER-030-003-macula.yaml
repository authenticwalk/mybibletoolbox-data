verse: JER 30:3
text: כִּ֠י הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם־יְהוָ֔ה וְ֠שַׁבְתִּי אֶת־שְׁב֨וּת עַמִּ֧י
  יִשְׂרָאֵ֛ל וִֽיהוּדָ֖ה אָמַ֣ר יְהוָ֑ה וַהֲשִׁבֹתִ֗ים אֶל־הָאָ֛רֶץ אֲשֶׁר־נָתַ֥תִּי
  לַאֲבוֹתָ֖ם וִֽירֵשֽׁוּהָ׃פ
