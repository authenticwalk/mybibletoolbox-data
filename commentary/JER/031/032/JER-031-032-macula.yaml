text: לֹ֣א כַבְּרִ֗ית אֲשֶׁ֤ר כָּרַ֨תִּי֙ אֶת־אֲבוֹתָ֔ם בְּיוֹם֙ הֶחֱזִיקִ֣י בְיָדָ֔ם
