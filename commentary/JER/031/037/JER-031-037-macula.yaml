text: כֹּ֣ה׀אָמַ֣ר יְהוָ֗ה אִם־יִמַּ֤דּוּ שָׁמַ֨יִם֙ מִלְמַ֔עְלָה וְיֵחָקְר֥וּ מֽוֹסְדֵי־אֶ֖רֶץ
