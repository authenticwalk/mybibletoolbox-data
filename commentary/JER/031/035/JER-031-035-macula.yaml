text: כֹּ֣ה׀אָמַ֣ר יְהוָ֗ה נֹתֵ֥ן שֶׁ֨מֶשׁ֙ לְא֣וֹר יוֹמָ֔ם חֻקֹּ֛ת יָרֵ֥חַ וְכוֹכָבִ֖ים
