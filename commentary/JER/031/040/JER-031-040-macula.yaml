text: וְכָל־הָעֵ֣מֶק הַפְּגָרִ֣ים׀וְהַדֶּ֡שֶׁן וְכָֽל־הַשְּׁדֵמוֹת֩ עַד־נַ֨חַל קִדְר֜וֹן
