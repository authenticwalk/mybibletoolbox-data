text: קַח־לְךָ֮ מְגִלַּת־סֵפֶר֒ וְכָתַבְתָּ֣ אֵלֶ֗יהָ אֵ֣ת כָּל־הַדְּבָרִ֞ים אֲשֶׁר־דִּבַּ֧רְתִּי
  אֵלֶ֛יךָ עַל־יִשְׂרָאֵ֥ל וְעַל־יְהוּדָ֖ה וְעַל־כָּל־הַגּוֹיִ֑ם מִיּ֞וֹם דִּבַּ֤רְתִּי
  אֵלֶ֨יךָ֙ מִימֵ֣י יֹאשִׁיָּ֔הוּ וְעַ֖ד הַיּ֥וֹם הַזֶּֽה׃
