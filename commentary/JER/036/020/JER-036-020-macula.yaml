text: וַיָּבֹ֤אוּ אֶל־הַמֶּ֨לֶךְ֙ חָצֵ֔רָה וְאֶת־הַמְּגִלָּ֣ה הִפְקִ֔דוּ בְּלִשְׁכַּ֖ת
