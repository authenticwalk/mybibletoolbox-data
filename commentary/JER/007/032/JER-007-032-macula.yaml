verse: JER 7:32
text: לָכֵ֞ן הִנֵּֽה־יָמִ֤ים בָּאִים֙ נְאֻם־יְהוָ֔ה וְלֹא־יֵאָמֵ֨ר ע֤וֹד הַתֹּ֨פֶת֙
