text: לָכֵ֞ן כֹּה־אָמַ֣ר׀אֲדֹנָ֣י יְהֹוִ֗ה הִנֵּ֨ה אַפִּ֤י וַֽחֲמָתִי֙ נִתֶּ֨כֶת֙
