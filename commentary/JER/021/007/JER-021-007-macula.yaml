verse: JER 21:7
text: וְאַחֲרֵי־כֵ֣ן נְאֻם־יְהוָ֡ה אֶתֵּ֣ן אֶת־צִדְקִיָּ֣הוּ מֶֽלֶךְ־יְהוּדָ֣ה וְאֶת־עֲבָדָ֣יו׀וְאֶת־הָעָ֡ם
  וְאֶת־הַנִּשְׁאָרִים֩ בָּעִ֨יר הַזֹּ֜את מִן־הַדֶּ֣בֶר׀מִן־הַחֶ֣רֶב וּמִן־הָרָעָ֗ב
  בְּיַד֙ נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ־בָּבֶ֔ל וּבְיַד֙ אֹֽיְבֵיהֶ֔ם וּבְיַ֖ד מְבַקְשֵׁ֣י
  נַפְשָׁ֑ם וְהִכָּ֣ם לְפִי־חֶ֔רֶב לֹֽא־יָח֣וּס עֲלֵיהֶ֔ם וְלֹ֥א יַחְמֹ֖ל וְלֹ֥א יְרַחֵֽם׃
