verse: JER 25:9
text: הִנְנִ֣י שֹׁלֵ֡חַ וְלָקַחְתִּי֩ אֶת־כָּל־מִשְׁפְּח֨וֹת צָפ֜וֹן נְאֻם־יְהוָ֗ה
  וְאֶל־נְבֽוּכַדְרֶאצַּ֣ר מֶֽלֶךְ־בָּבֶל֮ עַבְדִּי֒ וַהֲבִ֨אֹתִ֜ים עַל־הָאָ֤רֶץ הַזֹּאת֙
  וְעַל־יֹ֣שְׁבֶ֔יהָ וְעַ֛ל כָּל־הַגּוֹיִ֥ם הָאֵ֖לֶּה סָבִ֑יב וְהַ֣חֲרַמְתִּ֔ים וְשַׂמְתִּים֙
  לְשַׁמָּ֣ה וְלִשְׁרֵקָ֔ה וּלְחָרְב֖וֹת עוֹלָֽם׃
