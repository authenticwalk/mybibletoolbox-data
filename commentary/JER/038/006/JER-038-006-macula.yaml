text: וַיִּקְח֣וּ אֶֽת־יִרְמְיָ֗הוּ וַיַּשְׁלִ֨כוּ אֹת֜וֹ אֶל־הַבּ֣וֹר׀מַלְכִּיָּ֣הוּ
