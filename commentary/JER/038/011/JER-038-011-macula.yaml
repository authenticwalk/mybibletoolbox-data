verse: JER 38:11
text: וַיִּקַּ֣ח׀עֶֽבֶד־מֶ֨לֶךְ אֶת־הָאֲנָשִׁ֜ים בְּיָד֗וֹ וַיָּבֹ֤א בֵית־הַמֶּ֨לֶךְ֙
