verse: JER 38:17
text: וַיֹּ֣אמֶר יִרְמְיָ֣הוּ אֶל־צִדְקִיָּ֡הוּ כֹּֽה־אָמַ֣ר יְהוָה֩ אֱלֹהֵ֨י צְבָא֜וֹת
  אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אִם־יָצֹ֨א תֵצֵ֜א אֶל־שָׂרֵ֤י מֶֽלֶךְ־בָּבֶל֙ וְחָיְתָ֣ה נַפְשֶׁ֔ךָ
  וְהָעִ֣יר הַזֹּ֔את לֹ֥א תִשָּׂרֵ֖ף בָּאֵ֑שׁ וְחָיִ֖תָה אַתָּ֥ה וּבֵיתֶֽךָ׃
