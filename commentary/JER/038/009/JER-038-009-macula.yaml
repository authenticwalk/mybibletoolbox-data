text: אֲדֹנִ֣י הַמֶּ֗לֶךְ הֵרֵ֜עוּ הָאֲנָשִׁ֤ים הָאֵ֨לֶּה֙ אֵ֣ת כָּל־אֲשֶׁ֤ר עָשׂוּ֙
