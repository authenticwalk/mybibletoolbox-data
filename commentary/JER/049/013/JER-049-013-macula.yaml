verse: JER 49:13
text: כִּ֣י בִ֤י נִשְׁבַּ֨עְתִּי֙ נְאֻם־יְהוָ֔ה כִּֽי־לְשַׁמָּ֧ה לְחֶרְפָּ֛ה לְחֹ֥רֶב
