verse: JER 51:62
text: וְאָמַרְתָּ֗ יְהוָה֙ אַתָּ֨ה דִבַּ֜רְתָּ אֶל־הַמָּק֤וֹם הַזֶּה֙ לְהַכְרִית֔וֹ
