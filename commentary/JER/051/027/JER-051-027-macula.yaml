verse: JER 51:27
text: שְׂאוּ־נֵ֣ס בָּאָ֗רֶץ תִּקְע֨וּ שׁוֹפָ֤ר בַּגּוֹיִם֙ קַדְּשׁ֤וּ עָלֶ֨יהָ֙ גּוֹיִ֔ם
  הַשְׁמִ֧יעוּ עָלֶ֛יהָ מַמְלְכ֥וֹת אֲרָרַ֖ט מִנִּ֣י וְאַשְׁכְּנָ֑ז פִּקְד֤וּ עָלֶ֨יהָ֙
  טִפְסָ֔ר הַֽעֲלוּ־ס֖וּס כְּיֶ֥לֶק סָמָֽר׃
