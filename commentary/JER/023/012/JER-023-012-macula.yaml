verse: JER 23:12
text: לָכֵן֩ יִֽהְיֶ֨ה דַרְכָּ֜ם לָהֶ֗ם כַּחֲלַקְלַקּוֹת֙ בָּֽאֲפֵלָ֔ה יִדַּ֖חוּ וְנָ֣פְלוּ
