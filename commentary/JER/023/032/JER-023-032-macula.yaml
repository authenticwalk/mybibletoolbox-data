verse: JER 23:32
text: הִ֠נְנִי עַֽל־נִבְּאֵ֞י חֲלֹמ֥וֹת שֶׁ֨קֶר֙ נְאֻם־יְהוָ֔ה וַֽיְסַפְּרוּם֙ וַיַּתְע֣וּ
  אֶת־עַמִּ֔י בְּשִׁקְרֵיהֶ֖ם וּבְפַחֲזוּתָ֑ם וְאָנֹכִ֨י לֹֽא־שְׁלַחְתִּ֜ים וְלֹ֣א
  צִוִּיתִ֗ים וְהוֹעֵ֛יל לֹֽא־יוֹעִ֥ילוּ לָֽעָם־הַזֶּ֖ה נְאֻם־יְהוָֽה׃
