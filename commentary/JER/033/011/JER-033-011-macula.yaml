text: ק֣וֹל שָׂשׂ֞וֹן וְק֣וֹל שִׂמְחָ֗ה ק֣וֹל חָתָן֮ וְק֣וֹל כַּלָּה֒ ק֣וֹל אֹמְרִ֡ים
  הוֹדוּ֩ אֶת־יְהוָ֨ה צְבָא֜וֹת כִּֽי־ט֤וֹב יְהוָה֙ כִּֽי־לְעוֹלָ֣ם חַסְדּ֔וֹ מְבִאִ֥ים
