verse: JER 33:10
text: כֹּ֣ה׀אָמַ֣ר יְהוָ֗ה עוֹד֮ יִשָּׁמַ֣ע בַּמָּקוֹם־הַזֶּה֒ אֲשֶׁר֙ אַתֶּ֣ם אֹֽמְרִ֔ים
  חָרֵ֣ב ה֔וּא מֵאֵ֥ין אָדָ֖ם וּמֵאֵ֣ין בְּהֵמָ֑ה בְּעָרֵ֤י יְהוּדָה֙ וּבְחֻצ֣וֹת
  יְרוּשָׁלִַ֔ם הַֽנְשַׁמּ֗וֹת מֵאֵ֥ין אָדָ֛ם וּמֵאֵ֥ין יוֹשֵׁ֖ב וּמֵאֵ֥ין בְּהֵמָֽה׃
