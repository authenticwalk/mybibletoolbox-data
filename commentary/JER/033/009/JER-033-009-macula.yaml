verse: JER 33:9
text: וְהָ֣יְתָה לִּ֗י לְשֵׁ֤ם שָׂשׂוֹן֙ לִתְהִלָּ֣ה וּלְתִפְאֶ֔רֶת לְכֹ֖ל גּוֹיֵ֣י
  הָאָ֑רֶץ אֲשֶׁ֨ר יִשְׁמְע֜וּ אֶת־כָּל־הַטּוֹבָ֗ה אֲשֶׁ֤ר אָֽנֹכִי֙ עֹשֶׂ֣ה אֹתָ֔ם
  וּפָחֲד֣וּ וְרָֽגְז֗וּ עַ֤ל כָּל־הַטּוֹבָה֙ וְעַ֣ל כָּל־הַשָּׁל֔וֹם אֲשֶׁ֥ר אָֽנֹכִ֖י
  עֹ֥שֶׂה לָּֽהּ׃ס
