text: כִּ֣י שָׁמַ֜עְתִּי דִּבַּ֣ת רַבִּים֮ מָג֣וֹר מִסָּבִיב֒ הַגִּ֨ידוּ֙ וְנַגִּידֶ֔נּוּ
