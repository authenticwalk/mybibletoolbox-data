verse: JER 48:44
text: הַנָּ֞ס מִפְּנֵ֤י הַפַּ֨חַד֙ יִפֹּ֣ל אֶל־הַפַּ֔חַת וְהָֽעֹלֶה֙ מִן־הַפַּ֔חַת
