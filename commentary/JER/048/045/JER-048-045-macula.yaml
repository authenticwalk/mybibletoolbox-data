verse: JER 48:45
text: בְּצֵ֥ל חֶשְׁבּ֛וֹן עָמְד֖וּ מִכֹּ֣חַ נָסִ֑ים כִּֽי־אֵ֞שׁ יָצָ֣א מֵחֶשְׁבּ֗וֹן
  וְלֶֽהָבָה֙ מִבֵּ֣ין סִיח֔וֹן וַתֹּ֨אכַל֙ פְּאַ֣ת מוֹאָ֔ב וְקָדְקֹ֖ד בְּנֵ֥י שָׁאֽוֹן׃
