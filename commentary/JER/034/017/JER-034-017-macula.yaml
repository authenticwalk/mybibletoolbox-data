verse: JER 34:17
text: לָכֵן֮ כֹּה־אָמַ֣ר יְהוָה֒ אַתֶּם֙ לֹֽא־שְׁמַעְתֶּ֣ם אֵלַ֔י לִקְרֹ֣א דְר֔וֹר
  אִ֥ישׁ לְאָחִ֖יו וְאִ֣ישׁ לְרֵעֵ֑הוּ הִנְנִ֣י קֹרֵא֩ לָכֶ֨ם דְּר֜וֹר נְאֻם־יְהוָ֗ה
  אֶל־הַחֶ֨רֶב֙ אֶל־הַדֶּ֣בֶר וְאֶל־הָרָעָ֔ב וְנָתַתִּ֤י אֶתְכֶם֙ לְזַעֲוָ֔ה לְכֹ֖ל
  מַמְלְכ֥וֹת הָאָֽרֶץ׃
