verse: JER 34:7
text: וְחֵ֣יל מֶֽלֶךְ־בָּבֶ֗ל נִלְחָמִים֙ עַל־יְר֣וּשָׁלִַ֔ם וְעַ֛ל כָּל־עָרֵ֥י יְהוּדָ֖ה
  הַנּֽוֹתָר֑וֹת אֶל־לָכִישׁ֙ וְאֶל־עֲזֵקָ֔ה כִּ֣י הֵ֗נָּה נִשְׁאֲר֛וּ בְּעָרֵ֥י יְהוּדָ֖ה
  עָרֵ֥י מִבְצָֽר׃פ
