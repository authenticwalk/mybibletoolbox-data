verse: JER 41:6
text: וַ֠יֵּצֵא יִשְׁמָעֵ֨אל בֶּן־נְתַנְיָ֤ה לִקְרָאתָם֙ מִן־הַמִּצְפָּ֔ה הֹלֵ֥ךְ
  הָלֹ֖ךְ וּבֹכֶ֑ה וַֽיְהִי֙ כִּפְגֹ֣שׁ אֹתָ֔ם וַיֹּ֣אמֶר אֲלֵיהֶ֔ם בֹּ֖אוּ אֶל־גְּדַלְיָ֥הוּ
  בֶן־אֲחִיקָֽם׃ס
