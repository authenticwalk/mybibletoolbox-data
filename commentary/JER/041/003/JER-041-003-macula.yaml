verse: JER 41:3
text: וְאֵ֣ת כָּל־הַיְּהוּדִ֗ים אֲשֶׁר־הָי֨וּ אִתּ֤וֹ אֶת־גְּדַלְיָ֨הוּ֙ בַּמִּצְפָּ֔ה
  וְאֶת־הַכַּשְׂדִּ֖ים אֲשֶׁ֣ר נִמְצְאוּ־שָׁ֑ם אֵ֚ת אַנְשֵׁ֣י הַמִּלְחָמָ֔ה הִכָּ֖ה
  יִשְׁמָעֵֽאל׃
