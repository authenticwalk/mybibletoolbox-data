verse: JER 41:10
text: וַיִּ֣שְׁבְּ׀יִ֠שְׁמָעֵאל אֶת־כָּל־שְׁאֵרִ֨ית הָעָ֜ם אֲשֶׁ֣ר בַּמִּצְפָּ֗ה אֶת־בְּנ֤וֹת
  הַמֶּ֨לֶךְ֙ וְאֶת־כָּל־הָעָם֙ הַנִּשְׁאָרִ֣ים בַּמִּצְפָּ֔ה אֲשֶׁ֣ר הִפְקִ֗יד נְבֽוּזַרְאֲדָן֙
  רַב־טַבָּחִ֔ים אֶת־גְּדַלְיָ֖הוּ בֶּן־אֲחִיקָ֑ם וַיִּשְׁבֵּם֙ יִשְׁמָעֵ֣אל בֶּן־נְתַנְיָ֔ה
  וַיֵּ֕לֶךְ לַעֲבֹ֖ר אֶל־בְּנֵ֥י עַמּֽוֹן׃ס
