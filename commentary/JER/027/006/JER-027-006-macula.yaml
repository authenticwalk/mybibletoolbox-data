text: וְעַתָּ֗ה אָֽנֹכִי֙ נָתַ֨תִּי֙ אֶת־כָּל־הָאֲרָצ֣וֹת הָאֵ֔לֶּה בְּיַ֛ד נְבוּכַדְנֶאצַּ֥ר
