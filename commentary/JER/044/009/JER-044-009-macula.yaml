text: הַֽשְׁכַחְתֶּם֩ אֶת־רָע֨וֹת אֲבוֹתֵיכֶ֜ם וְאֶת־רָע֣וֹת׀מַלְכֵ֣י יְהוּדָ֗ה וְאֵת֙
