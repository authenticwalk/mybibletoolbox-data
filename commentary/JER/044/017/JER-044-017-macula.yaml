verse: JER 44:17
text: כִּ֩י עָשֹׂ֨ה נַעֲשֶׂ֜ה אֶֽת־כָּל־הַדָּבָ֣ר׀אֲשֶׁר־יָצָ֣א מִפִּ֗ינוּ לְקַטֵּ֞ר
  לִמְלֶ֣כֶת הַשָּׁמַיִם֮ וְהַסֵּֽיךְ־לָ֣הּ נְסָכִים֒ כַּאֲשֶׁ֨ר עָשִׂ֜ינוּ אֲנַ֤חְנוּ
  וַאֲבֹתֵ֨ינוּ֙ מְלָכֵ֣ינוּ וְשָׂרֵ֔ינוּ בְּעָרֵ֣י יְהוּדָ֔ה וּבְחֻצ֖וֹת יְרוּשָׁלִָ֑ם
  וַנִּֽשְׂבַּֽע־לֶ֨חֶם֙ וַנִּֽהְיֶ֣ה טוֹבִ֔ים וְרָעָ֖ה לֹ֥א רָאִֽינוּ׃
