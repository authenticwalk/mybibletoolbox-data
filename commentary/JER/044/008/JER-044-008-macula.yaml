verse: JER 44:8
text: לְהַכְעִסֵ֨נִי֙ בְּמַעֲשֵׂ֣י יְדֵיכֶ֔ם לְקַטֵּ֞ר לֵאלֹהִ֤ים אֲחֵרִים֙ בְּאֶ֣רֶץ
  מִצְרַ֔יִם אֲשֶׁר־אַתֶּ֥ם בָּאִ֖ים לָג֣וּר שָׁ֑ם לְמַ֨עַן֙ הַכְרִ֣ית לָכֶ֔ם וּלְמַ֤עַן
  הֱיֽוֹתְכֶם֙ לִקְלָלָ֣ה וּלְחֶרְפָּ֔ה בְּכֹ֖ל גּוֹיֵ֥י הָאָֽרֶץ׃
