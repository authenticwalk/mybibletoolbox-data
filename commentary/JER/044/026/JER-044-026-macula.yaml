verse: JER 44:26
text: לָכֵן֙ שִׁמְע֣וּ דְבַר־יְהוָ֔ה כָּל־יְהוּדָ֕ה הַיֹּשְׁבִ֖ים בְּאֶ֣רֶץ מִצְרָ֑יִם
  הִנְנִ֨י נִשְׁבַּ֜עְתִּי בִּשְׁמִ֤י הַגָּדוֹל֙ אָמַ֣ר יְהוָ֔ה אִם־יִהְיֶה֩ ע֨וֹד
  שְׁמִ֜י נִקְרָ֣א׀בְּפִ֣י׀כָּל־אִ֣ישׁ יְהוּדָ֗ה אֹמֵ֛ר חַי־אֲדֹנָ֥י יְהוִ֖ה בְּכָל־אֶ֥רֶץ
  מִצְרָֽיִם׃
