text: הַדָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל־יִרְמְיָ֔הוּ אֶ֚ל כָּל־הַיְּהוּדִ֔ים הַיֹּשְׁבִ֖ים
