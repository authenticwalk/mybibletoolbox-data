text: הַשְׁמִ֣יעוּ אֶל־בָּבֶ֣ל׀רַ֠בִּים כָּל־דֹּ֨רְכֵי קֶ֜שֶׁת חֲנ֧וּ עָלֶ֣יהָ סָבִ֗יב
