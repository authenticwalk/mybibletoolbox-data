verse: JER 50:4
text: בַּיָּמִ֨ים הָהֵ֜מָּה וּבָעֵ֤ת הַהִיא֙ נְאֻם־יְהוָ֔ה יָבֹ֧אוּ בְנֵֽי־יִשְׂרָאֵ֛ל
  הֵ֥מָּה וּבְנֵֽי־יְהוּדָ֖ה יַחְדָּ֑ו הָל֤וֹךְ וּבָכוֹ֙ יֵלֵ֔כוּ וְאֶת־יְהוָ֥ה אֱלֹהֵיהֶ֖ם
  יְבַקֵּֽשׁוּ׃
