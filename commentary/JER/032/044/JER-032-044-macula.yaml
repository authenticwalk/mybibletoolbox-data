verse: JER 32:44
text: שָׂד֞וֹת בַּכֶּ֣סֶף יִקְנ֗וּ וְכָת֨וֹב בַּסֵּ֥פֶר׀וְחָתוֹם֮ וְהָעֵ֣ד עֵדִים֒
  בְּאֶ֨רֶץ בִּנְיָמִ֜ן וּבִסְבִיבֵ֣י יְרוּשָׁלִַ֗ם וּבְעָרֵ֤י יְהוּדָה֙ וּבְעָרֵ֣י
  הָהָ֔ר וּבְעָרֵ֥י הַשְּׁפֵלָ֖ה וּבְעָרֵ֣י הַנֶּ֑גֶב כִּֽי־אָשִׁ֥יב אֶת־שְׁבוּתָ֖ם
  נְאֻם־יְהוָֽה׃פ
