verse: JER 32:42
text: כִּֽי־כֹה֙ אָמַ֣ר יְהוָ֔ה כַּאֲשֶׁ֤ר הֵבֵ֨אתִי֙ אֶל־הָעָ֣ם הַזֶּ֔ה אֵ֛ת כָּל־הָרָעָ֥ה
  הַגְּדוֹלָ֖ה הַזֹּ֑את כֵּ֣ן אָנֹכִ֞י מֵבִ֤יא עֲלֵיהֶם֙ אֶת־כָּל־הַטּוֹבָ֔ה אֲשֶׁ֥ר
  אָנֹכִ֖י דֹּבֵ֥ר עֲלֵיהֶֽם׃
