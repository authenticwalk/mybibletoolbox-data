verse: JER 32:23
text: וַיָּבֹ֜אוּ וַיִּֽרְשׁ֣וּ אֹתָ֗הּ וְלֹֽא־שָׁמְע֤וּ בְקוֹלֶ֨ךָ֙ וּבְתוֹרָתְךָ֣
