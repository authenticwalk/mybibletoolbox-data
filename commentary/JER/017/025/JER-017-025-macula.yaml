text: וּבָ֣אוּ בְשַׁעֲרֵ֣י הָעִ֣יר הַזֹּ֡את מְלָכִ֣ים׀וְשָׂרִ֡ים יֹשְׁבִים֩ עַל־כִּסֵּ֨א
  דָוִ֜ד רֹכְבִ֣ים׀בָּרֶ֣כֶב וּבַסּוּסִ֗ים הֵ֚מָּה וְשָׂ֣רֵיהֶ֔ם אִ֥ישׁ יְהוּדָ֖ה
  וְיֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְיָשְׁבָ֥ה הָֽעִיר־הַזֹּ֖את לְעוֹלָֽם׃
