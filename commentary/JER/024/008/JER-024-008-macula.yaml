verse: JER 24:8
text: וְכַתְּאֵנִים֙ הָֽרָע֔וֹת אֲשֶׁ֥ר לֹא־תֵאָכַ֖לְנָה מֵרֹ֑עַ כִּי־כֹ֣ה׀אָמַ֣ר
  יְהוָ֗ה כֵּ֣ן אֶ֠תֵּן אֶת־צִדְקִיָּ֨הוּ מֶֽלֶךְ־יְהוּדָ֤ה וְאֶת־שָׂרָיו֙ וְאֵ֣ת׀שְׁאֵרִ֣ית
  יְרוּשָׁלִַ֗ם הַנִּשְׁאָרִים֙ בָּאָ֣רֶץ הַזֹּ֔את וְהַיֹּשְׁבִ֖ים בְּאֶ֥רֶץ מִצְרָֽיִם׃
