verse: JER 29:14
text: וְנִמְצֵ֣אתִי לָכֶם֮ נְאֻם־יְהוָה֒ וְשַׁבְתִּ֣י אֶת־שְׁבוּתְכֶ֗ם וְקִבַּצְתִּ֣י
  אֶ֠תְכֶם מִֽכָּל־הַגּוֹיִ֞ם וּמִכָּל־הַמְּקוֹמ֗וֹת אֲשֶׁ֨ר הִדַּ֧חְתִּי אֶתְכֶ֛ם
  שָׁ֖ם נְאֻם־יְהוָ֑ה וַהֲשִׁבֹתִ֣י אֶתְכֶ֔ם אֶל־הַ֨מָּק֔וֹם אֲשֶׁר־הִגְלֵ֥יתִי אֶתְכֶ֖ם
  מִשָּֽׁם׃
