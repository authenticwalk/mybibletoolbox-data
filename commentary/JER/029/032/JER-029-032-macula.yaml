verse: JER 29:32
text: לָכֵ֞ן כֹּֽה־אָמַ֣ר יְהוָ֗ה הִנְנִ֨י פֹקֵ֜ד עַל־שְׁמַעְיָ֣ה הַנֶּחֱלָמִי֮ וְעַל־זַרְעוֹ֒
  לֹא־יִהְיֶ֨ה ל֜וֹ אִ֣ישׁ׀יוֹשֵׁ֣ב׀בְּתוֹךְ־הָעָ֣ם הַזֶּ֗ה וְלֹֽא־יִרְאֶ֥ה בַטּ֛וֹב
  אֲשֶׁר־אֲנִ֥י עֹשֶֽׂה־לְעַמִּ֖י נְאֻם־יְהוָ֑ה כִּֽי־סָרָ֥ה דִבֶּ֖ר עַל־יְהוָֽה׃ס
