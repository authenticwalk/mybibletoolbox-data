text: כִּי־כֹ֣ה׀אָמַ֣ר יְהוָ֗ה אֶל־הַמֶּ֨לֶךְ֙ הַיּוֹשֵׁב֙ אֶל־כִּסֵּ֣א דָוִ֔ד וְאֶל־כָּל־הָעָ֔ם
