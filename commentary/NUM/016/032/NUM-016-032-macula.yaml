verse: NUM 16:32
text: וַתִּפְתַּ֤ח הָאָ֨רֶץ֙ אֶת־פִּ֔יהָ וַתִּבְלַ֥ע אֹתָ֖ם וְאֶת־בָּתֵּיהֶ֑ם וְאֵ֤ת
