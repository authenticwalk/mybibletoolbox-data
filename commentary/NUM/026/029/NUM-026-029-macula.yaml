text: בְּנֵ֣י מְנַשֶּׁ֗ה לְמָכִיר֙ מִשְׁפַּ֣חַת הַמָּכִירִ֔י וּמָכִ֖יר הוֹלִ֣יד אֶת־גִּלְעָ֑ד
  לְגִלְעָ֕ד מִשְׁפַּ֖חַת הַגִּלְעָדִֽי׃
