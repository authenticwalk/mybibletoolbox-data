verse: NUM 11:26
text: וַיִּשָּׁאֲר֣וּ שְׁנֵֽי־אֲנָשִׁ֣ים׀בַּֽמַּחֲנֶ֡ה שֵׁ֣ם הָאֶחָ֣ד׀אֶלְדָּ֡ד וְשֵׁם֩
  הַשֵּׁנִ֨י מֵידָ֜ד וַתָּ֧נַח עֲלֵיהֶ֣ם הָר֗וּחַ וְהֵ֨מָּה֙ בַּכְּתֻבִ֔ים וְלֹ֥א
  יָצְא֖וּ הָאֹ֑הֱלָה וַיִּֽתְנַבְּא֖וּ בַּֽמַּחֲנֶֽה׃
