verse: NUM 18:28
text: כֵּ֣ן תָּרִ֤ימוּ גַם־אַתֶּם֙ תְּרוּמַ֣ת יְהוָ֔ה מִכֹּל֙ מַעְשְׂרֹ֣תֵיכֶ֔ם אֲשֶׁ֣ר
  תִּקְח֔וּ מֵאֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּנְתַתֶּ֤ם מִמֶּ֨נּוּ֙ אֶת־תְּרוּמַ֣ת יְהוָ֔ה
  לְאַהֲרֹ֖ן הַכֹּהֵֽן׃
