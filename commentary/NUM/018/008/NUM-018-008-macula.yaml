verse: NUM 18:8
text: וַיְדַבֵּ֣ר יְהוָה֮ אֶֽל־אַהֲרֹן֒ וַאֲנִי֙ הִנֵּ֣ה נָתַ֣תִּֽי לְךָ֔ אֶת־מִשְׁמֶ֖רֶת
  תְּרוּמֹתָ֑י לְכָל־קָדְשֵׁ֣י בְנֵֽי־יִ֠שְׂרָאֵל לְךָ֨נְתַתִּ֧ים לְמָשְׁחָ֛ה וּלְבָנֶ֖יךָ
  לְחָק־עוֹלָֽם׃
