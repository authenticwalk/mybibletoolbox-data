text: וְיֵ֞שׁ אֲשֶׁר־יִהְיֶ֤ההֶֽעָנָן֙ מֵעֶ֣רֶב עַד־בֹּ֔קֶר וְנַעֲלָ֧ה הֶֽעָנָ֛ן בַּבֹּ֖קֶר
