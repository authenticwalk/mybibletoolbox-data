verse: NUM 30:6
text: וְאִם־הֵנִ֨יא אָבִ֣יהָ אֹתָהּ֮ בְּי֣וֹם שָׁמְעוֹ֒ כָּל־נְדָרֶ֗יהָ וֶֽאֱסָרֶ֛יהָ
