text: וְהֵנִיף֩ אוֹתָ֨ם הַכֹּהֵ֥ן׀תְּנוּפָה֮ לִפְנֵ֣י יְהוָה֒ קֹ֤דֶשׁ הוּא֙ לַכֹּהֵ֔ן
