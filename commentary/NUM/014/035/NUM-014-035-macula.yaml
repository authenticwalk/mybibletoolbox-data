text: אֲנִ֣י יְהוָה֮ דִּבַּרְתִּי֒ אִם־לֹ֣א׀זֹ֣את אֶֽעֱשֶׂ֗ה לְכָל־הָעֵדָ֤ה הָֽרָעָה֙
