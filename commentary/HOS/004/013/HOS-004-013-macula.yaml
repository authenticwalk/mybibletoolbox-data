verse: HOS 4:13
text: עַל־רָאשֵׁ֨י הֶהָרִ֜ים יְזַבֵּ֗חוּ וְעַל־הַגְּבָעוֹת֙ יְקַטֵּ֔רוּ תַּ֣חַת אַלּ֧וֹן
  וְלִבְנֶ֛ה וְאֵלָ֖ה כִּ֣י ט֣וֹב צִלָּ֑הּ עַל־כֵּ֗ן תִּזְנֶ֨ינָה֙ בְּנ֣וֹתֵיכֶ֔ם
  וְכַלּוֹתֵיכֶ֖ם תְּנָאַֽפְנָה׃
