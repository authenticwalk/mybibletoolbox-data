text: שִׁמְעוּ־זֹ֨את הַכֹּהֲנִ֜ים וְהַקְשִׁ֣יבוּ׀בֵּ֣ית יִשְׂרָאֵ֗ל וּבֵ֤ית הַמֶּ֨לֶךְ֙
