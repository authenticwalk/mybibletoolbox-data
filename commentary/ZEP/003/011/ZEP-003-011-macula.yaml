verse: ZEP 3:11
text: בַּיּ֣וֹם הַה֗וּא לֹ֤א תֵב֨וֹשִׁי֙ מִכֹּ֣ל עֲלִילֹתַ֔יִךְ אֲשֶׁ֥ר פָּשַׁ֖עַתְּ
